  '/api_v2/projects/{project_id}/tasks/{task_id}.json':
    get:
      tags: [Tasks]
      summary: Show Task
      description: Returns full details for a single task within a project. Returns complete task details including metadata, browser info, and screenshot data.
      security:
        - basicAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: task_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
    put:
      tags: [Tasks]
      summary: Update Task
      description: |
        Updates one or more fields on a task. Only include the fields you want to change.

        **Unassigning users:**
        - Set `assigned_to_id` to `null` to unassign all users
        - Use `unassign_user` with a user ID to remove a specific user

        **Moving tasks between columns:**
        - Set `status` to a column name (e.g. `todo`, `doing`, or a custom column name)
        - Set `status` to `feedback` to return the task to the Feedback panel

        **Audit trail:**
        Include `updater_email` to attribute the change to a specific user. This is for audit purposes only - permissions are not enforced via the API.
      security:
        - basicAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: task_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: object
                  properties:
                    description: { type: string }
                    priority:
                      type: string
                      enum: [not set, critical, important, normal, minor]
                    status: { type: string }
                    assigned_to_id: { type: ["integer", "null"] }
                    assigned_to_email: { type: string, format: email }
                    unassign_user: { type: integer }
                    tag_names:
                      type: array
                      items: { type: string }
                    external_id: { type: string }
                    site: { type: string, format: uri }
                    url: { type: string }
                    updater_email:
                      type: string
                      format: email
                      description: Email of the user to attribute this change to (for audit)
            example:
              task:
                status: doing
                priority: critical
                assigned_to_id: 4561
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
    delete:
      tags: [Tasks]
      summary: Delete task
      description: Permanently deletes the task. This action cannot be undone.
      security:
        - basicAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: task_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

