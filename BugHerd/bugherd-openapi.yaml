  '/api_v2/projects/{project_id}/move_tasks.json':
    post:
      tags: [Tasks]
      summary: Move Tasks
      description: |
        Moves one or more tasks from the current project to a different destination project. Task IDs remain the same after the move.

        **Important:** `task_ids` must contain `local_task_id` values (the project-scoped task number), NOT the globally unique task ID.

        > **Note:** This endpoint is documented in the BugHerd API but may not be available for all accounts. If you receive a 404 response, contact BugHerd support.
      security:
        - basicAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
          description: The source project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination_project_id, task_ids]
              properties:
                destination_project_id:
                  type: integer
                  description: The project to move tasks into
                task_ids:
                  type: array
                  items: { type: integer }
                  description: Array of task IDs to move
            example:
              destination_project_id: 2000
              task_ids: [98765, 98766, 98767]
      responses:
        '200':
          description: Tasks moved successfully

