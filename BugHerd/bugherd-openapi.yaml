  # ── Webhooks ──────────────────────────────────────────────────────────────────

  /api_v2/webhooks.json:
    get:
      tags: [Webhooks]
      summary: List Webhooks
      description: Returns all webhooks configured for your organization. Use this to verify which events are being monitored. Includes delivery statistics and error details.
      security:
        - basicAuth: []
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
    post:
      tags: [Webhooks]
      summary: Create Webhook
      description: |
        Creates a new webhook subscription. When the specified event occurs, BugHerd sends a POST request to your `target_url` with the relevant payload.

        **Supported events:** `project_create`, `task_create`, `task_update`, `comment`, `task_destroy`. Create separate webhook entries for each event type you want to monitor.

        **Project scope:** Omit `project_id` to receive events for all projects.

        **Auto-removal:** A `410 Gone` response from your target URL will cause BugHerd to automatically remove the webhook.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_url, event]
              properties:
                target_url:
                  type: string
                  format: uri
                  description: The endpoint that will receive the webhook POST
                event:
                  type: string
                  enum: [project_create, task_create, task_update, comment, task_destroy]
                project_id:
                  type: integer
                  description: Scope the webhook to a specific project. Omit for all projects.
            example:
              target_url: https://app.example.com/api/bugherd_sync/task_create
              event: task_create
              project_id: 1000
      responses:
        '201':
          description: Created webhook
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    $ref: '#/components/schemas/Webhook'

  '/api_v2/webhooks/{webhook_id}.json':
    delete:
      tags: [Webhooks]
      summary: Delete Webhook
      description: Removes a webhook subscription. BugHerd will stop sending events to the target URL immediately.
      security:
        - basicAuth: []
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Webhook deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

webhooks:
  task_create:
    post:
      tags: [Webhooks]
      summary: Task Created (Webhook Callback)
      description: |
        BugHerd sends this POST request to your registered `target_url` whenever a new task is created in a project. The request body contains the full task object. Your server should respond with any `2xx` status code to acknowledge receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  $ref: '#/components/schemas/Task'
            example:
              task:
                id: 98765
                local_task_id: 42
                project_id: 1000
                title: Button not aligned on mobile
                description: The submit button overlaps the footer on screens under 375px.
                status: backlog
                status_id: 0
                priority: normal
                priority_id: 3
                created_at: "2024-01-15T09:30:00Z"
                updated_at: "2024-01-15T09:30:00Z"
                closed_at: null
                deleted_at: null
                tag_names: [ui, mobile]
                external_id: null
                requester_email: reporter@example.com
                screenshot_url: https://bugherd.com/screenshots/abc.png
                secret_link: https://bugherd.com/tasks/secret/abc123
                admin_link: https://bugherd.com/projects/1000/tasks/42
                assigned_to: null
                requester:
                  id: 4561
                  email: reporter@example.com
                  display_name: Jane Smith
                  avatar_url: https://bugherd.com/avatars/jane.png
      responses:
        '200':
          description: Webhook acknowledged

  task_update:
    post:
      tags: [Webhooks]
      summary: Task Updated (Webhook Callback)
      description: |
        BugHerd sends this POST request to your registered `target_url` whenever a task is updated. This includes status changes, priority changes, reassignment, tag edits, or any other field modification. Your server should respond with any `2xx` status code to acknowledge receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  $ref: '#/components/schemas/Task'
            example:
              task:
                id: 98765
                local_task_id: 42
                project_id: 1000
                title: Button not aligned on mobile
                status: doing
                status_id: 2
                priority: important
                priority_id: 2
                updated_at: "2024-01-20T14:45:00Z"
                assigned_to:
                  id: 4561
                  email: dev@example.com
                  display_name: Alex Dev
                  avatar_url: https://bugherd.com/avatars/alex.png
      responses:
        '200':
          description: Webhook acknowledged

  task_destroy:
    post:
      tags: [Webhooks]
      summary: Task Deleted (Webhook Callback)
      description: |
        BugHerd sends this POST request to your registered `target_url` whenever a task is permanently deleted. The payload includes the task ID and deletion timestamp. Your server should respond with any `2xx` status code to acknowledge receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  $ref: '#/components/schemas/Task'
            example:
              task:
                id: 98765
                local_task_id: 42
                project_id: 1000
                deleted_at: "2024-01-22T08:00:00Z"
      responses:
        '200':
          description: Webhook acknowledged

  comment:
    post:
      tags: [Webhooks]
      summary: Comment Added (Webhook Callback)
      description: |
        BugHerd sends this POST request to your registered `target_url` whenever a comment is added to a task. The payload includes both the comment and the parent task. Your server should respond with any `2xx` status code to acknowledge receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  $ref: '#/components/schemas/Comment'
                task:
                  $ref: '#/components/schemas/Task'
            example:
              comment:
                id: 8801
                text: I can reproduce this on Chrome 120.
                created_at: "2024-01-16T10:00:00Z"
                user_id: 4561
                is_private: false
              task:
                id: 98765
                local_task_id: 42
                project_id: 1000
      responses:
        '200':
          description: Webhook acknowledged

  project_create:
    post:
      tags: [Webhooks]
      summary: Project Created (Webhook Callback)
      description: |
        BugHerd sends this POST request to your registered `target_url` whenever a new project is created in your organization. The payload contains the full project object. Your server should respond with any `2xx` status code to acknowledge receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  $ref: '#/components/schemas/Project'
            example:
              project:
                id: 1001
                name: New Campaign Site
                devurl: https://www.newcampaign.com
                is_active: true
                is_public: false
                has_custom_columns: false
                guests_see_guests: false
      responses:
        '200':
          description: Webhook acknowledged
