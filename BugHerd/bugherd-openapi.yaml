  # ── Tasks ─────────────────────────────────────────────────────────────────────

  '/api_v2/projects/{project_id}/tasks.json':
    get:
      tags: [Tasks]
      summary: List Tasks
      description: Returns tasks for a project. Supports filtering by status, priority, tag, assignee, external ID, and date range.
      security:
        - basicAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
          description: Return tasks updated after this timestamp
        - name: created_since
          in: query
          schema: { type: string, format: date-time }
          description: Return tasks created after this timestamp
        - name: status
          in: query
          schema: { type: string }
          description: Filter by status name (e.g. `todo`, `doing`)
        - name: priority
          in: query
          schema: { type: string, enum: [not set, critical, important, normal, minor] }
        - name: tag
          in: query
          schema: { type: string }
          description: Filter by tag name
        - name: assigned_to_id
          in: query
          schema: { type: integer }
        - name: external_id
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Total number of records across all pages
                        example: 42
    post:
      tags: [Tasks]
      summary: Create Task
      description: |
        Creates a new task in a project.

        **Requester and assignee:** The requester and assignee can each be specified by user ID or email address.
        - `assigned_to_email` - the user must be a current project member
        - `requester_email` - accepts any email address

        **Status:** Omitting the `status` field or setting it to `null` sends the task to the Feedback panel.
      security:
        - basicAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: object
                  properties:
                    description: { type: string }
                    priority:
                      type: string
                      enum: [not set, critical, important, normal, minor]
                    status: { type: string }
                    requester_id: { type: integer }
                    requester_email: { type: string, format: email }
                    assigned_to_id: { type: integer }
                    assigned_to_email: { type: string, format: email }
                    tag_names:
                      type: array
                      items: { type: string }
                    external_id: { type: string }
            example:
              task:
                description: Login button not responding on Safari
                priority: important
                status: backlog
                requester_email: reporter@example.com
                tag_names: [safari, auth]
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'

