  ##### Message endpoint #####
  '/messages':
      post:
        tags:
          - Messages
        summary: Send a message to a Facebook audience
        # description:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                title: Send Message body
                type: object
                required:
                  - message
                  - recipient
                properties:
                  recipient:
                    type: object
                    properties:
                      id:
                        type: string
                    required:
                      - id
                    additionalProperties: false
                  message:
                    description: >
                      Message in json format for sent to use. Please follow <a href="https://docs.botstar.com/docs/en/message-api">BotStar JSON Format</a>.
                    type: object
                    example:
                      text: Hello World
                  options:
                    type: object
                    properties:
                      message_tag:
                        type: string
                        enum:
                          - CONFIRMED_EVENT_UPDATE
                          - POST_PURCHASE_UPDATE
                          - ACCOUNT_UPDATE
                    additionalProperties: false
                additionalProperties: false
        security:
          - BearerAuth: []
        responses:
          '200':
            description: Successful Response
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    recipient_id:
                      type: string
                    message_id:
                      type: string
                  additionalProperties: false
                  description: Default Response
