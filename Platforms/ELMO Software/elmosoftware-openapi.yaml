    WithholdingDetailsAu:
      type: object
      nullable: true
      properties:
        tfn:
          nullable: true
          type: string
          example: '10000001'
          description: >-
            Tax File Number of an employee. Note that this could be null value
            if employee do not provide TFN. But that will ensure reasonNoTfn
            field will have value with relevant code.
        reasonNoTfn:
          nullable: true
          type: string
          enum:
            - The employee didn’t quote a TFN
            - Application or Enquiry for a new/existing TFN
            - >-
              Exemption for under 18 years of age and not earning enough to pay
              tax
            - 'Exemption as recipient of pension, benefit or allowance'
            - The employee quoted an invalid TFN
          description: >-
            Specific TFN reason why employee is unable to provide TFN. Note this
            field will be null if TFN is provided by employee.
          example: The employee didn’t quote a TFN
        primaryEmail:
          type: string
          example: john.smith@autaxation.com.au
          description: Main contact email of the employee.
        previousSurname:
          nullable: true
          type: string
          example: Smith
          description: >-
            If employee have changed the name since last dealt with the ATO and
            therefore is required to provide previous family name.
        basisOfPayment:
          nullable: true
          type: string
          enum:
            - Full-time
            - Part-time
            - Labor hire
            - Casual
            - Superannuation or annuity income stream
          example: Full-time
          description: >-
            When working out whether worker is an employee or contractor, one
            factor to consider is how you work out what you agree to pay the
            worker.
        isAustralianResident:
          type: boolean
          example: false
          description: Whether or not employee is Australian Resident for tax purposes.
        isClaimTaxFreeThreshold:
          type: boolean
          example: false
          description: >-
            Amount of income employee can earn each financial year that is not
            taxed. By claiming the threshold, employee reduces the amount of tax
            that is withheld from the pay during the year
        isClaimPensionerOffset:
          type: boolean
          example: true
          description: >-
            Tax offset for low and middle income earners to reduce tax payable
            to zero, but it is not a bonus payment. The amount of available
            offset depends on individual circumstances.
        isClaimZoneOffset:
          type: boolean
          example: false
          description: >-
            Employee may be eligible for a zone tax offset if live or work in
            certain remote or isolated areas of Australia.
        isWorkingHolidayMaker:
          type: boolean
          example: true
          description: >-
            Applies to payments to individuals - including backpackers - who are
            working in Australia and hold visa(subclass 417 or subclass 462 or
            Bridging Visa)
        visaCountry:
          type: string
          example: BR
          description: >-
            ISO 3166-1 alpha-2 codes of country where employee is originally
            from.
        hasStlr:
          type: boolean
          example: false
          description: >-
            If Australian Government lent employee money under HECS-HELP,
            FEE-HELP, OS-HELP, VET FEE-HELP, VET Student loans prior to 1 July
            2019 or SA-HELP or if employee have a debt from the previous Higher
            Education Contribution Scheme (HECS)
        isSeasonalWorker:
          type: boolean
          nullable: true
          example: false
          description: >-
            If employee is seasonal workers who withheld tax at a flat rate of
            15% on all earnings. Returns null in case integration type is not
            Payroll
        isInformationCorrect:
          type: boolean
          example: true
          description: >-
            Declaring employee has answered all the questions truthfully and
            correctly.
        declarationDate:
          type: string
          example: '2021-12-25'
          description: >-
            Date when employee declare all the questions in the TFN form were
            answered truthfully and correctly. Dates are strings in ISO 8601
            format YYYY-MM-DD
        declarationDateTimezone:
          type: string
          example: Pacific/Auckland
          description: >-
