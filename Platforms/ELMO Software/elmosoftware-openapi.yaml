  - name: Users
    description: Allows you to retrieve Users and Update Personal Contact Details.
  - name: Onboarding Users
    description: >-
      Allows you to retrieve Onboarding Users and convert an Onboarding User to
      a General User.
  - name: User Events
    description: Allows you to trigger events for creating and updating a User
  - name: Onboarding User Events
    description: Allows you to trigger events for creating and updating an Onboarding User
  - name: Departments
    description: Allows you to retrieve list of Departments
  - name: Locations
    description: Allows you to retrieve list of Locations
  - name: Positions
    description: Allows you to retrieve list of Positions
  - name: Metadata
    description: Allows you to retrieve Metadata of configurable fields
  - name: Employees
    description: Allows you to retrieve employment details for users
  - name: Legal Entities
    description: Allows you to retrieve details for legal entities
  - name: Payroll Cycles
    description: Allows you to retrieve details for payroll calendars/cycles
  - name: Leave Requests
    description: Allows you to retrieve details for all leave requests
  - name: Leave Types
    description: Allows you to retrieve details for leave types
  - name: Candidates
    description: Allows you to retrieve candidate details
paths:
  /core/v1/departments:
    get:
      summary: Gets all the departments
      parameters:
        - name: id
          in: query
          schema:
            type: array
            items:
              type: string
          style: deepObject
          explode: true
          required: false
          description: Exact match of id/s
        - name: title
          in: query
          schema:
            type: string
          required: false
          description: Exact/Partial match of title
        - name: departmentId
          in: query
          schema:
            type: array
            items:
              type: string
          style: deepObject
          explode: true
          required: false
          description: Exact match of the department Id
        - name: description
          in: query
          schema:
            type: string
          required: false
          description: Exact/Partial match of descriptions
        - name: page
          in: query
          required: false
          description: The page number
          schema:
            type: integer
        - name: itemsPerPage
          in: query
          required: false
          description: The number of items per page
          schema:
            type: integer
        - name: deleted
          in: query
          required: false
          description: Type of departments to be returned
          schema:
            type: boolean
        - name: format
          in: query
          required: false
          description: >-
            Format for description field - 'HTML' preserves formatting
            (default), 'TEXT' removes HTML tags
          schema:
            type: string
            enum:
              - HTML
              - TEXT
      tags:
        - Departments
      operationId: getDepartmentCollection
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '401':
          description: Unauthorized error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new department
      tags:
        - Departments
      operationId: postDepartmentCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  description: Title of department
                  type: string
                  example: Client Services
                departmentId:
                  description: ID of current department
                  type: string
                  example: '2'
                description:
                  description: Description of department
                  type: string
                  example: <p>Client Services</p>
                parent:
                  description: ID of department parent
                  type: string
                  nullable: true
                  example: null
      responses:
        '201':
          description: Department created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentMutate'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityExtended'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
