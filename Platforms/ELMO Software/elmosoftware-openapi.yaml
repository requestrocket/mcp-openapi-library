    UserEvents:
      type: object
      description: >
        The ***output*** you get when you fire a user event. User Events are
        asynchronous events and will change state
      properties:
        id:
          type: string
          nullable: true
          description: >-
            The id of the event. This is not the resource id. You will need to
            poll this event to get its current state
          example: null
        entityName:
          type: string
          nullable: true
          description: >
            The entityName contains the resource name the event was linked to.
            So the entityName for the UserEvent would be "**user**"
          example: null
        resourceId:
          type: string
          nullable: true
          description: |
            The id of the linked resource.
          example: null
        responseCode:
          type: integer
          example: 202
        summary:
          type: string
          nullable: true
          description: The summary of the event represents its state in a summarized view
          example: success
        logs:
          type: object
          description: >-
            The logs contains details of what succeeded and what failed. It can
            contain additional information not found in the summary
          example:
            success:
              user:
                - Successfully updated user.
            failure: {}
            successCount: '1'
            failureCount: '0'
