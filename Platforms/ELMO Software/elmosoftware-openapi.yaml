  /core/v1/user-creation-events:
    post:
      tags:
        - User Events
      operationId: postUserCreationEventCollection
      summary: Triggers an event to create a new user
      description: >
        The word **Event** is used to highlight asynchronous requests. Instead
        of creating a new user, you are Posting an event that will
        **eventually** create a new user. After your payload is validated, you
        get back a user event id. You then need to fire a request at `GET
        user-creation-events/{id}` to get the newly created user's id.


        Because the payload for creating a user varies and is a fluid schema
        (schema changes based on configurations), you need to get the template
        by visiting `GET /user-creation-template`.


        User will be created with role "Employee" by default.


        If the ability to set custom field values of type checkbox, menu, or
        tiered menu is required, then the Accept Header must include the value
        "application/vnd.elmo.core.user.v2+json" This will ensure that the
        endpoint supports updating both the standard user profile fields and the
        custom field types, which include text fields, date fields, menus,
        tiered menus, or checkboxes. Do note, this format version option is an
        early Beta release.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: >
            Success


            The term **entityName** points to the type of entity/resource that
            was created through posting this event. In this case, the entity
            name will indicate that a new user was created. The **id** is the
            new id of the resource. **Logs** will indciate a detailed view of
            what went well and what went wrong.
          content:
            application/vnd.elmo.core.user.v2+json:
              schema:
                $ref: '#/components/schemas/UserEvents'
            application/json:
              schema:
                $ref: '#/components/schemas/UserEvents'
          links:
            GetUserCreationEventItem:
              parameters:
                id: '$response.body#/id'
              operationId: getUserCreationEventItem
              description: >-
                The `id` value returned in the response can be used as the `id`
                parameter in `GET /user-creation-events/{id}`.
        '400':
          description: Invalid input
        '401':
          description: Unauthorized error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityExtended'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
