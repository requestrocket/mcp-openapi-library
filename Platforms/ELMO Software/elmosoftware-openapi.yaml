security:
  - apiKey: []
  - basicAuth: []
  - bearerAuth: []
components:
  schemas:
    OauthToken:
      type: object
      properties:
        access_token:
          type: string
          example: >-
            eyJqdGkiOiJiY2M4NjI3Ni1mNGU2LTRjMzAtODIwYi0zZWMzNmRhODM5M2YiLCJpYXQiOjE2OTI2NjA0MjUsImV4cCI6MTY5MjfffjIyNSwic2NvcGUiOiIifQ.mip0NertYWfyry3yaUG7xqtrlVYUg9mrtIA2erkLsxa
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 1692662225
      required:
        - access_token
        - token_type
        - expires_in
    User:
      type: object
      properties:
        id:
          readOnly: true
          type: string
          example: 0a000000-00aa-00aa-000a-0000a0000aa0
        identifier:
          readOnly: true
          type: string
          example: john.smith@test.com
        firstName:
          description: First name of user
          type: string
          example: John
        lastName:
          description: Last name of user
          type: string
          example: Smith
        preferredFirstName:
          description: Preferred first name of user
          type: string
          example: John
          nullable: true
        preferredLastName:
          description: Preferred last name of user
          type: string
          example: Sm
          nullable: true
        username:
          description: is this read only
          type: string
          example: john.smith@test.com
        email:
          description: 'Email of user, is this ready only'
          type: string
          example: john.smith@test.com
        active:
          readOnly: true
          type: boolean
          example: true
        employeeNumber:
          description: is this read only
          nullable: true
          type: string
          example: 'null'
        manager:
          description: Id of the user's manager
          type: string
          nullable: true
          example: ''
        dateOfBirth:
          description: the date of birth of this user
          type: string
          nullable: true
          example: 2022/12/22
        startDate:
          type: string
          nullable: true
          example: 2022/12/22
        endDate:
          type: string
          nullable: true
          example: 2022/12/22
        expiryDate:
          type: string
          nullable: true
          example: 2022/12/22
        timezone:
          type: string
          nullable: true
          example: Australia/Sydney
        country:
          type: string
          nullable: true
          example: Australia
        state:
          type: string
          nullable: true
          example: Victoria
        role:
          type: string
          nullable: true
          enum:
            - EMPLOYEE
            - MANAGER
            - COMPANY_ADMIN
          example: EMPLOYEE
        mobile:
          type: string
          nullable: true
          example: (08)83308820
        customData:
          description: Configurable Custom Fields
          type: object
          nullable: true
          example:
            customField_email: email@example.com
            customField_drivers_license: FH4356HVN
        position:
          description: 'Current position of this user - /positions/{id}'
          type: string
          nullable: true
          example: /positions/0a000000-00aa-00aa-000a-0000a0000aa0
        location:
          description: 'Current location of this user - /locations/{id}'
          type: string
          nullable: true
          example: /locations/0a000000-00aa-00aa-000a-0000a0000aa0
        department:
          description: 'Current department of this user - /departments/{id}'
          type: string
          nullable: true
          example: /departments/0a000000-00aa-00aa-000a-0000a0000aa0
        legalEntity:
          description: 'Legal Entity attached to this user - /legal-entities/{id}'
          type: string
          nullable: true
          example: /legal-entities/0a000000-00aa-00aa-000a-0000a0000aa0
        serviceStartDate:
          description: the service start date of this user
          type: string
          nullable: true
          example: 2022/12/22
      required:
        - id
        - identifier
        - firstName
        - lastName
        - username
        - email
    UserV2:
      type: object
      additionalProperties:
        type: object
        properties:
          profile_field_sampleText:
            type: string
            example: sample text
          profile_field_sampleDate:
            type: string
            example: 2022/12/22
          profile_field_sampleMenu:
            type: string
            example: menu option
          profile_field_sampleTierMenu:
            type: string
            example: sample tier menu option
          profile_field_sampleCheckboxList:
            type: array
            items:
              type: string
            example:
              - value1
              - value2
      properties:
        id:
          readOnly: true
          type: string
          example: 0a000000-00aa-00aa-000a-0000a0000aa0
        identifier:
          readOnly: true
          type: string
          example: john.smith@test.com
        firstName:
          description: First name of user
          type: string
          example: John
        lastName:
          description: Last name of user
          type: string
          example: Smith
        preferredFirstName:
          description: First name of user
          type: string
          example: John
          nullable: true
        preferredLastName:
          description: Last name of user
          type: string
          example: Sm
          nullable: true
        username:
          description: is this read only
          type: string
          example: john.smith@test.com
        email:
          description: 'Email of user, is this ready only'
          type: string
          example: john.smith@test.com
        active:
          readOnly: true
