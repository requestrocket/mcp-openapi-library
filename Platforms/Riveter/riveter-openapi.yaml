  /runs:
    get:
      summary: list runs
      description: |
        List the account's runs, newest first. Every async operation shows up here — enrichment runs, dataset builds, extractions, and quick searches.

        Filter by `type` (comma-separated), `status`, `enrichment_id`, `dataset_id`, `monitor_id`, and `created_after` / `created_before` (ISO 8601). Paginate with `page` / `per_page`. `enrichment_id` naming a legacy enrichment still filters and the response carries `legacy`.

        Pass `ids` (comma-separated, up to 100 run ids) to get those runs' full status objects (same shape as `GET /runs/{id}`) in one call; `not_found` lists ids not on this account. Filters and pagination are ignored.
      operationId: listRuns
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const page = await riveter.runs.list({ status: "success" });
            for await (const run of page) { // auto-pages through every result
              console.log(run.id, run.type);
            }
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            page = riveter.runs.list(status="success")
            for run in page.auto_paging_iter():  # pages through every result
                print(run.id, run.type)
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            page = riveter.runs.list(status: "success")
            page.auto_paging_each do |run| # pages through every result
              puts "#{run.id} #{run.type}"
            end
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            ctx := context.Background()
            page, err := client.Runs.List(ctx, &riveter.ListRunsParams{Status: "success"})
            for {
                for _, run := range page.Runs {
                    fmt.Println(run.ID, run.Type)
                }
                if !page.HasNextPage() {
                    break
                }
                page, err = page.NextPage(ctx)
            }
      tags:
        - Runs
      parameters:
        - name: ids
          in: query
          required: false
          description: "Comma-separated run ids, up to 100. Returns their full status objects plus `not_found`; other filters ignored."
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: "Comma-separated run types: enrichment, dataset_build, extraction, scrape, quick_search, search_agent"
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by run status
          schema:
            type: string
            enum: [pending, enqueued, processing, success, stopped]
        - name: enrichment_id
          in: query
          required: false
          description: Only runs of this enrichment (enr_...)
          schema:
            type: string
        - name: dataset_id
          in: query
          required: false
          description: Only runs on this dataset (ds_...) — its fills and its list generations
          schema:
            type: string
        - name: monitor_id
          in: query
          required: false
          description: Only runs of this monitor (mon_...)
          schema:
            type: string
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 25
            maximum: 100
      responses:
        "200":
          description: Runs listed (with `ids`, the named runs' full status envelopes plus `not_found`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    description: Compact list items, or full `Run` objects when `ids` was passed
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/RunListItem"
                        - $ref: "#/components/schemas/Run"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  not_found:
                    type: array
                    description: With `ids` only — the requested ids that are not runs on this account
                    items:
                      type: string
                required:
                  - runs
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

