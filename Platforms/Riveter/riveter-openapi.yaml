  /datasets:
    post:
      summary: build dataset
      description: |
        Create a dataset: from rows you have, or from a prompt Riveter finds rows for.

        ## What a dataset is

        A dataset is a table in Riveter. Its **input columns** are your starting data: a company name, a URL, a product identifier, etc. Its **output columns** hold what Riveter finds out about each row: the CEO, data from a page, product images, etc. The output columns, the instructions for filling them, and the tools allowed are an **enrichment**, and a dataset belongs to one (`enrichment_id`). Creating a dataset and adding rows is free. Filling the cells is a run of the enrichment, [POST /enrich](#tag/enrich/post/enrich) with the `dataset_id`, and that run spends credits: one AI agent per row.

        Rows are deduplicated on the first input column (`index_column`; change it with [PATCH /datasets/{id}](#tag/datasets/patch/datasets/{id})). Every row has an id (`row_...`) and a position counted from 1.

        **Not on Datasets yet?** New accounts are. An older account moves itself: open [Datasets](https://app.riveterhq.com/v2/datasets) in the app and click **Migrate to Datasets** — its enrichments and list builds are copied into datasets, and every endpoint in this section opens when the copy completes. Until then they answer `403` with `type: "feature_not_enabled"`.

        ## 1. Build a dataset from rows you have

        This is the preferred way to enrich data you already hold. The request is the rows plus the columns to add: the `enrichment_id` of an enrichment you already have — from a dataset in the app (the dataset page's **API** button shows it), from [GET /datasets/{id}](#tag/datasets/get/datasets/{id}), or from [GET /enrichments](#tag/enrich/get/enrichments); or save a new one with [POST /enrichments](#tag/enrich/post/enrichments) — or, with no enrichment yet, `attributes`, the output column names: Riveter creates the dataset's enrichment from them (its columns typed from their names; set a column's prompt, format, or tool with [PATCH /datasets/{id}](#tag/datasets/patch/datasets/{id})). Rows are objects keyed by input column name (an enrichment's input columns, [GET /enrichments/{id}](#tag/enrich/get/enrichments/{id}) lists them; with `attributes`, `input_columns` or the keys of the rows), up to 100 per request; add more with [POST /datasets/{id}/rows](#tag/datasets/post/datasets/{id}/rows) or a CSV on [POST /datasets/{id}/rows/import](#tag/datasets/post/datasets/{id}/rows/import).

        ```bash
        curl -X POST "https://api.riveterhq.com/v1/datasets" \
          -H "Authorization: Bearer YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "Q4 targets",
            "enrichment_id": "enr_YOUR_ENRICHMENT_ID",
            "rows": [
              { "Company": "Apple", "Website": "apple.com" },
              { "Company": "Shopify", "Website": "shopify.com" }
            ]
          }'
        ```

        The response is the dataset: `id` (`ds_...`), `input_columns`, `enrichment_id`, `output_columns`, `row_count`. Nothing has run yet. Fill the cells:

        ```bash
        curl -X POST "https://api.riveterhq.com/v1/enrich" \
          -H "Authorization: Bearer YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{ "dataset_id": "ds_YOUR_DATASET_ID" }'
        ```

        This fills every empty cell and returns a run (`id`: `run_...`). Add `"estimate_cost": true` to see the price without running anything, or `"max_credits": 50` to refuse the run above a ceiling. Then read the results:

        ```bash
        curl "https://api.riveterhq.com/v1/runs/RUN_ID/result?wait=50" \
          -H "Authorization: Bearer YOUR_API_KEY"
        ```

        `wait` holds the request for up to 50 seconds. `output` is `null` until the run finishes, so call again until it is not; or pass `webhook_url` on the fill and skip polling. `output.rows` is the rows the fill ran, each with its `input`, its `cells` by output column name (`value`, `state`, `sources`), and the `credits` it cost. [GET /datasets/{id}/rows](#tag/datasets/get/datasets/{id}/rows) is the whole grid at any time, filled cells included.

        ## 2. Large datasets

        `output.rows` holds up to 5,000 rows. Above that, `output` is `null` and the run's `output_files` are the result: `output_files.jsonl` and `output_files.csv` are the whole grid as files on object storage, one row per line. Each has a `state` (`pending` until the export lands, shortly after the run finishes; then `ready`), a signed `url`, and `expires_at` (one hour; fetch the result again for a fresh link).

        ```bash
        curl -o rows.jsonl "$(curl -s "https://api.riveterhq.com/v1/runs/RUN_ID/result" \
          -H "Authorization: Bearer YOUR_API_KEY" | jq -r '.output_files.jsonl.url')"
        ```

        Two more ways to read a large grid: page [GET /datasets/{id}/rows](#tag/datasets/get/datasets/{id}/rows) with `limit` (up to 1,000) and `cursor`, or `updated_since` for only the rows changed since a time; or download the grid at any time with [GET /datasets/{id}/export](#tag/datasets/get/datasets/{id}/export) (`output_format` `jsonl`, `csv`, or `xlsx`).

        ## 3. Build a dataset from a prompt

        No rows yet? Describe them. Riveter's list generator finds `count` rows for the `prompt`; `input_columns` names the identity columns to generate. The output columns come from `attributes` (an enrichment is created for the dataset from the prompt and the column names) or from an `enrichment_id`. `auto_fill: true` fills the cells as soon as the rows land. Generation and the fill are both paid runs; `estimate_cost: true` prices them first.

        Or send `prompt` and `count` alone and the whole dataset is set up from the prompt: the identity columns, and one output column per fact the prompt asks to find about each row, each with its own prompt and type ("Top 50 US fintech startups with their CEO, total funding, and founding year" → rows under `Company`, columns `CEO`, `Total funding`, `Founding year`). A prompt about rows alone gets no output columns. Name `input_columns` yourself and the output columns come from `attributes` or `enrichment_id` only, as above.

        ```bash
        curl -X POST "https://api.riveterhq.com/v1/datasets" \
          -H "Authorization: Bearer YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "SF coffee roasters",
            "prompt": "Specialty coffee roasters in San Francisco",
            "count": 50,
            "input_columns": ["Roaster", "Website"],
            "attributes": ["Founded year", "Number of cafes"],
            "auto_fill": true
          }'
        ```

        The response is the dataset plus `run`, the generation run; poll it like any run. The rows land in the dataset when generation finishes, and with `auto_fill` the fill run starts then: it appears under the dataset's `runs` on [GET /datasets/{id}](#tag/datasets/get/datasets/{id}), and `fill_webhook_url` is POSTed when it finishes. Read the grid as in step 2. For more rows later, [POST /datasets/{id}/rows/build](#tag/datasets/post/datasets/{id}/rows/build).

        The list builder's older body on this path (`max_items`, `identifiers`, `qualifiers`, ...) still runs and is documented in [the legacy API docs](?spec=legacy#tag/retired-resource-endpoints/post/datasets); its response carries `legacy` with the field mapping. New code sends `prompt` + `count`.
      operationId: buildDataset
      x-mcp-open-world: true
      x-mcp-description: |
        Build a dataset: rows you send or rows Riveter finds. `rows` (≤ 100 objects keyed by input column name, free) or `prompt` + `count` (generated, paid); output columns from `attributes` or `enrichment_id`, or, with `prompt` + `count` alone, written from the prompt (one typed column per fact it asks for) along with the identity columns; `auto_fill: true` fills generated rows when they land; `budget` caps a generation's spend (default 50 + 1.5 per row). Returns the dataset (`id`, `ds_...`) and `run` (the generation run, or null); then `enrich` with `dataset_id` alone. `estimate_cost: true` prices it first. `help` with `datasets`.
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const dataset = await riveter.datasets.create({
              name: "US fintech startups",
              prompt: "Top 100 US fintech startups",
              count: 100,
              input_columns: ["Company", "Website"],
              attributes: ["CEO", "Funding raised"],
              auto_fill: true,
            });
            const result = await riveter.runs.waitForResult(dataset.run!.id);
            console.log(result.status, dataset.id);
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            dataset = riveter.datasets.create(
                name="US fintech startups",
                prompt="Top 100 US fintech startups",
                count=100,
                input_columns=["Company", "Website"],
                attributes=["CEO", "Funding raised"],
                auto_fill=True,
            )
            result = riveter.runs.wait_for_result(dataset.run.id)
            print(result.status, dataset.id)
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            dataset = riveter.datasets.create(
              name: "US fintech startups",
              prompt: "Top 100 US fintech startups",
              count: 100,
              input_columns: ["Company", "Website"],
              attributes: ["CEO", "Funding raised"],
              auto_fill: true
            )
            result = riveter.runs.wait_for_result(dataset.run.id)
            puts "#{result.status} #{dataset.id}"
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            ctx := context.Background()
            dataset, err := client.Datasets.Create(ctx, riveter.CreateDatasetParams{
                Name:         "US fintech startups",
                Prompt:       "Top 100 US fintech startups",
                Count:        100,
                InputColumns: []string{"Company", "Website"},
                Attributes:   []string{"CEO", "Funding raised"},
                AutoFill:     true,
            })
            result, err := client.Runs.WaitForResult(ctx, dataset.Run.ID, nil)
            fmt.Println(result.Status, dataset.ID)
      tags:
        - Datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: "Display name"
                input_columns:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                  description: "Input column names (row identity). Optional with rows; with prompt, the identity columns to generate — omitted, they are written from the prompt, and with no attributes / enrichment_id the output columns are too."
                rows:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
                  maxItems: 100
                  description: "The rows, keyed by input column name. Up to 100; more with POST /datasets/{id}/rows/import."
                prompt:
                  type: string
                  description: "What the rows are, for Riveter to find them. Requires count."
                count:
                  type: integer
                  minimum: 1
                  maximum: 12000
                  description: "How many rows to generate for prompt. Capped per account."
                budget:
                  $ref: "#/components/schemas/ListBuildBudgetParam"
                attributes:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                  description: "Output column names; they become the dataset's own enrichment's columns, typed from their names. Not with enrichment_id. Nothing is filled until POST /enrich (or auto_fill)."
                enrichment_id:
                  type: string
                  description: "A saved enrichment (enr_...) whose output columns become the dataset's. Not with attributes."
                auto_fill:
                  type: boolean
                  default: false
                  description: "With count: fill the output columns when the rows land (a second paid run)."
                webhook_url:
                  type: string
                  format: uri
                  description: "POSTed the list-generation run when it finishes"
                fill_webhook_url:
                  type: string
                  format: uri
                  description: "With auto_fill: POSTed the fill run when it finishes"
                estimate_cost:
                  $ref: "#/components/schemas/EstimateCostParam"
                max_credits:
                  $ref: "#/components/schemas/MaxCreditsParam"
            examples:
              rows_and_attributes:
                summary: Rows you have, two columns to fill
                value:
                  name: "Targets"
                  rows:
                    - { "Company": "Apple", "Website": "apple.com" }
                    - { "Company": "Shopify" }
                  attributes: ["CEO", "HQ city"]
              generated_rows_auto_fill:
                summary: Generate 50 rows on a 100-credit budget, filled when they land, refused above 200 credits
                value:
                  prompt: "Specialty coffee roasters in San Francisco"
                  count: 50
                  input_columns: ["Roaster", "Website"]
                  attributes: ["Founded year"]
                  auto_fill: true
                  budget: 100
                  max_credits: 200
              from_prompt_alone:
                summary: The whole dataset from the prompt — identity columns and typed output columns
                value:
                  prompt: "Top 50 US fintech startups with their CEO, total funding, and founding year"
                  count: 50
                  auto_fill: true
      responses:
        "201":
          description: The dataset, with `run` when list generation started (null when the rows came in the request)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Dataset"
                  - type: object
                    properties:
                      run:
                        $ref: "#/components/schemas/Run"
        "200":
          description: estimate_cost only — the credit estimate (the build budget as `maximum` — `budget`, else 50 + 1.5 × count; charged upfront and settled down to what the agent spent — plus every row's budget with auto_fill); nothing was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateCostResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    get:
      summary: list datasets
      description: |
        The account's datasets, most recently updated first (up to 200). Each item is compact: id, name, column counts, `row_count`, and the newest run. Columns, the bound enrichment, and recent runs are on [GET /datasets/{id}](#tag/datasets/get/datasets/{id}); rows on [GET /datasets/{id}/rows](#tag/datasets/get/datasets/{id}/rows).
      operationId: listDatasets
      x-mcp-description: |
        The account's datasets, newest first (up to 200): id, name, column counts, `row_count`, newest run. `get_dataset` has the columns and enrichment.
      tags:
        - Datasets
      responses:
        "200":
          description: Datasets listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      $ref: "#/components/schemas/DatasetListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /datasets/{id}:
    get:
      summary: read dataset
      description: |
        One dataset: `input_columns`, `index_column`, the bound `enrichment_id` and its `output_columns` (names; prompts and schemas are on [GET /enrichments/{id}](#tag/enrich/get/enrichments/{id})), `row_count`, whether the rows expired (`rows_expired`), whether a CSV import is still landing (`import_in_progress`), and the five newest `runs` (list generation and fills).
      operationId: getDataset
      x-mcp-description: |
        One dataset by id: `input_columns`, `index_column`, `enrichment_id` + `output_columns` (names; `get_enrichment` has the prompts), `row_count`, `import_in_progress`, newest `runs`. Rows are `list_dataset_rows`.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: The dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: update dataset
      description: |
        Edit a dataset's structure: `name`, `index_column`, `input_columns` (add, rename, delete), `output` columns (add, change the prompt or schema, pin or unpin a tool, rename, delete), and the per-row `budget` / `budget_locked` of its enrichment. Nothing runs; fill with [POST /enrich](#tag/enrich/post/enrich). Changing a column's prompt, schema, or pinned tool marks its filled cells `stale`. A saved or shared enrichment is copied before the edit, so `enrichment_id` may change. Refused with 409 `dataset_in_use` while a run is on the dataset.

        The budget follows the columns as on [PATCH /enrichments/{id}](#tag/enrich/patch/enrichments/{id}): adding an output column raises `budget_credits_per_row` by 1.5, removing one lowers it by 1.5, until `budget_locked` is true. `budget_locked: true` or `budget` sent in the same request as column changes wins over that adjustment, so one call can lock the budget and add columns. Both need an output column to land on: on a dataset without one, send them with the first `output` add.
      operationId: updateDataset
      x-mcp-destructive: true
      x-mcp-description: |
        Edit a dataset's structure (no run): `name`; `index_column`; `input_columns` ops (`{ "Name": {} }` add, `{ "rename" }`, `{ "delete": true }`); `output` column ops (new name adds, type inferred unless `output_schema` is given; `{ "prompt", "output_schema" }` changes, cells go `stale`; `{ "tool": "<list_tools name>" }` pins a tool: one call per row, arguments chosen by the agent, result is the cell (`null` unpins); `{ "rename" }`; `{ "delete": true }`); `budget` (credits per row; moves by 1.5 per output column added or removed unless `budget_locked`) and `budget_locked` (true / false; sent with column changes it wins over that adjustment). Edits a shared enrichment on a private copy. 409 `dataset_in_use` while a fill runs. Then `enrich` with `dataset_id`. `help` with `datasets`, `pinned_columns`, `output_schema`.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                index_column:
                  type: string
                  description: The input column rows are unique on (by name). Every row is re-keyed.
                input_columns:
                  $ref: "#/components/schemas/InputColumnOperations"
                output:
                  $ref: "#/components/schemas/OutputColumnOperations"
                budget:
                  type: number
                  minimum: 0.1
                  maximum: 100
                  description: Credits the row agent may spend per row, on the dataset's enrichment. Sent with column changes, it wins over the per-column adjustment.
                budget_locked:
                  type: boolean
                  description: true keeps the budget as set when output columns are added or removed; false lets it move by 1.5 per column again.
            examples:
              change_columns:
                summary: Change a prompt, add a typed column, remove one
                value:
                  output:
                    "CEO":
                      prompt: "Full name of the current CEO"
                    "Employee count":
                      prompt: "Current headcount as an integer"
                      output_schema: { type: integer, minimum: 0 }
                    "HQ city":
                      delete: true
              lock_budget_and_add_columns:
                summary: Lock the budget and add columns without moving it
                value:
                  budget_locked: true
                  output:
                    "Founded": {}
                    "Revenue":
                      prompt: "Latest annual revenue in USD"
              pin_a_tool:
                summary: A column pinned to the LinkedIn profile lookup; the agent finds the URL to call it on
                value:
                  output:
                    "Profile":
                      prompt: "The LinkedIn profile of the row's person; find the canonical linkedin.com/in/<slug> URL first"
                      tool: linkedin_person_profile
              add_input_column:
                summary: Rename the dataset, add an input column and dedupe on it, rename another
                value:
                  name: "Q4 targets"
                  input_columns:
                    "Ticker": {}
                    "Website":
                      rename: "Domain"
                  index_column: "Ticker"
      responses:
        "200":
          description: The dataset after the edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      summary: delete dataset
      description: |
        Delete a dataset and its rows. Its enrichment is kept. Refused with 409 `dataset_in_use` while a build or fill runs on it.
      operationId: deleteDataset
      x-mcp-destructive: true
      x-mcp-description: |
        Delete a dataset by id (rows and cells with it; its enrichment stays). 409 `dataset_in_use` while a run is on it.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /datasets/{id}/rows:
    get:
      summary: list rows
      description: |
        The dataset's rows in position order, each with its `input` values, its `cells` by output column name (`value`, `state`, `sources`), and the `credits` spent on it. Page with `limit` (max 1,000) and `cursor`; `updated_since` returns only rows changed since then.
      operationId: listDatasetRows
      x-mcp-description: |
        Rows of a dataset in position order: `input` by column name, `cells` by output column name (`value`, `state`: pending / running / ok / not_found / failed / manual / stale, `reason` + `error` on failed), `credits` and `not_found_reason` per row. `limit` up to 1,000; pass `next_cursor` back as `cursor` for the next page; `updated_since` for changes only.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page
          schema:
            type: integer
        - name: updated_since
          in: query
          description: Only rows updated at or after this time (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/DatasetRow"
                  next_cursor:
                    type: integer
                    nullable: true
                    description: Pass back as `cursor` for the next page; null on the last page
                  row_count:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: add rows
      description: |
        Append up to 100 rows, each an object keyed by input column name (missing columns are empty). Free. Rows that duplicate an existing one on the index column are skipped and counted in `skipped_duplicates`. New rows' cells are `pending`; fill them with [POST /enrich](#tag/enrich/post/enrich) `{ "dataset_id": ... }`. More than 100 rows: [POST /datasets/{id}/rows/import](#tag/datasets/post/datasets/{id}/rows/import).
      operationId: addDatasetRows
      x-mcp-description: |
        Append up to 100 rows (objects keyed by input column name; free). Duplicates on the index column are skipped (`skipped_duplicates`). Returns the inserted rows. Then `enrich` with `dataset_id`. More rows: `import_dataset_rows`.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
                  maxItems: 100
                  description: Objects keyed by input column name
              required:
                - rows
            example:
              rows:
                - { "Company": "Stripe", "Website": "stripe.com" }
                - { "Company": "Plaid" }
      responses:
        "201":
          description: The rows inserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/DatasetRow"
                  skipped_duplicates:
                    type: integer
                  row_count:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      summary: delete rows
      description: |
        Remove up to 100 rows by id (`ids`, comma-separated `row_...`) and / or by position (`positions`, comma-separated integers from 1). Positions of the other rows do not change. Unknown ids or positions are a 422; nothing is deleted then.
      operationId: deleteDatasetRows
      x-mcp-destructive: true
      x-mcp-description: |
        Remove rows: `ids` (comma-separated `row_...` ids) and / or `positions` (comma-separated positions from 1), up to 100 rows together. Returns the number deleted.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: ids
          in: query
          required: false
          description: Comma-separated row ids (row_...). ids and positions together name up to 100 rows; one of them is required
          schema:
            type: string
        - name: positions
          in: query
          required: false
          description: Comma-separated row positions (integers from 1, as GET rows reports them)
          schema:
            type: string
      responses:
        "200":
          description: Rows deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                  row_count:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /datasets/{id}/rows/import:
    post:
      summary: import rows (CSV)
      description: |
        Append rows from a CSV whose header row holds column names. Input column values become the row's input; output column values land as `manual` cells. Send the CSV as the body (`text/csv`), as a multipart `file`, or as the `csv` string of a JSON body (2 MB max). Up to 1,000 rows land at once (`201`); a bigger file is imported in the background (`202`; [GET /datasets/{id}](#tag/datasets/get/datasets/{id}) shows `import_in_progress`). Duplicates on the index column are skipped.
      operationId: importDatasetRows
      x-mcp-description: |
        Append rows from CSV text (`csv`; header row = input and / or output column names, output values land as `manual` cells; free). Up to 1,000 rows land at once (`import.status` done); more are accepted and land in the background (`importing`; `get_dataset` shows `import_in_progress`). Duplicates on the index column are skipped.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv:
                  type: string
                  description: The CSV text. First row = input and / or output column names.
              required:
                - csv
            example:
              csv: "Company,Website\nStripe,stripe.com\nPlaid,plaid.com\n"
          text/csv:
            schema:
              type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The rows landed in this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetImportResult"
        "202":
          description: The file was accepted and is landing from a job (`import.status` is `importing`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The body is over the 2 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /datasets/{id}/rows/build:
    post:
      summary: generate more rows
      description: |
        Ask the list generator for `count` more rows of an existing dataset. Requires a `index_column` on the dataset (set one with [PATCH /datasets/{id}](#tag/datasets/patch/datasets/{id})); the generator is told the existing rows and skips them, and anything it still repeats is dropped on the index column. `prompt` says what to find; when omitted, the prompt of the dataset's latest build is reused. The generator may find fewer rows than `count`: when the run finishes, its `progress` reports `requested_rows`, `generated_rows`, `added_rows`, `skipped_duplicate_rows`. `auto_fill: true` fills the new rows' output columns when they land (a second paid run). The response is the dataset plus `run` (the generation run); poll it with [GET /runs/{id}](#tag/runs/get/runs/{id}) or pass `webhook_url`.
      operationId: buildDatasetRows
      x-mcp-open-world: true
      x-mcp-description: |
        Generate `count` more rows for a dataset (paid; `estimate_cost` first). Needs a `index_column` on the dataset (`update_dataset`). `prompt` says what to find (default: the dataset's last build prompt); the generator skips the existing rows and may find fewer than `count` — the finished run's `progress` has `requested_rows`, `generated_rows`, `added_rows`, `skipped_duplicate_rows`. `auto_fill: true` fills them when they land. Returns the dataset and `run`.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: "What the rows are. Default: the prompt of the dataset's latest build."
                count:
                  type: integer
                  minimum: 1
                  maximum: 12000
                  description: How many rows to generate. Capped per account.
                budget:
                  $ref: "#/components/schemas/ListBuildBudgetParam"
                auto_fill:
                  type: boolean
                  default: false
                  description: Fill the new rows' output columns when they land (needs an enrichment on the dataset)
                webhook_url:
                  type: string
                  format: uri
                  description: POSTed the generation run when it finishes
                fill_webhook_url:
                  type: string
                  format: uri
                  description: With auto_fill — POSTed the fill run when it finishes
                estimate_cost:
                  $ref: "#/components/schemas/EstimateCostParam"
                max_credits:
                  $ref: "#/components/schemas/MaxCreditsParam"
              required:
                - count
            examples:
              more_rows:
                summary: Fifty more, filled on arrival
                value:
                  prompt: "Specialty coffee roasters in Oakland and Berkeley"
                  count: 50
                  auto_fill: true
      responses:
        "201":
          description: The dataset with `run` (the generation run)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Dataset"
                  - type: object
                    properties:
                      run:
                        $ref: "#/components/schemas/Run"
        "200":
          description: estimate_cost only — the credit estimate; nothing was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateCostResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /datasets/{id}/rows/{row_id}:
    patch:
      summary: set input values
      description: |
        Set a row's `input` values and / or `cells` by hand. Nothing runs. A cell set this way is `manual`: fills skip it unless `force`. `null` clears a value. `input` is refused with 409 `row_in_use` while a fill is on the row; `cells` land during a fill, and a cell set by hand while its row runs stands over the run's answer for it.
      operationId: updateDatasetRow
      x-mcp-destructive: true
      x-mcp-description: |
        Write one row (`row_id`: a `row_...` id or a position) by hand. `input` is `{ "<input column>": value | null }` (an index-column value another row holds is a 422). `cells` is `{ "<output column>": value | null }`: a value becomes a `manual` cell (kept by fills unless `force`); `null` clears it back to `pending`. One write for both. 409 `row_in_use` for `input` while a fill is on the row; `cells` land meanwhile and stand over the run's answer.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: row_id
          in: path
          required: true
          description: The row id (row_...) or its position (an integer from 1)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of `input` and `cells`
              properties:
                input:
                  type: object
                  description: Input column name → value, or null to clear
                  additionalProperties:
                    type: [string, "null"]
                    description: The new value, at most 10,000 characters; null clears the value
                cells:
                  type: object
                  description: Output column name → value, or null to clear
                  additionalProperties:
                    type: [string, "null"]
                    description: The new value; null clears the cell. (Over HTTP any JSON value is accepted, e.g. an object for a column with an output_schema.)
            example:
              input:
                "Website": "apple.com"
              cells:
                "CEO": "Tim Cook"
                "HQ city": null
      responses:
        "200":
          description: The row after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /datasets/{id}/columns/promote:
    post:
      summary: convert output column to input
      description: |
        Turn an output column into an input column of the same name. Every row's value moves with it, so later columns and dedupe can key on it. Refused with 409 `dataset_in_use` while a fill runs. Converting the last output column leaves the dataset with none; a fill is refused until one is added.
      operationId: promoteDatasetColumn
      x-mcp-destructive: true
      x-mcp-description: |
        Make a filled output column an input column of the same name (`column`); every row's value moves with it, so later columns and dedupe can key on it. Not undoable; 409 `dataset_in_use` while a fill runs.
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column:
                  type: string
                  description: The output column name
              required:
                - column
            example:
              column: "Domain"
      responses:
        "200":
          description: The dataset after the conversion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /datasets/{id}/export:
    get:
      summary: export dataset (CSV, Excel, or JSON Lines)
      description: |
        The whole grid: input columns, then the enrichment's output columns, one row per dataset row, in position order. CSV by default (structured cell values are JSON text); `output_format=xlsx` is the same grid as an Excel workbook (every cell text, cells over Excel's 32,767-character limit truncated); `output_format=jsonl` keeps values structured, one JSON object per line. Built in memory; for very large datasets prefer the result files of the fill run ([GET /runs/{id}/result](#tag/runs/get/runs/{id}/result)).
      operationId: exportDataset
      x-mcp-description: |
        The dataset as CSV text (or JSON Lines with `output_format: "jsonl"`; `xlsx` is binary and meant for a browser): input columns, then output columns, one line per row. For a few rows prefer `list_dataset_rows` (it carries cell states).
      tags:
        - Datasets
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: output_format
          in: query
          required: false
          description: "`csv` (default), `xlsx`, or `jsonl`."
          schema:
            type: string
            enum: [csv, xlsx, jsonl]
            default: csv
      responses:
        "200":
          description: The CSV, workbook, or JSON Lines body
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/jsonl:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /configured_datasets/{id}/build:
    post:
      summary: build configured list
      description: |
        Run a **configured list build** — a reusable, pre-configured list template (id `cds_...`) set up for your account ("Configured list builds" in the app). The spec, prompt template, row cap, and per-run credit cost are all defined on the template; you only supply `parameters` to fill in its `{{ placeholder }}` values.

        Returns the list-build run; poll [GET /runs/{id}](#tag/runs/get/runs/{id}). The rows land in a dataset named by the run's `dataset_id`; fill them with [POST /enrich](#tag/enrich/post/enrich).
      operationId: buildConfiguredDataset
      x-mcp-open-world: true
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const run = await riveter.configuredDatasets.build("cds_YOUR_CONFIGURED_DATASET_ID", {
              parameters: { City: "Denver" },
            });
            const result = await riveter.runs.waitForResult(run.id);
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            run = riveter.configured_datasets.build(
                "cds_YOUR_CONFIGURED_DATASET_ID",
                parameters={"City": "Denver"},
            )
            result = riveter.runs.wait_for_result(run.id)
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            run = riveter.configured_datasets.build(
              "cds_YOUR_CONFIGURED_DATASET_ID",
              parameters: { "City" => "Denver" }
            )
            result = riveter.runs.wait_for_result(run.id)
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            ctx := context.Background()
            run, err := client.ConfiguredDatasets.Build(ctx, "cds_YOUR_CONFIGURED_DATASET_ID",
                riveter.BuildConfiguredDatasetParams{Parameters: map[string]string{"City": "Denver"}})
            result, err := client.Runs.WaitForResult(ctx, run.ID, nil)
      tags:
        - Configured list builds
      parameters:
        - name: id
          in: path
          required: true
          description: Configured dataset id (cds_...)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters:
                  type: object
                  description: Values for the template's placeholders (keys defined by the template)
                tier:
                  type: string
                  description: Optional pricing/depth tier when the template defines tiers
                dataset_webhook_url:
                  type: string
                  format: uri
                  description: URL to POST the dataset results to when the build completes
                estimate_cost:
                  $ref: "#/components/schemas/EstimateCostParam"
                max_credits:
                  $ref: "#/components/schemas/MaxCreditsParam"
            examples:
              with_parameters:
                summary: Fill in template parameters
                value:
                  parameters:
                    practice_type: "dentists"
                    state: "ohio"
      responses:
        "201":
          description: Build started — the run plus dataset_id / configured_dataset_id / max_items / tier / credits_charged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Run"
                  - type: object
                    properties:
                      dataset_id:
                        type: string
                      configured_dataset_id:
                        type: string
                      max_items:
                        type: integer
                      tier:
                        type: [string, "null"]
                      credits_charged:
                        type: number
        "200":
          description: estimate_cost only — the tier's flat price; nothing was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateCostResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /extractions/{id}/runs:
    post:
      summary: run extraction
      description: |
        Execute a `ready` extraction. Returns a run — poll [GET /runs/{id}](#tag/runs/get/runs/{id}) and fetch the extracted records with [GET /runs/{id}/result](#tag/runs/get/runs/{id}/result) (the records come back as an array of JSON objects matching your schema), or pass a `webhook_url`.

        `variables` fills any `{{ placeholder }}` values the plan defines (e.g. a search term or location). Each run charges run credits (`credits_charged`).
      operationId: runExtraction
      x-mcp-open-world: true
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const run = await riveter.extractions.run("ext_YOUR_EXTRACTION_ID", {
              variables: { location: "Denver" },
            });
            const result = await riveter.runs.waitForResult(run.id);
            console.log(result.output);
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            run = riveter.extractions.run(
                "ext_YOUR_EXTRACTION_ID",
                variables={"location": "Denver"},
            )
            result = riveter.runs.wait_for_result(run.id)
            print(result.output)
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            run = riveter.extractions.run(
              "ext_YOUR_EXTRACTION_ID",
              variables: { "location" => "Denver" }
            )
            result = riveter.runs.wait_for_result(run.id)
            puts result.output
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            ctx := context.Background()
            run, err := client.Extractions.Run(ctx, "ext_YOUR_EXTRACTION_ID",
                riveter.RunExtractionParams{Variables: map[string]string{"location": "Denver"}})
            result, err := client.Runs.WaitForResult(ctx, run.ID, nil)
            fmt.Println(string(result.Output))
      tags:
        - Extractions
      parameters:
        - name: id
          in: path
          required: true
          description: The extraction id (ext_...)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  description: Values for the plan's placeholders
                webhook_url:
                  type: string
                  format: uri
                  description: URL to POST the records to when the run completes
                estimate_cost:
                  $ref: "#/components/schemas/EstimateCostParam"
                max_credits:
                  $ref: "#/components/schemas/MaxCreditsParam"
      responses:
        "201":
          description: Extraction run started — the run plus merged variables / credits_charged (and a validation_warning when the plan's last discovery validation did not pass)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Run"
                  - type: object
                    properties:
                      variables:
                        type: object
                      credits_charged:
                        type: number
                      validation_warning:
                        type: string
                        description: Present when the last discovery validation did not pass
        "200":
          description: estimate_cost only — the flat per-run price (also shown as run_credits_required on GET /extractions/{id}); nothing was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateCostResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /extractions:
    post:
      summary: create extraction
      description: |
        Create an **extraction** — a reusable recipe for scraping structured records from a website — and start its agent discovery. Discovery explores the site, builds the scrape/extract plan, and validates it against your schema.

        Poll [GET /extractions/{id}](#tag/extractions/get/extractions/{id}) until `status` is `ready`, then execute it with [POST /extractions/{id}/runs](#tag/extractions/post/extractions/{id}/runs). The extraction (`ext_...`) and its runs (`run_...`) are different resources.

        Creating an extraction charges discovery credits (returned as `credits_charged`). To see the price first, send `estimate_cost: true`.
      operationId: createExtraction
      x-mcp-open-world: true
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const extraction = await riveter.extractions.create({
              starting_url: "https://example.com/directory",
              goal_description: "Extract every listed company",
              output_record_json_schema: {
                type: "object",
                properties: { name: { type: "string" }, website: { type: "string" } },
              },
            });
            console.log(extraction.id); // ext_...
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            extraction = riveter.extractions.create(
                starting_url="https://example.com/directory",
                goal_description="Extract every listed company",
                output_record_json_schema={
                    "type": "object",
                    "properties": {"name": {"type": "string"}, "website": {"type": "string"}},
                },
            )
            print(extraction.id)  # ext_...
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            extraction = riveter.extractions.create(
              starting_url: "https://example.com/directory",
              goal_description: "Extract every listed company",
              output_record_json_schema: {
                "type" => "object",
                "properties" => { "name" => { "type" => "string" }, "website" => { "type" => "string" } }
              }
            )
            puts extraction.id # ext_...
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            extraction, err := client.Extractions.Create(context.Background(),
                riveter.CreateExtractionParams{
                    StartingURL:     "https://example.com/directory",
                    GoalDescription: "Extract every listed company",
                    OutputRecordJSONSchema: map[string]any{
                        "type": "object",
                        "properties": map[string]any{
                            "name":    map[string]any{"type": "string"},
                            "website": map[string]any{"type": "string"},
                        },
                    },
                })
            fmt.Println(extraction.ID) // ext_...
      tags:
        - Extractions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                starting_url:
                  type: string
                  format: uri
                  description: Where the agent starts exploring
                goal_description:
                  type: string
                  description: What records to extract, in plain language
                output_record_json_schema:
                  type: object
                  description: JSON schema of one output record
                name:
                  type: string
                  description: Optional display name
                required_keys:
                  type: array
                  items:
                    type: string
                  description: Record keys that must be non-empty for a record to count
                estimate_cost:
                  $ref: "#/components/schemas/EstimateCostParam"
                max_credits:
                  $ref: "#/components/schemas/MaxCreditsParam"
              required:
                - starting_url
                - goal_description
                - output_record_json_schema
            examples:
              create:
                summary: Create an extraction
                value:
                  starting_url: "https://example.com/products"
                  goal_description: "Extract every product with its name and price"
                  output_record_json_schema:
                    type: object
                    properties:
                      name:
                        type: string
                      price:
                        type: string
                  required_keys: ["name"]
      responses:
        "201":
          description: Extraction created, discovery started
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Extraction id (ext_...)
                  name:
                    type: string
                  status:
                    type: string
                    enum: [discovering]
                  app_url:
                    type: string
                    format: uri
                  credits_charged:
