    post:
      summary: search agent
      description: |
        Ask a question and get an answer. This is meant for quick, relatively scoped one-off questions, like "What is the NAICS code for this company...". For more complex questions, use the `enrich/` endpoint.

        This uses the same AI + web-tool loop that fills a single agent-mode cell in an enrichment (web search, web scraping, PDF reading, HTTP requests), with no enrichment setup.

        The run is processed in the background while this request **long-polls up to `wait` seconds (default 50)** — most runs finish in time and return the answer inline in `output.result`. If the agent is still working when the budget elapses, the response comes back with `status: processing` and `output: null`; poll [GET /runs/{id}/result](#tag/runs/get/runs/{id}/result) (it long-polls too) until the run is terminal.

        Pass `output_schema` (a JSON Schema object) to get `output.result` back as a structured object matching your schema instead of free text. Unanswerable questions return the string `"not found"`.

        ## Quick example
        ```bash
        curl -X POST https://api.riveterhq.com/v1/search_agent \
          -H "Authorization: Bearer YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"prompt": "Who is the current CEO of Anthropic, and when did they take the role?"}'
        ```

        ## Credit costs
        - **1 credit** per call (same as one agent-mode enrichment cell), charged when the agent completes. Failed runs are not charged.
      operationId: searchAgent
      x-mcp-open-world: true
      tags:
        - Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  maxLength: 50000
                  description: The question or task for the agent
                output_schema:
                  type: object
                  description: 'Optional JSON Schema object for the answer, e.g. `{"type": "object", "properties": {"ceo_name": {"type": "string"}}}`. When set, `output.result` is an object matching this schema.'
                wait:
                  type: integer
                  minimum: 0
                  maximum: 50
                  description: Seconds to hold this request waiting for the answer (default and max 50). Pass 0 to return immediately and poll GET /runs/{id}/result instead.
                run_key:
                  type: string
                  maxLength: 255
                  pattern: "^[A-Za-z0-9._~-]+$"
                  description: Optional idempotency key (becomes the run id "run_<run_key>")
                estimate_cost:
                  $ref: "#/components/schemas/EstimateCostParam"
                max_credits:
                  $ref: "#/components/schemas/MaxCreditsParam"
              required:
                - prompt
            examples:
              free_text_question:
                summary: A free-text question
                value:
                  prompt: "Who is the current CEO of Anthropic, and when did they take the role?"
              structured_answer:
                summary: A structured answer via output_schema
                value:
                  prompt: "Find the founding year and headquarters city of Anthropic"
                  output_schema:
                    type: object
                    properties:
                      founding_year:
                        type: integer
                      headquarters_city:
                        type: string
      responses:
        "201":
          description: "The run — with the answer in `output.result` when it finished within `wait`, or `status: processing` and `output: null` when the agent is still working"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Run"
                  - type: object
                    properties:
                      output:
                        type: [object, "null"]
                        description: '`{ "result": <string or object> }` once the run finishes; null while it is still processing'
        "200":
          description: estimate_cost only — the flat per-call price; nothing was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateCostResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /scrape:
    post:
      summary: scrape
      description: |
        Scrape a webpage and return the text content **synchronously** — the only endpoint here that doesn't return a run to poll. Unchanged from the legacy API (response uses the legacy `request_status` format).

        ## Quick example
        ```bash
          curl -X POST https://api.riveterhq.com/v1/scrape \
          -H "Authorization: Bearer YOUR_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"url": "https://example.com"}'
        ```

        ## Credit costs
        - **With proxy**: 0.30 credits
        - **Without proxy**: 0.10 credits
        - **From cache**: 0.01 credits

        ## Proxy usage
        Scraping is not guaranteed to succeed without a proxy. Some websites may block requests or require specific geographic locations. To use a proxy, include `proxy_country_code` with a two-character country code (e.g. 'us', 'gb', 'de').

        ## Caching
        Recently scraped pages are cached to save credits (0.01 credits on a cache hit). Set `skip_cache: true` to always fetch fresh content.
      operationId: scrape
      x-mcp-open-world: true
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const page = await riveter.scrape({ url: "https://example.com" });
            console.log(page.text); // synchronous — no run to poll
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            page = riveter.scrape("https://example.com")
            print(page.text)  # synchronous — no run to poll
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            page = riveter.scrape(url: "https://example.com")
            puts page.text # synchronous — no run to poll
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            page, err := client.Scrape(context.Background(),
                riveter.ScrapeParams{URL: "https://example.com"})
            fmt.Println(page.Text) // synchronous — no run to poll
      tags:
        - Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: The URL to scrape
                proxy_country_code:
                  type: string
                  description: Optional two-character country code for proxy (e.g. 'us', 'gb', 'de')
                  pattern: "^[a-z]{2}$"
                skip_cache:
                  type: boolean
                  description: Set to true to bypass cache and always fetch fresh content
                  default: false
                estimate_cost:
                  $ref: "#/components/schemas/EstimateCostParam"
                max_credits:
                  $ref: "#/components/schemas/MaxCreditsParam"
              required:
                - url
      responses:
        "200":
          description: Webpage scraped successfully (or, with estimate_cost, the credit estimate only — minimum is the cache-hit price, maximum depends on proxy_country_code)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScrapeResponse"
                  - $ref: "#/components/schemas/EstimateCostResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /tools:
    get:
      summary: list agent tools
      description: |
        The tools an enrichment may name in `only_tools` / `additional_tools`, or pin to an output column (`tool`): what each does, what a call takes (`inputs`; `input_groups` when any one complete set of them is enough) and gives back (`returns`), its credits per call (`price_note` when the price settles after the call: `pdf` and `image` by the tokens their model spends reading the file, `text_search_pdf` per page, the LinkedIn email / phone tools only on a contact), whether it is on by default, and whether it is enabled on this account. Some tools call their provider with your own API key (`requires_api_key`, linked under Settings > API keys). `budget` is the per-row credit range and the per-column default.
      operationId: listTools
      x-mcp-description: |
        The tools an enrichment may list in `only_tools` / `additional_tools` or pin to an output column (`tool`): name, what it does, what a call takes (`inputs`, each with `required`; `input_groups` when any one complete set is enough) and gives back (`returns`) — the values a pinned column's row must carry or the agent must find —, credits per call (`price_note` when the price settles after the call — the LinkedIn email / phone tools only on a contact, `text_search_pdf` per page, `pdf` / `image` by tokens spent reading it), whether it is on by default, whether it needs opt-in and is enabled on this account, and for a tool that uses the account's own provider key (Apollo, Hunter, Findymail, curl, USPTO) whether one is linked (`api_key_linked`; refused until it is). Also the `budget` (credits per row) range and per-column default.
      tags:
        - Datasets
      responses:
        "200":
          description: The tool catalog for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account:
    get:
      summary: account
      description: |
        Information about the account associated with the API key: plan, credit balance, and the key's metadata. Unchanged from the legacy API (response uses the legacy `request_status` format).
      operationId: getAccount
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const info = await riveter.account();
            console.log(info.account.credit.balance);
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            info = riveter.account()
            print(info.account.credit.balance)
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            info = riveter.account
            puts info.account.credit.balance
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            info, err := client.Account(context.Background())
            fmt.Println(info.Account.Credit.Balance)
      tags:
        - Account
      responses:
        "200":
          description: Account information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_status:
                    type: string
                    enum: [success]
                  message:
                    type: string
                  account:
                    $ref: "#/components/schemas/Account"
                  api_key_info:
                    $ref: "#/components/schemas/ApiKeyInfo"
                required:
                  - request_status
                  - message
                  - account
                  - api_key_info
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
      description: API key authentication. Use 'Bearer YOUR_API_KEY' in the Authorization header.
      x-scalar-secret-token: YOUR_API_KEY

  parameters:
    DatasetId:
      name: id
      in: path
      required: true
      description: The dataset id (ds_...)
      schema:
        type: string

  schemas:
    Run:
      type: object
      description: |
        The uniform shape for every run, returned by kickoff endpoints and all /runs endpoints.
        Related resource ids (enrichment_id, dataset_id, extraction_id, monitor_id) appear when they
        apply to the run; kickoff responses may add a few endpoint-specific fields.
      properties:
        id:
          type: string
          description: The run id (run_...)
        type:
          type: string
          enum:
            [
              enrichment,
              dataset_build,
              extraction,
              scrape,
              quick_search,
              search_agent,
            ]
          description: What kind of run this is
        status:
          type: string
          enum: [pending, enqueued, processing, success, stopped]
        progress:
          $ref: "#/components/schemas/RunProgress"
        credits_used:
          type: number
          description: Credits consumed so far
        credit_detail:
          $ref: "#/components/schemas/CreditDetail"
        app_url:
          type: string
          format: uri
          description: Link to view this run in the Riveter app
        result_url:
          type: string
          format: uri
          description: Where to fetch the run's output
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        error:
          type: [object, "null"]
          description: Null unless the run hit an error
          properties:
            type:
              type: string
            message:
              type: string
        stopped_reason:
          $ref: "#/components/schemas/StoppedReason"
        enrichment_id:
          type: string
          description: Present when the run belongs to an enrichment
        enrichment_name:
          type: string
        dataset_id:
          type: string
          description: Present on dataset-build runs
        extraction_id:
          type: string
          description: Present on extraction runs
        monitor_id:
          type: string
          description: Present on monitor-scheduled runs
        webhook_url:
          type: string
          format: uri
          description: Present when the run has a webhook configured
        legacy:
          $ref: "#/components/schemas/LegacyNotice"
      required:
        - id
        - type
        - status
        - progress
        - credit_detail
        - result_url
      example:
        id: "run_018f6a70-1234-7abc-89ab-0123456789ab"
        type: "enrichment"
        status: "processing"
        progress:
          percent_complete: 40
          estimated_seconds_remaining: 90
          elapsed_seconds: 60
          completed_cells: 4
          total_cells_expected: 10
          not_found_cells: 0
        credits_used: 2.5
        credit_detail:
          estimate:
            minimum: 0
            maximum: 10
            charged_upfront: false
          credits_used: 2.5
        app_url: "https://app.riveterhq.com/runs/run_018f6a70-1234-7abc-89ab-0123456789ab"
        result_url: "https://api.riveterhq.com/v1/runs/run_018f6a70-1234-7abc-89ab-0123456789ab/result"
        started_at: "2026-01-15T12:00:00Z"
        finished_at: null
        error: null
        enrichment_id: "enr_018f5b60-1234-7abc-89ab-0123456789ab"
        enrichment_name: "My Enrichment"

    LegacyNotice:
      type: object
      description: |
        Present on a response when the request took a legacy mode — a legacy enrichment's id on `/enrich`,
        `/enrichments/{id}`, `/monitors`, or `GET /runs`; a monitor on a legacy enrichment; an `output` column
        with legacy-pipeline fields on `/enrich`; the list-build body on `POST /datasets`. The response also
        carries `Deprecation: true` and a `Link` header (`rel="successor-version"`). The legacy generation is
        documented in [the legacy API docs](?spec=legacy).
      properties:
        notice:
          type: string
          description: One or two sentences — what was legacy about the request and what to send instead
        successor:
          type: string
          description: "`METHOD /v1/path` of the current operation to use"
        docs:
          type: string
          format: uri
          description: The successor's section of this reference
      required:
        - notice
        - successor
        - docs
      example:
        notice: "enrichment_id named a legacy enrichment, so this run is on the legacy pipeline. It keeps working, but new integrations should use POST /v1/enrich with dataset_id ds_018f5b60-1234-7abc-89ab-0123456789ab."
        successor: "POST /v1/enrich"
        docs: "https://docs.riveterhq.com/#tag/enrich/post/enrich"

    EstimateCostParam:
      type: boolean
      default: false
      description: |
        Validate and price the request without running or charging anything; the 200 response is the
        credit estimate (EstimateCostResult).

    MaxCreditsParam:
      type: number
      minimum: 0
      description: |
        Credit ceiling. Refused with 422 credit_cap_exceeded (nothing charged) when the estimate's
        maximum exceeds it.

    ListBuildBudgetParam:
      type: number
      minimum: 10
      maximum: 5000
      description: "Most credits the build may spend (default 50 + 1.5 per row); charged at kickoff, settled to the agent's spend. A low budget means fewer rows."

    CreditEstimate:
      type: object
      description: |
        Kickoff-time credit estimate. `maximum` is the contract — the run never charges more.
        `minimum` is 0 when the run can charge less (cells that short-circuit, a dataset build settling below its cap).
        `expected` is the likely charge when history exists (a dataset fill: rows × the enrichment's average charge per row over its finished fills; a dataset build: what builds of that size settled at lately — the account's own once it has a few, else Riveter-wide — never above the budget).
      properties:
        minimum:
          type: number
          description: Least the run can cost
        expected:
          type: number
          description: Likely cost from past runs of the same config; absent without history
        maximum:
          type: number
          description: Most the run can cost
        charged_upfront:
          type: boolean
          description: true when `maximum` is taken at kickoff (dataset builds, extractions); false when credits accrue as work completes
      required:
        - minimum
        - maximum
        - charged_upfront

    CreditDetail:
      type: object
      description: |
        The estimate made at kickoff next to what has been charged so far. `estimate` is null for runs
        started before estimates existed. Estimates and credit errors add `credits_remaining` and `sufficient_credits`.
      properties:
        estimate:
          oneOf:
            - $ref: "#/components/schemas/CreditEstimate"
            - type: "null"
        credits_used:
          type: number
          description: Credits charged so far (same value as the top-level credits_used)
        credits_remaining:
          type: number
          description: Account balance. Only on estimates and credit errors.
        sufficient_credits:
          type: boolean
          description: Whether the balance covers `estimate.maximum`. Only on estimates and credit errors.
      required:
        - estimate
        - credits_used

    EstimateCostResult:
      type: object
      description: |
        Returned with `200` when a paid endpoint is called with `estimate_cost: true`. The request was validated
        and priced; nothing was created or charged.
      properties:
        estimate_cost:
          type: boolean
          enum: [true]
        type:
          type: string
          enum:
            [
              enrichment,
              dataset_build,
              extraction_discovery,
              extraction,
              monitor,
              scrape,
              quick_search,
              search_agent,
            ]
          description: What would have been charged for (`monitor` = one scheduled run of the monitor)
        credit_detail:
          $ref: "#/components/schemas/CreditDetail"
      required:
        - estimate_cost
        - type
        - credit_detail
      example:
        estimate_cost: true
        type: "enrichment"
        credit_detail:
          estimate:
            minimum: 0
            maximum: 1920
            charged_upfront: false
          credits_used: 0
          credits_remaining: 5000
          sufficient_credits: true

    RunProgress:
      type: object
      description: Completion estimate. Cell-based runs (enrichment, quick_search) also report cell counts; dataset fills report row counts; builds on a dataset report what landed.
      properties:
        percent_complete:
          type: [number, "null"]
        estimated_seconds_remaining:
          type: [number, "null"]
        elapsed_seconds:
          type: [number, "null"]
        completed_cells:
          type: integer
          description: Cell-based runs only
        total_cells_expected:
          type: integer
          description: Cell-based runs only
        not_found_cells:
          type: [integer, "null"]
          description: Cell-based runs only. Null while a run over 5,000 rows is in progress; set when it finishes.
        total_rows:
          type: integer
          description: Dataset fills only. Rows in the fill's scope
        completed_rows:
          type: integer
          description: Dataset fills only. Rows finished (ok, not found, or failed)
        running_rows:
          type: integer
          description: Dataset fills only. Rows an agent is working on right now
        requested_rows:
          type: integer
          description: Builds on a dataset only. The `count` asked for
        generated_rows:
          type: integer
          description: Builds on a dataset only. Rows the generator found; set when the run finishes
        added_rows:
          type: integer
          description: Builds on a dataset only. Rows that landed in the dataset; set when the run finishes
        skipped_duplicate_rows:
          type: integer
          description: Builds on a dataset only. Generated rows dropped as duplicates on the index column; set when the run finishes

    RunListItem:
      type: object
      description: The slim run shape used by GET /runs and GET /monitors/{id}/runs.
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            [
              enrichment,
              dataset_build,
              extraction,
              scrape,
              quick_search,
              search_agent,
            ]
        status:
          type: string
          enum: [pending, enqueued, processing, success, stopped]
        enrichment_id:
          type: [string, "null"]
        enrichment_name:
          type: [string, "null"]
        row_count:
          type: [integer, "null"]
        credits_used:
          type: number
        error:
          type: [object, "null"]
          properties:
            type:
              type: string
            message:
              type: string
        stopped_reason:
          $ref: "#/components/schemas/StoppedReason"
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        app_url:
          type: string
          format: uri
        result_url:
          type: string
          format: uri

    StoppedReason:
      type: string
      enum: [user_request, credit_limit, error]
      description: |
        Why the run has status `stopped`. Only present on stopped runs.
        `user_request`: stopped through the API or the app. `credit_limit`: the account ran out of credits.
        `error`: the run failed (internal error, or every enrichment cell failed); `error.message` has the detail.

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer

    OutputFile:
      type: object
      description: One export of a run's whole grid on object storage. `url` is a signed link, valid until `expires_at`; re-fetch the result for a fresh one.
      properties:
        state:
          type: string
          enum: [pending, ready]
        format:
          type: string
          enum: [csv, jsonl]
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        byte_size:
          type: integer
        row_count:
          type: integer
      required:
        - state
        - format

    OutputFiles:
      type: object
      description: The run's output as files, on every dataset fill (`POST /enrich` with `dataset_id` or `input`, `POST /enrich_rows`). Both are written together once the run finishes.
      properties:
        csv:
          $ref: "#/components/schemas/OutputFile"
        jsonl:
          $ref: "#/components/schemas/OutputFile"

    EnrichmentInputData:
      type: object
      description: |
        Keys are your source-data column headers. Values are arrays of strings (one per row).
        Any column header name is allowed; all input columns must have the same array length.
        Row caps: 10,000 rows with enrichment_id, 1,000 rows with an inline config.
      additionalProperties:
        type: array
        description: One string per row (all input columns must have the same array length)
        items:
          type: string
        maxItems: 10000
      example:
        "Company Name": ["Acme Corp", "Tech Solutions Inc"]
        "Website": ["acme.com", "techsolutions.com"]

    FormatDetails:
      type: object
      description: |
        Format-specific options. Valid keys depend on the column `format`.
        Only include keys that apply to your chosen format.
      properties:
        options:
          type: array
          items:
            type: string
          description: tag — allowed tag values (required for tag format)
        allow_multiple:
          type: boolean
          description: tag — allow selecting more than one tag
        descriptions:
          type: object
          description: tag — optional map from tag value to description (keys must be in `options`)
          additionalProperties:
            type: string
        decimal_places:
          type: integer
          minimum: 0
          maximum: 9
          description: number — decimal places to round to
        currency_code:
          type: string
          description: number — 3-letter currency code (mutually exclusive with percentage)
        commas:
          type: boolean
          description: number — display thousands separators
        percentage:
          type: boolean
          description: number — format as percentage (mutually exclusive with currency_code)
        description:
          type: string
          description: json — natural-language schema description (use with or instead of `schema`)
        schema:
          type: object
          description: |
            json — JSON Schema for structured output (object or array root, up to 10 levels; no `$ref`,
            `oneOf`, `allOf`, `not`). Strict mode is applied; mark optional fields nullable. `help` with `formats`.
        iso_8601:
          type: boolean
          description: date — output ISO 8601 (cannot combine with month/day/year/delimiter)
        month:
          type: string
          enum: [M, MM, MMM, MMMM]
          description: date — month format token
        day:
          type: string
          enum: [D, DD, Do]
          description: date — day format token
        year:
          type: string
          enum: [YYYY, YY]
          description: date — year format token
        delimiter:
          type: string
          description: date — single-character delimiter between date parts

    EnrichmentOutputColumnConfig:
      type: object
      description: |
        One output column of an inline `enrich`: `prompt`, an optional `output_schema`, an optional pinned `tool`
        (the same fields as [OutputColumnSpec](#model/outputcolumnspec), keyed by column name). `contexts` is
        accepted and ignored. Every other field is the legacy pipeline's: a column that sets one keeps the run
        on the legacy pipeline (one agent or one tool call per cell, a legacy enrichment) and the response
        carries `legacy` naming the fields; they are documented in the legacy API docs.
      properties:
        prompt:
          type: string
          description: What this cell is, one value. The agent also has the task prompt and the whole row. Leave sources out; the agent records the URLs it cited on the cell's `sources`.
        output_schema:
          type: object
          description: "JSON Schema for the value (type, enum, properties, items, format, ...). Leave it out: the type is inferred from the prompt. Send one only for an enum, a list, or an object. `help` with `output_schema`."
        tool:
          type: string
          description: "Pin a tool by its GET /tools name: one call of it per row is the cell, arguments chosen by the agent (`help` with `pinned_columns`). With tool parameters (`url`, `query`, `code`, ...) it is the legacy tool-only column instead."
        contexts:
          type: array
          description: Accepted and ignored — the agent reads every column of the row.
          items:
            type: string
        tools:
          type: array
          description: "Legacy pipeline: the cell agent's tools (web_search, scrape, pdf, image, http_request, check_urls, text_search_pdf)."
          items:
            type: string
        max_tool_calls:
          type: integer
          minimum: 0
          maximum: 10
          description: "Legacy pipeline: cap on tool calls per cell."
        format:
          type: string
          enum: [text, number, url, email, tag, date, json, boolean]
          description: "Legacy pipeline: the value's format. Use `output_schema` instead."
        format_details:
          $ref: "#/components/schemas/FormatDetails"
        run_when:
          type: string
          enum: [always, any_filled, all_filled, dynamic]
          description: "Legacy pipeline: per-row gate (`any_filled` / `all_filled` on the column's dependencies; `dynamic` on `run_when_config`)."
        run_when_config:
          type: object
          description: "Legacy pipeline: rules for `run_when: dynamic` — `match_mode` `all` / `any`, and `rules` on cell values."
          properties:
            match_mode:
              type: string
              enum: [all, any]
              description: How rules combine — `all` (default) or `any`
            rules:
              type: array
              minItems: 1
              description: Conditions evaluated against the row's cell values
              items:
                type: object
                properties:
                  column:
                    type: string
                    description: Header of an input column or an earlier output column
                  condition:
                    type: string
                    enum:
                      [
                        is_empty,
                        is_not_empty,
                        text_contains,
                        text_does_not_contain,
                        text_starts_with,
                        text_ends_with,
                        text_is_exactly,
                      ]
                    description: |
                      `is_empty` / `is_not_empty` take no `value` ("not found" counts as empty); the `text_*`
                      conditions compare to `value`, case-insensitive except `text_is_exactly`.
                  value:
                    type: string
                    description: Comparison text for the `text_*` conditions
                required: [column, condition]
          example:
            match_mode: all
            rules:
              - column: "CEO"
                condition: "is_not_empty"
              - column: "Company Size"
                condition: "text_contains"
                value: "enterprise"
        url:
          type: string
          description: "Legacy tool-only column: column header or static URL."
        query:
          type: string
          description: "Legacy tool-only column (web_search): column header or static query."
        date_start:
          type: string
          description: "Legacy tool-only column (web_search): start date, YYYY-MM-DD."
        date_end:
          type: string
          description: "Legacy tool-only column (web_search): end date, YYYY-MM-DD."
        code:
          type: string
          description: "Legacy tool-only column (code): JavaScript source. On the dataset engine the prompt describes the computation and the agent writes the code."
        args:
          type: object
          description: "Legacy tool-only column (code): named arguments; values are column headers or static strings."
        proxy_country_code:
          type: string
          description: "Legacy tool-only column (scrape)."
        wait_longer:
          type: boolean
          description: "Legacy tool-only column (scrape)."
        skip_cache:
          type: boolean
          description: "Legacy tool-only column (scrape)."

    EnrichmentOutputSpec:
      type: object
      description: |
        Keys are output column headers. Values are per-column configuration objects. Any output column name
        is allowed that is not an input column. Columns are researched together by one agent per row and need no order.
      additionalProperties:
        $ref: "#/components/schemas/EnrichmentOutputColumnConfig"
      example:
        "Employee Count":
          prompt: "The current number of employees at this company"
          output_schema: { type: "integer", minimum: 0 }
        "Industry":
          prompt: "The industry this company is in"
          output_schema: { type: "string", enum: ["SaaS", "Fintech", "Healthcare", "Other"] }
        "CEO":
