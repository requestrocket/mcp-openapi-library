    # ----- dataset engine -----

    OutputColumnSpec:
      type: object
      description: One output column of an enrichment. A plain string is accepted in its place (a column name with no prompt or schema).
      properties:
        name:
          type: string
          maxLength: 100
          description: The column name; the handle in every later call
        prompt:
          type: string
          maxLength: 5000
          description: What to find for this column, one value, on top of the enrichment's task prompt; on a pinned column, what to call the tool on. Leave sources out; the agent records the URLs it cited on the cell's `sources`.
        output_schema:
          type: object
          description: 'A JSON Schema for the cell value (`help` with `output_schema`). Leave it out: the type is inferred from the prompt, caveats included. Send one only for an enum, a list, or an object. Does not apply to a pinned column.'
        tool:
          $ref: "#/components/schemas/ColumnToolPin"
      required:
        - name

    ColumnToolPin:
      type: string
      nullable: true
      description: 'A tool name from GET /tools. The row agent makes one call of it per row — arguments it works out from the row, the known values, and its research; the column `prompt` says what to call it on — and the call''s result is the cell. `null` unpins. `help` with `pinned_columns`.'
      example: linkedin_person_profile

    OutputColumnOperations:
      type: object
      description: |
        Output column edits keyed by column name. A name not on the enrichment adds a column; `prompt` / `output_schema` / `tool` change one (its filled cells read `stale`); `rename` renames it (cells kept); `delete: true` removes it.
      additionalProperties:
        type: object
        properties:
          prompt:
            type: string
            maxLength: 5000
            description: What to find for this column, one value. Leave sources out; the agent records the URLs it cited on the cell's `sources`.
          output_schema:
            type: object
            description: 'A JSON Schema for the cell value (`help` with `output_schema`). Leave it out on an added column: the type is inferred from the prompt, caveats included. Send one only for an enum, a list, or an object.'
          tool:
            $ref: "#/components/schemas/ColumnToolPin"
          rename:
            type: string
            maxLength: 100
            description: The column's new name
          delete:
            type: boolean
            description: Remove the column

    InputColumnOperations:
      type: object
      description: |
        Input column edits keyed by column name. `{}` adds the column; `rename` renames it; `delete: true` removes it (not the index column). Rows are untouched: an added column reads empty, a removed column's values are dropped from reads.
      additionalProperties:
        type: object
        properties:
          rename:
            type: string
            maxLength: 100
            description: The column's new name
          delete:
            type: boolean
            description: Remove the column

    Enrichment:
      type: object
      description: An enrichment (the recipe a fill runs). A legacy enrichment's id answers its older shape (the legacy API docs) with `legacy` set.
      properties:
        id:
          type: string
          description: enr_...
        name:
          type: string
          nullable: true
        prompt:
          type: string
          description: The task prompt the row agent reads for every row
        input_columns:
          type: array
          items:
            type: string
          description: The headers rows must carry (empty = any)
        output:
          type: array
          items:
            $ref: "#/components/schemas/OutputColumnSpec"
        tools:
          type: array
          items:
            type: string
          description: The tools the row agent may call (names from GET /tools)
        budget_credits_per_row:
          type: number
          description: The most the row agent may spend on one row. Moves by 1.5 per output column added or removed unless `budget_locked`
        budget_locked:
          type: boolean
          description: true when the budget stays as set through column changes
        version:
          type: integer
          description: Goes up by one on every column change; a cell filled under an older version reads `stale`
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        legacy:
          $ref: "#/components/schemas/LegacyNotice"
      example:
        id: enr_018f5b60-1234-7abc-89ab-0123456789ab
        name: Company basics
        prompt: Research each company from its name and website.
        input_columns: [Company, Website]
        output:
          - name: CEO
          - name: Employee count
            prompt: Current headcount as an integer
            output_schema: { type: integer, minimum: 0 }
          - name: Homepage text
            prompt: The company's homepage, from the Website column
            tool: scrape
        tools: [web_search, scrape, pdf, http_request, code]
        budget_credits_per_row: 4.5
        budget_locked: false
        version: 1
        created_at: "2026-10-01T12:00:00Z"
        updated_at: "2026-10-01T12:00:00Z"

    DatasetRunSummary:
      type: object
      description: A run on a dataset, as the dataset lists it (the full run is GET /runs/{id})
      properties:
        id:
          type: string
          description: run_...
        type:
          type: string
          enum: [dataset_build, enrichment]
          description: dataset_build = list generation; enrichment = a fill
        status:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    Dataset:
      type: object
      properties:
        id:
          type: string
          description: ds_...
        name:
          type: string
          nullable: true
        input_columns:
          type: array
          items:
            type: string
          description: Input column names, in order (row identity)
        index_column:
          type: string
          nullable: true
          description: The input column rows are unique on
        enrichment_id:
          type: string
          nullable: true
          description: The bound enrichment (its output columns are the dataset's)
        output_columns:
          type: array
          items:
            type: string
          description: Output column names, in order (from the bound enrichment; [] without one). Prompts and schemas are on GET /enrichments/{enrichment_id}
        row_count:
          type: integer
        rows_expired:
          type: boolean
          description: True once the rows were removed by retention; the structure stays
        import_in_progress:
          type: boolean
          description: A CSV import accepted with 202 has not landed yet
        runs:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRunSummary"
          description: The five newest runs on the dataset
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: ds_018f6a70-1234-7abc-89ab-0123456789ab
        name: Targets
        input_columns: [Company, Website]
        index_column: Company
        enrichment_id: enr_018f5b60-1234-7abc-89ab-0123456789ab
        output_columns: [CEO, HQ city]
        row_count: 2
        rows_expired: false
        import_in_progress: false
        runs:
          - id: run_018f6a70-cccc-7abc-89ab-0123456789ab
            type: enrichment
            status: success
            created_at: "2026-10-01T12:05:00Z"
            finished_at: "2026-10-01T12:07:00Z"
        created_at: "2026-10-01T12:00:00Z"
        updated_at: "2026-10-01T12:07:00Z"

    DatasetListItem:
      type: object
      properties:
        id:
          type: string
          description: ds_...
        name:
          type: string
          nullable: true
        input_column_count:
          type: integer
        output_column_count:
          type: integer
        row_count:
          type: integer
        rows_expired:
          type: boolean
        newest_run:
          allOf:
            - $ref: "#/components/schemas/DatasetRunSummary"
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DatasetCell:
      type: object
      properties:
        value:
          description: The cell value (a string, or structured JSON when the column has an output_schema); null until filled or when nothing was found
          nullable: true
        state:
          type: string
          enum: [pending, running, ok, not_found, failed, manual, stale]
          description: |
            pending = never filled; running = a fill is on it; ok / not_found / failed = the last fill's result
            (a failed cell never finished — the next fill re-runs it without force; a not_found cell is an answer and stays);
            manual = set by hand (PATCH rows/{row_id}); stale = filled before the column's prompt or schema changed (the next fill re-runs it)
        reason:
          type: string
          enum: [credit_limit, provider, internal]
          description: |
            Failed cells only. credit_limit = the account's credit limit refused the row's charge; provider = the model
            provider answered with an error or did not answer (run it again); internal = something went wrong on Riveter's
            side (run it again). A stopped run leaves no failed cells: its recorded values land as ok, the rest stay as they were.
        error:
          type: string
          description: Failed cells only. One fixed sentence for the `reason`, fit to show a user
        sources:
          type: array
          items:
            type: string
          description: URLs the agent cited, when present

    DatasetRow:
      type: object
      properties:
        id:
          type: string
          description: row_...
        position:
          type: integer
          description: Insertion order, from 1 (the row number a user sees); stable, and the paging cursor
        input:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: Input values by column name
        cells:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DatasetCell"
          description: Cells by output column name (every output column is present; in a run's `output.rows`, only the columns the fill covered)
        credits:
          type: number
          description: Credits fills have charged for this row so far (each row run counted once)
        not_found_reason:
          type: string
          nullable: true
          description: The agent's one sentence on what it could not find on this row and why, from its last successful run; null when it found every column or has not run
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: row_018f6a70-aaaa-7abc-89ab-0123456789ab
        position: 1
        input: { Company: Apple, Website: apple.com }
        cells:
          CEO:
            {
              value: Tim Cook,
              state: ok,
              sources: ["https://www.apple.com/leadership/"],
            }
          HQ city: { value: null, state: pending }
        credits: 1.2
        not_found_reason: null
        created_at: "2026-10-01T12:00:00Z"
        updated_at: "2026-10-01T12:07:00Z"

    DatasetImportResult:
      type: object
      properties:
        import:
          type: object
          properties:
            status:
              type: string
              enum: [done, importing]
            rows:
              type: integer
              description: Rows in the file
            rows_added:
              type: integer
              nullable: true
              description: Null while importing
            skipped_duplicates:
              type: integer
              nullable: true
              description: Null while importing
        row_count:
          type: integer
          description: The dataset's row count after this request (staged rows included)

    ToolCatalog:
      type: object
      properties:
        tools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name to use in only_tools / additional_tools
              description:
                type: string
              credits_per_call:
                type: number
              price_note:
                type: string
                nullable: true
                description: When the price is not flat — the scrape settles to its outcome, pdf and image to the tokens their model spent reading the file (credits_per_call is what is booked before the call), text_search_pdf to the PDF's page count; the LinkedIn email / phone tools are charged only when the call returns a contact. Null for a flat price.
              default:
                type: boolean
                description: On without being named
              requires_opt_in:
                type: boolean
                description: A Riveter admin enables it on the account; false for the default tools and the ones any account may add
              enabled:
                type: boolean
                description: Usable on this account (opt-in satisfied or not needed; says nothing about the API key)
              requires_api_key:
                type: boolean
                description: Calls its provider with the account's own API key (Apollo, Hunter, Findymail, curl, USPTO); refused until one is linked under Settings > API keys
              api_key_linked:
                type: boolean
                nullable: true
                description: Whether the account has linked a key for this tool; null when the tool needs none
              companions:
                type: array
                items:
                  type: string
                description: Free helper tools this tool brings along
              inputs:
                type: array
                description: What a call takes. On a pinned column the agent fills these from the row's columns or its research, so the dataset should carry them (a LinkedIn URL column for the LinkedIn tools, a domain for the Hunter domain search).
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                      nullable: true
                      description: string / integer / number / boolean / object; null when the input takes more than one shape
                    required:
                      type: boolean
                    description:
                      type: string
                      nullable: true
              input_groups:
                type: array
                nullable: true
                description: When set, any one complete group of inputs is enough (`[["linkedin_handle"], ["domain", "full_name"]]`) and `required` is false on each
                items:
                  type: array
                  items:
                    type: string
              returns:
                type: string
                nullable: true
                description: What a call gives back — on a pinned column, what the cell holds
        budget:
          type: object
          properties:
            default_credits_per_output_column:
              type: number
              description: A new enrichment's budget per row is this times its output columns; it moves by this much per column added or removed until locked
            min_credits_per_row:
              type: number
            max_credits_per_row:
              type: number

  responses:
    BadRequest:
      description: The request is malformed or names a conflicting parameter combination
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API key (legacy-shaped body — see the AuthError schema)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    Forbidden:
      description: The API key's account may not access this resource or endpoint (`forbidden`), or the account has not migrated to Datasets yet (`feature_not_enabled` — open Datasets in the app and click "Migrate to Datasets")
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No resource with that id on this account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate run_key or a run already in progress
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: The request is valid but can't be executed (e.g. insufficient_credits, credit_cap_exceeded when max_credits is set, validation failure)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

tags:
  - name: Runs
    description: |
      The uniform lifecycle for every async operation — status, results, stop.

      **The run** (returned by kickoffs and every `/runs` endpoint):

      ```json
      {
        "id": "run_018f6a70-1234-7abc-89ab-0123456789ab",
        "type": "enrichment",
        "status": "processing",
        "progress": {
          "percent_complete": 40,
          "estimated_seconds_remaining": 90,
          "elapsed_seconds": 60,
          "completed_cells": 4,
          "total_cells_expected": 10,
          "not_found_cells": 0
        },
        "credits_used": 2.5,
        "credit_detail": {
          "estimate": { "minimum": 0, "maximum": 10, "charged_upfront": false },
          "credits_used": 2.5
        },
        "app_url": "https://app.riveterhq.com/runs/run_018f6a70-...",
        "result_url": "https://api.riveterhq.com/v1/runs/run_018f6a70-.../result",
        "started_at": "2026-01-15T12:00:00Z",
        "finished_at": null,
        "error": null,
        "enrichment_id": "enr_018f5b60-...",
        "enrichment_name": "My Enrichment"
      }
      ```

      Related resource ids (`enrichment_id`, `dataset_id`, `extraction_id`, `monitor_id`) appear when they apply to the run. A kickoff that took a legacy mode adds `legacy` ([LegacyNotice](#model/legacynotice)).
  - name: Datasets
    description: Tables Riveter keeps for you — rows you send or Riveter generates, filled column by column by an enrichment ([POST /enrich](#tag/enrich/post/enrich) with `dataset_id`). The preferred way to enrich data you have. Start with [POST /datasets](#tag/datasets/post/datasets) — what a dataset is, and three worked flows. On an account that has not migrated to Datasets yet, every endpoint here answers `403 feature_not_enabled` until it does.
  - name: Enrich
    description: Fill in new columns for rows — a dataset's rows ([POST /enrich](#tag/enrich/post/enrich) with `dataset_id`, the preferred way) or rows sent inline for a one-off — and manage saved enrichment configurations.
  - name: Extractions
    description: Reusable site scrape/extract recipes and their runs
  - name: Tools
    description: Synchronous and quick utilities — web search and scraping.
  - name: Account
    description: Account and API key information
  - name: Monitors
    description: A dataset filled again on a schedule, each cell compared with the previous run, with webhooks
  - name: Configured list builds
    description: |
      Templated list builds (`cds_...`): a list generation whose prompt and columns staff configured for your account, run with `parameters` and a `tier`. The rows land in a dataset named by the run's `dataset_id`; fill them with [POST /enrich](#tag/enrich/post/enrich).

      For a list of your own description, use [POST /datasets](#tag/datasets/post/datasets) with `prompt` + `count` or [POST /datasets/{id}/rows/build](#tag/datasets/post/datasets/{id}/rows/build).
