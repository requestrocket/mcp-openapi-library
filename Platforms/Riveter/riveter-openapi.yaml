            })
            result, err := client.Runs.WaitForResult(ctx, run.ID, nil)
            fmt.Println(string(result.Output))
      tags:
        - Enrich
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enrichment_id:
                  type: string
                  description: "Config source: id of a saved enrichment (enr_...)"
                output:
                  $ref: "#/components/schemas/EnrichmentOutputSpec"
                  description: "Config source: a spec per output column (prompt, output_schema, tool)"
                prompt:
                  type: string
                  description: "Config source: the task the agent follows for every row (requires attributes)"
                attributes:
                  type: array
                  items:
                    type: string
                  maxItems: 20
                  description: "Config source: the output column names, typed from their names (requires prompt). Max 20."
                input:
                  $ref: "#/components/schemas/EnrichmentInputData"
                  description: "Row source: inline columnar data"
                dataset_id:
                  type: string
                  description: "Row source: a ds_... id. Fills the dataset's cells with its bound enrichment; no column config with it."
                columns:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                  description: "With dataset_id: only these output columns (by name). Default: every output column."
                rows:
                  type: array
                  items:
                    type: string
                  maxItems: 100000
                  description: "With dataset_id: only these rows (row_... ids). May be combined with positions. Default: every row."
                positions:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  maxItems: 100000
                  description: "With dataset_id: only the rows at these positions (from 1, as list_dataset_rows reports them). May be combined with rows."
                targets:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      columns:
                        type: array
                        items:
                          type: string
                        maxItems: 50
                        description: "Output column names in this box. Default: every output column."
                      rows:
                        type: array
                        items:
                          type: string
                        maxItems: 100000
                        description: "row_... ids in this box. May be combined with positions. Default: every row."
                      positions:
                        type: array
                        items:
                          type: integer
                          minimum: 1
                        maxItems: 100000
                        description: "Row positions (from 1) in this box. May be combined with rows."
                  description: "With dataset_id: several boxes of columns × rows in one run, e.g. CEO on rows 3-4 and HQ on rows 20-22. The scope is their union. Not combined with the flat columns / rows / positions."
                states:
                  type: array
                  items:
                    type: string
                    enum: [pending, stale, failed, not_found, ok, manual]
                  description: 'With dataset_id: the cell states to run, e.g. ["not_found"] to research the not-found cells again. Default: pending, stale, failed. Not combined with force.'
                force:
                  type: boolean
                  default: false
                  description: "With dataset_id: re-run every cell in scope, whatever its state (the same as states naming every state)."
                run_key:
                  type: string
                  maxLength: 255
                  pattern: "^[A-Za-z0-9._~-]+$"
                  description: |
                    Optional idempotency key, unique per account. Becomes the run id ("run_<run_key>"),
                    so it is limited to letters, digits, and . _ ~ - characters. A duplicate returns 409.
                webhook_url:
                  type: string
                  format: uri
                  description: URL to POST the results to when the run completes
                allow_duplicate_input:
                  type: boolean
                  default: false
                  description: With enrichment_id — allow re-running rows already present in the enrichment
                estimate_cost:
                  $ref: "#/components/schemas/EstimateCostParam"
                max_credits:
                  $ref: "#/components/schemas/MaxCreditsParam"
            examples:
              saved_enrichment:
                summary: Run a saved enrichment
                value:
                  enrichment_id: "enr_018f5b60-1234-7abc-89ab-0123456789ab"
                  input:
                    "Company Name": ["Acme Corp", "Tech Solutions Inc"]
              prompt_and_attributes:
                summary: Prompt + attributes (a task and column names)
                value:
                  prompt: "Research each company"
                  attributes: ["CEO", "Employee Count", "Industry"]
                  input:
                    "Company": ["Apple", "Google"]
                  webhook_url: "https://your-server.com/webhook"
              full_output_spec:
                summary: A spec per output column
                value:
                  output:
                    "Employee Count":
                      prompt: "Find the number of employees at this company"
                      output_schema: { type: "integer" }
                  input:
                    "Company": ["Apple", "Google"]
              fill_dataset:
                summary: Fill a dataset's pending, stale, and failed cells
                value:
                  dataset_id: "ds_018f6a70-1234-7abc-89ab-0123456789ab"
              fill_dataset_scope:
                summary: Re-run one column on rows 10–12, even if filled
                value:
                  dataset_id: "ds_018f6a70-1234-7abc-89ab-0123456789ab"
                  columns: ["CEO"]
                  positions: [10, 11, 12]
                  force: true
      responses:
        "201":
          description: Run started — poll /runs/{id} or wait for the webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "200":
          description: estimate_cost only — the credit estimate; nothing was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateCostResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /runs/{id}:
    get:
      summary: run status
      description: |
        This returns the **status and progress** of a run for any run created from enrichments, datasets, or extractions. `status` reports the status of the run, and `progress` gives a completion estimate.

        `?wait=N` (max 50) long-polls: the request holds until the run finishes or the budget elapses.
      operationId: getRun
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const run = await riveter.runs.get("run_YOUR_RUN_ID");
            console.log(run.status, run.progress);
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            run = riveter.runs.get("run_YOUR_RUN_ID")
            print(run.status, run.progress)
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            run = riveter.runs.get("run_YOUR_RUN_ID")
            puts run.status
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            run, err := client.Runs.Get(context.Background(), "run_YOUR_RUN_ID")
            fmt.Println(run.Status)
      tags:
        - Runs
      parameters:
        - name: id
          in: path
          required: true
          description: The run id (run_...)
          schema:
            type: string
        - name: wait
          in: query
          required: false
          description: Seconds to long-poll (0–50, default 0)
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/result:
    get:
      summary: run result
      description: |
        The run plus `output`, `null` until the run finishes.

        Pass `?wait=N` (max 50) to long-poll: the request holds until the run finishes or the budget elapses, whichever comes first.

        ## Output shape by run type
        - **enrichment** — an object mapping column headers to arrays of cell objects: `{ "Company": [{"value": "Apple"}], "CEO": [{"value": "Tim Cook"}] }`
        - **dataset_build** — the same columnar shape as enrichment
        - **extraction** — the extracted records as an array of JSON objects (matching your `output_record_json_schema`)
        - **quick_search** — the search result object `{ "results": [{ "title", "link", "snippet" }, ...], "knowledge_graph"? }`, the same data the synchronous `POST /quick_search` response already carried. (Runs started on the legacy async `/web_search` endpoint share this run type but return the columnar enrichment shape with a `search_results` column.)
        - **search_agent** — the answer object `{ "result": <string or object> }`; `result` matches the request's `output_schema` when one was given, otherwise it's free text.
        - **enrichment** on a dataset (`POST /enrich` with `dataset_id`) — `{ "rows": [...] }`: only the rows the fill ran, in position order, each in the `/datasets/{id}/rows` shape (`id`, `position`, `input`, `cells` limited to the columns the fill covered, `credits`). `GET /datasets/{id}/rows` is the live view. Above 5,000 rows, or after the rows expire (30 days), `output` is `null` and `output_files` (signed CSV and JSONL links to the whole grid; `pending` until the export lands, valid one hour, see `expires_at`) are the output.
        - **enrichment** started on `POST /enrich_rows`, or on `POST /enrich` with `input` — the columnar shape while rows are ≤ 5,000, plus the same `output_files`. Above 5,000 rows, or after the rows expire (30 days), `output` is `null` and the files are the output.
      operationId: getRunResult
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            // One 30s long-poll:
            const result = await riveter.runs.result("run_YOUR_RUN_ID", { wait: 30 });
            // Or keep polling until the run finishes (default budget 10 min):
            const finished = await riveter.runs.waitForResult("run_YOUR_RUN_ID");
            console.log(finished.output);
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            # One 30s long-poll:
            result = riveter.runs.result("run_YOUR_RUN_ID", wait=30)
            # Or keep polling until the run finishes (default budget 10 min):
            finished = riveter.runs.wait_for_result("run_YOUR_RUN_ID")
            print(finished.output)
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            # One 30s long-poll:
            result = riveter.runs.result("run_YOUR_RUN_ID", wait: 30)
            # Or keep polling until the run finishes (default budget 10 min):
            finished = riveter.runs.wait_for_result("run_YOUR_RUN_ID")
            puts finished.output
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            ctx := context.Background()
            // One 30s long-poll:
            result, err := client.Runs.Result(ctx, "run_YOUR_RUN_ID", &riveter.ResultOptions{Wait: 30})
            // Or keep polling until the run finishes (default budget 10 min):
            finished, err := client.Runs.WaitForResult(ctx, "run_YOUR_RUN_ID", nil)
            fmt.Println(string(finished.Output))
      tags:
        - Runs
      parameters:
        - name: id
          in: path
          required: true
          description: The run id (run_...)
          schema:
            type: string
        - name: wait
          in: query
          required: false
          description: Long-poll budget in seconds (0–50, default 0)
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
      responses:
        "200":
          description: The run with output (null while still running)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Run"
                  - type: object
                    properties:
                      output:
                        description: The run's results (null until ready) — shape depends on run type, see the endpoint description
                        type: [object, array, "null"]
                      output_files:
                        $ref: "#/components/schemas/OutputFiles"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

