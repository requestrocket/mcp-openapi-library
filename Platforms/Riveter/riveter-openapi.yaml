        "200":
          description: The enrichment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrichment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: update enrichment
      description: |
        Edit an enrichment in place: `name`, `prompt`, `input_columns` (the headers its rows must carry; `[]` = any), `budget` and `budget_locked`, `only_tools` / `additional_tools`, and `output` columns by name. Inside `output`, a name not yet on the enrichment adds a column (typed from the prompts when it has no `output_schema` and its value is one plain value); `{ "prompt", "output_schema" }` change one; `{ "tool": "linkedin_person_profile" }` pins a tool to it — one call of it per row is the cell, the agent choosing the call's arguments (the [ColumnToolPin](#model/columntoolpin); `"tool": null` unpins); `{ "rename": "New name" }` renames one (cells keep their values); `{ "delete": true }` removes one. Every call is one write: `version` goes up by one and every added or changed column takes it, so cells filled under the old prompt, schema, or pin read `stale` on datasets bound to this enrichment and are re-run by their next fill. A rename changes nothing on the cells.

        The budget follows the columns: adding a column raises `budget_credits_per_row` by 1.5, removing one lowers it by 1.5 (within 0.1–100), unless `budget_locked` is true or the same call sets `budget`. Set `budget_locked: true` to keep the budget as set from then on.

        Refused with 409 `enrichment_in_use` while a fill runs on it (the fill reads the recipe as it goes): wait for the run or [stop it](#tag/runs/post/runs/{id}/stop). To edit the columns of one dataset without touching other datasets on the same enrichment, use [PATCH /datasets/{id}](#tag/datasets/patch/datasets/{id}), which copies a shared enrichment first.

        The id of a legacy enrichment keeps its older contract (the [legacy API docs](./openapi.legacy.yaml)) and answers with `legacy` naming its dataset copy.
      operationId: updateEnrichment
      x-mcp-destructive: true
      x-mcp-description: |
        Edit an enrichment: `name`, `prompt`, `input_columns`, `budget` (credits per row; moves by 1.5 per output column added or removed unless `budget_locked`), `only_tools` / `additional_tools`, and `output` columns by name: a new name adds a column (type inferred unless `output_schema` is given), `{ "prompt", "output_schema" }` changes one, `{ "tool": "<list_tools name>" }` pins a tool to it — one call per row is the cell, the agent choosing the arguments (`null` unpins; `help` with `pinned_columns`), `{ "rename" }` renames, `{ "delete": true }` removes. Changed columns make dataset cells `stale` (re-run by the next `enrich`). 409 `enrichment_in_use` while a fill runs. Prefer `update_dataset` to change one dataset's columns. `help` with `output_schema`.
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const enrichment = await riveter.enrichments.update("enr_YOUR_ENRICHMENT_ID", {
              output: {
                CEO: { prompt: "Full name of the current CEO" },
                "Employee count": { prompt: "Current headcount", output_schema: { type: "integer", minimum: 0 } },
              },
            });
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            enrichment = riveter.enrichments.update(
                "enr_YOUR_ENRICHMENT_ID",
                output={
                    "CEO": {"prompt": "Full name of the current CEO"},
                    "Employee count": {"prompt": "Current headcount", "output_schema": {"type": "integer", "minimum": 0}},
                },
            )
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            enrichment = riveter.enrichments.update(
              "enr_YOUR_ENRICHMENT_ID",
              output: {
                "CEO" => { prompt: "Full name of the current CEO" },
                "Employee count" => { prompt: "Current headcount", output_schema: { type: "integer", minimum: 0 } }
              }
            )
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            enrichment, err := client.Enrichments.Update(context.Background(), "enr_YOUR_ENRICHMENT_ID",
                riveter.UpdateEnrichmentParams{
                    Output: map[string]riveter.OutputColumnOperation{
                        "CEO":            {Prompt: "Full name of the current CEO"},
                        "Employee count": {Prompt: "Current headcount", OutputSchema: map[string]any{"type": "integer", "minimum": 0}},
                    },
                })
      tags:
        - Enrich
      parameters:
        - name: id
          in: path
          required: true
          description: The enrichment id (enr_...)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: Display name. An empty string clears it.
                prompt:
                  type: string
                  maxLength: 50000
                  description: The task prompt the row agent reads for every row.
                input_columns:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                  description: The headers rows must carry when this enrichment runs (replaces the list; [] = any headers). Names only; no row data.
                budget:
                  type: number
                  minimum: 0.1
                  maximum: 100
                  description: Credits the row agent may spend per row. Sent with column changes, it wins over the per-column adjustment.
                budget_locked:
                  type: boolean
                  description: true keeps the budget as set when output columns are added or removed; false lets it move by 1.5 per column again.
                only_tools:
                  type: array
                  items:
                    type: string
                  description: Exactly these tools (names from GET /tools). Replaces the default set.
                additional_tools:
                  type: array
                  items:
                    type: string
                  description: The default tools plus these (e.g. linkedin_person_contact; custom_apollo_people_search once enabled on the account and your Apollo key is linked). See GET /v1/tools.
                output:
                  $ref: "#/components/schemas/OutputColumnOperations"
            examples:
              change_and_add_columns:
                summary: Change one column's prompt, add a typed one
                value:
                  output:
                    "CEO":
                      prompt: "Full name of the current CEO"
                    "Employee count":
                      prompt: "Current headcount as an integer"
                      output_schema: { type: integer, minimum: 0 }
              rename_and_delete:
                summary: Rename a column, delete another
                value:
                  output:
                    "HQ":
                      rename: "HQ city"
                    "Old Column":
                      delete: true
              retune:
                summary: New prompt and budget
                value:
                  prompt: "Research each company's go-to-market motion"
                  budget: 8
      responses:
        "200":
          description: The enrichment after the edit (its `version` went up)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrichment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      summary: delete enrichment
      description: |
        Delete an enrichment. Runs in flight finish, and a dataset bound to it keeps its columns. A legacy enrichment's id answers `422 unsupported` with `legacy`; those are deleted in the app.
      operationId: deleteEnrichment
      x-mcp-destructive: true
      x-mcp-description: |
        Delete an enrichment by id. Runs in flight finish; a dataset bound to it keeps its columns. A legacy enrichment's id is refused (422 with `legacy`); those are deleted in the app.
      tags:
        - Enrich
      parameters:
        - name: id
          in: path
          required: true
          description: The enrichment id (enr_...)
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /enrichments:
    post:
      summary: create enrichment
      description: |
        Create an enrichment without running it: the task `prompt` the row agent reads for every row, the `output` columns it fills, and optionally `input_columns` (the headers rows must carry; empty = any), a `budget` in credits per row (default 1.5 per output column; it then moves by 1.5 as columns are added or removed until `budget_locked` is true), and the tools (`only_tools` replaces the default set, `additional_tools` adds to it; names from [GET /tools](#tag/datasets/get/tools)). Each `output` entry is a column name or `{ "name", "prompt"?, "output_schema"?, "tool"? }`; `output_schema` is a JSON Schema for the cell value (see `help` → `output_schema`); without one, the column is typed from the prompts as the one value it is about (email, URL, date, year, count, money, percentage, phone, address, a person's or company's name, ...; only prose stays free text); `tool` pins a tool to the column — `"tool": "linkedin_person_profile"`, the [ColumnToolPin](#model/columntoolpin): the agent makes one call of it per row, with arguments it works out from the row and its research, and the call's result is the cell. Output names may not repeat an input column.

        **From a prompt alone.** Leave `output` out and the recipe is written from the `prompt`: one output column per fact it asks to find about each row, each with its own prompt and type, plus the `name` and `input_columns` when you give none ("Research each company: its CEO, employee count, latest funding round date and amount, and whether it is hiring" → `CEO`, `Employee count`, `Latest funding round date`, `Latest funding round amount`, `Hiring`, typed). The response shows what was written; adjust it with [PATCH /enrichments/{id}](#tag/enrich/patch/enrichments/{id}). A prompt that names no facts to find is refused (`422`): add `output`.

        The enrichment comes with the **dataset it fills**: an empty dataset bound to it, named after it, whose input columns are `input_columns` (one `Input` column when you give none; the first build names it, or rename it with [PATCH /datasets/{id}](#tag/datasets/patch/datasets/{id})). It is on the Datasets page of the app at once. The response is the [enrichment](#model/enrichment) plus `dataset_id` (its id) and `app_url` (the dataset in the app).

        Then add rows to the dataset — [POST /datasets/{id}/rows](#tag/datasets/post/datasets/{id}/rows), [rows/import](#tag/datasets/post/datasets/{id}/rows/import) for a CSV, or [rows/build](#tag/datasets/post/datasets/{id}/rows/build) to generate them — and fill it with [POST /enrich](#tag/enrich/post/enrich) (`dataset_id`): the rows and cells are kept and the dataset shows them. Or run the enrichment once on rows you send inline (`enrichment_id` + `input`), nothing kept. Editing the enrichment through its dataset (the app's Column tab, [PATCH /datasets/{id}](#tag/datasets/patch/datasets/{id})) rebinds the dataset to a private copy; [PATCH /enrichments/{id}](#tag/enrich/patch/enrichments/{id}) edits this enrichment itself.

        `{ "dataset_id": "ds_..." }` alone answers the dataset's own enrichment as `{ id, name, app_url, dataset_id }` (nothing is created; `422` while the dataset has no output columns — [PATCH /datasets/{id}](#tag/datasets/patch/datasets/{id}) adds them). The same body with a legacy list build's id, documented in the [legacy API docs](./openapi.legacy.yaml), creates a legacy enrichment and answers with `legacy`.
      operationId: createEnrichment
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const created = await riveter.enrichments.create({
              name: "Company basics",
              prompt: "Research each company from its name and website.",
              input_columns: ["Company", "Website"],
              output: ["CEO", { name: "Employee count", output_schema: { type: "integer", minimum: 0 } }],
            });
            console.log(created.id, created.dataset_id); // enr_..., ds_...
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            created = riveter.enrichments.create(
                name="Company basics",
                prompt="Research each company from its name and website.",
                input_columns=["Company", "Website"],
                output=["CEO", {"name": "Employee count", "output_schema": {"type": "integer", "minimum": 0}}],
            )
            print(created.id, created.dataset_id)  # enr_..., ds_...
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            created = riveter.enrichments.create(
              name: "Company basics",
              prompt: "Research each company from its name and website.",
              input_columns: ["Company", "Website"],
              output: ["CEO", { name: "Employee count", output_schema: { type: "integer", minimum: 0 } }]
            )
            puts created.id, created.dataset_id # enr_..., ds_...
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            created, err := client.Enrichments.Create(context.Background(), riveter.CreateEnrichmentParams{
                Name:         "Company basics",
                Prompt:       "Research each company from its name and website.",
                InputColumns: []string{"Company", "Website"},
                Output:       []riveter.OutputColumnSpec{{Name: "CEO"}, {Name: "Employee count", OutputSchema: map[string]any{"type": "integer", "minimum": 0}}},
            })
            fmt.Println(created.ID, created.DatasetID) // enr_..., ds_...
      x-mcp-description: |
        Create an enrichment (no run, free) and the empty dataset it fills, bound to it and in the app at `app_url`. A recipe: `prompt` (the task), `output` columns (names, or `{ name, prompt, output_schema, tool }` — `tool: "<list_tools name>"` pins a tool: one call per row, arguments chosen by the agent, result is the cell; `help` with `output_schema` / `pinned_columns`), optional `input_columns`, `budget` (credits per row, default 1.5 per output column; follows column adds / removes unless `budget_locked`), `only_tools` / `additional_tools` (`list_tools`). Prefer `prompt` alone: the output columns (one typed column per fact asked for), name, and input columns are written from it; the response shows them. Then `add_dataset_rows` to the `dataset_id` and `enrich` with it (preferred), or `enrich` with `enrichment_id` + `input` for a one-off. `dataset_id` alone answers a dataset's own enrichment as `{ id, name, app_url, dataset_id }` (422 without output columns; add them with `update_dataset`).
      tags:
        - Enrich
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dataset_id:
                  type: string
                  description: "Alone: a dataset's id (ds_...); answers its own enrichment. Not with the fields below."
                name:
                  type: string
                  maxLength: 200
                  description: "Recipe: display name"
                prompt:
                  type: string
                  maxLength: 50000
                  description: "Recipe: the task prompt the row agent reads for every row. Required without dataset_id."
                input_columns:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                  description: "Recipe: the headers rows must carry, the dataset's input columns. Omit for any (one `Input` column), or, without output, for the ones the prompt implies."
                output:
                  type: array
                  items:
                    $ref: "#/components/schemas/OutputColumnSpec"
                  maxItems: 50
                  description: "Recipe: the columns to fill; a plain string is a name whose type is inferred. Omit it and the columns are written from the prompt, one per fact it asks for, each typed."
                budget:
                  type: number
                  minimum: 0.1
                  maximum: 100
                  description: "Recipe: credits the row agent may spend per row. Default 1.5 per output column."
                budget_locked:
                  type: boolean
                  default: false
                  description: "Recipe: true keeps the budget as set when output columns are later added or removed; false lets it move by 1.5 per column."
                only_tools:
                  type: array
                  items:
                    type: string
                  description: "Recipe: exactly these tools (GET /tools). Replaces the default set."
                additional_tools:
                  type: array
                  items:
                    type: string
                  description: "Recipe: the default tools plus these (GET /tools; some need enabling on the account or a linked key)."
            examples:
              company_research:
                summary: Save a recipe — three columns, one typed
                value:
                  name: "Company basics"
                  prompt: "Research each company from its name and website."
                  input_columns: ["Company", "Website"]
                  output:
                    - "CEO"
                    - name: "Employee count"
                      prompt: "Current headcount as an integer"
                      output_schema: { type: integer, minimum: 0 }
                    - name: "Summary"
                      prompt: "Two sentences on what the company sells and to whom"
                  budget: 4
              from_prompt_alone:
                summary: The recipe written from the prompt — columns, name, and input columns
                value:
                  prompt: "Research each company from its name and website: the CEO, employee count, latest funding round date and amount, and whether it is hiring."
              datasets_own_enrichment:
                summary: A dataset's own enrichment
                value:
                  dataset_id: "ds_018f6a70-1234-7abc-89ab-0123456789ab"
      responses:
        "201":
          description: Save a recipe — the saved enrichment plus `dataset_id` and `app_url`, the dataset it fills. With `dataset_id` alone — the dataset's own enrichment as `{ id, name, app_url, dataset_id }`
          content:
            application/json:
              schema:
                oneOf:
                  - title: Save a recipe
                    allOf:
                      - $ref: "#/components/schemas/Enrichment"
                      - type: object
                        properties:
                          dataset_id:
                            type: string
                            description: The dataset created for the enrichment (ds_...); add rows to it and fill it
                          app_url:
                            type: string
                            format: uri
                            description: The dataset in the app
                  - title: A dataset's own enrichment
                    type: object
                    properties:
                      id:
                        type: string
                        description: The dataset's enrichment (enr_...)
                      name:
                        type: string
                      app_url:
                        type: string
                        format: uri
                        description: The dataset in the app
                      dataset_id:
                        type: string
                      legacy:
                        $ref: "#/components/schemas/LegacyNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    get:
      summary: list enrichments
      description: |
        List the account's enrichments, most recently updated first: the recipes saved with [POST /enrichments](#tag/enrich/post/enrichments) (`prompt` + `output`) and bound to datasets, and the account's legacy enrichments (built in the app's Enrichments page, before Datasets). Each item is compact — id, name, timestamps, and column names/count — so the list stays small even for accounts with thousands of enrichments. Column configuration is on [GET /enrichments/{id}](#tag/enrich/get/enrichments/{id}).

        A legacy enrichment's item carries `status`, `app_url`, and — once the account's copy into Datasets has run — `dataset_id`, its dataset copy: fill that with [POST /enrich](#tag/enrich/post/enrich) instead of the legacy id. A saved recipe has none of the three. Filter by `status` (comma-separated; leaves the recipes out) and `name` (case-insensitive substring). Paginate with `page` / `per_page` (max 50). Column names are capped at 40 per input/output list; when cut, `column_names_truncated` is `true` and `column_count` still reports the total.
      operationId: listEnrichments
      x-mcp-description: |
        The account's enrichments, newest first: id, name, input / output column names. A legacy enrichment's item also has `status`, `app_url`, and `dataset_id` (its dataset copy: `enrich` that instead). Paginate with `page` / `per_page` (max 50); filter by `status` (legacy only), `name`. `get_enrichment` has the columns' config.
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const page = await riveter.enrichments.list({ name: "contact" });
            for await (const enrichment of page) {
              console.log(enrichment.id, enrichment.name, enrichment.input_columns);
            }
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            page = riveter.enrichments.list(name="contact")
            for enrichment in page.auto_paging_iter():
                print(enrichment.id, enrichment.name, enrichment.input_columns)
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            riveter.enrichments.list(name: "contact").auto_paging_each do |enrichment|
              puts "#{enrichment.id} #{enrichment.name} #{enrichment.input_columns}"
            end
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            page, err := client.Enrichments.List(context.Background(), &riveter.ListEnrichmentsParams{Name: "contact"})
            for _, enrichment := range page.Enrichments {
                fmt.Println(enrichment.ID, enrichment.Name, enrichment.InputColumns)
            }
      tags:
        - Enrich
      parameters:
        - name: status
          in: query
          required: false
          description: "Comma-separated: pending, enqueued, processing, success, stopped"
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Case-insensitive substring match on the enrichment name
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 25
            maximum: 50
      responses:
        "200":
          description: Enrichments listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrichments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Enrichment id (enr_...)
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                            [pending, enqueued, processing, success, stopped]
                          description: Legacy enrichments only
                        app_url:
                          type: string
                          format: uri
                          description: Legacy enrichments only
                        dataset_id:
                          type: string
                          description: Legacy enrichments only — the dataset copy (ds_...) to fill instead, once the account's copy into Datasets has run
                        column_count:
                          type: integer
                          description: Total number of columns (input + output)
                        input_columns:
                          type: array
                          description: Source-data column headers — the keys `input` must use when running this enrichment (first 40)
                          items:
                            type: string
                        output_columns:
                          type: array
                          description: Output column headers (first 40)
                          items:
                            type: string
                        column_names_truncated:
                          type: boolean
                          description: Present and true only when a column-name list was cut at 40 entries
                        created_at:
                          type: string
