  /monitors:
    post:
      summary: create monitor
      description: |
        Create a **monitor**: a schedule that fills a dataset's output columns again daily, weekly, or monthly, compares each cell with the previous run, and can POST the results (or only changes) to a webhook. Pass `dataset_id` (or `enrichment_id` naming the dataset's enrichment) and, optionally, `columns` — the output column names each run fills (every one when omitted). The rows are the dataset's: a monitor takes no `input`; add rows with [POST /datasets/{id}/rows](#tag/datasets/post/datasets/{id}/rows).

        Creating the monitor charges nothing. Every scheduled run is a fill of the dataset and charges the fill price (rows × the enrichment's per-row budget at most). `estimate_cost: true` returns the credit estimate for **one** scheduled run; `max_credits` refuses the monitor when that estimate is higher. Each run is listed by [GET /monitors/{id}/runs](#tag/monitors/get/monitors/{id}/runs) and read by [GET /runs/{id}/result](#tag/runs/get/runs/{id}/result); with `output_format: include_diffs` every cell carries `previous_value` and `changed`.

        `enrichment_id` naming a legacy enrichment creates a monitor on it over fixed `input` rows, as [the legacy API docs](?spec=legacy#tag/monitors/post/monitor_enrichment) describe; the response carries `legacy`, and so does every read of that monitor (`legacy: true` on its item in [GET /monitors](#tag/monitors/get/monitors)). The successor is a monitor on the enrichment's dataset copy (`dataset_id` on its item in [GET /enrichments](#tag/enrich/get/enrichments)).
      x-mcp-description: |
        Create a **monitor**: a schedule that fills a dataset's output columns again daily, weekly, or monthly, compares each cell with the previous run, and can POST results (or only changes) to a webhook. Pass `dataset_id` and optionally `columns` (output column names; every one when omitted); the rows are the dataset's, no `input`. Creation is free; every run charges the fill price. `estimate_cost: true` prices one run. `help` → `monitors`.
      operationId: createMonitor
      x-mcp-open-world: true
      x-codeSamples:
        - lang: typescript
          label: TypeScript
          source: |
            import { Riveter } from "riveter-sdk";

            const riveter = new Riveter(); // uses env RIVETER_API_KEY
            const monitor = await riveter.monitors.create({
              dataset_id: "ds_YOUR_DATASET_ID",
              cadence: "daily",
              minute: 0,
              hour: 9,
              timezone: "America/New_York",
              webhook_url: "https://your-server.com/webhook",
            });
            console.log(monitor.id, monitor.next_run_at);
        - lang: python
          label: Python
          source: |
            from riveter import Riveter

            riveter = Riveter()  # uses env RIVETER_API_KEY
            monitor = riveter.monitors.create(
                dataset_id="ds_YOUR_DATASET_ID",
                cadence="daily",
                minute=0,
                hour=9,
                timezone="America/New_York",
                webhook_url="https://your-server.com/webhook",
            )
            print(monitor.id, monitor.next_run_at)
        - lang: ruby
          label: Ruby
          source: |
            require "riveter"

            riveter = Riveter::Client.new # uses env RIVETER_API_KEY
            monitor = riveter.monitors.create(
              dataset_id: "ds_YOUR_DATASET_ID",
              cadence: "daily",
              minute: 0,
              hour: 9,
              timezone: "America/New_York",
              webhook_url: "https://your-server.com/webhook"
            )
            puts "#{monitor.id} #{monitor.next_run_at}"
        - lang: go
          label: Go
          source: |
            import riveter "github.com/riveterhq/riveter-go"

            client, err := riveter.NewClient() // uses env RIVETER_API_KEY
            monitor, err := client.Monitors.Create(context.Background(),
                riveter.CreateMonitorParams{
                    DatasetID:  "ds_YOUR_DATASET_ID",
                    Cadence:    "daily",
                    Minute:     0,
                    Hour:       9,
                    Timezone:   "America/New_York",
                    WebhookURL: "https://your-server.com/webhook",
                })
            fmt.Println(monitor.ID, monitor.NextRunAt)
      tags:
        - Monitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dataset_id:
                  type: string
                  description: The dataset to fill again on the schedule (ds_...). One of dataset_id / enrichment_id is required.
                columns:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Output column names each run fills. Omit for every output column, including ones added later.
                enrichment_id:
                  type: string
                  description: Instead of dataset_id — the enrichment bound to the dataset (enr_...). A legacy enrichment's id creates a monitor on it over fixed `input` rows (legacy API docs); the response carries `legacy`.
                cadence:
                  type: string
                  enum: [daily, weekly, monthly]
                  description: How often the monitor runs
                minute:
                  type: integer
                  minimum: 0
                  maximum: 59
                  description: Minute of the hour to run
                hour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  description: Hour of the day to run
                day_of_week:
                  type: integer
                  minimum: 0
                  maximum: 6
                  description: Day of the week (0=Sunday, required for weekly)
                day_of_month:
                  type: integer
                  minimum: 1
                  maximum: 28
                  description: Day of the month (required for monthly)
                timezone:
                  type: string
                  description: "Timezone (e.g. 'UTC', 'America/New_York')"
                webhook_url:
                  type: string
                  format: uri
                  description: URL to receive results each scheduled run
                alert_rule:
                  type: string
                  enum: [each_run, on_diff, disabled]
                  description: When the webhook fires — every run, only when a monitored cell changed since the previous run, or never (default each_run)
                output_format:
                  type: string
                  enum: [current_only, include_diffs]
                  description: include_diffs adds `previous_value` and `changed` to every cell of the run's output and webhook payload (default current_only)
                run_immediately:
                  type: boolean
                  description: Also run the monitor immediately after creation (a paid run)
                input:
                  $ref: "#/components/schemas/EnrichmentInputData"
                  description: Monitors on a legacy enrichment only — fixed rows every scheduled run enriches (same shape as enrich input). Refused on a dataset monitor; its rows are the dataset's.
                estimate_cost:
                  $ref: "#/components/schemas/EstimateCostParam"
                max_credits:
                  $ref: "#/components/schemas/MaxCreditsParam"
              required:
                - cadence
                - minute
                - hour
                - timezone
            examples:
              daily_dataset_monitor:
                summary: Daily monitor on a dataset, webhook only on changes
                value:
                  dataset_id: "ds_018f5b60-1234-7abc-89ab-0123456789ab"
                  columns: ["Headcount", "Latest funding round"]
                  cadence: daily
                  hour: 9
                  minute: 0
                  timezone: "UTC"
                  alert_rule: on_diff
                  output_format: include_diffs
                  webhook_url: "https://your-server.com/webhook"
              weekly_every_column:
                summary: Weekly monitor, every output column, results every run
                value:
                  dataset_id: "ds_018f5b60-1234-7abc-89ab-0123456789ab"
                  cadence: weekly
                  day_of_week: 1
                  hour: 7
                  minute: 30
                  timezone: "America/New_York"
                  webhook_url: "https://your-server.com/webhook"
      responses:
        "201":
          description: Monitor created (with `legacy` when it runs a legacy enrichment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"
        "200":
          description: estimate_cost only — the credit estimate for ONE scheduled run (the dataset's rows × the per-row budget; type monitor); nothing was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateCostResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
