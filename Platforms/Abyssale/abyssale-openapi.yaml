        message:
          type: string
          example: "font_size must be between 2 and 1000"
        expected:
          oneOf:
            - type: array
              items:
                type: string
              description: Allowed values, for an enum problem.
            - type: object
              description: "Bounds, for a range problem — `{ min, max }`."
              properties:
                min: {type: number}
                max: {type: number}
            - type: string
          description: |
            Type-dependent. For enums an array of allowed values; for ranges `{ min, max }`; for
            `missing_assets` the list of unfulfilled upload targets. Present on `out_of_range` and
            `unknown_enum_value` for schema-derived problems as well as hand-written ones.
