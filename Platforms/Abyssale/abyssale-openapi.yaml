          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /banner-builder/{designId}/generate:
    post:
      tags:
      - Asset Generation
      operationId: generateImage
      x-codeSamples:
        - lang: cURL
          source: |
            # Every field is optional — an empty body renders the design's saved content.
            curl -X POST \
              -H "x-api-key: $ABYSSALE_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                    "template_format_name": "facebook-post",
                    "elements": {
                      "title": { "payload": "Summer sale — 40% off" },
                      "cta": { "payload": "Shop now" }
                    }
                  }' \
              "https://api.abyssale.com/banner-builder/$DESIGN_ID/generate"
        - lang: Python
          source: |
            import os, requests

            r = requests.post(
                f"https://api.abyssale.com/banner-builder/{os.environ['DESIGN_ID']}/generate",
                headers={
                    "x-api-key": os.environ["ABYSSALE_API_KEY"],
                    "Content-Type": "application/json",
                },
                json={
                    "template_format_name": "facebook-post",
                    "elements": {"title": {"payload": "Summer sale — 40% off"}},
                },
                timeout=30,
            )
            r.raise_for_status()
            print(r.json()["file"]["cdn_url"])
      summary: Generate an image (synchronous)
      description: |
        Synchronously generate a single image from a design. Send your dynamic data
        (text, images, colors) as element overrides in the request body and receive
        the generated file URL immediately in the response.

        **`static` designs only.** An `animated`, `printer` or `printer_multipage` design answers
        `400` with `id: template_not_static` — use
        [asynchronous generation](/api-reference/generateMultiFormatMedia)
        instead. This is a property of the endpoint, not of your plan: a video or a print PDF
        cannot be produced inside a synchronous request, so there is no combination of parameters
        that makes this work.

        Best for: real-time image generation, single-asset workflows, or when you need
        the result inline without polling. The rendering budget is hard-capped at **10
        seconds**: the call returns the finished file within that window or fails with
        `500 internal_server_error` (typical renders take tens of milliseconds).

        For bulk generation across multiple formats, use the asynchronous endpoint instead.

        **AI features and the 10-second cap.** `text_to_image` is **not accepted here** — an AI
        generation takes far longer than the budget, so the field exists only on the asynchronous
        endpoint and sending it answers `400 invalid_payload`. Background removal (`remove_bg`)
        *is* accepted but is **deprecated on this endpoint**: it adds an AI round-trip before the
        render, so a large or slow source image can push the call past the cap and fail with
        `500 internal_server_error` rather than returning your asset. Existing integrations keep
        working; new ones should remove backgrounds asynchronously. `auto_focus` is unaffected
        and fully supported here — it runs on Abyssale's own detection model and is fast enough
        that it does not put the budget at risk.

        **All body fields are optional** — omit `elements` to render the design's saved
        default content. A `template_format_name` that does not exist on the design answers
        `404` with `id: format_not_found` (the format is addressed as a resource, so this is
        a 404 by contract, not a 400).
      parameters:
        - $ref: '#/components/parameters/DesignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                elements:
                  allOf:
                    - $ref: "#/components/schemas/Elements"
                  description: >-
                    Element overrides keyed by layer name. On this synchronous endpoint every
                    value MUST be an object — a bare string value answers `400 invalid_payload`
                    (the asynchronous endpoint is lenient).
                template_format_name:
                  type: string
                  example: "facebook-post"
                  description: Format ID to generate. Optional — when omitted, the design's first format is generated.
                image_file_type:
                  type: string
                  enum: [png, jpeg, webp, avif, pdf, auto]
                  description: >-
                    Output file type (`auto` ≡ omitted). When omitted: `jpeg`, or `png` when the
                    format's background color is transparent.
                original_visual_id:
                  type: string
                  format: uuid
                  description: >-
                    Regenerate an existing visual in place, keeping its share URL (visual
                    versioning). Unknown or unrelated visuals answer 404 (`visual_not_found`,
                    `not_related_to_same_template`, `not_related_to_same_format`).
                file_compression_level:
                  type: integer
                  example: 80
                  description: Output quality, 1-100 — 100 is the best quality (least compression), 1 the smallest file. Despite the name, higher = better.
                  minimum: 1
                  maximum: 100
            example:
              template_format_name: facebook-post
              image_file_type: png
              elements:
                root:
                  background_color: "#F3F3F3"
                title:
                  payload: "Summer sale — 40% off"
                  color: "#111111"
                product-image:
                  image_url: https://example.com/product.jpg
                cta:
                  payload: "Shop now"
                  background_color: "#5B4CF5"
      responses:
        '200':
          description: The generated banner, including its file URLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
              example:
                id: 64238d01-d402-474b-8c2d-fbc957e9d290
                version: 1
                sharing_id: 5fcec999-2bfb-4dd7-ba38-2d9e16c49149
                file:
                  type: png
                  url: https://production-banners.s3.eu-west-1.amazonaws.com/demo/996739f4-b563-428a-a6e8-ec3cb8bd03d4.png
                  cdn_url: https://cdn.abyssale.com/demo/996739f4-b563-428a-a6e8-ec3cb8bd03d4.png
                  filename: 996739f4-b563-428a-a6e8-ec3cb8bd03d4.png
                format:
                  id: facebook-post
                  unit: px
                  width: 1200
                  height: 1200
        '400':
          description: |
            The request body or parameters are invalid, **or** the design is not `static`
            (`template_not_static` — this endpoint renders single images only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                template_not_static:
                  summary: The design is animated, printer or printer_multipage
                  value:
                    id: template_not_static
                    message: "The current template is of type 'animated', expected 'static'. Use the /async endpoint instead."
                validation_error:
                  summary: Field-level validation failure
                  value:
                    id: invalid_payload
                    message: "Invalid parameters: elements.root.background_color: Must be either a hexadecimal color of 3, 4, 6 or 8 digits (i.e. #EAEAEA), a cmyk color (i.e. cmyk(0,10,0,50)) or a linear or radial gradient color of 2 to 8 stops (#RRGGBB, #RGB or cmyk(C,M,Y,K) stops, opacity 0 to 1, offsets and cmyk components between 0 and 100, a radial radius above 0) (i.e. linear-gradient(0% 100% 0% 0%,0% #092423 1,100% #FFFFFF 0.6) or radial-gradient(50% 50% 71%,0% #092423 1,100% #FFFFFF 0.6)) (given: #zzz)"
                    errors:
                      - path: "elements.root.background_color"
                        code: invalid_payload
                        message: "Must be either a hexadecimal color of 3, 4, 6 or 8 digits (i.e. #EAEAEA), a cmyk color (i.e. cmyk(0,10,0,50)) or a linear or radial gradient color of 2 to 8 stops (#RRGGBB, #RGB or cmyk(C,M,Y,K) stops, opacity 0 to 1, offsets and cmyk components between 0 and 100, a radial radius above 0) (i.e. linear-gradient(0% 100% 0% 0%,0% #092423 1,100% #FFFFFF 0.6) or radial-gradient(50% 50% 71%,0% #092423 1,100% #FFFFFF 0.6)) (given: #zzz)"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/GenerationRateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /async/banner-builder/{designId}/generate:
    post:
      tags:
      - Asset Generation
      summary: Generate multiple formats (asynchronous)
      operationId: generateMultiFormatMedia
      x-codeSamples:
        - lang: cURL
          source: |
            # Omit template_format_names to generate every format of the design.
            curl -X POST \
              -H "x-api-key: $ABYSSALE_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                    "template_format_names": ["facebook-feed", "instagram-post"],
                    "callback_url": "https://example.com/webhooks/abyssale",
                    "elements": {
                      "title": { "payload": "Summer sale — 40% off" }
                    }
                  }' \
              "https://api.abyssale.com/async/banner-builder/$DESIGN_ID/generate"
            # {"generation_request_id":"3f2a9c18-…"} — then poll it, or wait for the webhook.
        - lang: Python
          source: |
            import os, time, requests

            headers = {"x-api-key": os.environ["ABYSSALE_API_KEY"]}
            design_id = os.environ["DESIGN_ID"]

            r = requests.post(
                f"https://api.abyssale.com/async/banner-builder/{design_id}/generate",
                headers=headers,
                json={"template_format_names": ["facebook-feed", "instagram-post"]},
                timeout=30,
            )
            r.raise_for_status()
            request_id = r.json()["generation_request_id"]

            # Polling is in the generous polling tier; a webhook avoids the loop entirely.
            while True:
                poll = requests.get(
                    f"https://api.abyssale.com/generation-request/{request_id}",
                    headers=headers,
                    timeout=30,
                )
                body = poll.json()
                if body["is_finalized"]:
                    break
                time.sleep(2)

            for banner in body["banners"]:
                print(banner["file"]["cdn_url"])
            for failure in body.get("errors", []):
                print("failed:", failure["template_format_name"], failure["reason"])
      description: |
        Asynchronously generate multiple formats of an image, video, GIF, HTML5 banner,
        or PDF in a single API call. Ideal for bulk banner production, multi-channel
        marketing campaigns, and programmatic ad creative generation at scale.

        Specify one or more format IDs to generate, or omit the list to generate all
        formats defined in the design. Batches are queued and worker-driven, with no hard
        completion bound — most complete within a couple of minutes; rely on the webhook or
        polling, never a fixed wait. Provide a `callback_url` to receive a webhook
        notification when generation is complete, or poll
        `GET /generation-request/{generationRequestId}` for status.

        You can find available formats and elements by calling `GET /designs/{designId}`.

        **This is where AI image work belongs.** Having no completion bound, this endpoint is the
        only one that accepts `text_to_image` (AI generation and inpainting), and it is the
        recommended home for `remove_bg` too — both add an AI round-trip that the synchronous
        endpoint's 10-second cap cannot absorb.

        **All body fields are optional** — omit `elements` to render the design's saved
        default content, and omit `template_format_names` to generate every format. A
        `template_format_names` entry that does not exist on the design answers `404` with
        `id: format_not_found` (the format is addressed as a resource, so this is a 404 by
        contract, not a 400).
      parameters:
        - $ref: '#/components/parameters/DesignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                elements:
                  $ref: "#/components/schemas/AsyncElements"
                template_format_names:
                  type: array
                  items:
                    type: string
                  example: ["facebook-feed", "instagram-post", "iab-medium"]
                  description: |
                    **Format IDs you would like to generate**.

                    _The array can be empty or not provided if you want to generate all formats of this design._
                callback_url:
                  type: string
                  format: uri
                  description:  |
                    **The url that will be called once generation of your images is done.**

                    We will do a `POST` request of the [NewBannerBatch](#operation/newBannerBatch) event on this URL with a JSON payload.
                image_file_type:
                  type: string
                  enum: [png, jpeg, webp, avif, gif, pdf, html5, mp4, auto]
                  description: >-
                    Output file type (`auto` ≡ omitted); must match the design type, else
                    `400 invalid_filetype` — static → jpeg/png/webp/avif/pdf, animated →
                    mp4/gif/html5, print → pdf. When omitted: static → jpeg (png when the
                    format background is transparent); animated → mp4; print → pdf.
                file_compression_level:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Output quality, 1-100 — 100 is the best quality (least compression), 1 the smallest file. Despite the name, higher = better.
                html5:
                  type: object
                  description: HTML5 output options (animated designs only)
                  properties:
                    page_title:
                      type: string
                      maxLength: 255
                      default: "Abyssale page title example"
                    click_tag:
                      type: string
                      maxLength: 255
                      default: "https://www.abyssale.com"
                    ad_network:
                      type: string
                      maxLength: 255
                      default: "default"
                      description: >-
                        Ad network to optimize the HTML5 output for (e.g. `google-ads`,
                        `google-marketing`, `adform`, `amazon-ads`, `adroll`). Free string —
                        unknown values are validated downstream.
                    include_backup_image:
                      type: boolean
                      nullable: true
                    repeat:
                      type: integer
                      minimum: -1
                      maximum: 100
                      nullable: true
                      description: Number of loop repetitions. -1 = infinite.
                gif:
                  type: object
                  description: GIF output options (animated designs only)
                  properties:
                    max_fps:
                      type: integer
                      minimum: 2
                      maximum: 9
                    repeat:
                      type: integer
                      minimum: -1
                      maximum: 100
                      description: Number of loop repetitions. -1 = infinite.
                video:
                  type: object
                  description: Video output options (animated designs only)
                  properties:
                    fps:
                      type: integer
                      minimum: 2
                      maximum: 30
                print:
                  type: object
                  description: Print output options (printer/printer_multipage designs only)
                  properties:
                    color_profile:
                      type: string
                      format: uuid
                      description: |
                        UUID of the color profile to apply. The built-ins, which are the same for
                        every workspace:

                        | UUID | Profile |
                        |---|---|
                        | `be2ab219-8fe4-4d85-91ba-65bdc9ddaf01` | CMYK — ISO Coated v2 (ECI) |
                        | `03738f37-5b6f-4be9-9100-706b1711f9dd` | CMYK — ISO Coated v2 (ECI) 300% |
                        | `e0c86a8a-050c-41f1-885a-0f74b9baac50` | CMYK — ISO Uncoated |
                        | `0e0355e6-2931-4c83-92f2-64db9f5ddffc` | CMYK — US Web Coated (SWOP 2006 5v2) |
                        | `fac91df8-1155-11ef-b77e-f93002785645` | CMYK — ISO Newspaper26 v4 |
                        | `db3c123e-1127-11ef-b77e-f93002785645` | RGB — No color profile |

                        A workspace may also hold custom profiles, whose UUIDs are not listed
                        here. Omitted, the design's own profile is used. Not an enum: the list can
                        grow, and a generated client should not reject a UUID it has not seen.
                    display_crop_marks:
                      type: boolean
                pages:
                  allOf:
                    - $ref: "#/components/schemas/Pages"
                  description: >-
                    **`printer_multipage` designs only**, where it replaces `elements`: a
                    multipage design is one document with no formats, so content is addressed per
                    page. Ignored on every other design type. The dedicated
                    [multipage PDF operation](/api-reference/generateMultiPagePdf)
                    takes the same field and is the clearer choice for print output; this one
                    exists so a `printer_multipage` design can also be driven through the generic
                    async endpoint.
                original_visual_id:
                  type: string
                  format: uuid
                  description: >-
                    Regenerate an existing visual in place, keeping its share URL (visual
                    versioning). The request must target exactly ONE format — combining this
                    with more than one `template_format_names` entry answers
                    `400 more_than_one_format`. Unknown or unrelated visuals answer 404
                    (`visual_not_found`, `not_related_to_same_template`,
                    `not_related_to_same_format`).
            example:
              template_format_names: ["facebook-feed", "instagram-post"]
              image_file_type: png
              callback_url: https://example.com/webhooks/abyssale
              elements:
                root:
                  background_color: "#F3F3F3"
                title:
                  payload: "Summer sale — 40% off"
                  color: "#111111"
                product-image:
                  image_url: https://example.com/product.jpg
      responses:
        '200':
          description: Generation queued; poll `generation_request_id` or wait for the webhook.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generation_request_id:
                    type: string
                    format: uuid
                    description: Unique identifier (UUID) of the batch generation
                  version:
                    $ref: '#/components/schemas/ApiVersion'
              example:
                generation_request_id: 3f2a9c18-6b1e-4f4a-9a75-2b6d0e1c8f77
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/GenerationRateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /signing-secret:
    get:
      tags:
        - Webhooks
      operationId: getSigningSecret
      x-codeSamples:
        - lang: cURL
          source: |
            curl -H "x-api-key: $ABYSSALE_API_KEY" \
              https://api.abyssale.com/signing-secret
            # {"secret":"whsec_…","created_at_ts":1755561234,"rotated_at_ts":null}
      summary: Get the webhook signing secret
      description: |
        Retrieve the workspace's webhook signing secret, creating it on the first call and returning
        the same value on every call after that.

        One secret covers every webhook in the workspace — dashboard subscriptions and per-job
        `callback_url` deliveries alike. Fetch it once at setup and store it with your other
        credentials.

        Use it to verify the `X-Abyssale-Signature` header on incoming deliveries; the header format
        and ready-made verification snippets are in the **Webhooks** section of the introduction.
        Keep it server-side: a signature computed in a browser is a secret you have published.

        > A workspace with no secret receives **unsigned** deliveries; the secret coming into
        > existence is what turns signing on. This endpoint is the normal way to create it, but
        > `rotate` and `revoke` mint one too if none exists.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The workspace's signing secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /signing-secret/rotate:
    post:
      tags:
        - Webhooks
      operationId: rotateSigningSecret
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST -H "x-api-key: $ABYSSALE_API_KEY" \
              https://api.abyssale.com/signing-secret/rotate
      summary: Rotate the webhook signing secret
      description: |
        Issue a new signing secret and keep the previous one valid for **24 hours**.

        During that window every delivery carries **two** `v1` hashes — one per secret — so a
        receiver holding either value still verifies. That is what lets you deploy the new secret on
        your own schedule instead of coordinating a cutover.

        Keep accepting the old secret for a few minutes after you switch: retries already in flight
        were signed before you deployed.

        Takes no request body. If the workspace has no secret yet, one is created and immediately
        rotated, so the response always carries a usable value.

        **Calling this twice in a row is refused.** A second rotate while the previous secret is
        still inside its 24-hour window would demote the secret the first rotate minted and drop the
        one your receiver is still verifying with — the outage the window exists to prevent. You get
        `409 previous_secret_still_active`, and nothing changes. Either wait for the window to close
        (`previous_secret_expires_at_ts` from the first response tells you when), call
        `POST /signing-secret/revoke` to end the overlap now and rotate immediately after, or repeat
        the call with `?force=true` if you really do mean to rotate twice and accept that anything
        signed with the oldest secret stops verifying.
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Rotate even though the previous secret is still valid, revoking it. Only needed to
            override the `409` above; a first rotate never needs it.
      responses:
        '200':
          description: The new secret. The previous one stays valid for 24 hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Conflict — the previous secret is still within its grace window, so rotating would
            revoke it. Nothing changed. Retry with `?force=true` to rotate anyway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                previous_secret_still_active:
                  summary: A second rotate inside the 24-hour window
                  value:
                    id: previous_secret_still_active
                    message: "A previous signing secret is still valid until 1787319076 and rotating now would revoke it. Wait for it to expire, or repeat this call with `force=true` to rotate anyway."
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /signing-secret/revoke:
    post:
      tags:
        - Webhooks
      operationId: revokeSigningSecret
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST -H "x-api-key: $ABYSSALE_API_KEY" \
              https://api.abyssale.com/signing-secret/revoke
      summary: End the rotation overlap early
      description: |
        Invalidate the **previous** secret, ending the 24-hour overlap early. The current secret is
        untouched. Signing applies the change within **60 seconds** — deliveries already in flight
        may still carry a signature from the revoked secret for up to a minute.

        Use it after a rotation prompted by a leak rather than by routine hygiene. Note what it does
        and does not achieve for webhooks: **you** are the verifier, so a forged request stops being
        accepted the moment you deploy a receiver that no longer trusts the old secret — that does
        not wait on us. This endpoint closes the window on our side, which matters because we keep
        signing with the old secret until it lapses.

        Deliberately abrupt: within a minute, anything still signed with the old secret stops
        verifying, so a receiver you have not yet redeployed will start rejecting deliveries.

        Takes no request body, and is safe to call when there is no overlap to end. Like `rotate`, it
        **mints a secret if the workspace has none** — so calling it on a workspace that never
        enabled signing turns signing on.
      responses:
        '200':
          description: The current secret. Any previous secret is no longer valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /fonts:
    get:
      tags:
        - Fonts
      operationId: listFonts
      summary: List and search fonts
      description: |
        Retrieve the fonts available in your Abyssale workspace, including Google Fonts
        and any custom fonts you have uploaded, ordered by name. Use a font's `id` to override
        the font on text or button elements in a generation request.

        Search by `name`, filter by `category`, `weight` and `style`, and page — all optional: without
        them every font is returned, as a bare array. The number of matches is in the
        `X-Total-Count` header.
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [google, custom]
          description: >-
            Filter fonts by type. Omit to return both Google and custom fonts. An unknown value is **ignored** and the full unfiltered list is returned — this never answers 400 (long-standing behavior existing integrations rely on).
        - in: query
          name: name
          required: false
          schema:
            type: string
          example: open sans
          description: >-
            Text in the font name, matched ignoring case, accents, spaces, hyphens and underscores
            (`OpenSans` finds `Open Sans`). Exact names come first, then names starting with the
            text, then the rest — alphabetically within each.
        - in: query
          name: category
          required: false
          schema:
            type: string
            enum: [serif, sans-serif, display, handwriting, monospace]
          description: >-
            Only Google fonts of this category. Custom fonts have no category, so they never
            match. An unknown value answers `400 unknown_enum_value`.
        - in: query
          name: weight
          required: false
          schema:
            type: integer
            enum: [100, 200, 300, 400, 500, 600, 700, 800, 900]
          description: >-
            Only fonts available in this weight (`700` is bold): upright, or italic with
            `style=italic`. Any other value answers `400 out_of_range`.
        - in: query
          name: style
          required: false
          schema:
            type: string
            enum: [normal, italic]
          description: >-
            Only fonts with a variant in this style. With `weight`, that weight in that style
            (`weight=700&style=italic` keeps fonts that have `700-italic`). Apply an italic variant
            at generation with text markup: `<w=italic>…</w>`, or `<w=700-italic>…</w>`. An
            unknown value answers `400 unknown_enum_value`.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The fonts available to this workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Font"
        '400':
          description: >-
            A search or paging parameter is invalid: an unknown `category` or `style` (`unknown_enum_value`),
            a `weight` that is not 100–900 by hundreds, or `page` / `per_page` below 1
            (`out_of_range`), or not a number (`wrong_type`). An unknown `type` is ignored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: unknown_enum_value
                message: "unknown category script"
                errors:
                  - path: "category"
                    code: unknown_enum_value
                    message: "Must be one of: display, handwriting, monospace, sans-serif, serif."
                    expected: [display, handwriting, monospace, sans-serif, serif]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /credits:
    get:
      tags:
        - Credits
      operationId: getCredits
      x-codeSamples:
        - lang: cURL
          source: |
            curl -H "x-api-key: $ABYSSALE_API_KEY" \
              https://api.abyssale.com/credits
            # {"generation_credits":{"available":120,"limit":500,"consumed":380,"extra":0}, …}
      summary: Get remaining credits
      description: |
        Remaining generation and AI credits for the caller's workspace, for the current billing
        period.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The workspace's remaining credits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditsBalance"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /async/banners/export:
    post:
      tags:
      - Exports
      operationId: exportBanners
      summary: Export generated assets as a ZIP archive (asynchronous)
      description: |
        Asynchronously package a set of previously generated assets — any output type
        (JPEG, PNG, WEBP, AVIF, PDF, MP4, GIF, HTML5 bundle) — into a single ZIP
        archive for download. Provide a `callback_url` to receive a webhook notification
        when the export is ready, containing the archive URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  minItems: 1
                  description: An array of string that corresponds to the banners IDs you would like to export.
                  items:
                    type: string
                    format: uuid
                    example: "64238d01-d402-474b-8c2d-fbc957e9d290"
                callback_url:
                  type: string
                  format: uri
                  description: The url that will be called once the generation of your export is done.
                  example: "https://your-webhook.com/export-abyssale"
              required:
                - ids
      responses:
        '200':
          description: Export queued; keep `export_id` to match the webhook.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_id:
                    type: string
                    format: uuid
                    example: "64238d01-d402-474b-8c2d-fbc957e9d290"
                    description: Unique identifier (UUID) of the asynchronous export. Keep it to be able to identify the asynchronous response.
                  version:
                    $ref: '#/components/schemas/ApiVersion'
                required:
                  - export_id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            None of the ids in `ids` exist in this workspace (`visual_not_found`). A request
            mixing known and unknown ids SUCCEEDS, and the archive contains only the ones that
            were found. An id that is not a valid UUID answers `endpoint_not_found` instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /async/banner-builder/{designId}/generate-multipage-pdf:
    post:
      tags:
      - Asset Generation
      operationId: generateMultiPagePdf
      summary: Generate a multi-page PDF (asynchronous)
      description: |
        Asynchronously generate a multi-page print-ready PDF from a printer_multipage design.
        Each page is defined by a `pages` dictionary entry, allowing different element
        overrides per page — ideal for brochures, catalogs, and variable data printing.

        Provide a `callback_url` to receive a webhook when the PDF is ready,
        or poll `GET /generation-request/{generationRequestId}` for status.

        You can find available formats and elements by calling `GET /designs/{designId}`.
      parameters:
        - $ref: '#/components/parameters/DesignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pages:
                  $ref: "#/components/schemas/Pages"
                callback_url:
                  type: string
                  format: uri
                  description: |
                    **The url that will be called once generation of your PDF is done.**

                    We will do a `POST` request of the [NewBannerBatch](#operation/newBannerBatch) event on this URL with a JSON payload.
                print:
                  type: object
                  description: Print output options
                  properties:
                    color_profile:
                      type: string
                      format: uuid
                      description: |
                        UUID of the color profile to apply. The built-ins, which are the same for
                        every workspace:

                        | UUID | Profile |
                        |---|---|
                        | `be2ab219-8fe4-4d85-91ba-65bdc9ddaf01` | CMYK — ISO Coated v2 (ECI) |
                        | `03738f37-5b6f-4be9-9100-706b1711f9dd` | CMYK — ISO Coated v2 (ECI) 300% |
                        | `e0c86a8a-050c-41f1-885a-0f74b9baac50` | CMYK — ISO Uncoated |
                        | `0e0355e6-2931-4c83-92f2-64db9f5ddffc` | CMYK — US Web Coated (SWOP 2006 5v2) |
                        | `fac91df8-1155-11ef-b77e-f93002785645` | CMYK — ISO Newspaper26 v4 |
                        | `db3c123e-1127-11ef-b77e-f93002785645` | RGB — No color profile |

                        A workspace may also hold custom profiles, whose UUIDs are not listed
                        here. Omitted, the design's own profile is used. Not an enum: the list can
                        grow, and a generated client should not reject a UUID it has not seen.
                    display_crop_marks:
                      type: boolean
                original_visual_id:
                  type: string
                  format: uuid
                  description: |
                    **Do not use — visual versioning is not wired on this endpoint yet.** Every
                    other generation path resolves this UUID to an internal visual id and checks
                    it belongs to the same design and format; this one does not, so the raw UUID
                    is forwarded unresolved, no `visual_not_found` /
                    `not_related_to_same_template` / `not_related_to_same_format` check runs, and
                    the outcome is undefined. Use
                    `POST /async/banner-builder/{designId}/generate` for versioned regeneration.
              required:
                - pages
      responses:
        '200':
          description: Generation queued; poll `generation_request_id` or wait for the webhook.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generation_request_id:
                    type: string
                    format: uuid
                    description: Unique identifier (UUID) of the batch generation
                  version:
                    $ref: '#/components/schemas/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/GenerationRateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /generation-request/{generationRequestId}:
    get:
      operationId: getGenerationRequest
      summary: Poll async generation request status
      description: |
        Poll the status of an asynchronous generation request. Use this endpoint to track
        the progress of a batch generation operation started with the async generate endpoint.
        The result is available for 7 days after generation.
      tags:
        - Asset Generation
      parameters:
        - in: path
          name: generationRequestId
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier (UUID) of the generation request
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: Generation finished — `is_finalized` is `true` and `banners` is populated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRequestStatus"
        '202':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: Generation still in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRequestStatus"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Generation request not found (`generation_request_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: >-
            Gone — the generation request expired (`generation_request_gone`; requests are
            kept 7 days).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /projects:
    get:
      operationId: listProjects
      summary: List and search projects
      description: |
        Retrieve the projects in your workspace, ordered by name. Projects group designs into
        logical collections. Only designs that belong to a project are accessible via the API.

        Filter by `name` and page with `page` / `per_page` — both optional: without them every
        project is returned, as a bare array. The number of matches is in the `X-Total-Count`
        header. Pass a project's `id` as `project_id` to `GET /designs` to list its designs.
      tags:
        - Projects
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: One exact phrase that must appear in the project name (case- and accent-insensitive).
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The workspace's projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
              examples:
                projects_list:
                  summary: List of projects
                  value:
                    - id: "9d00e9fe-9bd5-4471-acad-baa702a867e9"
                      name: "Animation Tests"
                      created_at_ts: 1654763057
                    - id: "bdf9ab44-f5fd-47ad-881d-a45906901233"
                      name: "HTML5 Tests"
                      created_at_ts: 1663767647
        '400':
          description: "`page` or `per_page` is below 1 (`out_of_range`) or not a number (`wrong_type`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: out_of_range
                message: "per_page must be at least 1"
                errors:
                  - path: "per_page"
                    code: out_of_range
                    message: "Must be at least 1, got 0."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

    post:
      operationId: createProject
      summary: Create a project
      description: |
        Create a new project to organize your designs. Assign designs to this project
        in the Abyssale editor to make them accessible via the API.
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Name of the project
                  example: "Summer Campaign 2024"
              required:
                - name
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: Project created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProjectSummary"
                  - type: object
                    properties:
                      version:
                        $ref: '#/components/schemas/ApiVersion'
              examples:
                created_project:
                  summary: Successfully created project
                  value:
                    id: "cb2c4add-4867-11f0-96f2-0a00d9eb8f78"
                    name: "Summer Campaign 2024"
                    created_at_ts: 1749827107
        '400':
          description: |
            Bad Request — `name` is missing, outside 2–100 characters, or already taken
            (`project_already_exists`).

            Project names are unique within a workspace, and the comparison is made on the
            **trimmed** name: `"  Summer  "` collides with an existing `"Summer"`. Note the
            length check runs before trimming, so `"  a  "` passes validation and is stored as
            the single character `a`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_exists:
                  summary: A project of that name exists in this workspace
                  value:
                    id: project_already_exists
                    message: "Project already exists with the same name"
                name_out_of_range:
                  summary: name outside 2–100 characters
                  value:
                    id: out_of_range
                    message: "name: Length must be between 2 and 100."
                    errors:
                      - path: "name"
                        code: out_of_range
                        message: "Length must be between 2 and 100."
                name_missing:
                  summary: name absent
                  value:
                    id: missing_required
                    message: "name: Missing data for required field."
                    errors:
                      - path: "name"
                        code: missing_required
                        message: "Missing data for required field."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []
  /workspace-templates:
    get:
      operationId: listWorkspaceTemplates
      summary: List all workspace templates
      description: |
        Retrieve the organisation-level master designs shared across your workspace.

        A workspace template lives in a **category** (`category_id`), not a project — it
        belongs to the organisation until you duplicate it into a project with
        `POST /workspace-templates/{companyTemplateId}/use`. Designs, which do live in a
        project, are listed by `GET /designs`; the two listings never overlap.

        Items have the same shape as a design, except the grouping fields are named
        `category_id` / `category_name`.
      tags:
        - Workspace Templates
      parameters:
        - in: query
          name: category_id
          schema:
            type: string
            format: uuid
          required: false
          description: |
            Unique identifier (UUID) of a workspace category. List the available ids with
            `GET /workspace-template-categories`. Categories are optional, so this filter only
            ever returns categorised templates — omit it to include those at the workspace root.
        - in: query
          name: type
          schema:
            type: string
            enum: [static, printer, animated, printer_multipage]
          required: false
          description: >-
            Filter workspace templates by one of these types: static, animated,
            printer, printer_multipage. An unknown value is **ignored** and the full unfiltered list is returned — this never answers 400 (long-standing behavior existing integrations rely on).
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The workspace's shared templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceTemplate"
        '400':
          description: |
            `category_id` is not a UUID. The only way this endpoint answers `400`: an unknown
            `type` is ignored rather than rejected, so it never does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: invalid_payload
                message: "malformed id category_id"
                errors:
                  - path: "category_id"
                    code: invalid_payload
                    message: "malformed"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []
  /workspace-template-categories:
