            dynamic_image_url: https://img.abyssale.com/a12b3c4d-5e6f-7890-abcd-ef1234567890/another-format

    backgroundColor:
      type: string
      description:  |
        **The background color displayed behind the element.**

        4 filling modes are available:
        - `Hex`: `#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA` (the 8- and 4-digit forms carry alpha). _i.e. #EAEAEA or #FF00FF55_
        - `Linear Gradient`: `linear-gradient(x1% y1% x2% y2%,offset1% color1 opacity1,offset2% color2 opacity2[,...])` with 2 to 8 color stops, each at its own offset. _i.e. linear-gradient(0% 0% 100% 0%,0% #1a47ff 1,100% #b65151 1)_
          - offset: `0%` to `100%`;
          - color: `#RRGGBB` or `#RGB`, or `cmyk(C,M,Y,K)` without spaces, and every stop in the same notation. A stop color carries no alpha (`#RRGGBBAA`, `#RGBA` and `cmyka` are refused): transparency is the stop opacity;
          - opacity: `0` to `1`.

          No space after a comma.
        - `Radial Gradient`: `radial-gradient(cx% cy% r%,offset1% color1 opacity1,offset2% color2 opacity2[,...])`, the same stops as a linear gradient around a centre (`cx% cy%`) with a radius `r%` above 0. Each value is a percent of the element's box, so on an element that is not square the gradient is an ellipse fitted to it. _i.e. radial-gradient(50% 50% 71%,0% #1a47ff 1,100% #b65151 1)_
        - `CMYK` (for print; converted to RGB on other designs): `cmyk(C,M,Y,K)` or `cmyka(C,M,Y,K,A)`, each component an integer 0–100, optionally followed by `%`. _i.e. cmyk(0,100,100,0)_

        On a `printer` / `printer_multipage` design a gradient is accepted only on the
        `background_color` of a shape or button, with `cmyk(C,M,Y,K)`, `#RRGGBB` or `#RGB` stops, all
        opaque; on the format background (`root`) or any other element it is refused with
        `400 invalid_payload`.
      example: "#FF0000"

    payload:
      type: string
      description: |
        **The text content**. *Example: Lorem Ipsum*

        - [How can I force specific line breaks?](https://developers.abyssale.com/image-generation-properties.html#color)
        - [How can I add decorations to specific parts of a text?](https://developers.abyssale.com/image-generation-properties.html#color)
      minLength: 1
      maxLength: 10000

    buttonPayload:
      type: string
      description: |
        **The button's label.** Same content rules as a text `payload`, but capped at 2 048
        characters rather than 10 000 — the validator enforces the two separately.
      minLength: 1
      maxLength: 2048

    color:
      type: string
      description:  |
        **The text color.**

        4 filling modes are available:
        - `Hex`: `#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA` (the 8- and 4-digit forms carry alpha). _i.e. #EAEAEA or #FF00FF55_
        - `Linear Gradient`: `linear-gradient(x1% y1% x2% y2%,offset1% color1 opacity1,offset2% color2 opacity2[,...])` with 2 to 8 color stops, each at its own offset. _i.e. linear-gradient(0% 0% 100% 0%,0% #1a47ff 1,100% #b65151 1)_
          - offset: `0%` to `100%`;
          - color: `#RRGGBB` or `#RGB`, or `cmyk(C,M,Y,K)` without spaces, and every stop in the same notation. A stop color carries no alpha (`#RRGGBBAA`, `#RGBA` and `cmyka` are refused): transparency is the stop opacity;
          - opacity: `0` to `1`.

          No space after a comma.
        - `Radial Gradient`: `radial-gradient(cx% cy% r%,offset1% color1 opacity1,offset2% color2 opacity2[,...])`, the same stops as a linear gradient around a centre (`cx% cy%`) with a radius `r%` above 0. Each value is a percent of the element's box, so on an element that is not square the gradient is an ellipse fitted to it. _i.e. radial-gradient(50% 50% 71%,0% #1a47ff 1,100% #b65151 1)_
        - `CMYK` (for print; converted to RGB on other designs): `cmyk(C,M,Y,K)` or `cmyka(C,M,Y,K,A)`, each component an integer 0–100, optionally followed by `%`. _i.e. cmyk(0,100,100,0)_

        A gradient is not accepted on a `printer` / `printer_multipage` design: print text is
        solid, and the request is refused with `400 invalid_payload`.

    backgroundPadding:
      type: string
      description: |
        **The padding of the background color around the text.** *Example: 10*

        _This parameter will only be used if a background color is defined._

        - String: Two numbers separated by a space: First number represents the vertical padding in pixels & the second the vertical padding. For instance: 0 10 : 0 as vertical padding & 10 as horizontal
        - Number: Paddings (Horizontal & vertical) in pixels. _i.e. 10_

    fontSize:
      type: number
      minimum: 1
      description: "**Font size in pixels** *Example: 20*"

    # Named `fontId`, not `font`: a component named `font` differs from the `Font` model of
    # GET /fonts by case alone, and a generator writing one file per model overwrites one with
    # the other on a case-insensitive filesystem (macOS, Windows). The two are different things —
    # this is the id you send, `Font` is the object you read.
    fontId:
      type: string
      format: uuid
      description: |
        **Force a specific font by ID**. *Example: 6156907e-33c5-11ea-9877-92672c1b8195*

        The fonts list is available by calling the [GET /fonts](/api-reference/#fonts) API route.

    fontWeight:
      type: number
      enum: [100, 200, 300, 400, 500, 600, 700, 800, 900]
      description: |
        **Force a font weight**. *Example: 500*

        | Value | Corresponding name |
        |-----|-----|
        | 100   | Thin   |
        | 200   | Extra Light   |
        | 300   | Light   |
        | 400   | Regular   |
        | 500   | Medium   |
        | 600   | Semi Bold   |
        | 700   | Bold   |
        | 800   | Extra Bold   |
        | 900   | Black   |

        _If the font does not contain the given font weight, the nearest weight will be used._

    lineHeight:
      type: number
      minimum: 1
      description: |
        **Force line height in percentage** *Example: 130*

        __This parameter is only applied when the text is a multiline one.__

    skewY:
      type: number
      minimum: -20
      maximum: 20
      description: "**Slant text on the y axis** *Example: 20*"

    textAlignment:
      type: string
      enum: [top, middle, bottom, left, center, right, justify, justify-left, justify-center, justify-right, top left, top center, top right, middle left, middle center, middle right, bottom left, bottom right, bottom center, top justify, top justify-left, top justify-center, top justify-right, middle justify, middle justify-left, middle justify-center, middle justify-right, bottom justify, bottom justify-left, bottom justify-center, bottom justify-right, top custom, middle custom, bottom custom, custom left, custom center, custom right, custom custom]
      description: |
        **The text alignment.** *Example: left*

        __If given, the text position will be computed from the text bounding box defined within the design.__

        The horizontal half may be justified: `justify-left`, `justify-center` and `justify-right`
        stretch every line to the box except the last line of each paragraph, which is aligned as
        named (CSS `text-align: justify` with `text-align-last`). `justify` is the CSS and Figma
        spelling, an alias of `justify-left`. Text layers only: a button's label takes
        `left`, `center` or `right`.

    textTransform:
      type: string
      description: >
        **Text transformation style.**
        Force the text to be transformed to one of the following options:
        - `uppercase`: All letters become uppercase (e.g., `EXAMPLE`)
        - `lowercase`: All letters become lowercase (e.g., `example`)
        - `titlecase`: The first letter of each word is capitalized (e.g., `Example Text`)
        - `capitalize`: Only the first letter of the entire text is capitalized (e.g., `Example text`)
        - `none`: No transformation — send it to clear one set on the design
      enum:
        - none
        - uppercase
        - lowercase
        - titlecase
        - capitalize

    strokeWidth:
      type: number
      minimum: 0
      maximum: 40
      description: >-
        **Width of the stroke** *Example: 10*. Text and button top out at 40; a shape layer accepts up to 60
        (see `shapeStrokeWidth`). The design **import** allows up to 1000, so a design can hold a
        stroke this endpoint cannot reproduce — the import bound is the design's, this one is the
        override's.

    shapeStrokeWidth:
      type: number
      minimum: 0
      maximum: 60
      description: >-
        **Width of a shape's stroke or an image's frame** *Example: 10*. The design **import**
        allows up to 1000 — see `strokeWidth`.

    strokeColor:
      type: string
      description: |
        **Stroke color.** Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(...)` / `cmyka(...)`; no gradient. *Example: #FF0000*

        __If your design does not contain any stroke, this color won't be visible__

    imageUrl:
      type: string
      format: uri
      description: |
        **HTTP(s) URL of the image** *Example: https://www.abyssale.com/imge/abyssale_logo.png*

        __It must be publicly accessible and at most 20 MB__ (500 MB on `printer` and
        `printer_multipage` designs).

        Supported files: jpeg, jpg, png, webp, svg, gif, tiff, tif, avif

    imageEncoded:
      type: string
      description: |
        **Base64 encoded image as value.** *Example: /9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAIBAQE...*

        __If the image_url is given, this parameter will not be used.__

    iconUrl:
      type: string
      format: uri
      maxLength: 2048
      description: |
        **HTTP(s) URL of the button's icon** — the small image displayed beside the label.
        *Example: https://www.abyssale.com/imge/star.svg*

        __It must be publicly accessible__, and the same size limits as `image_url` apply.

        Supported files: jpeg, jpg, png, webp, svg, gif, tiff, tif, avif

        Only a `button` layer takes it. It replaces the icon the design carries, or gives one to a
        button designed without — a button that had none renders it on the left, at the label's
        font size, with no gap, since those are the icon defaults.

        The icon's geometry (its size, its gap to the label and the side it sits on) belongs to
        the design and cannot be overridden per generation.

    iconEncoded:
      type: string
      description: |
        **Base64 encoded icon as value** — the `icon_url` alternative, exactly as `image_encoded`
        is to `image_url`. *Example: /9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAIBAQE...*

        Either a bare base64 body or a `data:image/<type>;base64,` data URI; the prefix is stripped
        for you. The same mimetypes and the same size cap as `image_encoded` apply, and the value is
        never stored on the generation request.

        __If `icon_url` is given, this parameter will not be used.__

        Only a `button` layer takes it, and the icon's geometry still belongs to the design — see
        `icon_url`.

    iconColor:
      type: string
      description: |
        **Color applied to the button's icon.**

        - `Hex`: `#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA` (the 8- and 4-digit forms carry alpha). _i.e. #EAEAEA or #FF00FF55_
        - `CMYK` (for print; converted to RGB on other designs): `cmyk(C,M,Y,K)` or `cmyka(C,M,Y,K,A)`, each component an integer 0–100, optionally followed by `%`. _i.e. cmyk(0,100,100,0)_

        __Only an SVG icon can be recoloured__ — on any other file type the icon is drawn as-is
        and this parameter is ignored. There is no gradient form: an icon takes one flat colour.

    opacity:
      type: number
      minimum: 0
      maximum: 100
      description: "**Opacity of the image** *Example: 60*"

    fittingType:
      type: string
      enum: [cover, fill]
      description: |
        **Defines the way the image will be inserted in the bounding box**

        Two properties are supported:

        - `cover`: It will force the image to fill entirely the area without changing the aspect ratio (hence the image will be cropped if its ratio is not the same as the container)
        - `fill`: The image will be displayed entirely within the box.

    alignment:
      type: string
      enum: [top, middle, bottom, left, center, right, top left, top center, top right, middle left, middle center, middle right, bottom left, bottom right, bottom center, top custom, middle custom, bottom custom, custom left, custom center, custom right, custom custom]
      description: >-
        **The image alignment.** *Example: left*. A `custom` component resolves to the **centre** of
        that axis: `custom custom`, `custom center` and `middle custom` all place at the box
        centre, while `custom left` is the middle of the left edge. It is the value the editor
        stores for a hand-positioned layer, not a way to preserve one.

    maskName:
      type: string
      enum: [circle, rounded_corners, blob, squircle, pentagon, hexagon, parallelogram, window]
      description: |
        **A mask can be added to the image**.

        8 masks are available. Only `rounded_corners` takes a `mask_properties`; the other
        seven are shapes with no additional property.

        - `circle`: The image will be rendered as a circle.
        - `rounded_corners`: Corners of the image will be rounded. It requires another property: `mask_properties`.
        - `blob`: The image will be rendered as a blob.
        - `squircle`: The image will be rendered as a squircle.
        - `pentagon`: The image will be rendered as a pentagon.
        - `hexagon`: The image will be rendered as a hexagon.
        - `parallelogram`: The image will be rendered as a parallelogram.
        - `window`: The image will be rendered as a window (an arch — flat base, rounded top).

    maskProperties:
      type: object
      properties:
        radius:
          oneOf:
            - type: number
              minimum: 0
            - type: object
              properties:
                tl: {type: number, minimum: 0}
                tr: {type: number, minimum: 0}
                br: {type: number, minimum: 0}
                bl: {type: number, minimum: 0}
        skew_y:
          type: number
          minimum: -22
          maximum: 22
          description: Slant the mask on the y axis.
      description: |
        **When the rounded_corners mask is applied, this parameter allows to define the radius**.
        
        Two types of radius is supported:
        - A number, that allows to define all corners' radius at once. *Example: {"radius": 20}*
        - An object, that allows to customize each corner's radius individually.
          4 properties are available: (`tl` = top left, `tr` = top right, `br` = bottom right, `bl` = bottom left)
        
        *Example: {"radius": {
          "tl": 0,
          "tr": 56,
          "br": 56,
          "bl": 20
        }}*

    filterName:
      type: string
      enum: [grayscale, duotone]
      description: |
        **A filter can be added to the image.** *Example: grayscale*

        2 filters are available:
        - `grayscale`: It converts the input image to grayscale. No additional property is available.
        - `duotone`: Apply a duotone filter to the image. It requires another property: `filter_properties`

    filterProperties:
      type: object
      properties:
        name:
          type: string
          enum: [blue_green,blue_orange,deep_green_light_green,BrightRed_light_yellow,brown_pale_green,brown_beige,deep_blue_green,deep_blue_red,deep_purple_orange,deep_purple_beige,deep_purple_pale_green,deep_blue_pale_green]
      description: |
        **When the duotone mask is applied, this parameter allows to define the duotone filter to apply**.
        *Example: { "name": "blue_orange" }*

    patternName:
      type: string
      enum: [bubbles,cage,cross,doubleCircle,drops,parkay,pills,plus,star,ticTac,ticTacFilled,triangle,wiggle]
      description: |
        **A pattern can be added to the shape**.

        (List of patterns)[] 

    patternColor:
      type: string
      example: "#EAEAEA"
      description: |
        **The color of the pattern.** Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(C,M,Y,K)` / `cmyka(C,M,Y,K,A)` with components 0–100. No gradient. _i.e. #EAEAEA or #FF00FF55_

        _If no pattern is applied to the shape, this property will not change anything._

    overlayDirection:
      type: string
      enum: [horizontal, vertical, diagonal]
      description: Direction of the overlay.

    overlayColor1:
      type: string
      description: "First color of the overlay. Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(...)` / `cmyka(...)`; no gradient."

    overlayColor2:
      type: string
      description: "Second color of the overlay. Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(...)` / `cmyka(...)`; no gradient."

    ratingScore:
      type: number
      minimum: 0
      maximum: 100
      description: |
        **Score of the rating on a scale of 100.** *Example: 50*
        
        _For instance, as rating is displayed as five-stars, 50 will give a 2.5/5 score._  

    ratingBackgroundColor:
      type: string
      description:  |
        **The background color displayed behind all the stars.**

        Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(C,M,Y,K)` / `cmyka(C,M,Y,K,A)` with components 0–100. No gradient. _i.e. #EAEAEA or #FF00FF55_

    starColor:
      type: string
      description:  |
        **The color of the filled stars.**

        Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(C,M,Y,K)` / `cmyka(C,M,Y,K,A)` with components 0–100. No gradient. _i.e. #EAEAEA or #FF00FF55_

    starMargin:
      type: number
      minimum: 0
      maximum: 100
      description: "**Margins in pixels between stars.** *Example: 60*"

    starDimension:
      type: number
      exclusiveMinimum: true
      minimum: 0
      maximum: 400
      description: >-
        **Size in pixels of one star.** *Example: 100*. The design **import** requires at least 4,
        so this endpoint accepts smaller stars than a design can be imported with.

    illustrationType:
      type: string
      example: undraw
      description: >-
        **The illustration library the illustration name is looked up in.** The public libraries
        are `undraw`, `feather`, `twemoji` and `material_icons`.

        Left as a free string rather than an enum on purpose: some workspaces have private
        libraries of their own, and an enum would make a generated client reject a value their API
        accepts.

    illustrationFile:
      type: string
      description: "**The illustration name.**."

    illustrationProperties:
      type: object
      properties:
        primary_color:
          type: string
          description: |
            **Color of the illustration** 
            
            Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(C,M,Y,K)` / `cmyka(C,M,Y,K,A)` with components 0–100. No gradient. _i.e. #EAEAEA or #FF00FF55_
      description: |
         **Only `Undraw`, `feather` and `material icons` support `illustration_properties`.**

    qrcodeBackgroundColor:
      type: string
      description:  |
        **The background color displayed behind the qrcode.**

        Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(C,M,Y,K)` / `cmyka(C,M,Y,K,A)` with components 0–100. No gradient. _i.e. #EAEAEA or #FF00FF55_

    qrcodeForegroundColor:
      type: string
      description:  |
        **The color of the qrcode (of all squares).**

        Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(C,M,Y,K)` / `cmyka(C,M,Y,K,A)` with components 0–100. No gradient. _i.e. #EAEAEA or #FF00FF55_

    qrcodePayload:
      type: string
      description:  |
        **The content of the qrcode. i.e. Lorem Ipsum**

        This content will be displayed once the QR Code is scanned.

    qrcodeImageUrl:
      type: string
      description:  |
        **HTTP(s) URL of the icon displayed in the middle of the QR Code** *Example: https://www.abyssale.com/imge/abyssale_logo.png*

        __It must be a public accessible link and have a filesize of 10 mo maximum.__

        Supported files: jpeg, png, webp

    qrcodeHideIcon:
      type: boolean
      description: "`true`, `false`. If true it hides the icon in the middle of the QRCode."

    videoUrl:
      type: string
      format: uri
      description: |
        **HTTP(s) URL of the video** *Example: https://www.abyssale.com/imge/this_an_example.mp4*

        __It must be a public accessible link and have a filesize of 100 mo maximum.__

        Supported files: mp4

x-webhooks:
  newBanner:
    post:
      security: []
      summary: File generated
      description: |
        A new file (image, video, GIF, HTML5 banner, or PDF) has been generated and is ready to
        download.

        **Subscribed in the dashboard, not per request.** Unlike the other two events, this one
        has no `callback_url` field on any endpoint — it is configured once for the workspace and
        then fires for every file generated, including files produced outside the API.

        Delivery, retries and the `event_type` convention are described under
        [Webhooks](/webhooks/overview-webhooks).
      operationId: newImage
      tags:
        - Files
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    event_type:
                      type: string
                      enum: [NEW_BANNER]
                      description: Identifies the event — every webhook payload carries this field.
                - $ref: "#/components/schemas/Banner"
      responses:
        "200":
          description: Return a 200 status to indicate that the data was received successfully

  newBannerBatch:
    post:
      security: []
      summary: Batch generation completed
      description: |
        An asynchronous batch generation request has completed. Contains the full list
        of generated files and any per-format errors. Triggered by
        `POST /async/banner-builder/{designId}/generate`.
      operationId: newBannerBatch
      tags:
        - Files
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum: [NEW_BANNER_BATCH]
                  description: Identifies the event — every webhook payload carries this field.
                generation_request_id:
                  type: string
                  format: uuid
                  description: Unique identifier (UUID) of the batch generation
                banners:
                  type: array
                  items:
                    $ref: "#/components/schemas/Banner"
                  description: List of generated images
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      template_format_name:
                        type: string
                        description: The image related to this format name cannot be generated
                      reason:
                        type: string
                        description: The error reason
                  description: If any errors occur, they will be listed under that property
              required:
                - generation_request_id
                - banners
      responses:
        "200":
          description: Return a 200 status to indicate that the data was received successfully

  newExport:
    post:
      security: []
      summary: Banner export archive ready
      description: |
        An asynchronous banner export has completed. The ZIP archive containing all
        requested banners is available at the provided `archive_url`.
      operationId: newExport
      tags:
        - Exports
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum: [NEW_EXPORT]
                  description: Identifies the event — every webhook payload carries this field.
                export_id:
                  type: string
                  format: uuid
                  example: "38cb7df3-1160-4824-8531-2bacde2b6517"
                  description: ID of the export
                archive_url:
                  type: string
                  format: uri
                  example: "https://production-banners.s3.eu-west-1.amazonaws.com/demo/export_38cb7df3-1160-4824-8531-2bacde2b6517.zip"
                  description: The zip public URL
                requested_at:
                  type: number
                  example: 1642150000
                  description: Timestamp at which the export has been requested
                generated_at:
                  type: number
                  example: 1642150002
                  description: Timestamp at which the export has been done
      responses:
        "200":
          description: Return a 200 status to indicate that the data was received successfully
  templateStatus:
    post:
      security: []
      summary: Design status changed
      description: |
        A design moved through the approval workflow — submitted for review, approved, rejected,
        put on hold, or reset. Use it to tell an internal tool that a creative is cleared for use.

        **Configured in the dashboard, and filterable.** Like `newBanner`, this event has no
        `callback_url` on any endpoint: you subscribe once for the workspace. The subscription can
        be narrowed to specific designs, in which case changes to any other design are not
        delivered.

        The payload is the design plus the status that triggered the event. That status is
        **frozen at the moment of the change**, not read at delivery time — if a design is
        approved and then rejected, you receive two events carrying `APPROVED` and `REJECTED`
        respectively, rather than two copies of the latest value.

        Delivery, retries and the `event_type` convention are described under
        [Webhooks](/webhooks/overview-webhooks).
      operationId: templateStatus
      tags:
        - Designs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum: [TEMPLATE_STATUS]
                  description: Identifies the event — every webhook payload carries this field.
                id:
                  type: string
                  format: uuid
                  description: Unique identifier (UUID) of the design whose status changed.
                  example: "873608a1-e498-47dd-a36d-bd065e3e2b8e"
                name:
                  type: string
                  description: Name of the design.
                  example: "Ad campaign fall 2025"
                created_at:
                  type: integer
                  description: Unix timestamp of the design's creation.
                  example: 1623229458
                updated_at:
                  type: integer
                  description: Unix timestamp of the last change to the design's content.
                  example: 1649837900
                status:
                  type: string
                  enum: [NONE, IN_REVIEW, ON_HOLD, REJECTED, APPROVED, COMPLETED]
                  description: |
                    The workflow status this event reports. `NONE` is the default for a design
                    that has never entered the workflow, and is also what a reset reports.
                    `COMPLETED` reports that work on the design is finished.
                  example: "APPROVED"
                status_updated_at:
                  type: integer
                  description: Unix timestamp at which that status was set.
                  example: 1649837939
              required:
                - event_type
                - id
                - status
                - status_updated_at
      responses:
        "200":
          description: Return a 200 status to indicate that the data was received successfully
