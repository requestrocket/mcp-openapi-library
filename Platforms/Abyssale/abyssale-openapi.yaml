    DesignFormatSummary:
      description: >-
        The design a format belongs to, as returned nested in
        `GET /designs/{designId}/formats/{formatSpecifier}`.
      allOf:
        - $ref: "#/components/schemas/DesignSummary"
        - type: object
          properties:
            type:
              type: string
              enum: ["static", "printer", "animated", "printer_multipage"]
              example: "static"
            category_name:
              type: string
              nullable: true
              deprecated: true
              description: Deprecated alias of the project name — see `Design.category_name`.

    DesignFormat:
      type: object
      properties:
        id:
          type: string
          example: "facebook-post"
          description: Unique identifier (name) of the format.
        uid:
          type: string
          format: uuid
          example: "9b57d65e-eb2c-4a74-a51e-4482917c248a"
          description: Unique UUID of the format
        width:
          type: number
          example: 1200
          description: Width of the format
        height:
          type: number
          example: 1200
          description: Height of the format
        unit:
          type: string
          example: "px"
          description: Unit of measurement for dimensions
        preview_url:
          type: string
          format: uri
          example: https://production-banners.s3-eu-west-1.amazonaws.com/templates/e0d292f2-ec21-11e9-a539-3c408bf94155/a9b3c668-7b84-4924-adf0-815dae727d32.png
          description: Preview Image URL of the format
        dynamic_image_url:
          type: string
          format: uri
          example: https://img.abyssale.com/ecf1fe8c-5392-48c2-b6d2-665183a18fe5/9b57d65e-eb2c-4a74-a51e-4482917c248a
          description: URL of the existing dynamic image for this format.
        dpi:
          type: integer
          example: 300
          description: Printer designs only. Render DPI of the format, computed at import time (capped at 300; large formats degrade to stay within the renderer's pixel budget). Read-only — not an import field.
        bleed_size:
          type: number
          example: 3.5
          description: Printer designs only. Bleed size as a float in the design's unit (mm/in). Always present on a printer format; `0` means the zone is off.
        safe_size:
          type: number
          example: 5
          description: Printer designs only. Safe-zone size as a float in the design's unit (mm/in). Always present on a printer format; `0` means the zone is off.
      required:
        - id
        - uid
        - width
        - height
    DesignPage:
      type: object
      description: |
        One page of a `printer_multipage` design, as returned in `pages[]`.

        Deliberately **not** `DesignFormat`. A multipage design is one document with no formats —
        each page is addressed by `id` (`page_1 … page_N`), has no format `uid`, and cannot carry
        a dynamic image, so `GET /designs/{designId}/formats/{formatSpecifier}` answers
        `404 format_not_found` for every specifier.

        **A page carries no print settings.** `dpi`, `bleed_size` and `safe_size` belong to the
        document and are returned once, at the root of the design read. `width` / `height` /
        `unit` appear here because a page is a thing with dimensions, but every page of the
        document has the same ones.
      properties:
        id:
          type: string
          example: "page_1"
          description: Page identifier, `page_1 … page_N`, in document order.
        width:
          type: number
          example: 210
          description: Page width as a float in `unit`. Every page of the document shares it.
        height:
          type: number
          example: 297
          description: Page height as a float in `unit`. Every page of the document shares it.
        unit:
          type: string
          enum: [mm, in]
          example: "mm"
          description: The document's physical authoring unit.
        preview_url:
          type: string
          format: uri
          description: Preview image URL of this page.
      required:
        - id
        - width
        - height

    DesignAnimation:
      type: object
      description: |
        Animated designs only. The design's timeline, read-only (all values in seconds).
      properties:
        duration:
          type: number
          nullable: true
          example: 8.0
          description: Timeline length in seconds.
        screenshot_at_s:
          type: number
          nullable: true
          example: 8.0
          description: |
            The moment the HTML5 backup screenshot is taken (seconds). Null on designs created before it was recorded
            that never stored it; always set on imported designs.
    DesignElement:
      type: object
      properties:
        name:
          type: string
          example: "element-name"
          description: Layer name (`root` is a special element that allows to customize the image background color.)
        type:
          type: string
          enum: ["container", "text", "button", "image", "logo", "shape", "illustration", "rating", "qrcode", "video", "audio", "group", "code"]
          example: "text"
          description: >-
            Layer type. `container` is the design's own root wrapper, not a layer you can author or override — skip it when walking the tree. `group` elements are injected only on the platform
            advanced view (`i=advanced`); a masked group reports `group` too, with a `mask` block.
            `code` is listed last because it is marginal: a custom HTML/JS layer that exists only
            on `animated` designs, read-only like `container` — it carries no customisable
            attributes, so it can never be targeted in a generation request.
        layout:
          type: object
          description: The element's box, **keyed by format name**.
          additionalProperties:
            allOf:
              - $ref: "#/components/schemas/ElementLayout"
            x-additionalPropertiesName: format-id
        layer_ids:
          type: array
          description: "`group` layers only — the names of the layers this group contains."
          items:
            type: string
        hidden:
          type: object
          description: "`group` layers only — computed visibility, keyed by format name."
          additionalProperties:
            type: boolean
            x-additionalPropertiesName: format-id
        locked:
          type: object
          description: "`group` layers only — computed lock state, keyed by format name."
          additionalProperties:
            type: boolean
            x-additionalPropertiesName: format-id
        group:
          type: object
          description: "`group` layers only — auto-layout settings, keyed by format name."
          additionalProperties:
            allOf:
              - $ref: "#/components/schemas/GroupLayout"
            x-additionalPropertiesName: format-id
        mask:
          type: object
          description: >-
            Masked `group` layers only — the mask geometry, keyed by format name. Presence is a
            layer-level fact: a layer is a masked group in every format or in none.
          additionalProperties:
            allOf:
              - $ref: "#/components/schemas/GroupMask"
            x-additionalPropertiesName: format-id
        animation:
          type: object
          description: |
            Animated designs only; present when the element carries timeline timing or tweens.
            An injected `group` layer carries `start_at_s` / `end_at_s` only — never `tweens`.
          properties:
            start_at_s:
              type: number
              nullable: true
              example: 0.79
            end_at_s:
              type: number
              nullable: true
              example: 8.0
            tweens:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: "tb-text_0-slide_2"
                  type:
                    type: string
                    enum: [slide, fade, scale, rotate, audioFade, textEffect]
                  keyframes:
                    type: array
                    items:
                      type: object
                      description: >-
                        One keyframe. Several keyframe generations coexist in stored designs, so
                        extra keys are permitted rather than rejected.
                      properties:
                        attr:
                          type: object
                          additionalProperties: true
                          description: >-
                            The properties this keyframe sets, as a map of property name to value:
                            `{"opacity": 0}` (fade), `{"left": 1021, "top": 347}` (slide — always
                            both), `{"scale": 120}` (scale), `{"angle": -100}` (rotate),
                            `{"volumeEffect": 0}` (audioFade), `{"typewriting": 100,
                            "textEffectType": "classic", "textEffectSplit": "word", "textEffectTiming": "in"}` (textEffect).
                            Values are numbers, except `textEffectType`, `textEffectSplit` and
                            `textEffectTiming` which are names.
                          example:
                            left: 1021
                            top: 347
                        data:
                          type: object
                          properties:
                            type:
                              type: string
                              example: start
                            time:
                              type: number
                              example: 0
                      additionalProperties: true
        attributes:
          type: array
          description: List of all attributes
          items:
            type: object
            properties:
              id:
                type: string
                example: payload
                description: The attribute name
              help:
                type: string
                example: Text content (i.e. Lorem ipsum)
                description: An helper to understand what is this attribute
              values:
                type: object
                example:
                  facebook-post: "My image title"
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: number
                    - type: boolean
                    - type: object
                      additionalProperties: true
                  description: >-
                    The value of the attribute in that format. Usually a string; the media
                    attributes of a `video`/`audio` layer are typed — `video_duration` and
                    `max_volume` are numbers, `video_muted` and `audio_muted` booleans.
                    Two attributes carry an **object** instead: `mask_properties` (e.g.
                    `{"radius": 12, "skew_y": -2}`) and `filter_properties` (e.g.
                    `{"name": "blue_green"}`). Their inner keys vary by mask and filter and are
                    not enumerated here.
                  x-additionalPropertiesName: format-id
            required:
              - id
              - values
      required:
        - name
        - type
        - attributes

    ElementLayout:
      type: object
      description: >-
        An element's box. Integers in pixels on `static`/`animated`; floats in the design's
        physical unit (mm/in) on `printer`.
      properties:
        x: {type: number, example: 0}
        y: {type: number, example: 0}
        width: {type: number, example: 3333}
        height: {type: number, example: 666}

    GroupLayout:
      type: object
      description: >-
        Auto-layout settings of a `group` layer. **Empty on animated designs** — the platform
        stores no auto-layout there. `direction`, `placement` and `gap` appear only when
        `auto_layout` is on.
      properties:
        auto_layout:
          type: boolean
        direction:
          type: string
        placement:
          type: string
        gap:
          type: number
          description: Pixels on static/animated; a physical-unit float on printer.

    GroupMask:
      type: object
      description: Mask geometry of a masked `group` layer.
      properties:
        shape: {type: string}
        width: {type: number}
        height: {type: number}
        center_x: {type: number}
        center_y: {type: number}
        rx: {type: number}
        ry: {type: number}
        rotation: {type: number}
        radius:
          oneOf:
            - type: number
            - type: object
              properties:
                tl: {type: number}
                tr: {type: number}
                br: {type: number}
                bl: {type: number}
      required:
        - shape

    ElementAnimationTiming:
      type: object
      description: "Animated designs only — the element's own timeline window, in seconds."
      properties:
        start_at_s:
          type: number
          nullable: true
        end_at_s:
          type: number
          nullable: true

    DesignPageElement:
      type: object
      description: |
        One element of a `printer_multipage` page, as returned in `elements_per_page`.

        A page is a single format, so the per-format maps are collapsed exactly as they are on
        `GET /designs/{designId}/formats/{formatSpecifier}`: `layout` is that page's box and an
        attribute carries one `value`, not `values` keyed by format name.

        **`attributes` is an object here, keyed by attribute id — every other read returns an
        array.** That is the one difference from `DesignFormatElement`, which this schema
        otherwise matches field for field. It is an inconsistency, not a feature: the two
        single-format reads convert the platform's attribute map into an array and this path does
        not. It is documented rather than corrected because the current shape is live and in use.
        Expect it to be unified with `DesignFormatElement` in a future dated version, announced
        in the changelog — write your attribute lookup so it can tolerate both, e.g. by
        normalising with `Object.values(attributes)` / `list(attributes.values())` when it is not
        already an array.
      properties:
        name:
          type: string
          example: "headline"
          description: Layer name (`root` is the special element carrying the page background color).
        type:
          type: string
          enum: ["container", "text", "button", "image", "logo", "shape", "illustration", "rating", "qrcode", "group"]
          example: "text"
          description: >-
            Layer type. Narrower than the other reads: a page belongs to a print document, so
            `video` and `audio` — which exist only on `animated` designs — never appear here.
            `container` is the design's own root wrapper, not a layer you can author or override — skip it when walking the tree.
            `group` elements are injected only on the advanced view (`i=advanced`).
        settings:
          type: object
          properties:
            is_mandatory:
              type: boolean
              example: false
        attributes:
          type: object
          description: |
            The element's customisable attributes, **keyed by attribute id**. Each value carries
            that attribute's `id`, an optional `help` string, and its single `value` on this page.
          additionalProperties:
            type: object
            x-additionalPropertiesName: attribute-id
            properties:
              id:
                type: string
                example: "payload"
              help:
                type: string
                example: "Text content (i.e. Lorem ipsum)"
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: object
                    additionalProperties: true
                description: >-
                  The attribute's single value on this page. `mask_properties` and
                  `filter_properties` carry an **object** rather than a scalar (e.g.
                  `{"radius": {"tl": 1000, "tr": 1000, "bl": 1000, "br": 1000}}`); their inner
                  keys vary by mask and filter and are not enumerated here.
                example: "Spring Catalogue"
          example:
            payload: { id: payload, help: "Text content", value: "Spring Catalogue" }
            font_size: { id: font_size, help: "Font size in pt", value: 36 }
        layout:
          allOf:
            - $ref: "#/components/schemas/ElementLayout"
          description: The element's box on this page, in the document's unit.
        layer_ids:
          type: array
          description: "`group` layers only — the names of the layers this group contains."
          items:
            type: string
        hidden:
          type: boolean
          description: "`group` layers only — computed visibility on this page."
        locked:
          type: boolean
          description: "`group` layers only — computed lock state on this page."
        group:
          allOf:
            - $ref: "#/components/schemas/GroupLayout"
          description: "`group` layers only — auto-layout settings on this page."
        mask:
          allOf:
            - $ref: "#/components/schemas/GroupMask"
          description: Masked `group` layers only — the mask geometry on this page.
      required:
        - name
        - type

    DesignFormatElement:
      type: object
      description: |
        An element as `GET /designs/{designId}/formats/{formatSpecifier}` returns it — the
        **single-format projection** of `DesignElement`.

        The endpoint answers for one format, so the per-format maps are collapsed: an attribute
        carries a single `value` instead of `values` keyed by format name, and `layout` is that
        format's box instead of a map. This is deliberate, not drift — do not "align" it with
        `DesignElement`. An attribute the requested format does not define is omitted entirely.
      properties:
        name:
          type: string
          example: "headline"
          description: Layer name (`root` is a special element that allows to customize the image background color.)
        type:
          type: string
          enum: ["container", "text", "button", "image", "logo", "shape", "illustration", "rating", "qrcode", "video", "audio", "group", "code"]
          example: "text"
          description: >-
            Layer type. `container` is the design's own root wrapper, not a layer you can author or override — skip it when walking the tree.
            `code`, listed last, is a marginal `animated`-only custom HTML/JS layer, read-only in
            the same way.
        settings:
          type: object
          properties:
            is_mandatory:
              type: boolean
              example: false
              description: Whether the element is mandatory
        attributes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "background_color"
                description: Attribute identifier
              help:
                type: string
                example: "6 or 8 digits hexadecimal background color (i.e. #F3F3F3) of the banner"
                description: Help text for the attribute
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                example: "#FFFFFF"
                description: >-
                  The attribute's value in the requested format. Usually a string; a `video`/`audio`
                  layer's media attributes are typed (`video_duration`/`max_volume` numbers,
                  `video_muted`/`audio_muted` booleans).
        layout:
          allOf:
            - $ref: "#/components/schemas/ElementLayout"
          description: The element's box in the requested format.
        layer_ids:
          type: array
          description: "`group` layers only — the names of the layers this group contains."
          items:
            type: string
        hidden:
          type: boolean
          description: "`group` layers only — computed visibility in this format."
        locked:
          type: boolean
          description: "`group` layers only — computed lock state in this format."
        group:
          allOf:
            - $ref: "#/components/schemas/GroupLayout"
          description: "`group` layers only — auto-layout settings in this format."
        mask:
          allOf:
            - $ref: "#/components/schemas/GroupMask"
          description: Masked `group` layers only — the mask geometry in this format.
        animation:
          allOf:
            - $ref: "#/components/schemas/ElementAnimationTiming"
          description: "`group` layers on animated designs only."
      required:
        - name
        - type

    DesignVariables:
      type: object
      description: |
        Variables used within the text layers of the design. Keys are variable names (without
        braces), values are the placeholder as written in the design (e.g. `"{name}"`).
      additionalProperties:
        type: string
        x-additionalPropertiesName: variable-name
      example:
        name: "{name}"
        title: "{title}"
    Font:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "61568e7c-33c5-11ea-9877-92672c1b8195"
          description: Font unique ID, this parameter can be used to force a specific font on a text or a button element.
        name:
          type: string
          example: "Ubuntu Mono"
          description: The font name
        available_weights:
          type: array
          items:
            oneOf:
              - type: number
                enum: [100, 200, 300, 400, 500, 600, 700, 800, 900]
              - type: string
                enum:
                  - "100-italic"
                  - "200-italic"
                  - "300-italic"
                  - "400-italic"
                  - "500-italic"
                  - "600-italic"
                  - "700-italic"
                  - "800-italic"
                  - "900-italic"
            description: The list of weights supported by this font
        category:
          type: string
          enum: [serif, sans-serif, display, handwriting, monospace]
          example: monospace
          description: >-
            The Google Fonts category of a Google font. Absent on custom fonts, which have none.
        type:
          type: string
          enum: [google, custom]
          description: Either `google` for the Google fonts or `custom` for your uploaded fonts.
      required:
        - id
        - name
        - available_weights
        - type

    CreditBlock:
      type: object
      properties:
        available:
          type: integer
          nullable: true
          example: 120
          description: Credits left this billing period. `null` means unlimited.
        limit:
          type: integer
          nullable: true
          example: 500
          description: The plan's credit limit for this credit type. `null` means unlimited.
        consumed:
          type: integer
          example: 380
          description: Credits used this billing period.
        extra:
          type: integer
          example: 0
          description: Extra/top-up credits beyond the plan limit.
      required:
        - available
        - limit
        - consumed
        - extra

    CreditsBalance:
      type: object
      properties:
        generation_credits:
          allOf:
            - $ref: "#/components/schemas/CreditBlock"
          description: Image/video/PDF/HTML5 render credits.
        ai_credits:
          allOf:
            - $ref: "#/components/schemas/CreditBlock"
          description: AI feature credits — `text_to_image`, background removal, etc.
      required:
        - generation_credits
        - ai_credits
      example:
        generation_credits:
          available: 120
          limit: 500
          consumed: 380
          extra: 0
        ai_credits:
          available: 42
          limit: 100
          consumed: 58
          extra: 0

    RootElement:
      type: object
      properties:
        background_color:
          $ref: '#/components/schemas/backgroundColor'
    SharedElementProperties:
      type: object
      description: >-
        Properties every layer type accepts, whatever its type. Composed into `Element` and
        `AsyncElement` with `allOf` so they survive the per-type `anyOf` — declared as a sibling of
        `anyOf` they would be dropped from every branch.
      properties:
        hidden:
          type: boolean
          description: "`true`, `false`. If true it hides the current element"
        shadow_color:
          type: string
          description: >-
            Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or `cmyk(...)` / `cmyka(...)`; no gradient.
            On a `button` this is the shadow of the **button box**;
            its label has its own, `text_shadow_color`.
        shadow_blur:
          type: number
          minimum: 0
          description: "Blur in pixels"
        shadow_offset_x:
          type: number
          minimum: -200
          maximum: 200
          description: "Horizontal offset in pixels (can be negative)"
        shadow_offset_y:
          type: number
          minimum: -200
          maximum: 200
          description: "Vertical offset in pixels (can be negative)"

    Element:
      # `anyOf`, not `oneOf`: these branches overlap by design. An element payload carries no type
      # field — the layer's type comes from the design — so `{"payload": "Hi"}` matches text,
      # button and qrcode at once, which `oneOf` rejects. Same reason there is no discriminator.
      allOf:
      - $ref: "#/components/schemas/SharedElementProperties"
      - anyOf:
        - $ref: "#/components/schemas/TextElement"
        - $ref: "#/components/schemas/ImageElement"
        - $ref: "#/components/schemas/ButtonElement"
        - $ref: "#/components/schemas/LogoElement"
        - $ref: "#/components/schemas/ShapeElement"
        - $ref: "#/components/schemas/RatingElement"
        - $ref: "#/components/schemas/IllustrationElement"
        - $ref: "#/components/schemas/QRCodeElement"
        - $ref: "#/components/schemas/VideoElement"
        - $ref: "#/components/schemas/AudioElement"

    AsyncElement:
      description: "Same as `Element`, but its image element also exposes AI generation properties (`text_to_image`, inpainting, background removal model, AI expand/outpainting, AI upscale) that are only available for asynchronous generation."
      # `anyOf` for the same reason as `Element` above — overlapping branches, no type field.
      allOf:
      - $ref: "#/components/schemas/SharedElementProperties"
      - anyOf:
        - $ref: "#/components/schemas/TextElement"
        - $ref: "#/components/schemas/AsyncImageElement"
        - $ref: "#/components/schemas/ButtonElement"
        - $ref: "#/components/schemas/LogoElement"
        - $ref: "#/components/schemas/ShapeElement"
        - $ref: "#/components/schemas/RatingElement"
        - $ref: "#/components/schemas/IllustrationElement"
        - $ref: "#/components/schemas/QRCodeElement"
        - $ref: "#/components/schemas/VideoElement"
        - $ref: "#/components/schemas/AudioElement"

    TextElement:
      type: object
      properties:
        payload:
          $ref: '#/components/schemas/payload'
        color:
          $ref: '#/components/schemas/color'
        background_color:
          $ref: '#/components/schemas/backgroundColor'
        background_padding:
          $ref: '#/components/schemas/backgroundPadding'
        font_size:
          $ref: '#/components/schemas/fontSize'
        font:
          $ref: '#/components/schemas/fontId'
        font_weight:
          $ref: '#/components/schemas/fontWeight'
        line_height:
          $ref: '#/components/schemas/lineHeight'
        skew_y:
          $ref: '#/components/schemas/skewY'
        alignment:
          $ref: '#/components/schemas/textAlignment'
        stroke_width:
          $ref: '#/components/schemas/strokeWidth'
        stroke_color:
          $ref: '#/components/schemas/strokeColor'
        text_transform:
          $ref: '#/components/schemas/textTransform'
        auto_resize:
          type: boolean
          description: Automatically adjusts the text size to fit within its container. When true, `min_font_size` must also be defined.
        min_font_size:
          type: number
          minimum: 0
          description: Minimum font size allowed when `auto_resize` is enabled.
        max_lines:
          type: number
          minimum: 1
          description: Maximum number of lines allowed.
        text_harmony:
          type: boolean
          description: Attempts to balance line lengths with a maximum variance of 20% between lines. Adjusts character spacing (±20), then reduces font size (up to -10px) if needed.
        text_truncation:
          type: boolean
          description: If the text does not fit, it is truncated and an ellipsis (...) is appended.
        side_border:
          type: string
          enum: [left, right, top, bottom, none]
          description: Defines the side on which a border is rendered. Use `none` to disable an existing side border.
        side_border_thickness:
          type: number
          minimum: 0
          description: Thickness of the side border in pixels.
        side_border_color:
          type: string
          description: "Color of the side border. Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or, for print, `cmyk(...)` / `cmyka(...)`; no gradient."
        side_border_rounded:
          type: boolean
          description: Whether the border corners are rounded (true) or square (false). Default is false.
        side_border_padding:
          type: number
          minimum: 0
          description: Distance in pixels between the text content and the side border. Default is 0.
        side_border_offset:
          type: number
          description: Moves the border along the perpendicular axis. Positive and negative values shift in opposite directions. Default is 0.
        side_border_spread:
          type: number
          minimum: 0
          description: Extends the length of the border beyond the text bounding box by the specified number of pixels. Default is 0.
    ButtonElement:
      type: object
      properties:
        payload:
          $ref: '#/components/schemas/buttonPayload'
        color:
          $ref: '#/components/schemas/color'
        background_color:
          $ref: '#/components/schemas/backgroundColor'
        background_padding:
          $ref: '#/components/schemas/backgroundPadding'
        font_size:
          $ref: '#/components/schemas/fontSize'
        font:
          $ref: '#/components/schemas/fontId'
        font_weight:
          $ref: '#/components/schemas/fontWeight'
        line_height:
          $ref: '#/components/schemas/lineHeight'
        text_transform:
          $ref: '#/components/schemas/textTransform'
        alignment:
          allOf:
            - $ref: '#/components/schemas/alignment'
          description: >-
            Placement of the **button box** — not of its label. A button keeps the two apart: this
            moves the box, `text_align` moves the label inside it.
        text_align:
          type: string
          enum: [left, center, right]
          description: >-
            Alignment of the **label** inside the button box. Default `center`. A button is the
            one layer type where these are two separate settings — on a `text` layer the alignment
            *is* the position.
        stroke_color:
          $ref: '#/components/schemas/strokeColor'
        stroke_width:
          $ref: '#/components/schemas/strokeWidth'
        min_font_size:
          type: number
          minimum: 0
          description: Minimum font size allowed when `auto_resize` is enabled.
        auto_resize:
          type: boolean
          description: Automatically adjusts the label size to fit the button. When true, `min_font_size` must also be defined.
        text_shadow_color:
          type: string
          description: >-
            **Shadow of the button's label**: hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or
            `cmyk(...)` / `cmyka(...)`; no gradient. A button carries two
            shadows: `shadow_color` and its `shadow_*` siblings drop the **box**, these drop the
            **text inside it**. Both can be set at once.
        text_shadow_blur:
          type: number
          minimum: 0
          description: "Blur of the label's shadow, in pixels"
        text_shadow_offset_x:
          type: number
          minimum: -200
          maximum: 200
          description: "Horizontal offset of the label's shadow, in pixels (can be negative)"
        text_shadow_offset_y:
          type: number
          minimum: -200
          maximum: 200
          description: "Vertical offset of the label's shadow, in pixels (can be negative)"
        icon_url:
          $ref: '#/components/schemas/iconUrl'
        icon_encoded:
          $ref: '#/components/schemas/iconEncoded'
        icon_color:
          $ref: '#/components/schemas/iconColor'
    ImageElement:
      type: object
      properties:
        image_url:
          $ref: '#/components/schemas/imageUrl'
        image_encoded:
          $ref: '#/components/schemas/imageEncoded'
        opacity:
          $ref: '#/components/schemas/opacity'
        stroke_width:
          allOf:
            - $ref: '#/components/schemas/shapeStrokeWidth'
          description: >-
            **Width of the image frame** *Example: 4*. The frame is drawn **outside** the image
            box and follows the mask shape (`mask_name`) when there is one. Transparent pixels
            inside the image are never painted: on a cut-out, the frame surrounds the box, not
            the subject.
        stroke_color:
          allOf:
            - $ref: '#/components/schemas/strokeColor'
          description: >-
            **Color of the image frame.** Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or,
            for print, `cmyk(...)` / `cmyka(...)`; no gradient. Invisible without a
            `stroke_width`.
        fitting_type:
          $ref: '#/components/schemas/fittingType'
        alignment:
          $ref: '#/components/schemas/alignment'
        mask_name:
          $ref: '#/components/schemas/maskName'
        mask_properties:
          $ref: '#/components/schemas/maskProperties'
        filter_name:
          $ref: '#/components/schemas/filterName'
        filter_properties:
          $ref: '#/components/schemas/filterProperties'
        overlay_direction:
          $ref: '#/components/schemas/overlayDirection'
        overlay_color_1:
          $ref: '#/components/schemas/overlayColor1'
        overlay_color_2:
          $ref: '#/components/schemas/overlayColor2'
        remove_bg:
          type: boolean
          deprecated: true
          description: |
            Activates AI background removal when set to true.

            **Deprecated on this endpoint, and not recommended.** It works and existing
            integrations keep working, but removing a background is an extra AI round-trip on
            top of the render, and this endpoint is hard-capped at 10 seconds — a large or slow
            source image can push the whole call past the cap and fail with
            `500 internal_server_error` instead of returning your asset. Use asynchronous
            generation, which has no such bound.
        remove_bg_properties:
          type: object
          deprecated: true
          description: Additional settings for background removal. Deprecated here for the same reason as `remove_bg`.
          properties:
            remove_bg_crop:
              type: boolean
              description: Trims the edges of the image after background removal. Default is false.
        auto_focus:
          type: boolean
          description: Activates AI-powered auto-focus to detect and focus on specified objects or people within the image.
        auto_focus_model:
          type: string
          enum: [generic, people, face]
          description: |
            `auto_focus_properties.model` at the top level — the form these five properties were
            moved to, and the one the renderer is handed. Both are accepted; the nested one wins
            when you send both, being the more specific.

            **`face` is deprecated** — see `auto_focus_properties.model`.
        focus_objects:
          type: array
          items:
            type: string
          description: |
            `auto_focus_properties.focus_objects` at the top level. Generic model only.
        focus_framing:
          type: string
          enum: [face, head, shoulders, full_body]
          description: |
            `auto_focus_properties.focus_framing` at the top level. Specific to the `people` model.
        focus_zoom:
          type: string
          enum: [off, low, medium, max]
          description: |
            `auto_focus_properties.focus_zoom` at the top level. Specific to the `people` model.
        focus_target:
          type: string
          enum: [largest, left, middle, right, all]
          description: |
            `auto_focus_properties.focus_target` at the top level. Specific to the `people` model.
        auto_focus_properties:
          type: object
          description: Additional settings for auto-focus.
          properties:
            model:
              type: string
              enum: [generic, people, face]
              description: |
                Model used for focusing. `generic` for objects, `people` for human subjects.
                Default is `generic`.

                **`face` is deprecated** — use `people` with `focus_framing: "face"`, which
                detects faces with the same model and additionally honours `focus_zoom` and
                `focus_target`. `face` ignores all three. `face` keeps working; no removal date
                is set.
            focus_objects:
              type: array
              items:
                type: string
              description: List of object labels to focus on (generic model only). Uses Open Images Dataset labels.
            focus_framing:
              type: string
              enum: [face, head, shoulders, full_body]
              description: "Specific to `people` model. Defines which part of the subject to frame. Default is `face`, which is why `people` alone replaces the deprecated `face` model."
            focus_zoom:
              type: string
              # `off` MUST stay quoted: bare `off` is a YAML 1.1 boolean, so PyYAML reads it as
              # `False` while js-yaml (YAML 1.2) reads the string. Unquoted, it generated a Python
              # enum member `False_ = False` inside a `type: string` enum.
              enum: ["off", low, medium, max]
              description: "Specific to `people` model. Controls the zoom level applied. Default is `max`."
            focus_target:
              type: string
              enum: [largest, left, middle, right, all]
              description: "Specific to `people` model. When multiple subjects are detected, defines which one to target. Default is `all`."

    AsyncImageElement:
      type: object
      description: Image element properties available for asynchronous generation, including AI image generation, inpainting, background removal model selection, AI expand/outpainting, and AI upscale.
      properties:
        image_url:
          $ref: '#/components/schemas/imageUrl'
        image_encoded:
          $ref: '#/components/schemas/imageEncoded'
        opacity:
          $ref: '#/components/schemas/opacity'
        stroke_width:
          allOf:
            - $ref: '#/components/schemas/shapeStrokeWidth'
          description: >-
            **Width of the image frame** *Example: 4*. The frame is drawn **outside** the image
            box and follows the mask shape (`mask_name`) when there is one. Transparent pixels
            inside the image are never painted: on a cut-out, the frame surrounds the box, not
            the subject.
        stroke_color:
          allOf:
            - $ref: '#/components/schemas/strokeColor'
          description: >-
            **Color of the image frame.** Hex (`#RRGGBB`, `#RRGGBBAA`, `#RGB` or `#RGBA`) or,
            for print, `cmyk(...)` / `cmyka(...)`; no gradient. Invisible without a
            `stroke_width`.
        fitting_type:
          $ref: '#/components/schemas/fittingType'
        alignment:
          $ref: '#/components/schemas/alignment'
        mask_name:
          $ref: '#/components/schemas/maskName'
        mask_properties:
          $ref: '#/components/schemas/maskProperties'
        filter_name:
          $ref: '#/components/schemas/filterName'
        filter_properties:
          $ref: '#/components/schemas/filterProperties'
        overlay_direction:
          $ref: '#/components/schemas/overlayDirection'
        overlay_color_1:
          $ref: '#/components/schemas/overlayColor1'
        overlay_color_2:
          $ref: '#/components/schemas/overlayColor2'
        remove_bg:
          type: boolean
          description: Activates AI background removal when set to true.
        remove_bg_properties:
          type: object
          description: Additional settings for background removal.
          properties:
            remove_bg_crop:
              type: boolean
              description: Trims the edges of the image after background removal. Default is false.
            model:
              type: string
              enum: [bria-rmbg-2-0, birefnet, pixelcut, imageUtils, ideogram, leonardo-remove-bg]
              description: Background removal model to use. Default is `bria-rmbg-2-0`.
        auto_focus:
          type: boolean
          description: Activates AI-powered auto-focus to detect and focus on specified objects or people within the image.
        auto_focus_model:
          type: string
          enum: [generic, people, face]
          description: |
            `auto_focus_properties.model` at the top level — the form these five properties were
            moved to, and the one the renderer is handed. Both are accepted; the nested one wins
            when you send both, being the more specific.

            **`face` is deprecated** — see `auto_focus_properties.model`.
        focus_objects:
          type: array
          items:
            type: string
          description: |
            `auto_focus_properties.focus_objects` at the top level. Generic model only.
        focus_framing:
          type: string
          enum: [face, head, shoulders, full_body]
          description: |
            `auto_focus_properties.focus_framing` at the top level. Specific to the `people` model.
        focus_zoom:
          type: string
          enum: [off, low, medium, max]
          description: |
            `auto_focus_properties.focus_zoom` at the top level. Specific to the `people` model.
        focus_target:
          type: string
          enum: [largest, left, middle, right, all]
          description: |
            `auto_focus_properties.focus_target` at the top level. Specific to the `people` model.
        auto_focus_properties:
          type: object
          description: Additional settings for auto-focus.
          properties:
            model:
              type: string
              enum: [generic, people, face]
              description: |
                Model used for focusing. `generic` for objects, `people` for human subjects.
                Default is `generic`.

                **`face` is deprecated** — use `people` with `focus_framing: "face"`, which
                detects faces with the same model and additionally honours `focus_zoom` and
                `focus_target`. `face` ignores all three. `face` keeps working; no removal date
                is set.
            focus_objects:
              type: array
              items:
                type: string
              description: List of object labels to focus on (generic model only). Uses Open Images Dataset labels.
            focus_framing:
              type: string
              enum: [face, head, shoulders, full_body]
              description: "Specific to `people` model. Defines which part of the subject to frame. Default is `face`, which is why `people` alone replaces the deprecated `face` model."
            focus_zoom:
              type: string
              # `off` MUST stay quoted: bare `off` is a YAML 1.1 boolean, so PyYAML reads it as
              # `False` while js-yaml (YAML 1.2) reads the string. Unquoted, it generated a Python
              # enum member `False_ = False` inside a `type: string` enum.
              enum: ["off", low, medium, max]
              description: "Specific to `people` model. Controls the zoom level applied. Default is `max`."
            focus_target:
              type: string
              enum: [largest, left, middle, right, all]
              description: "Specific to `people` model. When multiple subjects are detected, defines which one to target. Default is `all`."
        text_to_image:
          anyOf:
            - type: boolean
            - type: string
          description: |
            Activates AI image generation (text-to-image) or AI-assisted image editing (inpainting).
            If `image_url` (except default image) or `image_encoded` is provided, this property is ignored.

            `true` uses `text_to_image_properties`. As a shorthand you may instead pass the prompt
            **as a string** — optionally `"prompt,url1[,url2]"` to supply inpainting sources — which
            is expanded into `text_to_image_properties` before validation.
        text_to_image_properties:
          $ref: '#/components/schemas/TextToImageProperties'
        expand:
          type: boolean
          description: |
            Activates AI-powered image expansion (outpainting): extends the image beyond its
            original borders to fill the target area instead of cropping or letterboxing it.
            `true` uses `expand_properties`.
        expand_properties:
          $ref: '#/components/schemas/ExpandProperties'
        upscale:
          type: boolean
          description: |
            Activates AI-powered upscaling: the source image is re-rendered at a higher resolution
            by an AI model, recovering detail instead of interpolating pixels.
            `true` uses `upscale_properties`.
        upscale_properties:
          $ref: '#/components/schemas/UpscaleProperties'

    ExpandProperties:
      type: object
      description: Settings for AI-powered image expansion (outpainting).
      properties:
        model:
          type: string
          enum: [image-outpaint, flux-2-pro-outpaint, bria-expand]
          description: Model used for expansion. Default is `flux-2-pro-outpaint`.

    UpscaleProperties:
      type: object
      description: Settings for AI-powered upscaling.
      properties:
        model:
          type: string
          enum: [seedvr-upscale, topaz-precision, crystal-upscaler, bria-increase-resolution]
          description: |
            Model used for upscaling. Default is `seedvr-upscale`.
            Each model caps its output size and accepts its own `upscale_factor` values:

            | Model | `upscale_factor` | Max output |
            |---|---|---|
            | `seedvr-upscale` | 1, 2, 3, 4 | 64 MP |
            | `topaz-precision` | 1, 2, 3, 4 | 72 MP |
            | `crystal-upscaler` | 1, 2, 3, 4 | 16 MP |
            | `bria-increase-resolution` | 2, 4 | 8192 px |
        upscale_factor:
          type: number
          enum: [1, 2, 3, 4]
          description: |
            Multiplier applied to the source image's width and height. Default is `2`.
            `1` keeps the dimensions and only enhances detail. `bria-increase-resolution` accepts
            `2` and `4` only.

    TextToImageProperties:
      type: object
      description: Settings for AI image generation or inpainting.
      properties:
        prompt:
          type: string
          description: >-
            Description of the image to generate, or of the edit to apply when `inpaint_images` is
            provided. **At least 3 whitespace-separated words** — a shorter prompt is rejected.
          example: "A sleek, modern glass villa situated in the middle of a minimalist lavender field."
        model:
          type: string
          enum: [gemini-3-pro, gemini-2.5-flash, gemini-3.1-flash, kling-image-o3, wan-2.7, gpt-image-1.5, flux-2-pro, qwen-2511, nano-banana, nano-banana-2, nano-banana-pro, seedream-4.5, gpt-image-2, grok-imagine, flux-2-klein-9b, gpt-image-2.5-sunburst, gpt-image-2.5-flare, seedream-5-pro, ideogram-4.5]
          description: |
            Model used for generation. Default is `nano-banana-2`.
            Allowed `ratio` and `quality` values depend on the selected model — see the
            [Text to Image & Inpainting guide](https://developers.abyssale.com/rest-api/generation/element-properties/image#text-to-image-inpainting) for the full table.
        ratio:
          type: string
          description: |
            Aspect ratio or size of the output (e.g. `16:9`, `square_hd`, `1024x1024`).
            Allowed values depend on the selected `model` — see the
            [Text to Image & Inpainting guide](https://developers.abyssale.com/rest-api/generation/element-properties/image#text-to-image-inpainting).
        quality:
          type: string
          description: |
            Output quality/resolution (e.g. `1K`, `high`). Only supported by some models — see the
            [Text to Image & Inpainting guide](https://developers.abyssale.com/rest-api/generation/element-properties/image#text-to-image-inpainting).
            Ignored if the selected model does not support it.
        inpaint_images:
          type: array
          maxItems: 16
          items:
            type: string
            format: uri
          description: |
            URL(s) of the image(s) to edit. When provided, switches generation to inpainting mode
            instead of pure text-to-image. The maximum number of images depends on the selected
            `model`; a request with more is rejected with a validation error.

            | Model | Max images |
            |---|---|
            | `gpt-image-2` | 16 |
            | `gpt-image-2.5-flare` | 16 |
            | `gpt-image-2.5-sunburst` | 16 |
            | `gemini-3-pro` | 14 |
            | `gemini-3.1-flash` | 14 |
            | `nano-banana-2` | 14 |
            | `nano-banana-pro` | 14 |
            | `gpt-image-1.5` | 10 |
            | `flux-2-pro` | 8 |
            | `kling-image-o3` | 7 |
            | `seedream-4.5` | 7 |
            | `seedream-5-pro` | 7 |
            | `qwen-2511` | 6 |
            | `ideogram-4.5` | 5 |
            | `flux-2-klein-9b` | 4 |
            | `wan-2.7` | 4 |
            | `gemini-2.5-flash` | 3 |
            | `grok-imagine` | 3 |
            | `nano-banana` | 3 |
      required:
        - prompt

