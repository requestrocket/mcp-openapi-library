  /designs/import/json:
    get:
      operationId: listDesignImports
      summary: List imports
      description: |
        **Alpha.** This API is in Alpha. The contract may change without notice and imports
        created with it are not guaranteed to remain compatible. It is not covered by
        deprecation policy.

        List this company's JSON template imports, newest first.

        Use this to recover an import whose id you no longer have. Because the flow is
        `POST` → upload → `PUT`, a client that loses the id between those steps leaves behind an
        import it cannot otherwise resume or inspect; listing is how you find it again.

        Rows are summaries. The unbounded `warnings[]` array and the `error` object are served by
        `GET /designs/import/json/{importId}` — a row carries `warning_count` instead, and a
        `links.status` pointing at that endpoint.

        `status` filters on the **effective** status, matching what the item endpoint reports: an
        import whose presigned upload window has closed counts as `FAILED`, not
        `WAITING_FOR_VALIDATION`.

        Lists JSON imports exclusively — imports created through other channels are not returned.

        **No cursor.** Results are capped by `limit`; narrow with `created_after` /
        `created_before` to reach imports beyond the cap.
      tags:
        - Design Import
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [WAITING_FOR_VALIDATION, QUEUED, PROCESSING, DONE, FAILED]
          required: false
          description: Return only imports whose effective status matches.
        - in: query
          name: created_after
          schema:
            type: integer
          required: false
          description: Unix timestamp (seconds). Return imports created at or after this moment.
        - in: query
          name: created_before
          schema:
            type: integer
          required: false
          description: Unix timestamp (seconds). Return imports created at or before this moment.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          required: false
          description: Maximum number of imports to return.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The matching imports, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignImportSummary"
        '400':
          description: |
            A query parameter is invalid — `invalid_query_param` for `limit` / `created_after` /
            `created_before`, `unknown_enum_value` for an unrecognised `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []
    post:
      operationId: createDesignImport
      x-codeSamples:
        - lang: cURL
          source: |
            # 1. Validate first — free of the write budget, creates nothing.
            curl -X POST \
              -H "x-api-key: $ABYSSALE_API_KEY" \
              -H "Content-Type: application/json" \
              -d @design.json \
              "https://api.abyssale.com/designs/import/json?validate_only=true"
            # 204 = the payload is good. Then submit it for real:
            curl -X POST \
              -H "x-api-key: $ABYSSALE_API_KEY" \
              -H "Content-Type: application/json" \
              -d @design.json \
              "https://api.abyssale.com/designs/import/json"
        - lang: Python
          source: |
            import json, os, time, requests

            headers = {"x-api-key": os.environ["ABYSSALE_API_KEY"]}
            payload = json.load(open("design.json"))
            base = "https://api.abyssale.com/designs/import/json"

            # An upload entry identifies its asset by LAYER NAME, not by filename — it carries no
            # path — so keep your own map from layer name to the file on disk. Build it while you
            # build the payload; you cannot recover it from the response.
            files_by_layer = {"hero": "/tmp/hero.jpg", "brand": "/tmp/logo.png"}

            created = requests.post(base, headers=headers, json=payload, timeout=60)
            created.raise_for_status()
            body = created.json()

            # One presigned POST per asset given as a bare filename. When every src is a URL or
            # a data URI this list is empty and the import is already QUEUED — no PUT needed.
            for upload in body["uploads"]:
                # On printer_multipage, layer names are unique per page rather than per design,
                # so key on (page, name) — the entry carries `page` there.
                key = upload["name"]
                with open(files_by_layer[key], "rb") as fh:
                    requests.post(upload["url"], data=upload["fields"], files={"file": fh}, timeout=300)

            if body["uploads"]:
                requests.put(f"{base}/{body['id']}", headers=headers, timeout=30).raise_for_status()

            # A failed import is still HTTP 200 — branch on status, not on the status code.
            while True:
                status = requests.get(f"{base}/{body['id']}", headers=headers, timeout=30).json()
                if status["next_check_after_ms"] is None:
                    break
                time.sleep(status["next_check_after_ms"] / 1000)

            print(status["status"], status.get("result"), status["warnings"])
      summary: Create a design from JSON
      description: |
        **Alpha.** This API is in Alpha. The contract may change without notice and imports
        created with it are not guaranteed to remain compatible. It is not covered by
        deprecation policy.

        Submit a template structure as JSON. Returns an import ID, a `links` block, and a flat
        `uploads[]` array of presigned S3 POSTs — one for every asset given as a bare filename:
        `image`/`logo` `src`, `video`/`audio` `src` on animated designs, and a `qrcode` layer's
        `icon_src`. When every asset is a public URL or a data URI, the import is returned already
        in `QUEUED` with an empty `uploads[]` — no PUT call is needed.

        The payload carries no preview image: design thumbnails are generated by the backend
        after import (every format is rendered and the first visual becomes the thumbnail; the
        import reports `PROCESSING` while previews render).

        **Dry run:** pass `?validate_only=true` to validate the payload without creating an
        import. Runs the full schema and all payload-only structural validators (conflicting
        filename sources, data-URI validity and decoded-size caps, TIFF type constraints,
        video/audio extensions, animated keyframes, qrcode icons). Excluded: `unknown_font`,
        `project_not_found` and `unreachable_src`.
        Returns `204 No Content` on success.

        **Plan entitlement.** A design type your plan does not include is refused here rather
        than at generation time, so a workspace never ends up owning a design it cannot render:

        | `type` | Requires | Available from |
        |---|---|---|
        | `static` | — | any plan |
        | `animated` | MP4 | **Pro** |
        | `printer`, `printer_multipage` | Printable PDF | **Suite** |

        These are the same entitlements that gate *generating* the corresponding assets, so a
        plan that can render an animated design can also import one. See
        [abyssale.com/pricing](https://www.abyssale.com/pricing).

        A workspace without the feature gets `429 feature_not_in_plan`. The check also applies to
        `?validate_only=true`, so a dry run never returns `204` for a design the real call refuses.

      tags:
        - Design Import
      parameters:
        - in: query
          name: validate_only
          required: false
          schema:
            type: boolean
            default: false
          description: When `true`, runs schema and cross-field validation and returns `204 No Content` without creating an import row or generating presigned URLs.
        - in: query
          name: strict
          required: false
          schema:
            type: boolean
            default: false
          description: |
            When `true`, a text layer that cannot fit its box even at `min_font_size` fails the
            import instead of importing with a `text_fit_failed` warning.

            **It never changes this response.** Text fitting is measured while the design is
            built, long after this call has answered, so `strict` cannot produce a `400`. The
            import is accepted exactly as it would be otherwise, and the difference shows up when
            you poll: `status: "FAILED"` with `error.code: "text_fit_failed"` — delivered as
            HTTP `200`, like every other terminal import state. Without `strict` the same
            condition appears as a `warnings[]` entry and the import succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignImportRequest'
            example:
              name: 'Summer sale'
              type: static
              target:
                kind: design
                project_uuid: '9d1f2b7c-5a44-4c3e-9f21-0b8e6d4a1c73'
              formats:
                - name: facebook-post
                  width: 1200
                  height: 1200
                  background_color: '#F3F3F3'
              layers:
                - name: hero
                  type: image
                  layout:
                    x: 0
                    y: 0
                    width: 1200
                    height: 700
                  properties:
                    src: hero.jpg
                    fitting_type: cover
                - name: title
                  type: text
                  layout:
                    x: 80
                    y: 760
                    width: 1040
                    height: 220
                  properties:
                    payload: 'Summer sale — 40% off'
                    color: '#111111'
                    font_size: 72
                    text_align: center
                    vertical_align: middle
      responses:
        '200':
          description: Import created. Upload each entry of `uploads[]`, then call PUT.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignImportCreateResponse'
        '204':
          description: |
            Dry-run validation succeeded (`validate_only=true`). Nothing was created.

            A dry run is counted against its own, more generous rate-limit budget — see the
            `X-RateLimit-*` headers. Converging on a valid payload by looping here is supported.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
        '400':
          description: |
            Structured validation error (schema, cross-field, pre-flight `unknown_font` /
            `unreachable_src`, `project_not_found`, or `unsupported_for_type` — a field or value
            only valid on the other design type, e.g. TIFF sources on `static`, or a gradient
            on a `printer` text colour or format background. A hex color on `printer`, or a cmyk
            token on `static`/`animated`, is **not** an error: it is converted with a
            `color_converted` warning — and `shadow` / `text_shadow` / `pattern_name` /
            `pattern_color` / `overlay` on `printer` are accepted and
            dropped with a `property_dropped_for_type` warning). Every payload
            problem on this endpoint is a 400: `project_not_found` returns 400, not 404. A
            malformed or non-object request body is reported as `invalid_payload` / `wrong_type`
            at path `body`, and an unparseable query-parameter value as `invalid_query_param`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: |
            Three different limits answer here, and the `id` tells them apart:

            - `request_rate_limited` — the per-workspace request rate limit for this route
              (60/minute and 1 200/hour as a write, 120/minute and 2 400/hour with
              `?validate_only=true`). Wait `Retry-After` seconds and retry.
            - `feature_not_in_plan` — your plan does not include the design type you are
              importing: MP4 for `animated`, printable PDF for `printer` and
              `printer_multipage`. Retrying never helps; the plan has to change. Carries no
              `errors[]` array — the payload is fine, so there is no field to point at.
            - `rate_limit_exceeded` — the gateway's global ceiling, or a credit restriction.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: feature_not_in_plan
                message: "Animated designs are not included in your plan, please update your plan."
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /designs/import/json/{importId}:
    get:
      operationId: getDesignImport
      summary: Get import status
      description: |
        **Alpha.** This API is in Alpha. The contract may change without notice and imports
        created with it are not guaranteed to remain compatible. It is not covered by
        deprecation policy.

        Poll the status of a JSON template import. Scoped to the caller's company.

        Returns `next_check_after_ms` (suggested delay before the next poll, `null` on terminal states),
        a stable append-only `warnings[]` array, and a structured `error` object when `status` is `FAILED`.

        **Expired upload windows.** An import that reaches `WAITING_FOR_VALIDATION` and is never
        validated before its presigned upload window closes is reported as terminal:
        `status: "FAILED"`, `next_check_after_ms: null`, no `validate` link, and
        `error: {path: "uploads", code: "missing_assets", ...}`. This is derived at read time from
        the import's creation timestamp — the GET performs no write, so the import keeps its
        original state. A poller should therefore always drive off terminal states rather than
        waiting indefinitely.

        **Stuck imports.** An import that stays in processing too long is also reported as
        terminal, derived the same way (no write). While it is still being built, it becomes
        `status: "FAILED"` with `error: {path: "result", code: "import_failed", ...}` once it has
        been processing for more than 60 minutes since validation. Once the design exists and only
        its previews are rendering, it becomes `status: "DONE"` with its `result` and a
        `preview_generation_failed` warning after 30 minutes. `next_check_after_ms` is therefore
        never non-null forever.
      tags:
        - Design Import
      parameters:
        - in: path
          name: importId
          required: true
          schema:
            type: string
            format: uuid
          description: Import UUID returned by the POST endpoint.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: Import found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignImportStatusResponse'
              examples:
                done:
                  summary: Finished — the design exists
                  value:
                    id: c6cddf2b-d4b2-4eae-be8d-7eacd86ace01
                    name: Spring campaign
                    status: DONE
                    created_at_ts: 1786455103
                    validated_at_ts: 1786455103
                    next_check_after_ms: null
                    links:
                      status: https://api.abyssale.com/designs/import/json/c6cddf2b-d4b2-4eae-be8d-7eacd86ace01
                      dashboard: https://app.abyssale.com/designs/10feccaa-f7d3-491c-af21-de442a844b17
                    warnings: []
                    error: null
                    result:
                      kind: design
                      uuid: 10feccaa-f7d3-491c-af21-de442a844b17
                      project_uuid: 1d1bc138-9554-11f1-be33-f1074f796ebe
                    version: v2026-10-21
                processing:
                  summary: Still working — poll again after next_check_after_ms
                  value:
                    id: c6cddf2b-d4b2-4eae-be8d-7eacd86ace01
                    name: Spring campaign
                    status: PROCESSING
                    created_at_ts: 1786455103
                    validated_at_ts: 1786455103
                    next_check_after_ms: 2000
                    links:
                      status: https://api.abyssale.com/designs/import/json/c6cddf2b-d4b2-4eae-be8d-7eacd86ace01
                    warnings: []
                    error: null
                    result: null
                    version: v2026-10-21
                failed:
                  summary: Terminal failure — the HTTP status is still 200, branch on `status`
                  value:
                    id: c6cddf2b-d4b2-4eae-be8d-7eacd86ace01
                    name: Spring campaign
                    status: FAILED
                    created_at_ts: 1786455103
                    validated_at_ts: 1786455103
                    next_check_after_ms: null
                    links:
                      status: https://api.abyssale.com/designs/import/json/c6cddf2b-d4b2-4eae-be8d-7eacd86ace01
                    warnings: []
                    error:
                      path: layers[3].properties.font_size
                      code: text_fit_failed
                      message: The text does not fit the layer at the requested size.
                    result: null
                    version: v2026-10-21
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Import not found or does not belong to the caller's company. `id: not_found`, with
            one `errors` entry at path `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

    put:
      operationId: validateDesignImport
      summary: Validate an import and queue it
      description: |
        **Alpha.** This API is in Alpha. The contract may change without notice and imports
        created with it are not guaranteed to remain compatible. It is not covered by
        deprecation policy.

        Call this after every entry of `uploads[]` has been POSTed to S3. The edge API performs a
        pre-flight `HEAD` on every expected key. If any are missing, it returns
        `422 missing_assets` with the list of unfulfilled targets.

        On success, the import status transitions to `QUEUED` and backend processing picks it up.
        PUT is idempotent on `QUEUED` rows. PUT on a `PROCESSING`, `DONE`, or `FAILED` row returns
        `409 template_import_already_processed`.
      tags:
        - Design Import
      parameters:
        - in: path
          name: importId
          required: true
          schema:
            type: string
            format: uuid
          description: Import UUID returned by the POST endpoint.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: Import queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignImportValidateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Import not found or does not belong to the caller's company. `id: not_found`, with
            one `errors` entry at path `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Import is past the `QUEUED` state and cannot be re-validated.
            `id: template_import_already_processed`, with one `errors` entry at path `status`; the
            reported status is always one of the five **public** values
            (`WAITING_FOR_VALIDATION`, `QUEUED`, `PROCESSING`, `DONE`, `FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            One or more presigned uploads were never completed (`missing_assets`). Also returned
            when the presigned upload window has expired before validation, in which case the
            import is terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /designs/{designId}/as-import:
    get:
      operationId: getDesignAsImport
      summary: Export a design as an import payload
      description: |
        **Alpha.** The contract may change without notice and imports created with it are not
        guaranteed to remain compatible. Not covered by the deprecation policy.

        Return an existing design — any type, `printer_multipage` included — serialized into the
        exact shape `POST /designs/import/json` accepts. Useful as a worked example for an agent,
        or as a round-trip regression test (`as-import` → `POST` → `as-import` should diff empty).

        `src` values are Abyssale-hosted `https://` URLs, so no asset needs re-uploading. The
        response is validated against the import schema before it is returned: a design holding
        anything the schema cannot express answers `400 not_round_trippable` with structured
        details.

        **Stored state the contract has no field for is dropped and named in `warnings[]`**,
        never folded into a field that means something else — a re-import reproduces the design
        minus what was reported, never different artwork.

        Values outside the import bounds are clipped and warned about rather than failing the
        export. What cannot degrade fails instead: a gradient on a print design anywhere but a shape or
        button `background_color`, a
        `printer_multipage` whose pages disagree on their `unit` (each page's geometry is
        expressed in its own unit, so one ruler cannot describe them), an animated format outside
        the 1920×1200 box, and an export left with no layers.

        **Rate limit:** shares the write budget with `POST /designs/import/json` — 60
        requests/minute and 1 200/hour across both, so a round trip costs two calls and 1 200/hour
        is 600 export–edit–import cycles. See [Rate limits](/rest-api/rate-limits).
      externalDocs:
        description: Export a design — full warning list and per-type behaviour
        url: https://developers.abyssale.com/rest-api/designs/as-import
      tags:
        - Design Import
      parameters:
        - $ref: '#/components/parameters/DesignId'
      responses:
        '200':
          description: |
            Envelope containing the import payload. `payload` is ready to be POSTed to
            `/designs/import/json` (for `target.kind=design` re-imports, add a `target` object —
            the payload never contains one). `warnings[]` describes values that were clipped,
            converted or dropped to stay within the export contract.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignAsImportResponse'
        '400':
          description: |
            Design contains features outside the import schema (`not_round_trippable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Design not found or does not belong to the caller's company. `id: template_not_found` —
            the same code every other design lookup returns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: template_not_found
                message: "Design 9c2f31a0-8810-4c4b-bbf5-44a02e1f1d2f not found"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

components:
  headers:
    # Present on every response from a rate-limited route, not only on a 429. Read them and
    # pace yourself rather than discovering the limit by hitting it.
    XRateLimitLimit:
      description: |
        Requests allowed in the current window for this class of route. When several windows
        apply (a burst window and a sustained one), this describes the one closest to being
        exhausted — the one you will actually hit.
      schema:
        type: integer
      # The Write tier's per-minute budget — the smallest limit any tier carries. The old `10`
      # matched no tier at all; it was the gateway's per-second ceiling, which these headers do
      # not describe.
      example: 60
    XRateLimitRemaining:
      description: Requests still allowed in the window described by `X-RateLimit-Limit`.
      schema:
        type: integer
        minimum: 0
      example: 4
    XRateLimitReset:
      description: Unix timestamp (seconds) at which that window rolls over and the budget resets.
      schema:
        type: integer
      example: 1786000020
    XTotalCount:
      description: >-
        How many items match the filters, across all pages. Sent whether or not a page was cut,
        and still the real total on a page past the end (which comes back as an empty array).
      schema:
        type: integer
        minimum: 0
      example: 340
    RetryAfter:
      description: |
        Seconds to wait before retrying. Sent only on a `429 request_rate_limited`, and never
        `0` — retrying sooner will be refused again.
      schema:
        type: integer
        minimum: 1
      example: 27
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: >-
        1-based page number. Sending `page` or `per_page` turns paging on; without either, the
        listing returns every match, as it always has. Below 1 answers `400 out_of_range`.
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: >-
        Items per page when paging (see `page`). Values above 100 are treated as 100; below 1
        answers `400 out_of_range`.
    DesignId:
      name: designId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: |
        Unique identifier (UUID) of the design. A value that is not a UUID does not match the
        route and answers `404` with `id: endpoint_not_found`.
  responses:
    BadRequest:
      description: Bad Request — the request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_json:
              summary: Malformed request body
              value:
                id: invalid_payload
                message: "Invalid JSON"
            validation_error:
              summary: Field-level validation failure
              value:
                id: invalid_payload
                message: "Invalid parameters: elements.root.background_color: Must be either a hexadecimal color of 3, 4, 6 or 8 digits (i.e. #EAEAEA), a cmyk color (i.e. cmyk(0,10,0,50)) or a linear or radial gradient color of 2 to 8 stops (#RRGGBB, #RGB or cmyk(C,M,Y,K) stops, opacity 0 to 1, offsets and cmyk components between 0 and 100, a radial radius above 0) (i.e. linear-gradient(0% 100% 0% 0%,0% #092423 1,100% #FFFFFF 0.6) or radial-gradient(50% 50% 71%,0% #092423 1,100% #FFFFFF 0.6)) (given: #zzz)"
                errors:
                  - path: "elements.root.background_color"
                    code: invalid_payload
                    message: "Must be either a hexadecimal color of 3, 4, 6 or 8 digits (i.e. #EAEAEA), a cmyk color (i.e. cmyk(0,10,0,50)) or a linear or radial gradient color of 2 to 8 stops (#RRGGBB, #RGB or cmyk(C,M,Y,K) stops, opacity 0 to 1, offsets and cmyk components between 0 and 100, a radial radius above 0) (i.e. linear-gradient(0% 100% 0% 0%,0% #092423 1,100% #FFFFFF 0.6) or radial-gradient(50% 50% 71%,0% #092423 1,100% #FFFFFF 0.6)) (given: #zzz)"
    Unauthorized:
      description: Unauthorized — missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_or_invalid_key:
              summary: Missing or invalid API key
              value:
                message: "Unauthorized: missing or invalid API key."
                id: unauthorized
            plan_no_api_access:
              summary: Subscription plan does not include API access
              value:
                message: "Unauthorized: Your subscription plan does not include API access."
                id: api_access_denied
    NotFound:
      description: Not Found — the requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resource_not_found:
              summary: Design not found — never existed, or deleted
              value:
                message: "Template UUID 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx' not found"
                id: template_not_found
            format_not_found:
              summary: Format name not found on the design
              description: >-
                Returned by the generation endpoints when the design exists but a requested
                `template_format_name(s)` entry does not match any of its formats. This is a
                404 by contract, not a 400 — the format is addressed as a resource.
              value:
                message: "Format name 'Missing formats: facebook-feed' not found"
                id: format_not_found
            endpoint_not_found:
              summary: Endpoint does not exist
              value:
                message: "The endpoint 'GET /unknown/path' does not exist."
                id: endpoint_not_found
    DesignWriteNotFound:
      description: |
        No design that `GET /designs` lists has this id (`template_not_found`): it never existed,
        is already deleted, is in a deleted project, is a workspace template, or belongs to another
        workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            id: template_not_found
            message: "Template UUID '64238d01-d402-474b-8c2d-fbc957e9d290' not found"
    GenerationRateLimited:
      description: |
        Rate limit exceeded (10 req/s) **or** a plan / credit restriction — inspect `message`
        to tell them apart. Both answer `id: rate_limit_exceeded`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limit:
              summary: Request rate limit exceeded
              value:
                id: rate_limit_exceeded
                message: "Too Many Requests"
            not_enough_credits:
              summary: Insufficient generation credits
              value:
                id: rate_limit_exceeded
                message: "Not enough credits, please update your plan."
            format_not_in_plan:
              summary: Output format not included in plan
              value:
                id: rate_limit_exceeded
                message: "GIF is not included in your plan, please update your plan."
    TooManyRequests:
      description: |
        Too Many Requests. Two different limits answer here, and the `id` tells them apart:

        - `request_rate_limited` — the per-workspace request rate limit for this class of
          route. Wait `Retry-After` seconds and retry; `X-RateLimit-Remaining` on every
          response reports how much budget is left, so this is avoidable.
        - `rate_limit_exceeded` — the gateway's global ceiling, or a plan / credit
          restriction. Retrying does not help until the plan or the credit balance changes.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            request_rate_limited:
              summary: Too many requests for this route class
              value:
                id: request_rate_limited
                message: "Too many requests. Retry in 27 seconds."
            rate_limit_exceeded:
              summary: Gateway ceiling or plan restriction
              value:
                id: rate_limit_exceeded
                message: "Too Many Requests"
    InternalServerError:
      description: Internal Server Error — an unexpected error occurred on our side.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unhandled:
              summary: An unhandled failure in this API
              value:
                id: internal_error
                message: An unexpected error occurred.
                errors:
                  - code: internal_error
                    message: An unexpected error occurred.
            downstream:
              summary: A downstream service failed
              value:
                id: internal_server_error
                message: Internal server error
  securitySchemes:
    api_key:
      description: All of your Abyssale requests must contain a `x-api-key header` with your API Key.
      type: apiKey
      name: x-api-key
      in: header
  schemas:
    ErrorResponse:
      type: object
      description: |
        **The error shape for this entire API.** Every failure, on every endpoint, at every
        status, is this object — there is no second envelope to detect and no per-endpoint
        variant. `id` and `message` are always present; `errors` appears only when there is
        field-level detail to give.
      example:
        id: out_of_range
        message: "formats[0].width: Must be greater than or equal to 1 and less than or equal to 5000."
        errors:
          - path: "formats[0].width"
            code: out_of_range
            message: Must be greater than or equal to 1 and less than or equal to 5000.
            expected: { min: 1, max: 5000 }
            received: 99999999
      properties:
        message:
          type: string
          description: |
            Human-readable error message. Prose, not a contract — branch on `id`, never on this.

            It is meant to stand on its own, so when the failure comes down to a SINGLE problem
            the message is that problem's own text prefixed with its `path`
            (`name: Missing data for required field.`) — you do not have to read `errors` to
            learn which field was rejected. When several problems disagree it falls back to a
            generic sentence and `errors` carries the detail.
        id:
          type: string
          description: |
            Machine-readable error code. Branch on this rather than on `message`, which is prose
            and may change. **Present on every error this API returns**, on every endpoint, at
            every status — there is no second error shape to detect.

            When `errors` is present, `id` is the response-level code: the shared code if every
            entry agrees, otherwise `invalid_payload`, meaning "read `errors`".

            Codes are added over time. Treat one you do not recognise as generic and fall back to
            `message`; that keeps a new code from being a breaking change.

            This covers errors the generation pipeline raises downstream and this API relays:
            they carry no code of their own, so one is derived (`format_not_found`,
            `template_not_found`, `invalid_payload`, …) and a refusal that matches none of the
            known cases is reported as `cannot_build_banner` rather than as a bare `message`.

            Every value, as of this release. The list is generated from the API's code registry
            and covered by a test, so it cannot drift — but it is a snapshot, not a closed enum:
            treat an unrecognised code as generic rather than as a parse failure.

            Grouped by **what you should do about it**, because that is the only thing that
            changes your code. The grouping is guidance; the status line is what the response
            actually carries, and a few codes appear twice because they genuinely mean two things.

            **Fix the request, then send it again.** The payload, the parameters or the headers
            were wrong: `invalid_payload`, `invalid_json`, `wrong_type`, `missing_required`,
            `unknown_field`, `unknown_enum_value`, `unknown_format_key`, `out_of_range`,
            `mutually_exclusive`, `conditional_dependency_missing`, `duplicate_format_name`,
            `duplicate_layer_name`, `reserved_format_name`, `unsupported_for_type`,
            `unknown_font`, `unreachable_src`, `invalid_query_param`, `invalid_filetype`,
            `invalid_design_type`, `template_not_static`, `more_than_one_format`,
            `missing_assets`, `not_round_trippable`, `unsupported_media_type`, `not_acceptable`,
            `method_not_allowed`.

            **Fix the identifier.** The request was well-formed, but named something that does
            not exist or does not belong to this workspace: `template_not_found`,
            `format_not_found`, `visual_not_found`, `generation_request_not_found`,
            `duplication_request_not_found`, `workspace_template_not_found`, `project_not_found`,
            `not_related_to_same_template`, `not_related_to_same_format`, `not_found`,
            `endpoint_not_found`.

            **Too late.** The job finished, but its result is no longer kept (7 days):
            `generation_request_gone`, `duplication_request_gone`. Generate again, and store the
            result this time rather than re-polling for it later.

            **Back off, then retry.** These two are the only ones worth a retry loop:
            `request_rate_limited`, `rate_limit_exceeded`.

            **Retrying never helps — something has to change first.** The plan or the credit
            balance: `feature_not_in_plan`, `api_access_denied`. Note that `rate_limit_exceeded`
            lands here too when it means "not enough credits"; the message is what tells the two
            apart, which is why both entries name it.

            **Authenticate.** `unauthorized` for a missing, unknown or revoked key;
            `api_access_denied` when the key is valid but the plan excludes API access. There is
            no 403 in this API.

            **The resource is in the wrong state for this call.** Read it back to find out which:
            `template_import_already_processed`, `project_already_exists`, `template_not_active`,
            `previous_secret_still_active`, `design_in_open_product`.

            **Valid request, unrenderable content.** The engine accepted the call and then
            refused the artwork — most often text that cannot fit its layer:
            `cannot_build_banner`, `image_fetching_error`.

            **Ours, not yours.** Retry once; if it persists, send us the response:
            `internal_error`, `internal_server_error`.
        errors:
          type: array
          minItems: 1
          description: |
            Field-level detail. **Present only when there is some** — its absence means the error
            is not about a particular field, not that detail was withheld. When present it is
            always a non-empty FLAT array of problem objects; it is never an object, never null
            and never empty.

            Object keys are dotted and array indices bracketed (`formats[0].layers`,
            `elements.root.background_color`), so one parser reads every API error.

            This holds for detail produced downstream too: the generation engine reports its own
            field errors in a different shape, and they are translated to this one before the
            response is written.

            Entries may carry keys beyond the three required ones (`expected`, `received`).
            Ignore ones you do not recognise — more may be added.
          items:
            $ref: '#/components/schemas/Problem'
        version:
          $ref: '#/components/schemas/ApiVersion'
      # `id` is required as well as `message`: the API guarantees both on every error, and a
      # contract that says "branch on `id`" while typing it optional just makes every caller
      # write a fallback the API never takes.
      required:
        - id
        - message
    DesignAsImportResponse:
      type: object
      description: |
        Envelope returned by `GET /designs/{designId}/as-import`. `payload` is a complete,
        valid `POST /designs/import/json` body; re-posting it recreates the design.
      required: [payload, warnings, version]
      properties:
        payload:
          $ref: '#/components/schemas/DesignImportRequest'
        warnings:
          type: array
          description: |
            Values that were clipped, converted or dropped so the payload stays valid against the contract
            (e.g. `color_converted`, `property_not_representable`, `print_settings_not_recoverable`).
            An entry with no `code` is informational and carries no stable machine identity —
            branch only on entries that have one.
          items:
            $ref: '#/components/schemas/Warning'
        version:
          allOf:
            - $ref: '#/components/schemas/ApiVersion'
            - description: Contract version of `payload`.

    SigningSecret:
      type: object
      description: |
        The workspace's webhook signing secret and the state of any rotation in progress.
      properties:
        secret:
          type: string
          description: |
            The secret to verify `X-Abyssale-Signature` with. Prefixed `whsec_` so it is
            recognisable if it turns up somewhere it should not.
          example: whsec_2f1a8c4e6b9d0a7c3e5f8b1d4a6c9e2f0b3d5a7c1e4f6b8d0a2c5e7f9b1d3a5c
        created_at_ts:
          type: integer
          description: Unix second the secret was first issued.
          example: 1755561234
        rotated_at_ts:
          type: integer
          nullable: true
          description: |
            Unix second of the most recent rotation, or `null` if the secret has never been rotated.
          example: null
        previous_secret_expires_at_ts:
          type: integer
          nullable: true
          description: |
            When the previous secret stops being honoured — 24 hours after the rotation that
            demoted it. `null` when there is no overlap in progress, either because nothing was
            rotated, because the window has lapsed, or because it was ended with
            `POST /signing-secret/revoke`.

            While this is set, deliveries carry **two** `v1` hashes and a receiver holding either
            secret verifies. The previous secret's value is never returned — only its expiry.
          example: null
      # All four keys are ALWAYS emitted — `signing_secret_response()` builds the whole dict on
      # every one of the three routes. Only the two non-nullable ones are listed as `required`:
      # `datamodel-code-generator` drops `nullable: true` for any field it sees in `required`, so
      # listing `rotated_at_ts` here produced a Python model that rejected the commonest real
      # response (a never-rotated secret, where both timestamps are null). Do not "complete" this
      # list without regenerating the Python SDK and asserting a null-bearing payload validates.
      required:
        - secret
        - created_at_ts

    ApiVersion:
      type: string
      pattern: '^v\d{4}-\d{2}-\d{2}$'
      example: v2026-10-21
      description: |
        The API version that produced this response, named by release date (`vYYYY-MM-DD`).
        Stamped as a top-level field on JSON object bodies, success and error alike, so a client
        can always tell which contract answered. There is no version-selection parameter — a
        single version is maintained at a time.

        Two kinds of body are **not** stamped. Array bodies (the listings) carry no envelope. And
        a body that already has a `version` key of its own is left alone — which in practice means
        `Banner`, whose `version` is the generated file's integer counter. So `GET
        /banners/{bannerId}` and the synchronous generate are the two responses that do not tell
        you which contract answered.

        The value changes when a new version is released. Match the `vYYYY-MM-DD` shape rather than
        pinning today's literal, or your client breaks on the next release.

    DesignImportRequest:
      type: object
      description: |
        Import payload. `static` / `printer` / `animated` designs carry `formats` + top-level
        `layers` (both required). `printer_multipage` designs instead carry a top-level `pages`
        array (and no `formats`/`layers`) — see the `pages` and `type` fields.
      required:
        - name
        - type
      # marshmallow `unknown=RAISE`: any unlisted key is `unknown_field`.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Design name. Any Unicode character in the Basic Multilingual Plane is accepted;
            emoji and every other character at U+10000 or above are `invalid_payload` (the name
            is stored in a column that cannot hold them).
          example: "My YouTube Template"
        type:
          type: string
          enum: [static, printer, animated, printer_multipage]
          description: |
            Design type. `static` = single image; `printer` = single-page print PDF;
            `animated` = animated/video design; `printer_multipage` = multi-page print PDF.
            Printer payloads are authored in physical units — the design declares `unit`
            (`mm` | `in`) **once at the top level**, geometry is floats in that unit, font sizes are pt,
            and colors are stored as cmyk (a solid hex is converted with a
            `color_converted` warning; a gradient is accepted only on a shape or button
            `background_color`, with opaque stops).
            Animated payloads are px-authored like static and require a top-level
            `animation` object; they may use `video`/`audio` layers and per-layer
            `animation` timing/tweens.

            **Muting is spelled differently on each of the three surfaces, and the type changes
            too.** Importing takes `muted` (a boolean, on the `video`/`audio` layer properties);
            reading a design returns it as the attributes `video_muted` / `audio_muted`
            (booleans); overriding it at generation time takes `audio_muted` as a **number** 0–1,
            where `true`/`false` answer `400`. Convert deliberately when moving a value between
            them.
            Multipage payloads (`printer_multipage`) drop `formats`/`layers`, declare the print setup once at the top level (`unit`/`width`/`height` required, `bleed_size`/`safe_size`/`dpi` optional), and carry a
            top-level ordered `pages` array (1–30 pages); each page is a self-contained print
            page (own `background_color` + `layers`, inheriting the document-wide print
            setup) that inherits every per-layer `printer` rule. No shared layers exist — a repeated element is included
            per page.
          example: "static"
        target:
          type: object
          description: |
            Where the import lands. An import creates a **design** — the thing you can generate
            from — so this defaults to `{ "kind": "design" }` and `project_uuid` is required:
            a design lives in a project, and one without a project is not returned by
            `GET /designs`. Omitting `target` entirely therefore fails with `missing_required`
            at `target.project_uuid`.

            Pass `kind: workspace_template` for the other variant: a reusable blueprint in the
            workspace library, which has no project and must be duplicated into one before you
            can generate from it. Only designs are addressable via
            `GET /designs/{uuid}/as-import`.
          required: [kind]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [design, workspace_template]
              description: >-
                Required WHENEVER `target` is present. The `design` default applies only to an
                entirely absent `target`; sending `{"project_uuid": "..."}` with no `kind` is
                `missing_required` at `target.kind`.
            project_uuid:
              type: string
              format: uuid
              description: Required for `kind=design`; forbidden for `kind=workspace_template`.
        formats:
          type: array
          minItems: 1
          maxItems: 20
          description: List of formats (1-20). **Required on `static`/`printer`/`animated`; omit on `printer_multipage` (use `pages` instead).** A count outside 1-20 is rejected with `out_of_range` at `formats`. `background_color` is optional on each format and defaults to white. There is no preview-image field — thumbnails are rendered for you (a `preview_image` key is rejected as `unknown_field`).
          items:
            $ref: '#/components/schemas/DesignImportFormat'
        layers:
          type: array
          minItems: 1
          maxItems: 80
          description: "**Required on `static`/`printer`/`animated`; omit on `printer_multipage` (each page carries its own flat `layers`).** 1-80 layers - an empty array is rejected with `out_of_range` at `layers` (`expected: {min: 1, max: 80}`), since `required` enforces key presence and not non-emptiness. Layers defined once at the top level. Each layer contains `layout` and `properties` keyed by format name. A `\"default\"` key may be used in either dict — it is merged under each per-format entry before validation, so overrides only need to specify the fields that differ."
          items:
            $ref: '#/components/schemas/DesignImportLayer'
        unit:
          type: string
          enum: [mm, in]
          description: |
            **Print designs only (`printer` and `printer_multipage`) — required.** Physical
            authoring unit for **everything** in the document: format/page size, bleed and safe
            sizes, and every layer's geometry in every format. Declared exactly once, because a
            print design has one ruler — it does not change between its formats. Missing →
            `missing_required` at `unit`; present on `static`/`animated` →
            `unsupported_for_type`. A format carrying its own `unit` is rejected with
            `unknown_field`.
          example: "mm"
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: |
            **`printer_multipage` designs only — required.** Page width as a float in `unit`,
            shared by every page. At most 10000 mm / 394 in, and at least 1 px at the document's
            effective render DPI (`out_of_range` at `width`).
          example: 210.0
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: |
            **`printer_multipage` designs only — required.** Page height as a float in `unit`,
            shared by every page. Same bound as `width`, reported at `height`.
          example: 297.0
        bleed_size:
          type: number
          minimum: 0
          description: |
            **`printer_multipage` designs only.** Optional bleed size as a float in `unit`;
            presence enables bleed on every page.
        safe_size:
          type: number
          minimum: 0
          description: |
            **`printer_multipage` designs only.** Optional safe-zone size as a float in `unit`;
            presence enables the safe zone on every page.
        dpi:
          type: integer
          minimum: 10
          maximum: 300
          description: |
            **`printer_multipage` designs only.** Optional global render DPI for the whole
            document. Because the document has a single page size there is exactly one area-based
            ceiling `min(300, floor(72*sqrt(225000000/(w_pt*h_pt))))`; a higher value is rejected
            with `out_of_range` at `dpi` (carrying `expected: {max: <ceiling>}` and `received`).
            Omitted ⇒ the backend computes that same ceiling as the default, identically for every
            page. On `printer` designs `dpi` is a per-format field instead.
          example: 300
        pages:
          type: array
          minItems: 1
          maxItems: 30
          description: |
            **`printer_multipage` designs only** (replaces `formats` + top-level `layers`;
            forbidden on other types). Ordered array of 1–30 self-contained print pages — array
            order is the page order (the backend names them `page_1 … page_N`). A count outside
            1–30 → `out_of_range` at `pages`. All pages share one size, so the print setup
            (`unit`/`width`/`height`/`bleed_size`/`safe_size`/`dpi`) is declared once at the top
            level; a page object carries only `background_color` and a flat `layers` array (one
            format per page).
          items:
            $ref: '#/components/schemas/DesignImportPage'
        animation:
          type: object
          description: |
            Animated designs only — **required** when `type` is `animated`, rejected with
            `unsupported_for_type` on `static`/`printer`. The design's timeline.
          required: [duration]
          properties:
            duration:
              type: number
              minimum: 1
              maximum: 60
              description: Timeline length in seconds (1–60). The authoritative animation duration.
              example: 8.0
            screenshot_at_s:
              type: number
              minimum: 0
              description: |
                The moment (seconds, 0 ≤ value ≤ `duration` — `out_of_range` beyond) at which the
                HTML5 backup screenshot is taken. Defaults to `duration` when omitted.
              example: 8.0

    DesignImportFormat:
      type: object
      required:
        - name
        - width
        - height
      # marshmallow `unknown=RAISE`: any unlisted key is `unknown_field`.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Format name, 1–100 characters, matching `^[a-z0-9][a-z0-9_-]*$` — lowercase
            letters, digits, `-` and `_`, starting with a letter or digit. Anything else
            (spaces, capitals) is `invalid_payload`. Must be unique within `formats`
            (`duplicate_format_name`) and must not be a platform-reserved name
            (`reserved_format_name`).
          example: "youtube-thumbnail"
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: |
            The upper bound depends on the design type, so the schema declares none.
            `static`: width in pixels, integer 1–5000.
            `printer`: a float in the design's `unit` (`mm` | `in`), at most 10000 mm / 394 in
            (the editor's limit) and at least 1 px at the format's effective render DPI (its
            `dpi`, else the area ceiling), else `out_of_range`. Large OOH formats are fine: the
            rendered area is bounded by the DPI ceiling, not by a pixel side cap.
            On `animated`: integer pixels, and the format must additionally fit within a
            1920×1200 bounding box in either orientation (max(width, height) ≤ 1920 and
            min(width, height) ≤ 1200 — `out_of_range` otherwise).
          example: 1280
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: |
            The upper bound depends on the design type, so the schema declares none.
            `static`: height in pixels, integer 1–5000.
            `printer`: a float in the design's `unit` (`mm` | `in`), same bound as `width`
            (10000 mm / 394 in, ≥ 1 px at the effective render DPI), else `out_of_range`.
            On `animated`: integer pixels, and the format must additionally fit within a
            1920×1200 bounding box in either orientation (max(width, height) ≤ 1920 and
            min(width, height) ≤ 1200 — `out_of_range` otherwise).
          example: 720
        background_color:
          type: string
          description: |
            On `static`/`animated`: hex (`#RRGGBB` / `#RRGGBBAA`, or the `#RGB` / `#RGBA`
            shorthand) or a gradient; a cmyk token is converted to hex with a `color_converted`
            warning. On `type: "printer"`: a `cmyk(c,m,y,k)` / `cmyka(c,m,y,k[,a])` token (integers
            0–100, an optional `%` after each) is what gets stored, in the canonical spelling —
            a solid hex value is accepted and converted to cmyk with the same warning, while a
            gradient is rejected with `unsupported_for_type`.

            Optional. Omitted, it defaults to white — `#FFFFFF` on `static`/`animated`,
            `cmyk(0,0,0,0)` on `printer` (so defaulting it never emits `color_converted`).
          example: "#ffffff"
        bleed_size:
          type: number
          minimum: 0
          description: |
            Printer only. Bleed size as a float in the design's `unit`; presence enables bleed
            on the created design. Forbidden on `static` (`unsupported_for_type`).
        safe_size:
          type: number
          minimum: 0
          description: |
            Printer only. Safe-zone size as a float in the design's `unit`; presence enables the
            safe zone on the created design. Forbidden on `static` (`unsupported_for_type`).
        dpi:
          type: integer
          minimum: 10
          maximum: 300
          description: |
            Printer only, optional. Render DPI for this format. Beyond the 10–300 field range, the
            value is capped by an area-based ceiling computed from the format size, so a large
            format rejects a high DPI with `out_of_range`; omitted, the backend computes the
            ceiling itself. Forbidden on `static`/`animated` (`unsupported_for_type`). On
            `printer_multipage` `dpi` is a single document-level value instead — a page carries no
            print settings of its own.
          example: 300

    DesignImportPage:
      type: object
      description: |
        A single page of a `printer_multipage` design (one entry of the top-level `pages` array).

        All pages of a multipage design have the same dimensions, so the print setup (`unit`,
        `width`, `height`, `bleed_size`, `safe_size`, `dpi`) is declared **once at the top level
        of the payload**, never per page. A page
        object accepts **exactly two fields** — `background_color` (optional) and `layers`. Any other key,
        including the six print settings and `name`, is rejected with `unknown_field` at
        `pages[i].<field>`.

        A page is **single-format**, so its layer `layout`/`properties` may be flat or keyed
        under `default` (any other key → `unknown_format_key`). Layers are authored in the
        document-level `unit` and follow every `type: "printer"` layer rule.
      additionalProperties: false
      required:
        - layers
      properties:
        background_color:
          type: string
          default: 'cmyk(0,0,0,0)'
          description: |
            A `cmyk(c,m,y,k)` / `cmyka(c,m,y,k[,a])` token (integers 0-100, an optional `%` after
            each). Optional —
            it defaults to `cmyk(0,0,0,0)` (white). A
            solid hex value is accepted and converted to cmyk with a `color_converted` warning;
            a gradient is rejected with `unsupported_for_type` — same as `type: "printer"`. This
            is the one setting that stays per page, because a cover legitimately differs from an
            inside page.
          example: "cmyk(0,0,0,0)"
        layers:
          type: array
          minItems: 1
          maxItems: 80
          description: |
            This page's layers, authored in the document-level `unit`. A page is single-format, so
            each layer's `layout`/`properties` may be given flat or keyed under `default` — any
            other key is rejected with `unknown_format_key`. Either way the stored structure is
            flat. Same layer shapes and per-layer rules as `type: "printer"`.
            An empty array is rejected with `out_of_range` at `pages[i].layers`
            (`expected: {min: 1, max: 80}`).
          items:
            $ref: '#/components/schemas/DesignImportLayer'

    DesignImportLayer:
      type: object
      required:
        - name
        - type
        - layout
        - properties
      # marshmallow `unknown=RAISE`: any unlisted key is `unknown_field`.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^[a-z0-9_-]+$"
          description: >-
            Layer name, unique within the design (`duplicate_layer_name`). Lowercase letters,
            digits, hyphens and underscores only — the rule the design editor applies when a
            layer is renamed; anything else is `invalid_payload`. On `printer_multipage`
            uniqueness is scoped to the page, so two pages may reuse a name.
          example: "title"
        type:
          type: string
          enum: [image, logo, text, shape, group, button, rating, qrcode, illustration, video, audio]
          description: |
            `video` and `audio` are accepted on `type: "animated"` designs only — on
            static/printer the enum simply doesn't include them (`unknown_enum_value`).
            The order above is the contractual order surfaced in an `unknown_enum_value`
            problem's `expected` list.
        hidden:
          description: |
            Hide the layer. Either a single boolean applying to every format, or an object
            keyed by format name when the layer is hidden in some formats and visible in
            others — the editor allows that, and collapsing it to one boolean would remove
            the layer from a format where it is meant to show.

            A multi-format design MAY still send the flat form: "hidden everywhere" is a
            complete answer, unlike a flat `layout`. A missing format key means `false`; a
            `default` key covers the formats not named.
          default: false
          anyOf:
            - type: boolean
            - type: object
              additionalProperties:
                type: boolean
              example: {"a4-horizontal": false, "medium-rectangle": true}
        locked:
          description: |
            Lock the layer against editing. Same flat-or-format-keyed shape as `hidden`.
          default: false
          anyOf:
            - type: boolean
            - type: object
              additionalProperties:
                type: boolean
        layer_ids:
          type: array
          description: |
            **`group` layers only — required there, rejected anywhere else.** Omitting it on a
            group is `missing_required`; sending it on any other layer type is
            `unsupported_for_type`. Names of the layers this group contains.
            Declared here beside `layout`/`properties` rather than inside the group's property
            object, because a group's membership is one list for the whole design — the same
            children in every format, so per-format membership is unrepresentable by design.
            Each entry must name a layer declared in the same format, otherwise
            `conditional_dependency_missing`.
          items:
            type: string
            minLength: 1
            maxLength: 100
          example: ["headline", "subtitle"]
        layout:
          description: |
            Keyed by format name. Each value is `{ x, y, width, height }`. A `"default"` key is allowed and will be merged under each per-format entry.
            Single-format designs may instead pass the `{ x, y, width, height }` object directly (flat form, no format key). The same applies to `properties`.

            On `static` designs all four values are integer pixels (bounds below). On `printer`
            designs they are floats in the design's `unit` (`mm` | `in`), bounded to ±19999 in
            that unit (width/height positive), as the editor does (`out_of_range` otherwise).

            For a member of a group whose `auto_layout` is on, `x` and `y` are advisory: the
            import computes the member's position from the group's box, `direction`, `gap` and
            `alignment`, and stores that. Only `width` and `height` are taken as sent.
          anyOf:
            - title: Flat (single-format designs only)
              allOf:
                - $ref: "#/components/schemas/DesignImportLayoutBox"
            - title: Keyed by format name
              type: object
              additionalProperties:
                allOf:
                  - $ref: "#/components/schemas/DesignImportLayoutBox"
                x-additionalPropertiesName: format-name
          example:
            youtube-thumbnail:
              x: 57
              y: 67
              width: 715
              height: 383
        properties:
          description: |
            The layer's property set. Either **flat** (`{ "payload": "Hi", ... }`) or **keyed by
            format name** (`{ "youtube-thumbnail": { ... } }`, plus an optional `"default"` key
            merged under every per-format entry). A **single-format design may use either shape**;
            a multi-format design must key, and must cover every format. The two are told apart by
            key name: a top-level key that is a declared property of the layer's type means the
            flat form. `layout` follows exactly the same rule.

            Which property object is valid depends on the layer's `type` **and** on the design
            `type`. The three `anyOf` branches below are the generated, per-design-type unions —
            `DesignImportStaticLayerProperties`,
            `DesignImportPrinterLayerProperties` and
            `DesignImportAnimatedLayerProperties` — each fanning out to one schema per
            layer type. They are generated from the schemas that validate the
            request, so their fields, bounds, enums and defaults are exact. The fourth branch is
            the format-keyed envelope, whose values are those same objects.

            **A generic JSON-Schema validator cannot enforce the pairing, so do not trust a green
            result here.** The branch is selected by the layer's own `type`, and OpenAPI 3.0 has no
            way to tie an `anyOf` to a sibling field. A property set that is legal for *some* layer
            type therefore validates for *every* layer type — `alignment` on a `text` layer passes
            offline validation and then answers `400 unknown_field`, because `alignment` belongs to
            button/image/logo/illustration/group and a text layer takes `text_align` +
            `vertical_align`. Check a payload against the layer type you are actually sending, or
            against the API with `?validate_only=true`.

            **Printer designs (`type: "printer"` / `printer_multipage`):** every `*_color`
            field, `stroke.color` included, is a `cmyk(c,m,y,k)` / `cmyka(c,m,y,k[,a])` token
            (integers 0–100; a `%` after a component, leading zeros, spaces and a 5-component
            `cmyk(...)` are accepted and stored in the canonical `cmyk(0,10,20,30)` /
            `cmyka(0,0,0,0,50)` spelling). A solid hex is accepted and converted, reported as
            `color_converted`; inline markup inside a text `payload` is exempt and stays hex.
            Conversion is approximate — no ICC profile — so author `cmyk(...)` directly when the
            exact print colour matters. **A gradient is rejected** (`unsupported_for_type`) everywhere
            but the `background_color` of a shape or button layer, where its 2 to 8 stops must be
            opaque.
            Geometric values (`stroke.width`, `radius`, `padding`, `gap`, `star_dimension`,
            `star_margin`) are floats in the design's `unit` with **no upper bound**; only the
            format size and the layer `layout` are bounded, in physical units (`out_of_range`). `font_size`/`min_font_size` are floats in pt, 0.48–240.

            `shadow`, `text_shadow`, `pattern_name`, `pattern_color` and `overlay` are
            **accepted and dropped** — validated in full, then removed, one
            `property_dropped_for_type` warning per occurrence naming the layer path and the
            property. `overlay` is one nested object, so it drops as a unit and reports a single
            warning. Because they are still validated, a gradient in
            `pattern_color` is `invalid_payload`. `filter_name` stays allowed.

            **Animated designs (`type: "animated"`):** px/hex like static (a cmyk token is
            converted to hex with a `color_converted` warning). Group `auto_layout`, `direction`,
            `alignment` and `gap` are rejected (`unsupported_for_type`). A `video` `src` is a
            filename or URL ending `.mp4`/`.webm` or a `data:video/mp4`|`data:video/webm` URI;
            an `audio` `src` is `.mp3`/`.wav` or `data:audio/mpeg`|`data:audio/wav`. On both, an
            extension is checked only when present: an extensionless `https://` URL is accepted
            and the worker probes the content type. A media extension in an image/logo `src` is
            rejected (`unsupported_for_type`).

            **Asset fields:** `src` (and the `icon_src` of a qrcode's centre icon or of a button's label icon) accepts a filename — which returns a presigned S3 POST in `uploads[]` — an `https://` URL, or a data URI decoded and uploaded server-side at POST time (≤ 2 MB decoded on every design type). A qrcode's centre icon is `icon_src` and accepts the same three forms as `src`, with a data URI capped at 1 MB decoded rather than 2 MB. There is no `icon` property. The QR error-correction level is chosen for you (Q with an icon, M without) and is not a payload field.

            **Conditional dependencies** the flat schemas cannot express: `mask_name: "rounded_corners"` requires `mask_properties.radius`; `filter_name: "duotone"` requires `filter_properties.name`; each entry of a group's layer-level `layer_ids` must name a layer declared in the same format. Violations are reported as `conditional_dependency_missing`.

            `filter_properties.name` must additionally be one of the named duotone presets — `blue_green`, `blue_orange`, `deep_green_light_green`, `BrightRed_light_yellow`, `brown_pale_green`, `brown_beige`, `deep_blue_green`, `deep_blue_red`, `deep_purple_orange`, `deep_purple_beige`, `deep_purple_pale_green`, `deep_blue_pale_green`. An unlisted name is rejected with `unknown_enum_value`.

            **Groups** carry their per-format geometry like every other layer type, but their MEMBERSHIP is not per-format: `layer_ids` sits on the layer itself and names the same children in every format. A group may also carry the common layer-level `hidden`/`locked` attributes: the platform keeps a group consistent with its members automatically — setting them on import propagates the flag down to the members (per format), and on reads (`GET /designs/{designId}/formats/{formatSpecifier}`, as-import) a group's `hidden`/`locked` are computed from its members (all members locked ⇒ group locked; all hidden ⇒ group hidden).
          anyOf:
            - $ref: '#/components/schemas/DesignImportStaticLayerProperties'
            - $ref: '#/components/schemas/DesignImportPrinterLayerProperties'
            - $ref: '#/components/schemas/DesignImportAnimatedLayerProperties'
            - type: object
              description: |
                Multi-format form: keys are format names (plus the optional `"default"`), values
                are the per-design-type property objects of the three branches above.
              additionalProperties:
                anyOf:
                  - $ref: '#/components/schemas/DesignImportStaticLayerProperties'
                  - $ref: '#/components/schemas/DesignImportPrinterLayerProperties'
                  - $ref: '#/components/schemas/DesignImportAnimatedLayerProperties'
          example:
            default:
              payload: "Hello World"
              color: "#ffffff"
              font_size: 108
            youtube-thumbnail:
              font_size: 80
        animation:
          type: object
          description: |
            Animated designs only (`unsupported_for_type` on static/printer). Per-layer timeline
            timing and tweens — format-global (not keyed by format name). Layers without it span
            the whole timeline.
          properties:
            start_at_s:
              type: number
              minimum: 0
              default: 0
              description: When the layer appears on the timeline (seconds).
            end_at_s:
              type: number
              minimum: 0
              description: |
                When the layer disappears (seconds). Defaults to `animation.duration`; must be
                ≤ the timeline duration and strictly greater than `start_at_s` (`out_of_range`).
            tweens:
              type: array
              description: |
                Animation tweens. `type` is one of `slide` | `fade` | `scale` | `rotate` |
                `audioFade` | `textEffect`; `keyframes` is an array of at least two raw keyframe
                objects — deliberately untyped (several keyframe schema generations coexist);
                the only enforced invariant is that every item carries a numeric `data.time`
                (seconds). Tween ids are assigned by the API and are never part of the payload.
                Each type animates specific keyframe `attr` keys, and a tween whose (dict-era)
                keyframes carry none of them is rejected with `missing_required`: `slide` needs
                **both** `left` and `top`, `fade` needs `opacity`, **`scale` needs `scale`**,
                `rotate` needs `angle`, `audioFade` needs `volumeEffect`, `textEffect` needs
                `typewriting`. `scale` accepts no other spelling — `width`, `height` and
                `animationScale` exist on some older stored designs but animate nothing.
              items:
                type: object
                required: [type, keyframes]
                properties:
                  type:
                    type: string
                    enum: [slide, fade, scale, rotate, audioFade, textEffect]
                  keyframes:
                    type: array
                    minItems: 2
                    items:
                      type: object
                      description: >-
                        One keyframe. Several keyframe generations coexist in stored designs, so
                        extra keys are permitted rather than rejected.
                      properties:
                        attr:
                          type: object
                          additionalProperties: true
                          description: >-
                            The properties this keyframe sets, as a map of property name to value:
                            `{"opacity": 0}` (fade), `{"left": 1021, "top": 347}` (slide — always
                            both), `{"scale": 100}` (scale), `{"angle": -100}` (rotate),
                            `{"volumeEffect": 0}` (audioFade), `{"typewriting": 100,
                            "textEffectType": "classic", "textEffectSplit": "word", "textEffectTiming": "in"}` (textEffect).
                            Values are numbers, except `textEffectType`, `textEffectSplit` and
                            `textEffectTiming` which are names. A non-number in a numeric slot is
                            `invalid_payload` (`true` is not 1), and a number outside its range is
                            `out_of_range`, both at `…keyframes[k].attr.<name>`.

                            **The units are not the same for every attr — check this table rather
                            than assuming.**

                            | attr | Range | Unit |
                            |---|---|---|
                            | `opacity` | `0` … `1` | fraction |
                            | `volumeEffect` | `0` … `1` | fraction |
                            | `scale` | `0` … `100` | percent, `100` = as designed |
                            | `angle` | no bound | signed degrees (`1140` = four clockwise turns) |
                            | `left`, `top` | no bound | signed px |
                            | `typewriting` | `0` or `100` only | see below |

                            **`attr.opacity` is a 0–1 fraction, but a layer's
                            `properties.opacity` is an integer 0–100.** Same word, two scales —
                            `{"opacity": 100}` in a keyframe is `out_of_range`, not "fully
                            opaque". `volumeEffect` is a fraction for the same reason.

                            `typewriting` is not a range at all: it is **0 or 100** and nothing
                            else (`unknown_enum_value`). The effect types the text in whole — a
                            keyframe says "not yet typed" or "fully typed" and the reveal comes
                            from the easing between them — so `50` is not "half typed".

                            On a `textEffect` tween, `textEffectType` (when present) must be one
                            of `classic`, `softFade`, `focusIn`, `riseUp`, `riseDown`,
                            `textEffectSplit` (when present) one of `letter`, `word`, `line` —
                            the unit the effect reveals at a time — and `textEffectTiming` (when
                            present) one of `in`, `out`, `inOut` — when it plays: a start pair
                            typing in, an end pair going back to `typewriting: 0` (the effect in
                            reverse), or both. Anything else is `unknown_enum_value` at the
                            keyframe path. Omit them to get `classic` per `letter`, `in`.

                            Any key not in that table is passed through unvalidated, which is how
                            the older keyframe generations survive.
                          example:
                            left: 1021
                            top: 347
                        data:
                          type: object
                          properties:
                            type:
                              type: string
                              example: start
                            time:
                              type: number
                              example: 0
                              description: >-
                                Absolute seconds on the timeline. Must be a number, and must land
                                inside the LAYER's visible window — `start_at_s … end_at_s`,
                                defaulting to 0 and `animation.duration`. A layer's effects cannot
                                run outside the window in which the layer exists, so a keyframe
                                outside it is never reached and is rejected with `out_of_range`
                                rather than imported as an animation that never plays.
                      additionalProperties: true
                  scale_origin_x:
                    type: string
                    enum: [left, center, right]
                    description: |
                      **`scale` tweens only.** Horizontal anchor the layer grows/shrinks FROM,
                      relative to its own box. Must be given together with `scale_origin_y`
                      (`conditional_dependency_missing` otherwise) — the renderer applies the
                      origin only when both axes are set, so one alone would be ignored. On any
                      other tween type: `unsupported_for_type`. Omit both to scale from the
                      layer's own placement.
                    example: left
                  scale_origin_y:
                    type: string
                    enum: [top, middle, bottom]
                    description: |
                      **`scale` tweens only.** Vertical anchor the layer grows/shrinks FROM. Must
                      be given together with `scale_origin_x` — see that field.
                    example: top
              example:
                - type: fade
                  keyframes:
                    - attr: { opacity: 0 }
                      data: { type: start, time: 0 }
                    - attr: { opacity: 1 }
                      data: { type: end, time: 1.5 }

    DesignImportLayoutBox:
      type: object
      description: One layer box. Integer pixels on `static`/`animated`; floats in the design's `unit` on print.
      required: [x, y, width, height]
      properties:
        x:
          type: number
          minimum: -19999
          maximum: 19999
        y:
          type: number
          minimum: -19999
          maximum: 19999
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 19999
          description: Integer >= 1 (px) on static; float > 0 (unit) on printer.
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 19999
          description: Integer >= 1 (px) on static; float > 0 (unit) on printer.
      additionalProperties: false

    DesignImportLinks:
      type: object
      description: Hypermedia links the client should use instead of constructing URLs by hand.
      properties:
        validate:
          type: string
          format: uri
          description: URL to PUT once all `uploads[]` have been completed.
          example: "https://api.abyssale.com/designs/import/json/64238d01-d402-474b-8c2d-fbc957e9d290"
        status:
          type: string
          format: uri
          description: URL to GET for polling import status.
          example: "https://api.abyssale.com/designs/import/json/64238d01-d402-474b-8c2d-fbc957e9d290"
        dashboard:
          type: string
          format: uri
          description: |
            Human-facing link to the result. **Not always present.**

            A **workspace template** import (`target.kind: "workspace_template"`) carries it
            from creation, pointing at the Workspace Templates section keyed by import id.

            A **design** import (`target.kind: "design"`, the default) has no destination until it succeeds —
            the design does not exist before then — so the link is absent until `status` is
            `DONE`, at which point it points at the design itself.

            `PUT` never returns it: at that moment neither target exists yet.
          example: "https://app.abyssale.com/designs/9c2f31a0-8810-4c4b-bbf5-44a02e1f1d2f"

    DesignImportSummary:
      type: object
      description: |
        One row of `GET /designs/import/json`. A summary: `warnings[]` and `error` are omitted
        because they are unbounded — fetch them from `links.status` when you need them.
      properties:
        id:
          type: string
          format: uuid
          example: "64238d01-d402-474b-8c2d-fbc957e9d290"
          description: Unique identifier of the import.
        name:
          type: string
          example: "Autumn card"
          description: Name the import was created with.
        status:
          type: string
          enum: [WAITING_FOR_VALIDATION, QUEUED, PROCESSING, DONE, FAILED]
          description: |
            Effective status. An import past its presigned upload window reports `FAILED` here even
            though the import still reads `WAITING_FOR_VALIDATION`, matching the item endpoint.
        created_at_ts:
          type: integer
          example: 1649942114
          description: Unix timestamp of creation.
        validated_at_ts:
          type: integer
          nullable: true
          example: 1649942200
          description: Unix timestamp of the PUT that queued the import, or `null` if not yet validated.
        warning_count:
          type: integer
          example: 3
          description: Number of warnings accumulated so far. Read them from `links.status`.
        links:
          $ref: '#/components/schemas/DesignImportLinks'
        result:
          type: object
          nullable: true
          description: What the import produced. Present only once `status` is `DONE`.
          properties:
            kind:
              type: string
              enum: [workspace_template, design]
              description: '`workspace_template` for a workspace template, `design` for a design in a project.'
            uuid:
              type: string
              format: uuid
              description: Identifier of the created template or design.
            project_uuid:
              type: string
              format: uuid
              description: The project the design landed in. Only present when `kind` is `design`.
      required:
        - id
        - name
        - status
        - created_at_ts
        # Emitted unconditionally by `_import_summary`. `validated_at_ts` and `result` are also
        # always present but nullable, and are declared so above.
        - warning_count
        - links

    DesignImportUpload:
      type: object
      description: |
        A single S3 presigned POST. To upload, send a `multipart/form-data` request to `url`
        with every entry of `fields` as a form field, plus the file itself as the final `file` field.
      required: [target, url, fields, max_bytes, expires_at_ts]
      properties:
        target:
          type: string
          enum: [layer]
          description: What the upload is for. Always `layer` (an image/logo/video/audio `src` filename) — JSON imports have no preview uploads — thumbnails are rendered for you.
        name:
          type: string
          description: |
            **The layer's name — not a filename.** An upload entry carries no path and no
            original filename, so keep your own map from layer name to local file while you build
            the payload; it cannot be recovered from this response.
          example: "hero"
        page:
          type: string
          description: |
            **`printer_multipage` imports only** — the page this layer belongs to
            (`page_1 … page_N`). Layer names are unique per *page* on a multipage design, not per
            design, so two pages may each have a `hero`; this is what tells their uploads apart.
            Absent on every other design type.
          example: "page_1"
        url:
          type: string
          format: uri
          example: "https://s3.amazonaws.com/abyssale-template-import"
        fields:
          type: object
          description: S3 presigned POST form fields. Send all of these alongside the file.
          additionalProperties:
            type: string
        max_bytes:
          type: integer
          description: |
            Server-enforced upper bound on the upload size, in bytes. `20000000` for `static`
            layer assets; `500000000` on `printer` and `printer_multipage`; on `animated` it is
            per layer type — `100000000` for `video`, `25000000` for `audio`, `20000000` for
            `image`/`logo`. A `qrcode` layer's `icon_src` is capped at `1000000` on every design
            type.
          example: 20000000
        expires_at_ts:
          type: integer
          description: Unix timestamp when this presigned URL stops accepting uploads.
          example: 1749831334

    DesignImportCreateResponse:
      type: object
      required: [id, status, links, uploads]
      properties:
        id:
          type: string
          format: uuid
          example: "64238d01-d402-474b-8c2d-fbc957e9d290"
        status:
          type: string
          enum: [WAITING_FOR_VALIDATION, QUEUED]
          description: |
            `WAITING_FOR_VALIDATION` if any uploads are required.
            `QUEUED` (sync short-circuit) when every `src` is a public URL or data URI — `uploads[]` is empty and no PUT call is needed.
          example: "WAITING_FOR_VALIDATION"
        links:
          $ref: '#/components/schemas/DesignImportLinks'
        uploads:
          type: array
          description: Flat list of presigned uploads. Empty when no uploads are needed.
          items:
            $ref: '#/components/schemas/DesignImportUpload'
        version:
          $ref: '#/components/schemas/ApiVersion'

    DesignImportValidateResponse:
      type: object
      required: [id, status, next_check_after_ms, links]
      properties:
        id:
          type: string
          format: uuid
          example: "64238d01-d402-474b-8c2d-fbc957e9d290"
        status:
          type: string
          enum: [QUEUED]
          example: "QUEUED"
        next_check_after_ms:
          type: integer
          nullable: true
          example: 2000
        links:
          $ref: '#/components/schemas/DesignImportLinks'
        version:
          $ref: '#/components/schemas/ApiVersion'

    DesignImportStatusResponse:
      type: object
      # Every key is emitted unconditionally; the ones that can be empty are declared nullable.
      required:
        - id
        - name
        - status
        - created_at_ts
        - validated_at_ts
        - next_check_after_ms
        - links
        - warnings
        - error
        - result
      properties:
        id:
          type: string
          format: uuid
          example: "64238d01-d402-474b-8c2d-fbc957e9d290"
        name:
          type: string
          example: "Holiday Campaign"
        status:
          type: string
          enum: [WAITING_FOR_VALIDATION, QUEUED, PROCESSING, DONE, FAILED]
          example: "PROCESSING"
        created_at_ts:
          type: integer
          example: 1234567890
        validated_at_ts:
          type: integer
          nullable: true
          description: Unix timestamp when PUT was called. `null` until validated.
          example: null
        next_check_after_ms:
          type: integer
          nullable: true
          description: Suggested delay before polling again. `null` on terminal states (`DONE`, `FAILED`).
          example: 2000
        links:
          $ref: '#/components/schemas/DesignImportLinks'
        warnings:
          type: array
          description: |
            Stable append-only list of non-fatal backend decisions (font fallback, image scaled
            down, etc.).

            Warning codes: `font_weight_adjusted`, `text_fit_failed` (non-strict),
            `preview_generation_failed`, `property_dropped_for_type` (a property the design type
            cannot render — `shadow`, `text_shadow`, `pattern_name`, `pattern_color`,
            `overlay` on print — was accepted and removed from the imported design; one entry per
            occurrence),
            `print_settings_not_recoverable`, `animation_duration_derived`,
            `color_converted` (a solid color was converted into the design type's color space —
            hex → cmyk on printer, cmyk → hex on static/animated; emitted by the edge at POST time
            and by `as-import`),
            `property_not_representable` (`as-import` only — the design stores a property the
            import schema does not model, so it was omitted from the exported payload).
            `layer_renamed` (`as-import` only — the design stores a layer name the import refuses,
            so the export slugged it, at `layers[i].name`, and every group reference follows).

            `preview_generation_failed` is reported **once per format that has no preview**, at
            `formats[i]` — `i` being the format's position in the payload you imported — or at
            `pages[i]` on `printer_multipage`. It carries a `reason`: `render_failed` (the
            renderer gave up on that format; the `message` quotes its explanation when it is about
            the design, such as text that cannot fit its box, and a retry of the same payload
            will fail the same way) or `preview_not_stored` (the format rendered but its preview
            could not be stored; the payload is fine). The format's `preview_url` on
            `GET /designs/{designId}` answers an error until a preview exists. A bare `formats`
            or `pages` path, with no `reason`, means the previews that failed could not be
            identified.
          items:
            $ref: '#/components/schemas/Warning'
        error:
          # NOT `allOf: [$ref Problem]` with `nullable: true`: in OpenAPI 3.0 the
          # nullability does not reach inside `allOf`, so the `null` this field actually returns
          # failed validation against its own schema. Same shape, declared directly — as `result`
          # below already does.
          type: object
          nullable: true
          description: |
            The failure, when `status` is `FAILED`; `null` otherwise. Same shape as an entry of
            the `errors[]` array — see `Problem`.
          properties:
            path:
              type: string
              description: |
                Where the failure occurred, e.g. `layers[3].properties.font_size`. When the
                failure came from a layer, this is how you identify it — there is no separate
                layer field here, unlike a `Warning`.
            code:
              type: string
              description: Stable, machine-readable code — branch on this, not on `message`.
            message:
              type: string
              description: Human-readable explanation.
        result:
          type: object
          nullable: true
          description: |
            What the import produced. `null` until `status` is `DONE`, then polymorphic on the
            requested `target.kind`: `{ kind: "workspace_template", uuid }` or
            `{ kind: "design", uuid, project_uuid }`.
          properties:
            kind:
              type: string
              enum: [workspace_template, design]
              example: "design"
            uuid:
              type: string
              format: uuid
              description: UUID of the created template or design.
            project_uuid:
              type: string
              format: uuid
              description: Project UUID (present when `kind` is `design`).
        version:
          $ref: '#/components/schemas/ApiVersion'

    Warning:
      type: object
      description: |
        One non-fatal note attached to an otherwise successful response — the `warnings` array on
        `GET /designs/{designId}/as-import` and on the import status endpoint. Only `message` is
        guaranteed: an entry with no `code` is informational and carries no stable machine
        identity, so branch only on entries that have one.

        Same field meanings as `Problem`; split from it because `code` is required there.
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable explanation.
        code:
          type: string
          description: |
            Stable, machine-readable code, when the warning has one. Absent on purely
            informational entries.
          example: color_converted
        path:
          type: string
          description: Where in the payload the warning applies, same syntax as `Problem.path`.
          example: "layers[2].properties.color"
        reason:
          type: string
          enum: [render_failed, preview_not_stored]
          description: |
            Why a `preview_generation_failed` warning was raised; absent on every other code.
            `render_failed`: the format could not be rendered, so the design itself may need
            fixing — `message` says why when it can. `preview_not_stored`: the format rendered
            but its preview could not be stored.
          example: render_failed
        layer:
          type: string
          description: |
            Name of the layer the entry belongs to, when it was raised while transforming a
