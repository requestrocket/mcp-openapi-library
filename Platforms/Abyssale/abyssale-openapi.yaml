            Default `0`. **A number, not a boolean** — `true`/`false` answer `400 invalid_payload`.
            The import spells this `muted` and takes a boolean; a design read returns
            `video_muted` / `audio_muted`, also booleans.
    AudioElement:
      type: object
      description: "Audio layer element. Only available for animated designs with MP4 output."
      properties:
        audio_url:
          type: string
          format: uri
          description: |
            **HTTP(s) URL of the audio file.**

            It must be a publicly accessible link with a filesize of 25 MB maximum.

            Supported files: mp3, wav
        audio_encoded:
          type: string
          description: >-
            **Base64-encoded audio**, as a data URI or raw base64. Ignored when `audio_url` is
