  title: Abyssale API Reference — Image, Video & PDF Generation API
  license:
    name: Proprietary
    url: https://www.abyssale.com/terms-of-service
  x-logo:
    url: 'https://cdn.prod.website-files.com/6214efb2d4b5d94158f2ff03/674734715bd8e93b78fd7042_abyssale_v3_black.svg'
    altText: 'Abyssale logo'
    href: 'https://www.abyssale.com'
    backgroundColor: '#FAFAFA'
  description: |
    ### Abyssale API Reference

    Abyssale is a **programmatic creative asset generation API** for creating marketing visuals,
    ad creatives, videos, and print-ready PDFs at scale. Design once in Abyssale, then generate
    thousands of personalized variations — across every format, channel, and language —
    via a single REST API call.

    This documentation is about the Abyssale `Rest API`. If you would like to discover other Abyssale features or to have a comprehensive understanding on how everything works, go to the [Abyssale developers hub](https://developers.abyssale.com).

    Base URL: `https://api.abyssale.com`

    #### API versioning

    The API is versioned by **release date**: `vYYYY-MM-DD` (e.g. `v2026-10-21`), never
    a counter. Every JSON object payload the API returns — success and error alike — carries a
    top-level **`version`** field naming the version that answered. The
    [changelog](https://developers.abyssale.com/rest-api/changelog) lists every version and what
    changed in it, breaking changes first.

    #### General Rest API information:
    - Data exchange format: **JSON**. All API calls must contain the `Content-Type: application/json` header.
    - Rate limits: **10 requests/second**
    - Usage counts **successful visual creation only** — a call that generates nothing (a read, a
      failed generation, a dry-run validation) does not consume it. Visuals created from the API
      console on a design page count too.
    - Trial plan: **30 generation credits** and **100 AI credits** included — credits, not calls: one request over six formats spends six.
    - Available Integrations: [Zapier](https://zapier.com/apps/abyssale/integrations), [Make (ex Integromat)](https://www.make.com/en/integrations/abyssale), [Airtable](https://airtable.com/marketplace/blkB14c3EShbFLlh4/abyssale) & [n8n](https://n8n.io/integrations/abyssale/) _(if you prefer using nocode)_

    #### Which approach should I use?

    | Use case | Recommended approach |
    |----------|----------------------|
    | **Personalized images in emails** (rendered on open) | Static design → [Dynamic image URL](/api-reference/#dynamic-images) |
    | **Embed a live, customizable image on a website** | Static design → [Dynamic image URL](/api-reference/#dynamic-images) |
    | **Single image on demand** (synchronous response) | [Synchronous generation](/api-reference/generateImage) |
    | **Bulk campaign creatives** across multiple formats | [Async generation](/api-reference/generateMultiFormatMedia) |
    | **Animated GIF or video** for social/ads | Animated design → [Async generation](/api-reference/generateMultiFormatMedia) with `gif` or `video` options |
    | **HTML5 banner ads** for ad networks | Animated design → [Async generation](/api-reference/generateMultiFormatMedia) with `html5` options |
    | **Print-ready PDF** (single page) | Printer design → [Async generation](/api-reference/generateMultiFormatMedia) with `print` options |
    | **Multi-page print document** (brochure, catalog) | Printer multipage design → [Multi-page PDF](/api-reference/generateMultiPagePdf) |

    # Authentication

    Abyssale uses **API Key Authentication**.
    Your API key is passed along with every API call, allowing Abyssale to identify your company account and access your data.
    
    [How to get your API Key?](https://developers.abyssale.com/rest-api/authentication#how-to-get-an-api-key) 

    <SecurityDefinitions />

    #### Common error responses (applicable to all endpoints):
    - `401 Unauthorized` — missing or invalid API key
    - `429 Too Many Requests` — a rate limit was exceeded, or credits are insufficient
    - `500 Internal Server Error` — unexpected server-side failure

    # Rate limits

    Two limits apply to every request, one after the other. Both answer `429`, and the `id` in the
    body tells you which one you hit.

    | # | Limit | Applies to | Budget | `id` |
    |---|---|---|---|---|
    | 1 | Global ceiling | Every endpoint | **10 requests/second** | `rate_limit_exceeded` |
    | 2 | Endpoint budget | Endpoints in a limited tier | see below | `request_rate_limited` |

    **1. The global ceiling** is 10 requests per second across every endpoint, checked first. It
    is a burst guard: sustain that rate and you will exhaust most endpoint budgets within the
    minute anyway, so in practice it is the endpoint budget you meet first.

    **2. Endpoint budgets.** Every endpoint belongs to ONE tier, and the tier sets the budget.
    The table below covers every endpoint in this reference; a handful of internal and deprecated
    routes are limited too, but they are not part of the published contract.
    Each tier is counted **separately**, so writes never eat into your read budget, and each
    budget is enforced over **two windows at once** — per minute and per hour — both of which
    must pass. Generation endpoints are in no tier: nothing below bounds them per minute or per
    hour, only the global ceiling and your plan's credits.

    | Endpoint | Tier | Per minute | Per hour |
    |---|---|---|---|
    | `GET /designs` | Read | 120 | 3 000 |
    | `GET /designs/{designId}` | Read | 120 | 3 000 |
    | `GET /designs/{designId}/formats/{formatSpecifier}` | Read | 120 | 3 000 |
    | `POST /designs/{designId}/dynamic-image-url` | Write | 60 | 1 200 |
    | `GET /designs/{designId}/as-import` | Write | 60 | 1 200 |
    | `GET /designs/import/json` | Read | 120 | 3 000 |
    | `POST /designs/import/json` | Write | 60 | 1 200 |
    | `POST /designs/import/json?validate_only=true` | Validation | 120 | 2 400 |
    | `GET /designs/import/json/{importId}` | Polling | 600 | 18 000 |
    | `PUT /designs/import/json/{importId}` | Write | 60 | 1 200 |
    | `GET /design-duplication-requests/{duplicateRequestId}` | Polling | 600 | 18 000 |
    | `GET /banners/{bannerId}` | Read | 120 | 3 000 |
    | `POST /async/banners/export` | Write | 60 | 1 200 |
    | `GET /fonts` | Read | 120 | 3 000 |
    | `GET /credits` | Read | 120 | 3 000 |
    | `GET /projects` | Read | 120 | 3 000 |
    | `POST /projects` | Write | 60 | 1 200 |
    | `GET /workspace-templates` | Read | 120 | 3 000 |
    | `GET /workspace-template-categories` | Read | 120 | 3 000 |
    | `POST /workspace-templates/{companyTemplateId}/use` | Write | 60 | 1 200 |
    | `GET /generation-request/{generationRequestId}` | Polling | 600 | 18 000 |
    | `POST /auth` | Read | 120 | 3 000 |
    | `GET /signing-secret` | Read | 120 | 3 000 |
    | `POST /signing-secret/rotate` | Write | 60 | 1 200 |
    | `POST /signing-secret/revoke` | Write | 60 | 1 200 |
    | `POST /banner-builder/{designId}/generate` | none | — | — |
    | `POST /async/banner-builder/{designId}/generate` | none | — | — |
    | `POST /async/banner-builder/{designId}/generate-multipage-pdf` | none | — | — |

    **Write is the tightest** because one call is several database writes, two or more storage
    uploads, a queue publish and one outbound fetch per distinct layer `src`. Count round trips,
    not calls: exporting a design and importing it back spends two write calls, so 1 200/hour is
    600 export–edit–import cycles.

    **Validation is looser than write** so that iterating on a payload until it validates never
    costs you an import. It is not free — it still decodes every data URI you send.

    **Polling is the loosest** because those endpoints are meant to be called in a loop. An
    import's status response tells you when to come back (`next_check_after_ms`, 2 seconds while
    processing), which is 30 requests a minute for one job. The budget sits far above any sane
    cadence — honour `next_check_after_ms` and you will not meet it.

    **Generation has no endpoint budget** — which is not the same as unlimited. The global 10
    requests/second ceiling still applies, and your plan's credits gate it on top
    (`id: rate_limit_exceeded` for both; on a credit refusal retrying never helps, the plan or the
    balance has to change). Polling the resulting job IS budgeted, in the polling tier.

    Every response from a limited route carries `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
    `X-RateLimit-Reset` for whichever window you are closest to exhausting, and a `429` adds
    `Retry-After`. Two exceptions, both because the limiter never ran: a `401` (authentication
    fails first, so there is no workspace to charge) and the rare case where the limiter's backing
    store is unreachable and it lets the request through. **Read those headers and pace your calls** — this is a limit you can see
    coming, which matters most for automated clients and AI agents retrying a rejected payload.
    One thing worth knowing before you build a retry loop: a refused request **still counts**, so
    retrying into a `429` spends your hourly budget.

    # Deprecation

    Some fields in this reference are marked **deprecated**. That mark is a commitment and a
    warning, in that order:

    - **It keeps working.** A deprecated field is still populated and still behaves as
      documented. Nothing is removed from under a running integration.
    - **It will be removed eventually.** There is no date, and we do not commit to one. "Not yet"
      is the only guarantee, so treat a deprecation as work to schedule rather than work to
      ignore.
    - **Each one names its replacement.** Read the field's description: it says what to use
      instead, and whether the two are equal today (`template_id` duplicates `id`;
      `category_id` / `category_name` duplicate the project fields on a design).

    Deprecation is announced in **three** places, and only these count: the `deprecated` flag in
    this reference, the field's own description, and a dated entry in the
    [changelog](https://developers.abyssale.com/rest-api/changelog).

    **A route that disappears from this reference is deprecated too.** Omission is how a route is
    retired here: it keeps answering for existing callers, but it is no longer part of the
    published contract and should not be adopted. If you are calling something you cannot find
    documented, treat that as a signal, not as an oversight.

    Two things this does **not** cover. Anything marked **Alpha** — today, the whole Design
    Import section — may change or vanish without notice and without a changelog entry; that is
    what the label means. And a **new** field appearing in a response is not a breaking change,
    so parse permissively and ignore what you do not recognise.

    # Webhooks

    Asynchronous work — batch generation, exports — finishes on our side, not in your request.
    You learn about it in one of two ways: **poll** the job's status endpoint, or receive a
    **webhook**. The payloads are documented at the bottom of this reference; what follows is the
    delivery contract they all share.

    | Property | Detail |
    |---|---|
    | Method | `POST` over HTTPS |
    | Content type | `application/json` |
    | Acknowledgement | Return **`200`** or **`201`** within **15 seconds** |
    | Retries | The first attempt, then up to **5 retries** — about **3 hours** in total |
    | Backoff | 15 s, 3 min, 10 min, 30 min, 2 h |
    | Identifying header | `X-Referer: api.abyssale.com` |
    | Signature | `X-Abyssale-Signature` — HMAC-SHA256, see below |
    | Delivery id | `X-Abyssale-Delivery-Id` — 64 lowercase hex characters, stable across retries |
    | Static IPs | Available for allow-listing — contact support |

    Anything other than `200`/`201` is treated as a failure and retried; 15 seconds is a hard
    timeout, so acknowledge first and do your work afterwards. **Answer `410 Gone` to stop the
    retries permanently** — that is how a receiver says the endpoint is retired. Four responses
    are terminal: `410`, and a `400` whose body is exactly `Queue is full.`,
    `There is no scenario listening for this webhook.` or `Organization is in read-only mode.`
    Every other failure keeps its place in the backoff schedule.

    One delivery differs: **`NEW_EXPORT` sent to an export's own `callback_url`** is retried the same
    6 times over about 3 hours, but its first gap is **60 seconds** rather than 15 — the ladder is
    60 s, 3 min, 10 min, 30 min, 2 h. It has no subscription behind it, so nothing can be
    deactivated; a delivery that exhausts its retries is simply dropped. Dashboard subscriptions and
    a `callback_url` on a *generation* request both use the 15 s ladder above.

    Three failures also retire the subscription once the retries run out: a `404`, a **timeout**, or
    a **connection error** still failing on the sixth and final attempt deactivates it just as a
    `410` would, so a receiver unreachable for the full ~3 hours is retired silently. A persistent
    `5xx` behaves differently — the delivery is dropped but the subscription survives, so failing
    with a `503` during maintenance is safer than letting connections time out.

    **Every payload carries a top-level `event_type`** (`NEW_BANNER`, `NEW_BANNER_BATCH`,
    `NEW_EXPORT`, …). Dispatch on that field rather than inferring the event from the payload's
    shape, so a new event type never lands in the wrong branch of your handler.

    **Two ways to subscribe, and they are not interchangeable.** A `callback_url` in a request
    body is per-job: it fires once, for that job only. A webhook configured in the Abyssale
    dashboard is per-workspace: it fires for every matching event, including work started outside
    the API. `NEW_BANNER` has no `callback_url` of its own — it comes from a dashboard webhook.

    **Design your receiver to be idempotent and to tolerate re-delivery.** A retry sends the same
    payload again, and a webhook is not ordered with respect to your own polling: you may see the
    job finish through the status endpoint first. Treat the payload as a notification that
    something is ready, keyed on its id, not as a one-shot event you must not miss.

    **`X-Abyssale-Delivery-Id` is the key to deduplicate on.** Every delivery carries it — signed
    or not, since it is independent of signing — as **64 lowercase hex characters**. It is derived
    from the event and its destination, not from the attempt, so all six attempts of the same
    delivery carry the same value while the signature's `t` changes on each one. Record it and
    ignore a value you have already processed.

    The id identifies a *delivery*, not an event: one event fanned out to several subscribed URLs
    produces a **different** id per subscription. It is therefore unique within one receiver, which
    is all deduplication needs, but two of your endpoints receiving the same event cannot correlate
    on it — use the payload's own ids (`generation_request_id`, `export_id`, …) for that.

    # Verifying a webhook

    Signing is **opt-in, and the secret coming into existence is what turns it on**: a workspace that
    has never called a `/signing-secret` endpoint keeps receiving unsigned deliveries. `GET` is the
    normal way to create it, but `rotate` and `revoke` mint one too if none exists, so either of
    those also switches signing on. Once the secret exists, every delivery is signed, so you can
    prove it came from us and that nobody altered it in transit. Do
    not treat `X-Referer` as authentication — it is an unverifiable header anyone can set. The
    signature is the real thing.

    ## Get your signing secret

    `GET /signing-secret` returns the workspace's secret. Fetch it once, store it like any other
    credential, and reuse it: **one secret covers every webhook in the workspace**, whether the
    event was subscribed in the dashboard or requested with a `callback_url`. There is nothing to
    choose per endpoint.

    ```json
    {
      "secret": "whsec_…",
      "created_at_ts": 1755561234,
      "rotated_at_ts": null,
      "previous_secret_expires_at_ts": null
    }
    ```

    **This is not your API key, and the two are not interchangeable.** Your API key authorises
    calls *to* us and can spend credits; the signing secret only proves a delivery came *from* us.
    Never use one in place of the other.

    ## The header

    ```
    X-Abyssale-Signature: t=1755561234,v1=5f2c…
    ```

    `t` is the Unix second we signed at. Each `v1` is
    `HMAC-SHA256(secret, "v1:webhook:" + t + "." + raw_body)`, hex-encoded. To verify: rebuild that
    string, hash it with your secret, and compare against any `v1` present.

    ```python
    import hmac, hashlib, time

    def verify(raw_body: bytes, header: str, secret: str, tolerance: int = 300) -> bool:
        parts = [p.split("=", 1) for p in header.split(",") if "=" in p]
        t = next((v for k, v in parts if k == "t"), None)
        if t is None or not t.isdigit() or abs(time.time() - int(t)) > tolerance:
            return False
        signed = f"v1:webhook:{t}.".encode() + raw_body
        expected = hmac.new(secret.encode(), signed, hashlib.sha256).hexdigest()
        # `isascii()` first: compare_digest raises on a non-ASCII str, and the header is untrusted.
        return any(v.isascii() and hmac.compare_digest(expected, v) for k, v in parts if k == "v1")
    ```

    ```javascript
    const crypto = require("crypto");

    function verify(rawBody, header, secret, tolerance = 300) {
      const parts = header.split(",").map((p) => p.split("="));
      const t = (parts.find(([k]) => k === "t") || [])[1];
      if (!t || !/^\d+$/.test(t)) return false;
      if (Math.abs(Date.now() / 1000 - Number(t)) > tolerance) return false;
      const expected = crypto.createHmac("sha256", secret)
        .update(`v1:webhook:${t}.`).update(rawBody).digest("hex");
      return parts.some(([k, v]) =>
        k === "v1" && v.length === expected.length &&
        crypto.timingSafeEqual(Buffer.from(v), Buffer.from(expected)));
    }
    ```

    ## Five things that will silently break your verification

    1. **Hash the raw body, never re-serialized JSON.** Parsing and re-encoding reorders keys and
       changes spacing, and the signature stops matching. Use `request.get_data()` in Flask,
       `express.raw({ type: "application/json" })` in Express, and keep the bytes as received.
    2. **There can be more than one `v1`.** During a rotation we sign with both the new and the old
       secret and send both hashes. Parsing the header into a dictionary keeps only one of them, so
       your handler works for months and then fails the first time you rotate. Check every `v1`.
    3. **`t` changes on every retry; `X-Abyssale-Delivery-Id` does not.** Deduplicate on the
       delivery id. Use `t` only to reject stale deliveries, with a tolerance of a few minutes.
    4. **Compare in constant time** (`hmac.compare_digest`, `crypto.timingSafeEqual`) rather than
       with `==`.
    5. **Reject a malformed header, never raise on one.** Anyone who can reach your webhook URL can
       send whatever they like in `X-Abyssale-Signature`, so every path through your verifier has to
       return false rather than throw — a forged header that produces a 500 is an availability
       problem, and we will then retry it. The constant-time helpers are themselves a
       trap here: `hmac.compare_digest` raises on a string containing a non-ASCII character, and
       `crypto.timingSafeEqual` throws when the two buffers differ in length. Guard both before
       comparing, as the snippets above do.

    ## Rotating

    `POST /signing-secret/rotate` issues a new secret and keeps the previous one valid for **24
    hours**. During that window every delivery carries two `v1` hashes, one per secret, so you can
    deploy the new value whenever you like without dropping a delivery. Keep accepting the old
    secret for a few minutes after you switch — retries already in flight were signed earlier.

    Rotating **twice** inside that window is refused with `409 previous_secret_still_active`,
    because the second rotate would drop the secret your receiver is still using. Wait for the
    window, `revoke` first, or pass `?force=true` to override.

    ## If your secret leaks

    Rotate, deploy the new secret, and **stop accepting the old one**. That takes effect the moment
    you deploy: you are the verifier, so nothing needs to happen on our side for a forged request to
    start failing. `POST /signing-secret/revoke` additionally drops the previous secret on our side,
    ending the overlap early — signing picks that up within **60 seconds**, so do not wait on it.

    ## What a valid signature does and does not tell you

    It proves the delivery came from us and was not modified. It does **not** make the payload
    authoritative about the current state of anything — a retry can arrive hours after the event,
    with the body rebuilt at send time. Keep treating a webhook as "something is ready, go look",
    and read the API when the details matter. Keep the secret server-side; a signature you compute
    in a browser is a secret you have published.

externalDocs:
  description: Abyssale developer hub — guides, tutorials and webhook reference
  url: https://developers.abyssale.com/

servers:
  - url: https://api.abyssale.com
    description: Main Production Server
tags:
  - name: Authentication
    externalDocs:
      description: Getting an API key and authenticating requests
      url: https://developers.abyssale.com/rest-api/authentication
    description: |
      Every request is authenticated with an `x-api-key` header carrying a key generated from
      your Workspace settings.

      Use `POST /auth` to confirm a key works and to find out which workspace it belongs to.
      Any problem with the key answers **`401`** — unknown, revoked, or on a plan that does not
      include API access. The `id` in the body distinguishes them: `api_access_denied` is the
      plan case, `unauthorized` covers the rest.

      **Use a workspace key, not a user key.** A user-scoped key exists to confine a credential
      to the design plugins: it reaches only `POST /auth`, `GET /fonts` and the plugin endpoints,
      and **every other operation in this reference answers `401`**, whatever the plan. It is not
      plan-checked either — so it answers `200` on `/auth` even where a workspace key on the same
      plan would answer `401 api_access_denied`. If a key passes `/auth` but 401s everywhere
      else, that is why: it is a user key, and it was never meant to drive the API.

  - name: Designs
    externalDocs:
      description: Working with designs — listing, details and formats
      url: https://developers.abyssale.com/rest-api/designs/
    description: |
      A design is a layout including at least:
      - one format (dimension, i.e. Facebook feed 1200x628 or IAB 300x250)
      - one element (text, button, image, shape...)

      All elements have their own properties that can be customized (color, text payload, image...).

      Once designed, all properties of the design will act as a reference for subsequent image generation. Obviously, those properties can be overridden by sending new parameters in the generation API call.

      Abyssale provides a list of free template designs in the Template Library page. Feel free to use one to start designing your design instead of doing it from scratch.

      **All of your designs are listed in the different project pages, only those are accessible via API.**

  - name: Asset Generation
    externalDocs:
      description: Generation guides — synchronous, asynchronous and every output type
      url: https://developers.abyssale.com/rest-api/generation/
    description: |
      Generate images, animated videos, GIFs, HTML5 banners, and print-ready PDFs
      programmatically from your Abyssale designs.

      The generation workflow is simple:
      1. Build your design in Abyssale (or pick one from the Template Library)
      2. Send your dynamic data — text, images, colors — via the API
      3. Receive the generated asset URL in the response

      Use the **synchronous** endpoint for single-image generation with an immediate response.
      Use the **asynchronous** endpoint for bulk banner creation across multiple formats at once —
      ideal for marketing automation, personalized ad campaigns, and batch asset production at scale.

  - name: Webhooks
    description: |
      Manage the secret used to verify that a webhook delivery came from us.

      One secret per workspace, covering **every** webhook: both those configured in the dashboard
      and those requested per job with a `callback_url`. Fetch it once and store it alongside your
      other credentials — there is nothing to configure per endpoint.

      It is **not** your API key and cannot be substituted for one. The API key authorises calls to
      us and can spend credits; this secret only proves a delivery came from us, which is why it is
      safe to hold in a receiver that has no other access to your account.

      The header format, the verification snippets and the rotation rules are documented in the
      **Webhooks** section of this reference's introduction.

  - name: Fonts
    externalDocs:
      description: Using workspace and Google fonts in a generation
      url: https://developers.abyssale.com/rest-api/fonts
    description: |
      Retrieve the fonts available in your Abyssale workspace. Fonts can be applied
      to text and button elements during image generation. Two types are supported:
      Google Fonts (free, always available) and custom fonts uploaded to your workspace.

      Reference a font by its ID when overriding the `font` property in a generation request.

  - name: Credits
    description: |
      Check how many generation and AI credits your workspace has left in the current billing
      period. Generation credits are spent by image/video/PDF/HTML5 rendering; AI credits are
      spent separately by AI features (e.g. `text_to_image`, background removal).

      `limit` and `available` are `null` for an unlimited plan; `consumed` and `extra` are always
      a number.

  - name: Exports
    externalDocs:
      description: Packaging generated assets into an archive
      url: https://developers.abyssale.com/rest-api/asset-export
    description: |
      Export a collection of previously generated banners as a single ZIP archive.
      Useful for downloading bulk assets for offline use, sharing with creative teams,
      or archiving a campaign's outputs. The export is processed asynchronously —
      provide a callback URL to receive a webhook notification when the archive is ready.

  - name: Files
    externalDocs:
      description: Retrieving a generated file
      url: https://developers.abyssale.com/rest-api/generation/
    description: |
      Retrieve metadata and download URLs for generated files (images, videos, GIFs,
      HTML5 banners, and PDFs). Listen to webhook events to be notified in real time
      when a file or batch generation completes.

  - name: Projects
    externalDocs:
      description: Organising designs into projects
      url: https://developers.abyssale.com/rest-api/projects
    description: |
      Projects let you organize your designs into logical groups — for example by
      campaign, client, or content type. All designs must belong to a project to
      be accessible via the API. Use projects to scope design retrieval and keep
      large design libraries manageable.

  - name: Workspace Templates
    externalDocs:
      description: Workspace templates and how they differ from designs
      url: https://developers.abyssale.com/rest-api/workspace-templates
    description: |
      Workspace templates are master designs shared across your organization. Duplicate
      them into any project to create editable copies — useful for spinning up campaign
      variants, onboarding new clients, or maintaining brand-consistent starting points.
      The duplication is processed asynchronously; poll the status endpoint to track progress.

  - name: Design Import
    externalDocs:
      description: Design import guides — payload reference, per-type rules and worked examples
      url: https://developers.abyssale.com/rest-api/designs/import/
    description: |
      > **Alpha.** This API is in Alpha. The contract may change without notice and imports created
      > with it are not guaranteed to remain compatible. It is not covered by the deprecation
      > policy. This applies to every operation in this section.

      Create a design from a JSON structure — `static`, `animated`, `printer` or
      `printer_multipage`. The import produces a **design** in a project by default; pass
      `target.kind: "workspace_template"` for a reusable workspace blueprint instead.

      1. **POST** `/designs/import/json` — submit the structure. Returns an import id and a flat
         `uploads[]` array of presigned S3 POSTs, one per image/logo layer whose `src` is a
         filename.
      2. **Upload assets** — POST each file to its presigned URL with the returned `fields`.
      3. **PUT** `/designs/import/json/{importId}` — validate and queue the import.

      **No upload needed** when every `src` is a public URL or data URI: the POST returns the
      import already `QUEUED` with an empty `uploads[]`, and there is no step 2 or 3.

      **Dry run:** `POST …?validate_only=true` runs schema and payload cross-field validation
      without creating anything — `204` on success, the error contract on failure. Three checks
      need I/O and are skipped, so a `204` does not guarantee the real POST succeeds:
      `unknown_font`, `project_not_found` and `unreachable_src`.

      Poll **GET** `/designs/import/json/{importId}` for status. It carries `next_check_after_ms`
      (stop polling when it is `null`), structured `warnings[]`, and a structured `error` when
      `status` is `FAILED`. A failed import is still HTTP `200` — branch on `status`, not on the
      status code. Thumbnails are rendered for you; the payload has no preview image field
      (`preview_image` is `unknown_field`).

      **Errors** use the same envelope as the rest of the API — a top-level `id` and `message`,
      plus an `errors` array locating each problem. A rejected payload usually fails in several
      places at once, which is what `errors` is for; `id` is the shared `code` when every entry
      agrees and `invalid_payload` when they differ:
      ```json
      {
        "id": "out_of_range",
        "message": "font_size must be between 2 and 1000",
        "errors": [
          { "path": "layers[2].properties.font_size", "code": "out_of_range",
            "message": "font_size must be between 2 and 1000",
            "expected": { "min": 2, "max": 1000 }, "received": 1500 }
        ]
      }
      ```

      **Round trip:** `GET /designs/{designId}/as-import` returns any existing design — every
      type, multipage included — in the exact shape this endpoint accepts.

      **Per design type** — full rules in the guides linked above:

      | Type | Authored in | Colors | Key limits |
      |---|---|---|---|
      | `static` | px, integer | hex | format 1–5000 px |
      | `animated` | px, integer | hex | required `animation.duration` 1–60 s; format within a 1920×1200 box in either orientation |
      | `printer` | one top-level `unit` (`mm`\|`in`), float geometry, `font_size` in pt 0.48–240 | `cmyk()`/`cmyka()`; a solid hex is converted with a `color_converted` warning; a gradient only on a shape or button `background_color` | layer assets 500 MB presigned |
      | `printer_multipage` | as `printer`, print setup declared once at the top level | as `printer` | `pages` 1–30, each 1–80 layers |

      Data URIs are capped at 2 MB decoded on every type. Presigned layer assets: 20 MB static,
      100 MB video / 25 MB audio / 20 MB image on animated, 500 MB on print.

  - name: Dynamic Images
    externalDocs:
      description: Dynamic image URLs — customise an image from its query string
      url: https://developers.abyssale.com/dynamic-images/overview-dynamic-images
    description: |
      Dynamic images are live image URLs that render on-the-fly based on query parameters.
      Once created for a design, the URL can be embedded anywhere — emails, websites,
      social posts — and customized with different text, colors, or images per use case,
      without additional API calls. Ideal for personalization at scale.

      The one endpoint below mints the URL. **Everything after that is the URL itself**, which is
      served from `img.abyssale.com` and is not part of this API — so its grammar is documented
      here rather than under an operation.

      ```
      https://img.abyssale.com/{dynamicImageId}[/{formatNameOrUid}]?{overrides}
      ```

      `{dynamicImageId}` is the `id` from the creation response — **not** the design id. The
      `dynamic_image_url` that response returns already includes the format segment, so you can
      append a query string to it directly. Omit the format segment and the design's first format
      is rendered; give a format **name** or its **`uid`** (prefer `uid` — it survives a rename).
      An unknown format answers `404`.

      **The URL is public.** No API key, no signature: anyone holding it can render variants.
      That is the point — it goes in an email — but it means the design, not the URL, is the
      trust boundary. `enable_rate_limit` on the creating call caps each visitor at 5
      GENERATIONS per 24 h — the visitor is hashed from IP + `User-Agent`, and only requests that
      actually render count, so anything answered from cache is served without touching the
      budget.

      **Overrides.** Each query parameter names a layer of the design:

      | Form | Syntax | Example |
      |---|---|---|
      | Long | `layer_name.property_name=value` | `title.color=%23FF0000` |
      | Short | `layer_name=value` — the property is inferred from the layer's type | `title=Welcome` |

      The short form sets `payload` on `text` / `button` / `qrcode` layers, `image_url` on
      `image` / `logo`, and `rating_score` on `rating`. Every property listed under
      [Element Properties](https://developers.abyssale.com/rest-api/generation/element-properties)
      is addressable in the long form.

      Five rules worth knowing before you generate URLs programmatically:

      - **URL-encode every value.** `#` becomes `%23`; spaces and nested URLs must be escaped. An
        empty value is a hard `400`.
      - A long-form key must contain **exactly one dot**. More dots and the parameter is silently
        ignored.
      - A short-form key naming a layer that is not on the rendered format is **silently
        dropped**; a long-form key naming an unknown *property* answers `400`.
      - A repeated key keeps the **first** value.
      - A literal `\n` in a text value becomes a real line break.

      Note the asymmetry: unknown layers fail silently, unknown properties fail loudly. Render
      the URL once and look at it before wiring it into a campaign.

paths:
  /auth:
    post:
      tags:
        - Authentication
      operationId: verifyApiKey
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST -H "x-api-key: $ABYSSALE_API_KEY" \
              https://api.abyssale.com/auth
            # {"company":"Acme Inc.","version":"v2026-10-21"}
        - lang: Python
          source: |
            import os, requests

            r = requests.post(
                "https://api.abyssale.com/auth",
                headers={"x-api-key": os.environ["ABYSSALE_API_KEY"]},
                timeout=30,
            )
            print(r.status_code, r.json())
        - lang: Node.js
          source: |
            import abyssale from '@abyssale/sdk';

            const { data, error } = await abyssale.verifyApiKey();
            if (error) console.error(error);
            else console.log(data.company);
      summary: Verify an API key
      description: |
        Check that an API key is usable, and find out which workspace it belongs to.

        This is the endpoint to call when you want to confirm a key works — it runs the whole
        authentication path and answers `200` only if **all** of the following hold:

        - the key exists,
        - it is still active (a revoked key answers `401`),
        - and, **for a workspace key**, the plan includes API access (`401 api_access_denied`
          otherwise).

        The plan check is skipped for a **user-scoped** key, which therefore answers `200` here
        whatever the plan. That is not a loophole: a user key is confined to the plugin surface,
        so a `200` from this endpoint means "this key is live", not "this key can generate". If
        you need to know whether a key can drive the API, call a real endpoint with it.

        Every failure is a **`401`**, whether the key is unknown, revoked, or on a plan without
        API access. This endpoint does not answer `403`.

        The response carries the workspace name, so a caller holding several keys can tell which
        one it has. Integration platforms use it to label a connection.

        > **Do not use `GET /ready` to test a key.** It is a service health check and is exempt
        > from authentication, so it answers `200` regardless of the key you send — including one
        > that has been revoked.

        Takes no request body. It is a `POST` for historical reasons; live integrations depend on
        the current shape, so it will not be changed.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The key is valid and the plan includes API access.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    type: string
                    description: Name of the workspace the key belongs to.
                    example: Acme Inc.
                  version:
                    $ref: '#/components/schemas/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /designs:
    get:
      operationId: listDesigns
      x-codeSamples:
        - lang: cURL
          source: |
            # Static or animated designs that have a portrait (story) format, edited since
            # 28 Sept 2026, latest first, 25 per page.
            curl -G -H "x-api-key: $ABYSSALE_API_KEY" "https://api.abyssale.com/designs" \
              --data-urlencode "type=static,animated" \
              --data-urlencode "orientation=portrait" \
              --data-urlencode "updated_since=2026-09-28" \
              --data-urlencode "sort=updated" \
              --data-urlencode "per_page=25"
        - lang: Python
          source: |
            import os, requests

            r = requests.get(
                "https://api.abyssale.com/designs",
                headers={"x-api-key": os.environ["ABYSSALE_API_KEY"]},
                params={
                    "type": "static,animated",      # one type, or several comma-separated
                    "orientation": "portrait",      # portrait | landscape | square
                    "updated_since": "2026-09-28",  # ISO 8601 date or date-time
                    "sort": "updated",
                    "per_page": 25,
                },
                timeout=30,
            )
            print(r.headers["X-Total-Count"], "designs match")
            for design in r.json():
                print(design["id"], design["name"])
        - lang: Node.js
          source: |
            import abyssale from '@abyssale/sdk';

            const { data } = await abyssale.listDesigns({ type: 'static' });
            console.log(data.map((d) => `${d.id}  ${d.name}`).join('\n'));
      summary: List and search designs
      description: |
        Retrieve the designs available in your Abyssale workspace. Each design defines
        the visual layout, available formats (dimensions), and configurable elements
        (text, images, shapes, etc.) that can be overridden during image generation.

        Filter by design type, project, format (`orientation`, `size`, `format`) or date
        (`updated_since`, `created_since`), search by words (`query`) or exact phrases (`name`,
        `project`), sort, and page. Every one of these is optional: without them the answer is
        unchanged — every design, ordered by name, as a bare array. The number of matches is in
        the `X-Total-Count` header.

        A design lives in a **project**. Organisation-level master designs are *workspace
        templates*, live in a **category**, and are listed by `GET /workspace-templates`
        instead — they never appear here.
      tags:
      - Designs
      parameters:
        - in: query
          name: project_id
          schema:
            type: string
            format: uuid
          required: false
          description: Unique identifier (UUID) of a project. Filter designs by project.
        - in: query
          name: type
          style: form
          explode: false
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              enum: [static, animated, printer, printer_multipage]
          required: false
          example: [printer, printer_multipage]
          description: >-
            Filter designs by type — one, or several comma-separated (`type=printer,printer_multipage`).
            An unknown value is **ignored** (and with no known value left, the full unfiltered list
            is returned) — this never answers 400 (long-standing behavior existing integrations
            rely on).
        - in: query
          name: orientation
          schema:
            type: string
            enum: [portrait, landscape, square]
          required: false
          description: >-
            Only designs with at least one format of this shape. An unknown value answers
            `400 unknown_enum_value`.
        - in: query
          name: size
          style: form
          explode: false
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              pattern: '^\d+(\.\d+)?x\d+(\.\d+)?$'
          required: false
          example: ["1080x1920", "1080x1080"]
          description: >-
            Only designs with at least one format of this size — `<width>x<height>`, one or several
            comma-separated (at most 10), in the design's own unit: pixels for screen designs, mm
            or inches for print (`210x297` is an A4, `8.5x11` a US Letter). A value that is not
            `<width>x<height>` answers `400 wrong_type`.
        - in: query
          name: format
          style: form
          explode: false
          schema:
            type: array
            maxItems: 10
            items:
              type: string
          required: false
          example: [facebook-post, instagram-story]
          description: >-
            Only designs with a format of this name — the format id that generation takes as
            `template_format_name`. One or several, comma-separated (at most 10).
        - in: query
          name: updated_since
          schema:
            type: string
            format: date-time
          required: false
          example: "2026-09-28"
          description: >-
            Only designs last saved in the editor at or after this moment: an ISO 8601 date
            (midnight UTC) or date-time (UTC when it has no offset). Anything else answers
            `400 wrong_type`.
        - in: query
          name: created_since
          schema:
            type: string
            format: date-time
          required: false
          example: "2026-09-01T00:00:00Z"
          description: >-
            Only designs created at or after this moment, in the same format as `updated_since`.
        - in: query
          name: query
          schema:
            type: string
          required: false
          example: black friday story
          description: >-
            Words to find, in any order. Every word must appear in the design name **or** the
            project name, ignoring case and accents. Words are split on spaces and on `-` `_` `|`
            `/` `·`, so `black friday` matches `Black-Friday – Story`. At most 8 words; more
            answers `400 out_of_range`.
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: One exact phrase that must appear in the design name (case- and accent-insensitive).
        - in: query
          name: project
          schema:
            type: string
          required: false
          description: >-
            One exact phrase that must appear in the project name. Several projects can match;
            use `project_id` for exactly one.
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, updated, created]
            default: name
          required: false
          description: >-
            `updated` is the last time the design was saved in the editor (renaming or moving a
            design does not count); `created` is its creation. An unknown value answers
            `400 unknown_enum_value`.
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
          required: false
          description: >-
            Defaults to `asc` (A to Z) for `name` and `desc` (newest first) for `updated` and
            `created`. An unknown value answers `400 unknown_enum_value`.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The matching designs — every one, or one page when `page` / `per_page` is sent.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: "#/components/schemas/Design"
                  - type: object
                    properties:
                      preview_url:
                        type: string
                        format: uri
                        example: https://production-banners.s3-eu-west-1.amazonaws.com/templates/e0d292f2-ec21-11e9-a539-3c408bf94155/a9b3c668-7b84-4924-adf0-815dae727d32.png
                        description: Preview Image URL of the first design format
        '400':
          description: |
            `project_id` is not a UUID; or a filter, search, sort or paging parameter is invalid —
            `orientation`, `sort` or `order` unknown (`unknown_enum_value`); more than 8 `query`
            words, more than 10 `size` / `format` / `type` values, or `page` / `per_page` below 1
            (`out_of_range`); a `size` that is not `<width>x<height>`, a date that is not ISO 8601,
            or a `page` / `per_page` that is not a number (`wrong_type`). An unknown `type` is
            ignored rather than rejected, and so is a parameter this endpoint does not define.

            The reported `path` is always `category_id`, whichever of the two spellings you
            sent — `category_id` is the deprecated alias of `project_id` and the two share one
            validator, which kept the older wording so the released contract did not change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                id: invalid_payload
                message: "malformed id category_id"
                errors:
                  - path: "category_id"
                    code: invalid_payload
                    message: "malformed"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []
  /designs/{designId}:
    get:
      operationId: getDesign
      summary: Get design details
      description: |
        Retrieve the full specification of a design: its formats (dimensions and preview URLs),
        all configurable elements with their properties, and any template variables defined
        in text layers. Use this endpoint to discover what data to send in a generation request.

        For printer designs, each format additionally carries its print settings read-only:
        `dpi` (integer render DPI computed at import time, capped at 300), and `bleed_size` /
        `safe_size` (floats in the design's unit). **All three are always present on a printer
        format** — a design with no stored print settings, or with a zone disabled, reports the
        values the renderer itself uses: `dpi: 300` and `bleed_size` / `safe_size` of `0`, where
        0 means the zone is off. Read them unconditionally; there is no need to test for the keys.

        For animated designs, the response additionally carries the animation model: a
        top-level `animation` object (`duration` — timeline length in seconds; `screenshot_at_s`
        — the HTML5 backup-screenshot moment, null on designs created before it was recorded), a per-element
        `animation` object (`start_at_s`, `end_at_s`, `tweens` `[{id, type, keyframes}]` with
        raw keyframe objects) on elements that carry timing or tweens, and video/audio media
        attributes (`video_url`/`audio_url`, `video_duration`, `video_muted`/`audio_muted`,
        `max_volume`) in the standard attribute shape.

        **Multipage print designs (`printer_multipage`) return a different shape.** A multipage
        design has no formats — each page is one format row — so the response carries `pages` and
        `elements_per_page` **instead of** `formats`, `elements` and `variables`. A client coded
        against `formats[]` will not work on a multipage design, and because a dynamic image is
        minted per format, a multipage design has no `dynamic_image_url` anywhere in the response
        (it is a `static`-only feature in any case).

        `pages[]` items are `DesignPage` objects, not formats: `id` (`page_1 … page_N`), `width`,
        `height`, `unit` and `preview_url` — no format `uid`. `elements_per_page` is an **object
        keyed by page id** (not an array), each value being that page's element list.

        **The print settings are returned once, at the root** — `dpi`, `bleed_size` and
        `safe_size` describe the document, not a page, because a multipage design has a single
        print setup. That is the same reason the import declares them at the top level. A page
        does not repeat them.

        **Group layers require `?i=advanced`.** By default this endpoint returns its original
        released shape, in which no group layer appears at all — its children are listed
        individually and the group itself is invisible. Pass `i=advanced` to have them injected
        (into `elements`, or into each page's list in `elements_per_page` on a multipage design).
        Each one carries `layer_ids` (one list for the whole design — a group holds the same
        children in every format), a per-format `layout`, its computed `hidden` / `locked`, and,
        except on animated designs, a per-format `group` block of auto-layout settings
        (`auto_layout` / `direction` / `placement` / `gap`).

        A **masked** group — one whose members are clipped to a shape — is still `type: "group"`
        and additionally carries `mask`, keyed by format. The geometry can differ per format, but
        a group is masked in all of its formats or in none, so the presence of `mask` is what
        distinguishes a masked group from a plain one.

        The per-format read `GET /designs/{designId}/formats/{formatSpecifier}` is always the
        advanced view and needs no parameter; there `layout`, `mask` and `group` are flattened to
        the single format.
      tags:
      - Designs
      parameters:
        - $ref: '#/components/parameters/DesignId'
        - in: query
          name: i
          required: false
          schema:
            type: string
            enum: [advanced]
          description: |
            Pass `advanced` to receive the design's **full** layer set and property set —
            notably `group` layers, which are omitted from the default response. Any other
            value (or none) returns the default shape.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The design's formats, elements and variables.
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/Design"
                - type: object
                  properties:
                    formats:
                      type: array
                      description: |
                        The list of formats available in the design.

                        The id property can be used to specify the format you would like to generate in the generation API call.
                      items:
                        $ref: "#/components/schemas/DesignFormat"
                    elements:
                      type: array
                      description: |
                        The list of all elements (& customizable properties) contained in the design.

                        `name` is the layer name (root is a special element that allows to customize the image background color.)

                        `attributes` contains the list of all customizable properties:
                        - `id`: The attribute ID
                        - `values`: the related value for this attribute in each format (if defined)
                      items:
                        $ref: "#/components/schemas/DesignElement"
                    variables:
                      $ref: "#/components/schemas/DesignVariables"
                    animation:
                      $ref: "#/components/schemas/DesignAnimation"
                    dpi:
                      type: integer
                      example: 300
                      description: |
                        **`printer_multipage` designs only** — the document's render DPI,
                        computed at import time and capped at 300. Read-only.
                    bleed_size:
                      type: number
                      example: 3
                      description: |
                        **`printer_multipage` designs only** — the document's bleed, a float in
                        the design's unit; `0` means the zone is off.

                        Declared once, here, because a multipage document has a single print
                        setup — the same reason the import declares `unit` / `width` / `height` /
                        `bleed_size` / `safe_size` / `dpi` at the top level and leaves a page
                        carrying only `background_color` and `layers`. **A page does not repeat
                        it.**
                    safe_size:
                      type: number
                      example: 5
                      description: |
                        **`printer_multipage` designs only** — the document's safe zone, a float
                        in the design's unit; `0` means the zone is off.
                    pages:
                      type: array
                      description: |
                        **`printer_multipage` designs only** — returned *instead of* `formats`.
                        The document's ordered pages. Every page shares the document's dimensions
                        and print settings, so a page carries neither: read those from the root.
                      items:
                        $ref: "#/components/schemas/DesignPage"
                    elements_per_page:
                      type: object
                      description: |
                        **`printer_multipage` designs only** — returned *instead of* `elements`.
                        An object keyed by page id (`page_1 … page_N`), each value being that
                        page's element list (group layers included only when `i=advanced` is
                        passed). Defaults to `{}`.

                        Items are `DesignPageElement`, **not** `DesignElement`: a page is a single
                        format, so values are flat rather than keyed by format name. Note also
                        that its `attributes` is an object, where every other read returns an
                        array — see the schema.
                      additionalProperties:
                        type: array
                        x-additionalPropertiesName: page-id
                        items:
                          $ref: "#/components/schemas/DesignPageElement"

        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Design not found (`template_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

    delete:
      operationId: deleteDesign
      summary: Delete a design
      description: |
        Delete one design from your workspace. Once deleted, it no longer appears in
        `GET /designs`, and every endpoint that takes its id — reads, generation, rename, move —
        answers `404 template_not_found`. Files already generated from it are not affected.

        **There is no restore**, through the API or in the app.

        Any design that `GET /designs` lists can be deleted. Anything else answers `404
        template_not_found`, the same as an id that never existed: a design that is already
        deleted, one in a deleted project, a workspace template, or another workspace's design.
      tags:
      - Designs
      parameters:
        - $ref: '#/components/parameters/DesignId'
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The design was deleted. The body names it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignNameResult"
              examples:
                deleted_design:
                  summary: The deleted design
                  value:
                    id: "64238d01-d402-474b-8c2d-fbc957e9d290"
                    name: "Summer sale"
                    version: "v2026-10-21"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DesignWriteNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /designs/{designId}/name:
    put:
      operationId: renameDesign
      summary: Rename a design
      description: |
        Change the name of one design. The name is trimmed, then must be 1 to 100 characters.
        Sending the name the design already has succeeds and changes nothing.

        Design names need not be unique: two designs, in the same project or not, can share one.

        Any design that `GET /designs` lists can be renamed. Anything else answers `404
        template_not_found` (see `DELETE /designs/{designId}`).
      tags:
      - Designs
      parameters:
        - $ref: '#/components/parameters/DesignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: |
                    The new name. Leading and trailing spaces are removed before the length is
                    checked, so a name of spaces only is refused.
                  example: "Summer sale"
              required:
                - name
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The design was renamed. `name` is the name as stored, trimmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignNameResult"
              examples:
                renamed_design:
                  summary: The renamed design
                  value:
                    id: "64238d01-d402-474b-8c2d-fbc957e9d290"
                    name: "Summer sale"
                    version: "v2026-10-21"
        '400':
          description: "`name` is missing (`missing_required`), or not 1 to 100 characters once trimmed (`out_of_range`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                name_missing:
                  summary: name absent
                  value:
                    id: missing_required
                    message: "name: Missing data for required field."
                    errors:
                      - path: "name"
                        code: missing_required
                        message: "Missing data for required field."
                name_out_of_range:
                  summary: name empty, spaces only, or over 100 characters
                  value:
                    id: out_of_range
                    message: "name: Length must be between 1 and 100."
                    errors:
                      - path: "name"
                        code: out_of_range
                        message: "Length must be between 1 and 100."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DesignWriteNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /designs/{designId}/project:
    put:
      operationId: moveDesign
      summary: Move a design to another project
      description: |
        Move one design to another project of your workspace. List the projects, and their ids,
        with `GET /projects`.

        **Moving a design resets its approval status**, since that approval was given within the
        project it leaves. Moving a design to the project it is already in changes nothing,
        approval status included.

        Any design that `GET /designs` lists can be moved. Anything else answers `404
        template_not_found` (see `DELETE /designs/{designId}`). A destination that is not a
        project of your workspace, or a deleted one, answers `400 project_not_found`.
      tags:
      - Designs
      parameters:
        - $ref: '#/components/parameters/DesignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                  format: uuid
                  description: The id of the destination project, from `GET /projects`.
                  example: "9d00e9fe-9bd5-4471-acad-baa702a867e9"
              required:
                - project_id
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The design is now in the destination project.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DesignNameResult"
                  - type: object
                    required:
                      - project_id
                    properties:
                      project_id:
                        type: string
                        format: uuid
                        description: The project the design is now in.
              examples:
                moved_design:
                  summary: The moved design
                  value:
                    id: "64238d01-d402-474b-8c2d-fbc957e9d290"
                    name: "Summer sale"
                    project_id: "9d00e9fe-9bd5-4471-acad-baa702a867e9"
                    version: "v2026-10-21"
        '400':
          description: |
            `project_id` is missing (`missing_required`) or not a UUID (`invalid_payload`), or the
            project does not exist in your workspace or is deleted (`project_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                project_not_found:
                  summary: No such project in this workspace
                  value:
                    id: project_not_found
                    message: "Project UUID '9d00e9fe-9bd5-4471-acad-baa702a867e9' not found"
                project_id_missing:
                  summary: project_id absent
                  value:
                    id: missing_required
                    message: "project_id: Missing data for required field."
                    errors:
                      - path: "project_id"
                        code: missing_required
                        message: "Missing data for required field."
                project_id_not_uuid:
                  summary: project_id is not a UUID
                  value:
                    id: invalid_payload
                    message: "project_id: Not a valid UUID."
                    errors:
                      - path: "project_id"
                        code: invalid_payload
                        message: "Not a valid UUID."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DesignWriteNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /designs/{designId}/formats/{formatSpecifier}:
    get:
      tags:
      - Designs
      operationId: getDesignFormat
      summary: Get format details
      description: |
        Retrieve detailed information for a specific format within a design, including
        dimensions, unit, preview URL, dynamic image URL, element layout, and variables.
        Useful for inspecting a single format before generating or building dynamic image URLs.

        For printer designs the response additionally carries the format's print settings
        read-only: `dpi` (integer render DPI computed at import time, capped at 300), and
        `bleed_size` / `safe_size` (floats in the design's unit, `0` when the zone is off). All
        three are always present on a printer format; a design with no stored print settings
        reports the renderer's own defaults (`dpi: 300`, zones `0`).

        For animated designs the response additionally carries the design's `animation`
        object (`duration`, `screenshot_at_s` — seconds), per-element `animation`
        timing/tween data, and video/audio media attributes — the same read surface as
        `GET /designs/{designId}`.

        **This endpoint is always the advanced view.** Unlike `GET /designs/{designId}`, it
        needs no `i=advanced` parameter: it always returns the full property set and always
        injects the format's `group` layers, flattened to this single format (`layout`, the
        `group` block, and the computed `hidden` / `locked` are plain values, not keyed by
        format name). A group that does not exist in the requested format is not emitted.

        **Multipage print designs (`printer_multipage`):** a multipage design is one document —
        it has **no formats**, and its pages are not addressable through this endpoint. Any
        `formatSpecifier` yields `404` with `id: format_not_found`. Read the whole document with
        `GET /designs/{designId}` or export it with `GET /designs/{designId}/as-import`.
      parameters:
      - $ref: '#/components/parameters/DesignId'
      - name: formatSpecifier
        in: path
        required: true
        schema:
          type: string
        description: |
          Format name or UID. Prefer the UID — it survives a rename.

          Not applicable to `printer_multipage` designs: they have no formats, so every value
          here answers `404` with `id: format_not_found`. See the endpoint description.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: Format details retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/DesignFormat"
                - type: object
                  properties:
                    animation:
                      $ref: '#/components/schemas/DesignAnimation'
                    design:
                      $ref: '#/components/schemas/DesignFormatSummary'
                    elements:
                      type: array
                      description: |
                        The design's elements as they stand **in this format**: attribute values
                        and `layout` are the requested format's, not maps keyed by format name
                        (see `DesignFormatElement`). Group layers are included, flattened to this
                        format.
                      items:
                        $ref: "#/components/schemas/DesignFormatElement"
                    variables:
                      $ref: "#/components/schemas/DesignVariables"
                    version:
                      $ref: '#/components/schemas/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Format not found (`format_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /designs/{designId}/dynamic-image-url:
    post:
      tags:
      - Dynamic Images
      operationId: createDynamicImageUrl
      summary: Create a dynamic image URL
      description: >-
        Creates a dynamic image URL for a given design (`static` designs only). Only one
        dynamic image is allowed per design — subsequent calls return the existing dynamic
        image (200 instead of 201). `enable_rate_limit` limits each visitor to 5 generations per
        24 h, counted from a hash of IP + `User-Agent`; requests answered from cache do not count
        against it. `enable_production_mode` switches from test mode (variants saved to the
        workspace, 10 req/s per image) to production mode (built for scale: no per-image throttle,
        variants not saved). Production mode is not unlimited — the global 10 requests/second
        ceiling, your workspace credits and your bandwidth all still apply, and bandwidth is
        measured on every delivery including cache hits. A non-`static` design answers
        `400 template_not_static`, and a design that is not in the `CREATED` status answers
        `400 template_not_active`.
      parameters:
      - $ref: '#/components/parameters/DesignId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                enable_rate_limit:
                  type: boolean
                  default: false
                  description: Enable API rate limiting for this dynamic image
                enable_production_mode:
                  type: boolean
                  default: false
                  description: Enable Production mode for this dynamic image
            example:
              enable_rate_limit: true
              enable_production_mode: true
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: Existing dynamic image retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicImageResponse'
        '201':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: Dynamic image successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicImageResponse'
        '400':
          description: >-
            The design is not `static` (`template_not_static`) or not active
            (`template_not_active`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Design not found (`template_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - api_key: []

  /banners/{bannerId}:
    get:
      operationId: getFile
      summary: Get generated file
      description: |
        Retrieve the metadata and download URLs for a previously generated file
        (image, video, GIF, HTML5 banner, or PDF). Returns both the S3 storage URL
        and a CDN-hosted URL suitable for embedding directly in websites or emails.
      tags:
      - Files
      parameters:
        - in: path
          name: bannerId
          schema:
            type: string
            format: uuid
          required: true
          description: Unique identifier (UUID) of the file
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          description: The file's metadata and download URLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
