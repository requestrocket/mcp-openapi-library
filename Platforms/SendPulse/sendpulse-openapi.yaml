      description: >-
        Create and send or schedule a campaign. One of 'body' or 'template_id'
        is required. One of 'list_id' or 'segment_id' is required.
      x-ai-role: marketing_automation_specialist
      x-ai-description: >-
        The primary engine for launching marketing broadcasts. This endpoint
        allows for direct HTML injection, template usage, and sophisticated
        segmentation. It supports both immediate sends and future scheduling
        with dynamic list updates.
      x-ai-reasoning-instructions:
        - Validate that either `body` or `template_id` is present.
        - Validate that either `list_id` or `segment_id` is present.
        - >-
          If `send_date` is provided, ensure it is in `Y-m-d H:i:s` format and
          in the future.
        - Check if `sender_email` is a pre-verified sender for the account.
        - >-
          For large lists, advise calculating cost using
          `/addressbooks/{id}/cost` first.
        - >-
          If `is_test` is true, remind the user that only one `list_id` can be
          used.
      x-ai-responding-instructions:
        - Provide the new Campaign ID and its initial task status.
        - >-
          Clearly state if the campaign is a draft (status 26) or entering the
          send queue (status 13).
        - If scheduled, confirm the exact time it will be sent.
        - Highlight the estimated recipient count if provided in the response.
      x-ai-suggestions:
        - Monitor campaign statistics using `/campaigns/{id}`.
        - Check referral statistics with `/campaigns/{id}/referrals`.
        - 'Send a test campaign first by setting `is_test: true`.'
