          type: string
    VariableDefinition:
      type: object
      x-ai-description: Definition of a custom field.
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - string
            - number
            - date
    EmailContact:
      type: object
      x-ai-description: Subscriber record.
      properties:
        email:
          type: string
        status:
          type: integer
        status_explain:
          type: string
        variables:
          type: object
    EmailContactBasic:
      type: object
      x-ai-description: Minimal subscriber record.
      properties:
        email:
          type: string
        status:
          type: integer
        status_explain:
          type: string
    ResultTrue:
      type: object
      x-ai-description: Success indicator.
      properties:
        result:
          type: boolean
    ResultTrueWithId:
      type: object
      x-ai-description: Success indicator with ID.
      properties:
        result:
          type: boolean
        id:
          type: integer
    CampaignCost:
      type: object
      x-ai-description: Cost breakdown.
      properties:
        cur:
          type: string
        sent_emails_qty:
          type: integer
        overdraftAllEmailsPrice:
          type: number
        result:
          type: boolean
    CampaignCreateRequest:
      type: object
      required:
        - sender_name
        - sender_email
        - subject
      x-ai-description: >-
        Payload to create an email campaign. One of 'body' or 'template_id' is
        required. One of 'list_id' or 'segment_id' is required.
      properties:
        sender_name:
          type: string
          description: Sender's name
          example: my_sender_name
        sender_email:
          type: string
          description: Sender's email address
          example: my_sender@test.com
        subject:
          type: string
          description: Email subject
          example: hello customer
        body:
          type: string
          description: >-
            HTML code of the template, encoded in Base64. Required if
            template_id is not provided.
          example: SmFja2llIENoYW4=
        template_id:
          oneOf:
            - type: integer
            - type: string
          description: >-
            Template ID uploaded or created in the service. Required if body is
            not provided.
          example: '775667'
        list_id:
          oneOf:
            - type: integer
            - type: array
              items:
                type: integer
              maxItems: 10
          description: >-
            Mailing list ID or array of mailing list IDs. Required if segment_id
            is not provided. Max 10 IDs.
          example: 756589
        segment_id:
          type: integer
          description: Segment ID created in your account.
          example: 12345
        is_test:
          type: boolean
          description: Send a test email to the sender's address specified in sender_email.
          example: false
        send_date:
          type: string
          description: Scheduled date and time (Y-m-d H:i:s). Must not be in the past.
          example: '2016-02-02 23:34:23'
        name:
          type: string
          description: Campaign name.
          example: my_api_campaign
        use_dynamic_list:
          type: boolean
          description: Send to contacts added after campaign creation but before sending.
          example: true
        attachments:
          type: object
          description: Attached files (max 5). Key is filename, value is content.
          additionalProperties:
            type: string
          example:
            text.txt: my content file
        attachments_binary:
          type: object
          description: Attached files (max 5). Key is filename, value is Base64 content.
          additionalProperties:
            type: string
          example:
            text.txt: bXkgY29udGVudCBmaWxlIGluIGJhc2U2NA==
        type:
          type: string
          enum:
            - draft
          description: Create campaign as a draft.
          example: draft
        body_amp:
          type: string
          description: AMP version of the email, encoded in base64.
          example: bXkgYW1wIGJvZHk=
        stats:
          type: object
          description: Enable collection of statistics on opens and clicks.
          properties:
            clicks:
              type: boolean
              default: true
              description: Track link clicks.
            opens:
              type: boolean
              default: true
              description: Track email opens.
            utm_campaign:
              type: string
              description: Custom UTM tags for Google Analytics.
          example:
            opens: true
            clicks: false
            utm_campaign: MY_UTM
    CampaignCreateResponse:
      type: object
      x-ai-description: Response from campaign creation.
      properties:
        id:
          type: integer
          description: Email campaign ID
          example: 245587
        status:
          type: integer
          description: Task status for sending (13 - copying addresses, 26 - draft)
          example: 13
        count:
          type: integer
          description: Number of recipients
          example: 1
        tariff_email_qty:
