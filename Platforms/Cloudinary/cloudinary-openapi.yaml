          type: string
          description: The public ID of the asset.
          example: sample
        version:
          type: integer
          description: The version number of the asset.
          example: 1234567890
    person_details:
      type: object
      description: Detailed information about a recognized person.
      properties:
        id:
          type: string
          description: The unique identifier of the person.
          example: a1b2c3d4e5f6
        name:
          type: string
          description: The display name of the person, or null if not named.
          example: Jane Doe
        status:
          $ref: '#/components/schemas/person_status'
          example: active
        thumbnail:
          $ref: '#/components/schemas/thumbnail'
        created_at:
          type: string
          format: date-time
          description: The date and time when the person was first detected.
          example: '2025-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: The date and time when the person was last updated.
          example: '2025-01-20T14:45:00Z'
    people_list_response:
      type: object
      properties:
        people:
          type: array
          description: A list of recognized person objects.
          items:
            $ref: '#/components/schemas/person_details'
        next_cursor:
          type: string
          description: The cursor to use for the next page of results.
    person_response:
      type: object
      properties:
        person:
          $ref: '#/components/schemas/person_details'
    update_person_request:
      type: object
      properties:
        name:
          type: string
          description: The display name for the person. Maximum 255 characters.
          maxLength: 255
          example: Jane Doe
        status:
          $ref: '#/components/schemas/person_status'
        thumbnail_asset_id:
          type: string
          description: The external ID of an asset containing this person's face to use as the thumbnail.
          example: 2262b0b5eb88f1fd7724e29b0e57d730
    update_person_response:
      type: object
      properties:
        person_id:
          type: string
          description: The unique identifier of the person.
          example: f10f893da5a1586dca6764b22514aa0d25e6b867baffc4fb43a2318a25d8e5b2
        name:
          type: string
          description: The display name of the person.
          example: Jane Doe
        status:
          $ref: '#/components/schemas/person_status'
    people_inspection_group:
      type: object
      description: The items to inspect for a type and the actions to check against them.
      properties:
        items:
          type: object
          additionalProperties: true
          description: A map of caller-supplied cache keys to the person identifier to inspect.
        actions:
          type: object
          additionalProperties: true
          description: A map of action names to optional action context to inspect.
      required:
        - items
        - actions
    people_inspection_targets:
      type: object
      description: A map of inspectable types to the items and actions to inspect.
      properties:
        Person:
          $ref: '#/components/schemas/people_inspection_group'
      additionalProperties: true
    people_inspect_request:
      type: object
      description: The people and actions to inspect.
      properties:
        inspections:
          $ref: '#/components/schemas/people_inspection_targets'
      required:
        - inspections
    people_inspect_response:
      type: object
      description: The permission inspection results.
      properties:
        message:
          type: string
          description: A status message for the inspection request.
          example: ok
        inspections:
          type: object
          additionalProperties: true
          description: A map of inspected type to per-item, per-action permission results (true if permitted).
      required:
        - inspections
    GenerateImageRequest:
      type: object
      description: |
        Parameters for an image-generation request. Only `prompt` is required;
        all other fields fall back to documented defaults.
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 16384
          description: The text description of the image to generate.
          examples:
            - A photorealistic sunset over a mountain lake
        model:
          $ref: "#/components/schemas/ModelSelection"
        image_size:
          $ref: "#/components/schemas/ImageSize"
        format:
          $ref: "#/components/schemas/ImageFormat"
        target:
          $ref: "#/components/schemas/Target"
        seed:
          $ref: "#/components/schemas/Seed"
        async:
          $ref: "#/components/schemas/Async"
        notification_url:
          $ref: "#/components/schemas/NotificationUrl"
      examples:
        - prompt: A photorealistic sunset over a mountain lake
          image_size:
            aspect_ratio: 16:9
          target:
            target_type: temporary
    ImageFormat:
      type: string
      enum:
        - jpeg
        - png
        - webp
      description: |
        Desired output image format. Optional; defaults to `png` when omitted.
        Mapped to the closest format the chosen model supports — `webp` falls
        back to `png` on models that don't support it (e.g. FLUX.2 Pro), and the
        request is ignored entirely by models that don't expose a format option
        (e.g. Recraft).
      examples:
        - png
    Seed:
      type:
        - integer
        - "null"
      minimum: 0
      description: |
        Seed for reproducible generation. Supported by the `flux`, `nano-banana`
        and `ideogram` models and by `qwen-image-3`; silently ignored by the
        models that don't support it, which report `seed` as null in the
        response.
      examples:
        - 42
    Async:
      type: boolean
      default: false
      description: |
        Whether to perform the generation asynchronously. When true, the API
        returns immediately with a 202 and completes in the background. Once
        complete, a webhook notification is sent to the specified URL and/or to
        the URLs defined in the product environment's settings.
      examples:
        - false
    NotificationUrl:
      type: string
      format: uri
      description: The webhook URL to notify when the generation is complete. Only relevant when `async` is set to true.
      examples:
        - https://path.to/webhook
    ImageToImageRequest:
      type: object
      description: |
        Parameters for an image-to-image (reference-guided) request. Both
        `prompt` (the edit instruction) and `reference_images` are required; all
        other fields fall back to the same defaults as `text_to_image`.
      required:
        - prompt
        - reference_images
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 16384
          description: The text instruction describing the desired edit / output.
          examples:
            - Place the product from [1] on a marble kitchen counter, soft morning light
        reference_images:
          type: array
          minItems: 1
          maxItems: 4
          description: |
            Reference images that steer the generation, in order (1-indexed; the
            prompt may address them positionally as `[1]`, `[2]`, …). Each entry
            is either a managed asset (by `asset_id`) or an external `url`. The
            platform accepts up to 4; a specific model may accept fewer — the
            `recraft-v3-edit` and `mai-image` edit models accept 1, and the
            `grok-imagine` and `qwen-image` edit models accept 3. Exceeding the
            selected model's capacity returns 400.
          items:
            $ref: "#/components/schemas/ReferenceImage"
          examples:
            -   - source_type: url
                  url: https://res.cloudinary.com/demo/image/upload/docs/shoes.jpg
        model:
          $ref: "#/components/schemas/ModelSelection"
        image_size:
          $ref: "#/components/schemas/ImageSize"
        format:
          $ref: "#/components/schemas/ImageFormat"
        target:
          $ref: "#/components/schemas/Target"
        seed:
          $ref: "#/components/schemas/Seed"
        async:
          $ref: "#/components/schemas/Async"
        notification_url:
          $ref: "#/components/schemas/NotificationUrl"
      examples:
        - prompt: Place the shoes from [1] on a marble kitchen counter, soft morning light
          reference_images:
            - source_type: url
              url: https://res.cloudinary.com/demo/image/upload/docs/shoes.jpg
    ReferenceImage:
      description: |
        A single reference image, in **one** of two mutually exclusive forms
        determined by `source_type`:
          * `ManagedAssetReference`: a managed asset in the caller's product
            environment, by `asset_id` (read permission is checked).
          * `UrlReference`: an external image by HTTPS `url`.
      oneOf:
        - $ref: "#/components/schemas/ManagedAssetReference"
        - $ref: "#/components/schemas/UrlReference"
      discriminator:
        propertyName: source_type
        mapping:
          managed_asset: "#/components/schemas/ManagedAssetReference"
          url: "#/components/schemas/UrlReference"
      examples:
        - source_type: url
          url: https://res.cloudinary.com/demo/image/upload/docs/shoes.jpg
    ManagedAssetReference:
      type: object
      title: ManagedAssetReference
      description: |
        A reference to a managed asset in the caller's product environment, by
        asset ID.
      additionalProperties: false
      required:
        - source_type
        - asset_id
      properties:
        source_type:
          type: string
          description: Discriminator identifying this as a managed-asset reference.
          enum:
            - managed_asset
          examples:
            - managed_asset
        asset_id:
          type: string
          description: Cloudinary asset ID of the reference image. READ permission is enforced.
          examples:
            - 0d6f8e1c2b3a4d5e6f7a8b9c0d1e2f3a
      examples:
        - source_type: managed_asset
          asset_id: 0d6f8e1c2b3a4d5e6f7a8b9c0d1e2f3a
    UrlReference:
      type: object
      title: UrlReference
      description: A reference to an external image by HTTPS URL.
      additionalProperties: false
      required:
        - source_type
        - url
      properties:
        source_type:
          type: string
          description: Discriminator identifying this as an external-URL reference.
          enum:
            - url
          examples:
            - url
        url:
          type: string
          format: uri
          description: Public HTTPS URL of the reference image.
          examples:
            - https://example.com/product.png
      examples:
        - source_type: url
          url: https://res.cloudinary.com/demo/image/upload/docs/shoes.jpg
    ModelSelection:
      description: |
        Selects the model, in one of three mutually exclusive forms (omit to use
        the default: `nano-banana-2`, or `nano-banana-2-edit` for
        image-to-image):
          * `ModelByFamily`: `family` (+ optional `tier`); the stable-over-time
            selector.
          * `ModelById`: an explicit `id`, pinning one exact model.
          * `ModelAuto`: `mode: auto`, letting the service choose the model for
            the request (+ optional `preference`).
      oneOf:
        - $ref: "#/components/schemas/ModelByFamily"
        - $ref: "#/components/schemas/ModelById"
        - $ref: "#/components/schemas/ModelAuto"
      examples:
        - mode: auto
    ModelByFamily:
      type: object
      title: ModelByFamily
      description: |
        Select a model by family and quality tier; a missing `tier` defaults to
        `standard`.
      additionalProperties: false
      required:
        - family
      properties:
        family:
          type: string
          enum:
            - flux
            - recraft
            - gpt-image
            - nano-banana
            - ideogram
          description: |
            Model family:
            * `flux`: Photorealistic images (FLUX.2 Klein 9B / FLUX.2 Pro).
            * `recraft`: Vector and illustration (Recraft V3 / Recraft V4).
            * `gpt-image`: Campaign and marketing images (GPT Image 1 Mini / GPT
              Image 2).
            * `nano-banana`: General purpose generation (Nano Banana 1 / Nano
              Banana 2).
            * `ideogram`: Realism, text rendering, and artistic generation
              (Ideogram V4).
          examples:
            - flux
        tier:
          type: string
          enum:
            - standard
            - premium
          description: Quality tier within the family. Defaults to `standard` when omitted.
          examples:
            - premium
      examples:
        - family: flux
          tier: premium
    ModelById:
      type: object
      title: ModelById
      description: Pin an exact model by ID, bypassing family/tier.
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          enum:
            - nano-banana-1
            - nano-banana-2
            - nano-banana-2-lite
            - flux-2-klein-9b
            - flux-2-pro
            - flux-2-flash
            - flux-3
            - recraft-v3
            - recraft-v4
            - gpt-image-1-mini
            - gpt-image-2
            - gpt-image-2.5-flare
            - gpt-image-2.5-sunburst
            - muse-image
            - mai-image-2.5
            - mai-image-2.5-pro
            - seedream-5-pro
            - grok-imagine-image
            - recraft-v4.1-utility
            - recraft-v4.1-utility-pro
            - seedream-5-lite
            - grok-imagine-image-2.0-low
            - qwen-image-3
            - ideogram-v4-base
            - ideogram-v4-turbo
            - nano-banana-1-edit
            - nano-banana-2-edit
            - nano-banana-2-lite-edit
            - flux-2-klein-9b-edit
            - flux-2-pro-edit
            - flux-2-flash-edit
            - flux-3-edit
            - recraft-v3-edit
            - gpt-image-1-mini-edit
            - gpt-image-2-edit
            - gpt-image-2.5-flare-edit
            - gpt-image-2.5-sunburst-edit
            - muse-image-edit
            - mai-image-2.5-edit
            - mai-image-2.5-pro-edit
            - seedream-5-pro-edit
            - grok-imagine-image-edit
            - seedream-5-lite-edit
            - grok-imagine-image-2.0-low-edit
            - qwen-image-3-edit
          description: |
            Exact model identifier; overrides family/tier when provided. The
            `-edit` models accept reference images and are selectable only on
            `image_to_image`; the others only on `text_to_image`.
          examples:
            - flux-2-pro
      examples:
        - id: flux-2-pro
    ModelAuto:
      type: object
      title: ModelAuto
      description: |
        Let the service choose the model for this request. The response reports
        the resolved model in `data.assets[].model`, as for the other forms; on
        `image_to_image` it is always an edit model.
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - auto
          description: The only valid value; selects automatic model selection.
          examples:
            - auto
        preference:
          type: string
          enum:
            - balanced
            - quality
            - economy
            - balanced_fast
            - quality_fast
            - economy_fast
          default: balanced
          description: |
            What the choice optimizes for:
            * `balanced` (default): quality and cost weighted equally.
            * `quality`: quality only; cost isn't weighed.
            * `economy`: cost first, quality second.
            * `balanced_fast`, `quality_fast`, `economy_fast`: as above, but
              also favor faster generation, and never pick a model that
              typically takes longer than 30 seconds.
          examples:
            - quality
      examples:
        - mode: auto
          preference: quality
    ImageSize:
      description: |
        Desired output size, given in **one** of two mutually exclusive forms:

          * `DimensionsImageSize`: `width` and `height` in pixels, for precise
            control.
          * `DeclarativeImageSize`: `aspect_ratio` (and an optional `resolution`
            tier), resolved server-side to the closest size the chosen model
            supports. This is the portable form: most providers natively accept
            an aspect ratio plus a resolution tier rather than raw pixels.

        Omit `image_size` entirely to use the model's default size.
      oneOf:
        - $ref: "#/components/schemas/DimensionsImageSize"
        - $ref: "#/components/schemas/DeclarativeImageSize"
      examples:
        - aspect_ratio: 16:9
          resolution: 2K
    DimensionsImageSize:
      type: object
      title: DimensionsImageSize
      description: Exact output dimensions in pixels. Both `width` and `height` are required together.
      additionalProperties: false
      required:
        - width
        - height
      properties:
        width:
          type: integer
          minimum: 64
          maximum: 4096
          description: Output width in pixels.
          examples:
            - 1280
        height:
          type: integer
          minimum: 64
          maximum: 4096
          description: Output height in pixels.
          examples:
            - 720
      examples:
        - width: 1280
          height: 720
    DeclarativeImageSize:
      type: object
      title: DeclarativeImageSize
      description: |
        Declarative output size — an aspect ratio plus an optional resolution
        tier, resolved server-side to the nearest size the model supports.
      additionalProperties: false
      required:
        - aspect_ratio
      properties:
        aspect_ratio:
          type: string
          description: |
            Output aspect ratio, width-to-height. Limited to the core ratios
            every model supports natively.
          enum:
            - 1:1
            - 16:9
            - 9:16
            - 4:3
            - 3:4
          examples:
            - 16:9
        resolution:
          type: string
          description: |
            Output resolution tier, measured on the longest edge. Defaults to
            `1K` when omitted.
            * `0.5K`: ~512 px
            * `1K`: ~1024 px
            * `2K`: ~2048 px
            * `4K`: ~4096 px
          enum:
            - 0.5K
            - 1K
            - 2K
            - 4K
          examples:
            - 2K
      examples:
        - aspect_ratio: 16:9
          resolution: 2K
    Target:
      description: |
        Where the generated image goes, determined by `target_type`. Use
        `temporary` when the user only wants the image: a short-lived URL,
        nothing saved to their account. Omit it, or use `managed_asset`, to
        store the image permanently in their Media Library. If the caller lacks
        upload permission, the image is returned as `temporary` instead, with a
        `warning` notice.
      oneOf:
        - $ref: "#/components/schemas/ManagedAssetTarget"
        - $ref: "#/components/schemas/TemporaryTarget"
      discriminator:
        propertyName: target_type
        mapping:
          managed_asset: "#/components/schemas/ManagedAssetTarget"
          temporary: "#/components/schemas/TemporaryTarget"
      examples:
        - target_type: temporary
    ManagedAssetTarget:
      type: object
      description: Store the output as a permanent managed asset in your Cloudinary product environment (the default).
      additionalProperties: false
      required:
        - target_type
      properties:
        target_type:
          type: string
          description: Discriminator identifying this as a managed-asset target.
          enum:
            - managed_asset
          examples:
            - managed_asset
        public_id:
          type: string
          description: Public ID to store the asset under. Auto-assigned when omitted.
          examples:
            - my-public-id
        upload_preset:
          type: string
          description: Upload preset to apply. Uses the product environment's default when omitted.
          examples:
            - some-preset
      examples:
        - target_type: managed_asset
          public_id: my-public-id
    TemporaryTarget:
      type: object
      description: |
        Return the image at a short-lived URL (valid until `expires_at`) without
        saving it to the user's Cloudinary account.
      additionalProperties: false
      required:
        - target_type
      properties:
        target_type:
          type: string
          description: Discriminator identifying this as a temporary target.
          enum:
            - temporary
          examples:
            - temporary
      examples:
        - target_type: temporary
    Storage:
      description: |
        Where the generated asset is actually stored, determined by
        `storage_type`. Usually matches the request `target`; a `managed_asset`
        request falls back to `temporary` when the caller lacks upload
        permission. `secure_url` is always present.
      oneOf:
        - $ref: "#/components/schemas/ManagedAssetStorage"
        - $ref: "#/components/schemas/TemporaryStorage"
      discriminator:
        propertyName: storage_type
        mapping:
          managed_asset: "#/components/schemas/ManagedAssetStorage"
          temporary: "#/components/schemas/TemporaryStorage"
      examples:
        - storage_type: temporary
          secure_url: https://upload-global.cloudinary.com/v2/demo/uploads/a78a2e043c2da0b50a98961d60a8b05a/image.png
          expires_at: 2026-06-25T12:50:26Z
    ManagedAssetStorage:
      type: object
      description: |
        A generated asset stored as a permanent managed asset. Reference it in
        other Cloudinary APIs by `asset_id`, or by the
        `resource_type` / `type` / `public_id` triple.
      additionalProperties: false
      required:
        - storage_type
        - secure_url
        - public_id
        - resource_type
        - type
        - version
      properties:
        storage_type:
          type: string
          description: Discriminator identifying this as managed-asset storage.
          enum:
            - managed_asset
          examples:
            - managed_asset
        secure_url:
          type: string
          format: uri
          description: The URL to fetch the generated asset.
          examples:
            - https://res.cloudinary.com/demo/image/upload/v1/my-public-id.png
        asset_id:
          type: string
          description: Cloudinary asset ID — a stable, globally-unique reference to the asset.
          examples:
            - 0d6f8e1c2b3a4d5e6f7a8b9c0d1e2f3a
        public_id:
          type: string
          description: Public ID of the stored asset.
          examples:
            - my-public-id
        resource_type:
          type: string
          description: Cloudinary resource type of the stored asset.
          enum:
            - image
            - video
            - raw
          examples:
            - image
        type:
          type: string
          description: Cloudinary delivery type of the stored asset (e.g. `upload`, `private`, `authenticated`).
          examples:
            - upload
        version:
          type: integer
          format: int64
          description: Version of the stored asset.
          examples:
            - 1750000000
      examples:
        - storage_type: managed_asset
          secure_url: https://res.cloudinary.com/demo/image/upload/v1750000000/my-public-id.png
          asset_id: 0d6f8e1c2b3a4d5e6f7a8b9c0d1e2f3a
          public_id: my-public-id
          resource_type: image
          type: upload
          version: 1750000000
    TemporaryStorage:
      type: object
      description: A generated asset stored as a short-lived asset on the upload service.
      additionalProperties: false
      required:
        - storage_type
        - secure_url
        - expires_at
      properties:
        storage_type:
          type: string
          description: Discriminator identifying this as temporary storage.
          enum:
            - temporary
          examples:
            - temporary
        secure_url:
          type: string
          format: uri
          description: The URL to fetch the generated asset.
          examples:
            - https://upload-global.cloudinary.com/v2/demo/uploads/a78a2e043c2da0b50a98961d60a8b05a/stream
        expires_at:
          type: string
          format: date-time
          description: Time in UTC when secure_url stops being valid.
          examples:
            - 2026-06-25T12:50:26Z
      examples:
        - storage_type: temporary
          secure_url: https://upload-global.cloudinary.com/v2/demo/uploads/a78a2e043c2da0b50a98961d60a8b05a/image.png
          expires_at: 2026-06-25T12:50:26Z
    GenerateImageResult:
      type: object
      description: Successful synchronous image-generation response.
      required:
        - request_id
      properties:
        data:
          $ref: "#/components/schemas/GeneratedAssets"
        limits:
          $ref: "#/components/schemas/Limits"
        notices:
          $ref: "#/components/schemas/Notices"
        request_id:
          type: string
          description: Unique identifier for this request, for correlation and support.
          examples:
            - 17c3b70c5096df0e77e838323abb7029
      examples:
        - data:
            assets:
              - storage:
                  storage_type: temporary
                  secure_url: https://upload-global.cloudinary.com/v2/demo/uploads/a78a2e043c2da0b50a98961d60a8b05a/image.png
                  expires_at: 2026-06-25T12:50:26Z
          request_id: 17c3b70c5096df0e77e838323abb7029
    GeneratedAssets:
      type: object
      description: Wrapper holding the array of generated assets.
      required:
        - assets
      properties:
        assets:
          type: array
          description: The generated assets. Currently a single asset is returned.
          items:
            $ref: "#/components/schemas/GeneratedAsset"
          examples:
            -   - storage:
                    storage_type: temporary
                    secure_url: https://upload-global.cloudinary.com/v2/demo/uploads/a78a2e043c2da0b50a98961d60a8b05a/image.png
                    expires_at: 2026-06-25T12:50:26Z
      examples:
        - assets:
            - storage:
                storage_type: temporary
                secure_url: https://upload-global.cloudinary.com/v2/demo/uploads/a78a2e043c2da0b50a98961d60a8b05a/image.png
                expires_at: 2026-06-25T12:50:26Z
    GeneratedAsset:
      type: object
      description: |
        A generated asset: where it is stored (`storage`) plus its media
        metadata. The media fields are populated once the task completes; an
        in-progress asset carries only `storage`.
      required:
        - storage
      properties:
        storage:
          $ref: "#/components/schemas/Storage"
        format:
          type: string
          enum:
            - png
            - jpeg
            - webp
          description: The image format of the stored asset.
          examples:
            - png
        width:
          type: integer
          description: The width of the generated image in pixels; zero if the model doesn't provide dimensions.
          examples:
            - 1024
        height:
          type: integer
          description: The height of the generated image in pixels; zero if the model doesn't provide dimensions.
          examples:
            - 768
        bytes:
          type: integer
          format: int64
          description: The size of the generated image in bytes.
          examples:
            - 2048576
        model:
          $ref: "#/components/schemas/Model"
        seed:
          type:
            - integer
            - "null"
          description: |
            The seed used for generation. Echoes input or returns the
            model-generated seed. Null when the model doesn't support seeds.
          examples:
            - 42
        created_at:
          type: string
          format: date-time
          description: The timestamp when the image was generated.
          examples:
            - 2026-04-21T14:30:00Z
      examples:
        - storage:
            storage_type: temporary
            secure_url: https://upload-global.cloudinary.com/v2/demo/uploads/a78a2e043c2da0b50a98961d60a8b05a/image.png
            expires_at: 2026-06-25T12:50:26Z
          format: png
          width: 1024
          height: 768
          bytes: 2048576
          model:
            family: flux
            tier: premium
            id: flux-2-pro
          seed: 42
          created_at: 2026-04-21T14:30:00Z
    Model:
      type: object
      description: Identifies the model that produced a generation result.
      required:
        - family
        - tier
        - id
      properties:
        family:
          type: string
          description: |
            The family this model belongs to. `none` when the model is not part
            of any family.

            A family holds exactly two tiers (`standard` and `premium`), so the
            family/tier taxonomy names only part of the roster. The remaining
            models are selected by `id` alone and are not part of any family,
            which is reported as `none` rather than as a family the model does
            not belong to. This describes the model, not how it was selected: a
            model that belongs to a family reports it whether it was chosen by
            `family` and `tier` or pinned by `id`.

            Not an enum: new families are added over time, so treat any value
            as possible.
          examples:
            - flux
        tier:
          type: string
          description: |
            The quality tier this model holds within its family. `none` when
            the model is not part of any family. See `family`.
          examples:
            - premium
        id:
          type: string
          description: |
            The exact model identifier used for generation. Always a concrete
            model, and the reliable field to key on: unlike `family` and
            `tier`, it is never `none`.
          examples:
            - flux-2-pro
      examples:
        - family: flux
          tier: premium
          id: flux-2-pro
    TaskStatus:
      type: string
      description: |
        The status of an async generation task.
        * `pending`: accepted and queued, not yet started.
        * `processing`: generation is in progress.
        * `completed`: generation finished; `result` is populated.
        * `failed`: generation did not complete successfully.
      enum:
        - pending
        - processing
        - completed
        - failed
      examples:
        - completed
    Task:
      type: object
      description: |
        An async generation task. Returned when a generation is accepted (202)
        and from GET /tasks/{task_id} as it progresses. The `result` is filled
        in once `status` is `completed`.
      required:
        - task_id
        - status
      properties:
        task_id:
          type: string
          description: Identifier for the async generation task. Use it to poll `GET /generate/{cloud_name}/tasks/{task_id}`.
          examples:
            - 053f4bde4b933c8ecef23724ecde63b667c1ea21816d56c161c7ec1df6297da4b43109625650e9edf0f42152cc4cc32c8ad57824ac75ba8e05020f827c415559ac1248076a2d72c0a73af0479cca77eb
        status:
          $ref: "#/components/schemas/TaskStatus"
        result:
          type:
            - object
            - "null"
          allOf:
            - $ref: "#/components/schemas/GeneratedAssets"
          description: |
            The generated assets. Populated once `status` is `completed`.
          examples:
            - assets:
                - storage:
                    storage_type: temporary
                    secure_url: https://upload-global.cloudinary.com/v2/demo/uploads/a78a2e043c2da0b50a98961d60a8b05a/image.png
                    expires_at: 2026-06-25T12:50:26Z
        limits:
          $ref: "#/components/schemas/Limits"
      examples:
        - task_id: 053f4bde4b933c8ecef23724ecde63b667c1ea21816d56c161c7ec1df6297da4b43109625650e9edf0f42152cc4cc32c8ad57824ac75ba8e05020f827c415559ac1248076a2d72c0a73af0479cca77eb
          status: pending
    TaskResponse:
      type: object
      description: |
        Envelope for an async generation task — returned by the accepted (202)
        response and by GET /tasks/{task_id}.
      required:
        - request_id
      properties:
        data:
          $ref: "#/components/schemas/Task"
        notices:
          $ref: "#/components/schemas/Notices"
        request_id:
          type: string
          description: Unique identifier for this request, for correlation and support.
          examples:
            - 17c3b70c5096df0e77e838323abb7029
      examples:
        - data:
            task_id: 053f4bde4b933c8ecef23724ecde63b667c1ea21816d56c161c7ec1df6297da4b43109625650e9edf0f42152cc4cc32c8ad57824ac75ba8e05020f827c415559ac1248076a2d72c0a73af0479cca77eb
            status: pending
          request_id: 17c3b70c5096df0e77e838323abb7029
    ErrorResponse:
      type: object
      description: Wrapper for error responses; includes the error object and a request_id for correlation.
      required:
        - error
        - request_id
      properties:
        error:
          $ref: "#/components/schemas/Error"
        notices:
          $ref: "#/components/schemas/Notices"
        request_id:
          type: string
          description: Unique identifier for this request, for correlation and support.
          examples:
            - 17c3b70c5096df0e77e838323abb7029
      examples:
        - error:
            category: user_error
            code: MG_00001
            message: missing parameters
            details:
              parameters:
                - prompt
          request_id: 17c3b70c5096df0e77e838323abb7029
    Error:
      type: object
      description: Details of an error, including a coarse category for retry logic, a stable error code, and a human-readable message.
      properties:
        category:
          $ref: "#/components/schemas/ErrorCategory"
        code:
          type: string
          description: Stable, machine-readable error code for programmatic handling.
          examples:
            - MG_00001
        message:
          type: string
          description: Human-readable description of what went wrong.
          examples:
            - missing parameters
        details:
          type: object
          additionalProperties: true
          description: Additional structured context about the error, when available.
          examples:
            - parameters:
                - prompt
      examples:
        - category: user_error
          code: MG_00001
          message: missing parameters
          details:
            parameters:
              - param1
              - param2
    ErrorCategory:
      type: string
      description: |
        Coarse classification of an error, primarily used by clients to decide
        whether to retry.
        * `user_error`: the request was invalid; do not retry without changes.
        * `auth_error`: authentication or authorization failed.
        * `server_error`: an unexpected server-side error; retrying may succeed.
        * `rate_limit_error`: quota or rate limit exceeded; retry later.
      enum:
        - user_error
        - auth_error
        - server_error
        - rate_limit_error
      examples:
        - user_error
    Notices:
      type: array
      x-experimental: true
      description: |
        Tips and guidance attached to the response to help you get the most
        out of the generation. Each entry is plain text you can show to a
        user or act on as-is. Omitted when there is nothing to add.
      items:
        $ref: "#/components/schemas/Notice"
      examples:
        -   - severity: warning
              text: "You've used 40 of your 50 Image Generation credits. 10 remain. Tell the user the balance is nearly spent, do not estimate how many images it covers, and show them: https://console.cloudinary.com/app/image/generation/plans"
    Notice:
      type: object
      description: A single tip or piece of guidance, with how much weight to give it.
      required:
        - severity
        - text
      properties:
        severity:
          type: string
          description: |
            How much weight to give the message.
            * `info`: for awareness; nothing to do.
            * `warning`: worth relaying to the user before continuing.
            * `blocking`: the request was not served; the text says what
              unblocks it.
          enum:
            - info
            - warning
            - blocking
          examples:
            - info
        text:
          type: string
          description: The tip or guidance, in plain text. Show it as-is or follow it; the wording may change between releases.
          examples:
            - "You've used 25 of your 50 Image Generation credits. No action needed. If this run will keep generating, tell the user their balance is half spent and show them: https://console.cloudinary.com/app/image/generation/plans"
      examples:
        - severity: info
          text: "You've used 25 of your 50 Image Generation credits. No action needed. If this run will keep generating, tell the user their balance is half spent and show them: https://console.cloudinary.com/app/image/generation/plans"
    Limits:
      type: object
      description: Rate limit information for the account's add-on quotas.
      properties:
        addons_quota:
          type: array
          description: Per-add-on quota usage for this account.
          items:
            $ref: "#/components/schemas/AddonQuota"
          examples:
            -   - type: image_generation
                  used_by_request: 1
                  remaining: 48
                  limit: 50
      examples:
        - addons_quota:
            - type: image_generation
              used_by_request: 1
              remaining: 48
              limit: 50
    AddonQuota:
      type: object
      description: Credit usage for a single add-on.
      required:
        - type
        - used_by_request
        - remaining
        - limit
      properties:
        type:
          $ref: "#/components/schemas/Feature"
        used_by_request:
          type:
            - integer
            - "null"
          description: Credits used by this request; 0 when no image was generated.
          examples:
            - 1
        remaining:
          type:
            - integer
            - "null"
          description: Credits remaining in the current period.
          examples:
            - 48
        limit:
          type:
            - integer
            - "null"
          description: Credits available per period.
          examples:
            - 50
      examples:
        - type: image_generation
          used_by_request: 1
          remaining: 48
          limit: 50
    Feature:
      type: string
      description: The add-on a quota applies to.
      enum:
        - image_generation
      examples:
        - image_generation
