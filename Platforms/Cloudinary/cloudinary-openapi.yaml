        - list
      description: Delivery types for assets generated by Cloudinary operations.
    delivery_type_all:
      anyOf:
        - $ref: '#/components/schemas/managed_delivery_type'
        - $ref: '#/components/schemas/asset_delivery_type'
        - $ref: '#/components/schemas/fetch_delivery_type'
        - $ref: '#/components/schemas/social_delivery_type'
        - $ref: '#/components/schemas/generated_delivery_type'
        - type: string
          enum:
            - media_optimization
      description: All supported delivery types.
    destroy_request:
      allOf:
        - $ref: '#/components/schemas/signature_parameters'
        - type: object
          required:
            - public_id
          properties:
            public_id:
              type: string
              description: The public ID of the asset to destroy.
            type:
              $ref: '#/components/schemas/delivery_type_all'
            invalidate:
              type: boolean
              default: false
              description: Whether to invalidate CDN cached copies of the asset.
            notification_url:
              type: string
              format: uri
              description: URL to receive a notification when the operation is complete.
    destroy_response:
      type: object
      properties:
        result:
          type: string
          enum:
            - ok
            - not found
          description: Result of the deletion operation.
    explode_request:
      allOf:
        - $ref: '#/components/schemas/signature_parameters'
        - type: object
          properties:
            public_id:
              type: string
              description: The public ID of the PDF or animated image to generate from.
            format:
              type: string
              description: 'The format for the generated derived images. Default: png'
            transformation:
              type: string
              description: The transformation to apply. Must contain exactly one pg_all transformation parameter.
            notification_url:
              type: string
              format: uri
              description: The webhook URL to notify when the operation is complete.
            type:
              $ref: '#/components/schemas/managed_delivery_type'
              description: 'The delivery type of the asset. Default: upload'
          required:
            - public_id
            - transformation
    explode_response:
      type: object
      properties:
        status:
          type: string
          enum:
            - processing
          description: The status of the explode operation.
        batch_id:
          type: string
          description: The ID of the batch operation.
    explicit_delivery_type:
      anyOf:
        - $ref: '#/components/schemas/managed_delivery_type'
        - $ref: '#/components/schemas/asset_delivery_type'
        - $ref: '#/components/schemas/fetch_delivery_type'
        - $ref: '#/components/schemas/social_delivery_type'
      description: Delivery types accepted by the explicit operation.
    explicit_request:
      allOf:
        - $ref: '#/components/schemas/signature_parameters'
        - $ref: '#/components/schemas/upload_common_parameters'
        - type: object
          properties:
            public_id:
              type: string
              description: The public ID of the existing asset to apply operations on.
            type:
              $ref: '#/components/schemas/explicit_delivery_type'
          required:
            - public_id
        - type: object
          properties:
            overwrite:
              type: boolean
              description: |
                When applying eager for already existing video transformations, this setting indicates whether to force the existing derived video resources to be regenerated. Default for videos: false.
                Note: When specifying existing eager transformations for images, corresponding derived images are always regenerated.
            quality_override:
              description: Override the quality setting for this asset.
              oneOf:
                - type: string
                - type: integer
    public_ids_param:
      type: array
      items:
        type: string
      maxItems: 1000
      description: The public IDs of the assets to apply the operation to. At most 1000 are processed per request; any beyond the first 1000 are ignored rather than rejected. Public IDs that do not exist, or that the caller lacks update permission for, are skipped rather than failing the request, so the returned `public_ids` may be shorter than the requested list.
      example:
        - sample
        - product_image
        - banner_2023
    asset_metadata_common_parameters:
      type: object
      description: Fields common to every bulk metadata-management operation.
      properties:
        public_ids:
          $ref: '#/components/schemas/public_ids_param'
        type:
          allOf:
            - $ref: '#/components/schemas/delivery_type_all'
          description: The delivery type of the assets to operate on. Defaults to `upload`.
      required:
        - public_ids
    tags_update_request:
      description: A tag command plus the assets it applies to.
      allOf:
        - $ref: '#/components/schemas/asset_metadata_common_parameters'
        - type: object
          properties:
            command:
              type: string
              enum:
                - add
                - remove
                - replace
                - remove_all
              description: |-
                The tag operation to apply.

                - `add` adds the given tags, leaving existing tags untouched.
                - `remove` removes the given tags, leaving other tags untouched.
                - `replace` overwrites the full tag list with the given tags.
                - `remove_all` clears every tag. The `tags` field is ignored.
            tags:
              type: array
              items:
                type: string
              description: The tag names to apply. Required for `add`, `remove`, and `replace`; ignored for `remove_all`. A tag name must not contain a comma.
              example:
                - animal
                - dog
          required:
            - command
    public_ids_response:
      type: object
      description: The result of a bulk operation addressed by public ID.
      properties:
        public_ids:
          type: array
          items:
            type: string
          description: The public IDs the operation was actually applied to. Shorter than the requested list when assets were missing, unauthorized, or beyond the 1000-asset limit.
        unauthorized:
          type: array
          items:
            type: string
          description: The public IDs the caller lacks update permission for. Present only when at least one requested asset was unauthorized.
    context_update_request:
      description: A contextual-metadata command plus the assets it applies to.
      allOf:
        - $ref: '#/components/schemas/asset_metadata_common_parameters'
        - type: object
          properties:
            command:
              type: string
              enum:
                - add
                - remove_all
              description: |-
                The contextual-metadata operation to apply.

                - `add` merges the given key-value pairs into each asset's existing context. Keys
                  already present are overwritten; keys not mentioned are left intact. `context`
                  is required.
                - `remove_all` clears all contextual metadata. The `context` field is ignored.
            context:
              allOf:
                - $ref: '#/components/schemas/context_param'
              description: |-
                The key-value pairs to merge. Required for `add`; ignored for `remove_all`.
                An empty value deletes that key rather than storing an empty string, so `"alt="` removes `alt` while leaving other keys intact. Deletes and sets may be combined: `"alt=|owner=new"`.
                A literal `=` or `|` inside a value must be escaped with a prepending backslash, and a literal backslash must be doubled. A double quote must not be escaped.
          required:
            - command
    metadata_update_request:
      description: Structured metadata values plus the assets they apply to.
      allOf:
        - $ref: '#/components/schemas/asset_metadata_common_parameters'
        - type: object
          properties:
            metadata:
              $ref: '#/components/schemas/structured_metadata_param'
            clear_invalid:
              type: boolean
              description: Whether to clear a value already stored on the asset that is no longer valid — for example because its datasource entry was deleted — instead of failing the update for that asset. Applies only to fields governed by an active conditional metadata rule; an invalid value sent in this request is always rejected. Default is false.
          required:
            - metadata
    archive_resource_type:
      type: string
      enum:
        - image
        - video
        - raw
        - all
      description: The type of resources to include in the archive. "image" for images, "video" for videos, "raw" for non-media files, or "all" for mixed types.
    generate_archive_request:
      description: The archive generation parameters.
      allOf:
        - $ref: '#/components/schemas/signature_parameters'
        - type: object
          properties:
            public_ids:
              type: array
              items:
                type: string
              maxItems: 1000
              description: The list of public IDs to include in the archive.
            tags:
              type: array
              items:
                type: string
              maxItems: 20
              description: Tags to filter which assets to include in the archive. Assets matching any of the specified tags are included.
            prefixes:
              type: array
              items:
                type: string
              maxItems: 20
              description: Select all assets where the public ID starts with this prefix.
            type:
              $ref: '#/components/schemas/delivery_type_all'
            transformations:
              type: string
              description: The transformations to apply to the assets before including them in the archive (separated by "|").
            mode:
              type: string
              enum:
                - download
                - create
                - create_and_download
              default: create
              description: |
                The method for generating and delivering the archive. Options:
                download - Generates and delivers the archive file without storing it
                create - Creates and stores the archive as a raw asset, returning URLs in the response
                create_and_download - Creates, stores, and delivers the archive file
            target_format:
              type: string
              enum:
                - zip
                - tgz
              default: zip
              description: The format of the generated archive.
            target_public_id:
              type: string
              description: The public ID to assign to the generated archive, or the filename of the downloaded archive file.
            target_asset_folder:
              type: string
              description: The folder in your product environment where the generated archive should be stored.
            flatten_folders:
              type: boolean
              description: Whether to flatten all files to be in the root of the archive file.
              default: false
            flatten_transformations:
              type: boolean
              description: Whether to flatten the folder structure of the derived assets.
              default: false
            skip_transformation_name:
              type: boolean
              description: Whether to skip adding the transformation details to the file names in the archive.
              default: false
            allow_missing:
              type: boolean
              description: Whether to allow missing assets in the archive. If false, the operation will fail if any asset is not found.
              default: false
            expires_at:
              type: integer
              format: int64
              description: ("download" mode only) Unix timestamp indicating when the generated archive URL should expire.
            use_original_filename:
              type: boolean
              description: Whether to use the original filenames of the assets in the archive instead of public IDs (when available).
              default: false
            async:
              type: boolean
              description: ("create" mode only), specifies whether to generate the archive asynchronously.
              default: false
            notification_url:
              type: string
              format: uri
              description: ("create" mode only), specifies the URL to notify when the archive generation is complete.
            target_tags:
              type: array
              items:
                type: string
              description: A list of tag names to assign to the generated archive.
              example:
                - animal
                - dog
            keep_derived:
              type: boolean
              description: Whether to keep the derived assets used for generating the archive.
              default: false
            fully_qualified_public_ids:
              type: array
              items:
                type: string
              description: A list of fully qualified public IDs (resource_type/type/public_id) to include in the archive.
            search_expression:
              type: string
              description: A search expression to select assets to include in the archive.
            target_filename:
              type: string
              description: The filename for the downloaded archive file. Extension must match target_format (zip or tgz).
            asset_folders:
              anyOf:
                - type: array
                  items:
                    type: string
                  maxItems: 20
                - type: string
              description: A list of asset folder paths to include in the archive, or a single folder path string. Only available when asset folders are enabled for your account.
    generate_archive_response:
      type: object
      properties:
        asset_id:
          $ref: '#/components/schemas/asset_id'
        public_id:
          type: string
          description: The public ID of the generated archive.
        version:
          type: integer
          description: The version number of the generated archive.
        version_id:
          $ref: '#/components/schemas/version_id'
        signature:
          type: string
          description: The API signature for the generated archive.
        resource_type:
          type: string
          description: The type of resource. Always "raw" for generated archives.
        created_at:
          type: string
          format: date-time
          description: The timestamp when the archive was generated.
        tags:
          $ref: '#/components/schemas/tags_response'
          description: The tags assigned to the generated archive.
        bytes:
          type: integer
          description: The size of the generated archive in bytes.
        type:
          type: string
          description: The resource type of the generated archive.
        etag:
          type: string
          description: The ETag of the generated archive.
        placeholder:
          type: boolean
          description: Whether the generated archive is a placeholder.
        url:
          type: string
          description: The HTTP URL for downloading the generated archive.
        secure_url:
          type: string
          description: The HTTPS URL for downloading the generated archive.
        folder:
          type: string
          description: The folder where the archive is stored (only for product environments with Dynamic Folders disabled).
          deprecated: true
          x-speakeasy-deprecation-message: |
            If Dynamic folders mode is enabled on your product environment, this parameter is deprecated, and it's recommended to use the asset_folder parameter.
        resource_count:
          type: integer
          description: The number of unique resources included in the archive.
        file_count:
          type: integer
          description: The total number of files in the archive.
        asset_folder:
          type: string
          description: The folder in your product environment where the archive is stored.
        display_name:
          type: string
          description: The display name of the generated archive.
        missing_public_ids:
          type: array
          items:
            type: string
          description: The list of public IDs that were requested but not found.
        empty_tags:
          type: array
          items:
            type: string
          description: The list of tags that were requested but returned no results.
        empty_prefixes:
          type: array
          items:
            type: string
          description: The list of prefixes that were requested but returned no results.
    destroy_by_asset_id_request:
      type: object
