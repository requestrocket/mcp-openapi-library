  /v2/generate/{cloud_name}/text_to_image:
    summary: Text to image
    description: Generate images from a text prompt.
    parameters:
      - $ref: "#/components/parameters/cloudName"
    post:
      x-speakeasy-mcp:
        name: generate-image
        scopes:
          - builder
        title: Generate an Image
      tags:
        - Generation
      summary: Generate an image from a text prompt
      description: |
        Create any image from a text description with AI: photos, illustrations,
        logos, icons, product shots, banners, ads, social posts, concept art,
        mockups, and images with readable text. One call gives you the best
        image models — Nano Banana, GPT Image, FLUX, Ideogram, Recraft and more.
        Leave out `model` and a strong default is used.

        **Storage is optional.** Get the image at a temporary link without
        saving anything to your account, or keep it in your Media Library, ready
        to deliver, transform and optimize.

        **What you get back.** Each image comes with its URL, size, format and
        the model that made it, either in the response or, for longer jobs, from
        a background task you can check or be notified about. Each generation
        uses Image Generation credits.

        To edit, restyle or combine existing images, use image-to-image
        (`generate-image-from-images`) instead.
      operationId: generate_image
      requestBody:
        required: true
        description: A JSON object containing the generation request parameters.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImageRequest"
            examples:
              BasicExample:
                $ref: "#/components/examples/GenerateImageBasicExample"
              DeclarativeSizeExample:
                $ref: "#/components/examples/GenerateImageDeclarativeSizeExample"
              DimensionsSizeExample:
                $ref: "#/components/examples/GenerateImageDimensionsSizeExample"
              AsyncExample:
                $ref: "#/components/examples/GenerateImageAsyncExample"
              AutoModelExample:
                $ref: "#/components/examples/GenerateImageAutoModelExample"
      responses:
        "200":
          description: Image generated successfully (synchronous).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateImageResult"
              examples:
                Success:
                  $ref: "#/components/examples/GenerateImageSuccessExample"
                SuccessManagedAsset:
                  $ref: "#/components/examples/GenerateImageManagedAssetSuccessExample"
        "202":
          $ref: "#/components/responses/GenerationAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "502":
          $ref: "#/components/responses/ModelUnavailableResponse"
