components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic authentication using Cloudinary API Key and API Secret.
    oauth2:
      type: oauth2
      description: OAuth2 Authorization Code flow for user authentication
      flows:
        authorizationCode:
          authorizationUrl: https://oauth.cloudinary.com/oauth2/auth
          tokenUrl: https://oauth.cloudinary.com/oauth2/token
          scopes:
            asset_management: Allows managing assets, including reading, updating, and deleting.
            upload: Allows uploading new assets.
            media_generation: Generate media
  parameters:
    cloud_name:
      name: cloud_name
      in: path
      required: true
      schema:
        type: string
      description: The cloud name of your product environment.
      example: my_cloud
    upload_resource_type:
      name: resource_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/upload_resource_type'
      description: The type of resource (image, video, raw, or auto).
    resource_type:
      name: resource_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/resource_type'
      description: The type of resource (image, video, or raw).
    public_id_query:
      name: public_id
      in: query
      required: true
      schema:
        type: string
      description: The public ID of the asset.
    delivery_type_query:
      name: type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/managed_delivery_type'
      description: The delivery type of the asset. Default is "upload".
    api_key_query:
      name: api_key
      in: query
      required: false
      schema:
        type: string
      example: '472851639284736'
      description: The API key to use for the request. This is automatically computed by the Cloudinary's SDKs.
    signature_query:
      name: signature
      in: query
      required: false
      schema:
        type: string
      example: c08ed49d293e966cbe613a13d8e9476fdb76817bd668feb5b17001b168579fbc
      description: |
        (Required for signed REST API calls) Used to authenticate the request and based on the parameters you use in the request. When using the Cloudinary SDKs for signed requests, the signature is automatically generated and added to the request. If you manually generate your own signed POST request, you need to manually generate the signature parameter and add it to the request together with the api_key and timestamp parameters.
    timestamp_query:
      name: timestamp
      in: query
      required: false
      schema:
        type: integer
        format: int64
      example: 1623087658
      description: The timestamp to use for the request in unix time. This is automatically computed by the Cloudinary's SDKs.
    archive_resource_type:
      name: resource_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/archive_resource_type'
      description: The type of resource for archive generation (image, video, or raw).
    asset_id_query:
      name: asset_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/asset_id'
      description: The asset ID of the resource. Must be a 32-character hexadecimal string.
      example: f4e6579cf84dd9cf5683b21f5b30c7d9
    max_results_query:
      name: max_results
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 10
      description: The maximum number of results to return. Default is 10.
    next_cursor_query:
      name: next_cursor
      in: query
      required: false
      schema:
        type: string
      description: The cursor for pagination. Use the next_cursor value from a previous response to get the next page of results.
    transformation:
      name: transformation
      in: path
      required: true
      schema:
        type: string
      description: |
        The transformation identifier. Can be either a named transformation (e.g., 'small_profile_thumbnail') or a transformation string (e.g., 'w_100,h_150,c_fill,g_auto').
      examples:
        named:
          summary: Named transformation
          value: small_profile_thumbnail
        string:
          summary: Transformation string
          value: w_100,h_150,c_fill,g_auto
    transformation_name:
      name: transformation
      in: path
      required: true
      schema:
        type: string
      description: The valid transformation name to create.
      example: small_profile_thumbnail
    direction:
      name: direction
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/direction_enum'
      description: The sort direction for the results. Default is "desc".
    delivery_type_all_query:
      name: type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/delivery_type_all'
      description: The delivery type to filter by. When omitted, returns assets of all delivery types.
    prefix:
      name: prefix
      in: query
      required: false
      schema:
        type: string
      description: A public_id prefix. When specified, all assets with that prefix are returned.
    public_ids_query:
      name: public_ids
      in: query
      required: false
      explode: false
      schema:
        type: array
        items:
          type: string
        maxItems: 100
      description: An array of public IDs to return.
      example:
        - sample
        - product_image
        - banner_2023
    tags_query:
      name: tags
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Whether to include the list of tag names assigned to each asset. Default is false.
    next_cursor:
      name: next_cursor
      in: query
      required: false
      schema:
        type: string
      description: Cursor for pagination.
    max_results:
      name: max_results
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
      description: Maximum number of results to return (1-500).
    start_at:
      name: start_at
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: An ISO-8601 formatted timestamp. When specified, returns resources created since that timestamp. Supported only if neither `prefix` nor `public_ids` were passed.
    fields:
      name: fields
      in: query
      required: false
      explode: false
      schema:
        anyOf:
          - type: string
            description: A comma-separated list of field names.
          - type: array
            items:
              $ref: '#/components/schemas/resource_fields_enum'
      description: Additional fields to include in the response. The fields public_id and asset_id are always included.
    asset_folder_query:
      name: asset_folder
      in: query
      required: true
      schema:
        type: string
      description: The full path of the asset folder.
    resource_type_query:
      name: resource_type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/resource_type'
      description: Resource type filter.
    asset_ids_query:
      name: asset_ids
      in: query
      required: true
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/asset_id'
        maxItems: 100
      description: List of asset IDs to retrieve (max 100).
    context_key:
      name: key
      in: query
      required: true
      schema:
        type: string
      description: Context key to filter by.
    context_value:
      name: value
      in: query
      required: false
      schema:
        type: string
      description: Context value to filter by.
    moderation_kind:
      name: moderation_kind
      in: path
      required: true
      schema:
        type: string
        enum:
          - manual
          - webpurify
          - aws_rek
          - aws_rek_video
          - perception_point
          - google_video_moderation
          - duplicate
      description: The type of moderation to filter by.
    moderation_status:
      name: moderation_status
      in: path
      required: true
      schema:
        type: string
        enum:
          - approved
          - rejected
          - pending
          - queued
          - aborted
      description: The moderation status to filter by.
    context_query:
      name: context
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Whether to include key-value pairs of contextual metadata associated with each asset. Default is false.
    metadata_query:
      name: metadata
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Whether to include the structured metadata fields and values assigned to each asset. Default is false.
    moderations_query:
      name: moderations
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Whether to include image moderation status of each asset. Default is false.
    delivery_type_all:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/delivery_type_all'
      description: The delivery type of the asset.
    public_id:
      name: public_id
      in: path
      required: true
      schema:
        type: string
      example: sample
      description: The public ID of the asset.
    colors:
      name: colors
      in: query
      schema:
        type: boolean
        default: false
      required: false
      description: 'Whether to include color information (predominant colors and histogram of 32 leading colors). Default: false.'
    media_metadata:
      name: media_metadata
      in: query
      schema:
        type: boolean
        default: false
      required: false
      description: 'Whether to include IPTC, XMP, and detailed Exif metadata in the response. Default: false.'
    faces:
      name: faces
      in: query
      schema:
        type: boolean
        default: false
      required: false
      description: 'Whether to include a list of coordinates of detected faces. Default: false.'
    quality_analysis:
      name: quality_analysis
      in: query
      schema:
        type: boolean
        default: false
      required: false
      description: 'Whether to return quality analysis scores for the image. Default: false.'
    accessibility_analysis:
      name: accessibility_analysis
      in: query
      schema:
        type: boolean
        default: false
      required: false
      description: 'Whether to return accessibility analysis scores for the image. Default: false.'
    pages:
      name: pages
      in: query
      schema:
        type: boolean
        default: false
      required: false
      description: 'Whether to report the number of pages in multi-page documents (e.g., PDF). Default: false.'
    phash:
      name: phash
      in: query
      schema:
        type: boolean
        default: false
      required: false
      description: 'Whether to include the perceptual hash (pHash) of the uploaded photo for image similarity detection. Default: false.'
    coordinates:
      name: coordinates
      in: query
      schema:
        type: boolean
        default: false
      required: false
      description: 'Whether to include previously specified custom cropping coordinates and faces coordinates. Default: false.'
    versions:
      name: versions
      in: query
      schema:
        type: boolean
        default: false
      required: false
      description: 'Whether to include details of all the backed up versions of the asset. Default: false.'
    max_derived_results:
      name: max_results
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 500
      required: false
      description: 'Maximum number of derived assets to return. Default: 10.'
    derived_next_cursor:
      name: derived_next_cursor
      in: query
      schema:
        type: string
      required: false
      description: The cursor for the next page of derived assets when there are more derived images than max_results.
    asset_id:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/asset_id'
      description: The asset ID of the resource. Must be a 32-character hexadecimal string.
      example: f4e6579cf84dd9cf5683b21f5b30c7d9
    prefix_tags:
      name: prefix
      in: query
      required: false
      schema:
        type: string
      description: Limit the returned tags to those that start with the specified prefix.
    delivery_type:
      name: type
      in: path
      required: true
      schema:
        allOf:
          - $ref: '#/components/schemas/managed_delivery_type'
          - default: upload
      description: The delivery type of the asset.
    folder_path:
      name: folder
      in: path
      required: true
      schema:
        type: string
        pattern: ^(?!.*//)[^/].+(?<!/)$
      description: The full path of the folder, including any nested folders. Must not be empty, and must not contain double slashes or leading/trailing slashes.
      example: product/test
    max_results_folders_query:
      name: max_results
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      description: Maximum number of folders to return (max 500, default 50).
    folder_id:
      name: folder_id
      in: path
      required: true
      schema:
        type: string
      description: The immutable identifier of the folder, returned by the Get root folders and Get subfolders endpoints.
      example: cd7e9d690a014c68ae8b58f08e090cb03a
    permitted_roles_query:
      name: permitted_roles
      in: query
      required: false
      description: |
        Whether to include in the response the roles the authenticated user can assign on this folder, based on their permission level. Default: `false`.
      schema:
        type: boolean
    initial_backup_id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The unique identifier of the initial backup operation.
      example: abc123def456
    cloudName:
      in: path
      name: cloud_name
      description: The cloud name of your Cloudinary product environment.
      schema:
        type: string
        description: Cloud name of the product environment.
        examples:
          - demo
      required: true
      examples:
        default:
          value: demo
  schemas:
    upload_resource_type:
      type: string
      enum:
        - image
        - video
        - raw
        - auto
      description: |
        The type of resource to upload:
        - "image" for uploading strictly images
        - "video" for uploading strictly videos
        - "raw" for uploading non-media files
        - "auto" for allowing Cloudinary to automatically detect the type of the uploaded file
      default: auto
    signature_parameters:
      type: object
      properties:
        api_key:
          type: string
          description: The API key to use for the request. This is automatically computed by the Cloudinary's SDKs.
          example: '472851639284736'
        timestamp:
          type: integer
          format: int64
          description: The timestamp to use for the request in unix time. This is automatically computed by the Cloudinary's SDKs.
          example: 1623087658
        signature:
          type: string
          description: |
            (Required for signed REST API calls) Used to authenticate the request and based on the parameters you use in the request. When using the Cloudinary SDKs for signed requests, the signature is automatically generated and added to the request. If you manually generate your own signed POST request, you need to manually generate the signature parameter and add it to the request together with the api_key and timestamp parameters.
          example: c08ed49d293e966cbe613a13d8e9476fdb76817bd668feb5b17001b168579fbc
      example:
        api_key: '472851639284736'
        signature: c08ed49d293e966cbe613a13d8e9476fdb76817bd668feb5b17001b168579fbc
        timestamp: 1623087658
    access_control_item:
      type: object
      description: Access control rule that defines when and how the asset can be accessed.
      required:
        - access_type
      properties:
        access_type:
          type: string
          enum:
            - token
            - anonymous
          description: The type of access control to apply to the asset.
        key:
          type: string
          pattern: ^[a-zA-Z0-9]+$
          description: The authentication key identifier for token-based access. Default key is used if not specified or if set to 'default'.
          example: prod2024
        start:
          oneOf:
            - type: string
            - type: integer
          description: The start date and time when anonymous access becomes available. Accepts ISO 8601 string or Unix timestamp.
          example: '2024-03-15T09:00:00Z'
        end:
          oneOf:
            - type: string
            - type: integer
          description: The end date and time when anonymous access expires. Accepts ISO 8601 string or Unix timestamp.
          example: '2024-06-30T23:59:59Z'
    access_control:
      type: array
      description: |
        Restricts access to the asset by specifying one or more access types.
        The asset is restricted unless at least one listed access type is valid.
      items:
        $ref: '#/components/schemas/access_control_item'
      example:
        - access_type: token
          key: prod2024
        - access_type: anonymous
          start: '2024-03-15T09:00:00Z'
          end: '2024-06-30T23:59:59Z'
    structured_metadata_value:
      type: object
      description: A map of custom metadata fields (by external_id) and the values to assign to each of them.
      additionalProperties:
        oneOf:
          - type: string
          - type: integer
          - type: array
            items:
              type: string
      example:
        in_stock_id: 50
        color_id:
          - green
          - red
        caption_id: Summer collection
        shot_date_id: '2024-06-15'
    structured_metadata_param:
      description: |
        A pipe-separated list or a map of custom metadata fields (by external_id) and the values to assign to each of them. The = " and | characters can be supported as values when escaped with a prepended backslash (\). For a multi-select field, you can set a maximum of 3000 different metadata values on an asset.
      oneOf:
        - type: string
          description: A pipe-separated list of custom metadata fields (by external_id) and the values to assign to each of them.
          example: in_stock_id=50|color_id=["green","red"]
        - $ref: '#/components/schemas/structured_metadata_value'
    coordinate_pair:
      type: array
      description: A single [x, y] coordinate pair.
      minItems: 2
      maxItems: 2
      items:
        type: integer
    region_coordinates:
      type: array
      description: Coordinate pairs defining the region boundary.
      minItems: 2
      items:
        $ref: '#/components/schemas/coordinate_pair'
    region_mapping:
      type: object
      description: |
        A map of named region coordinate groups for cropping with region gravity.
        Each key is a region name (letters, numbers, or hyphens only).
        Each value is an array of at least two [x, y] integer coordinate pairs
        defining the region boundary.
      additionalProperties:
        $ref: '#/components/schemas/region_coordinates'
      example:
        face:
          -   - 100
              - 200
          -   - 300
              - 400
        body:
          -   - 50
              - 60
          -   - 70
              - 80
          -   - 90
              - 100
    responsive_breakpoint:
      type: object
      properties:
        create_derived:
          type: boolean
          description: Whether to generate and store the derived images. Default is true.
        max_width:
          type: integer
          description: The maximum width for responsive breakpoint images.
        min_width:
          type: integer
          description: The minimum width for responsive breakpoint images.
        bytes_step:
          type: integer
          description: The minimum byte size difference between consecutive breakpoint images.
        max_images:
          type: integer
          description: The maximum number of breakpoint images to generate.
        transformation:
          type: string
          description: A transformation string to apply before generating breakpoints.
    upload_base_parameters:
      type: object
      description: Upload configuration parameters such as access control, backup, moderation, and notification settings.
      properties:
        accessibility_analysis:
          type: boolean
          description: Whether to return accessibility analysis values for the image.
        asset_folder:
          type: string
          description: The asset folder to assign to the asset.
        async:
          type: boolean
          description: |
            When set to true, returns the uploaded asset's public_id immediately in the response, before the upload is completed (asynchronously). Default: false.
        auto_chaptering:
          type: boolean
          description: Whether to trigger automatic generation of video chapters. Chapters will be generated and saved as a .vtt file with -chapters appended to the public ID of the video. You can enable chapters as part of the Cloudinary Video Player. Relevant for videos only.
        auto_tagging:
          type: number
          description: |
            Automatically assigns tags to an asset according to detected objects or categories with a confidence score higher than the specified value.
            Use together with the detection parameter for:
            - Cloudinary AI Content Analysis
            - Amazon Rekognition Celebrity Detection
            Use together with the categorization parameter for:
            - Google Automatic Video Tagging
            - Google Auto Tagging
            - Imagga Auto Tagging
            - Amazon Rekognition Auto Tagging
          example: 0.5
          minimum: 0
          maximum: 1
        auto_transcription:
          oneOf:
            - type: boolean
              description: Whether to trigger automatic generation of video transcription. Transcription will be generated and saved as a .vtt file with -transcription appended to the public ID of the video. Relevant for videos only.
              example: true
            - type: object
              description: Configuration object for automatic video transcription with translation options.
              properties:
                translate:
                  type: array
                  items:
                    type: string
                  description: Array of target language codes for transcription translation.
                  example:
                    - pl-PL
                    - he-IL
              example:
                translate:
                  - pl-PL
                  - he-IL
        access_control:
          $ref: '#/components/schemas/access_control'
        access_mode:
          type: string
          deprecated: true
          x-speakeasy-deprecation-message: The access_mode parameter is no longer supported. To restrict access to assets, you can use the access_control parameter.
          x-speakeasy-deprecation-replacement: access_control
          enum:
            - public
            - authenticated
          description: |
            Deprecated. Use access_control instead. Allows the asset to behave as if it's of the authenticated delivery type while still using the default 'upload' type in delivery URLs. The asset can later be made public by changing its access_mode via the Admin API, without having to update any delivery URLs.
        backup:
          type: boolean
          description: Whether to backup the uploaded asset. When set to true, backs up uploaded assets to a secondary storage bucket.
        background_removal:
          type: string
          description: |
            Automatically remove the background of an image using an add-on.
            - Set to cloudinary_ai to use the deep-learning based Cloudinary AI Background Removal add-on.
              Optionally append a template suffix (e.g., cloudinary_ai:fine_edges).
            - Note: this feature has been superseded by background removal on the fly.
            - Set to pixelz to use the human-powered Pixelz Remove-The-Background Editing add-on service.
            Relevant for images only.
          example: cloudinary_ai
        callback:
          deprecated: true
          x-speakeasy-deprecation-message: The callback parameter is deprecated. Not relevant for modern browsers. Starting July 2025 new customers will not be able to use this parameter.
          type: string
          description: |
            A URL to redirect to after the upload/explicit is completed instead of returning the upload response.
            Signed upload result parameters are added to the callback URL. This parameter is ignored for XHR (Ajax XMLHttpRequest) or JavaScript Fetch API upload requests.
            Note: This parameter is relevant for direct uploads from a form in the browser. It is automatically set if you perform direct upload from the browser using Cloudinary's SDKs and the jQuery plugin.
        categorization:
          type: string
          description: |
            A comma-separated list of the categorization add-ons to run on the asset.
            Set to google_tagging, google_video_tagging, imagga_tagging and/or aws_rek_tagging
            to automatically classify the scenes of the uploaded asset.
            Optionally append a language code suffix (e.g., google_tagging:fr).
          example: google_tagging
        cinemagraph_analysis:
          type: boolean
          description: Whether to return a cinemagraph analysis value for the media asset between 0 and 1, where 0 means the asset is not a cinemagraph and 1 means the asset is a cinemagraph. Relevant for animated images and video only. A static image will return 0.
        colors:
          type: boolean
          description: 'Whether to retrieve predominant colors & color histogram of the uploaded image. Note: If all returned colors are opaque, then 6-digit RGB hex values are returned. If one or more colors contain an alpha channel, then 8-digit RGBA hex quadruplet values are returned.'
          default: false
        detection:
          type: string
          description: |
            Invokes the relevant add-on to return a list of detected content.
            Set to:
            - <content-aware model>_[<version>] (e.g. coco_v2) to return a list of detected content using the Cloudinary AI Content Analysis add-on. Can be used together with the auto_tagging parameter to apply tags automatically.
            - captioning to analyze an image and suggest a caption based on the image's contents.
            - iqa to analyze the quality of an image.
            - watermark-detection to detect watermarks in an image.
            - adv_face to return a list of facial attributes using the Advanced Facial Attribute Detection add-on.
            - aws_rek_face to return a list of detected celebrities and facial attributes using the Amazon Rekognition Celebrity Detection add-on. Can be used together with the auto_tagging parameter to apply tags automatically.
          example: coco_v2
        discard_original_filename:
          type: boolean
          description: Whether to discard the name of the original uploaded file. Relevant when delivering assets as attachments (setting the flag disposition:attachment in delivery URLs).
        display_name:
          type: string
          description: A display name for the asset.
        eager_async:
          type: boolean
          description: Whether to generate the eager transformations asynchronously in the background after the upload request is completed rather than before the upload is completed.
        eager_notification_url:
          type: string
          format: uri
          description: A URL to notify when eager transformations are completed.
        eval:
          type: string
          description: Allows you to modify upload parameters by specifying custom logic with JavaScript. This can be useful for conditionally adding tags, contextual metadata, structured metadata or eager transformations depending on specific criteria of the uploaded file.
        faces:
          type: boolean
          description: Whether to detect faces in the asset.
        filename_override:
          type: string
          description: Overrides the originally uploaded asset's file name in downloads that use flags like fl_attachment or fl_force_original.
        folder:
          type: string
          deprecated: true
          x-speakeasy-deprecation-message: |
            If Dynamic folders mode is enabled on your product environment, this parameter is deprecated, and it's recommended to use the asset_folder parameter to control where the asset will be placed. If you also want your public_id to match the initial asset folder path, include the use_asset_folder_as_public_id_prefixparameter.
          description: Folder name where the uploaded asset will be stored. This parameter applies when using the Admin API, or when specifying the upload preset for unsigned uploading with the Upload API.
        format:
          type: string
          description: An optional format to convert the uploaded asset to before saving in the cloud.
          example: jpg
        invalidate:
          type: boolean
          description: |
            Whether to invalidate CDN cache copies of a previously uploaded asset that shares the same public ID. Default: false.
        media_metadata:
          type: boolean
          description: |
            Whether to return IPTC, XMP, and detailed Exif metadata of the uploaded asset in the response.
            Supported for images, video, and audio.
            - Returned metadata for images includes: PixelsPerUnitX, PixelsPerUnitY, PixelUnits, Colorspace, and DPI.
            - Returned metadata for audio and video includes: audio_codec, audio_bit_rate, audio_frequency, channels, channel_layout.
            - Additional metadata for video includes: pix_format, codec, level, profile, video_bit_rate, dar.
        metadata:
          $ref: '#/components/schemas/structured_metadata_param'
        clear_invalid:
          type: boolean
          description: 'Whether to clear metadata field values that have become invalid due to a change in metadata rules. If false, the API returns an error if any existing metadata value is no longer valid. Default: false.'
          default: false
        moderation:
          type: string
          description: |
            For all asset types, set to:
            - manual to add the uploaded asset to a list of pending assets that can be moderated using the Admin API or the Cloudinary Console.
            - perception_point to automatically moderate the uploaded asset using the Perception Point Malware Detection add-on.

            For images only, set to:
            - webpurify to automatically moderate the uploaded image using the WebPurify Image Moderation add-on.
            - aws_rek to automatically moderate the uploaded image using the Amazon Rekognition AI Moderation add-on.
            - duplicate:<threshold> to detect if the same or a similar image already exists using the Cloudinary Duplicate Image Detection add-on. Set threshold to a float greater than 0 and less than or equal to 1.0 to specify how similar an image needs to be in order to be considered a duplicate. Set threshold to 0 to add an image to the index of images that are searched when duplicate detection is invoked for another image.

            For videos only, set to:
            - aws_rek_video to automatically moderate the uploaded video using the Amazon Rekognition Video Moderation add-on.
            - google_video_moderation automatically moderate the uploaded video using the Google AI Video Moderation add-on.

            To request multiple moderations in a single API call:
            - Send the desired list of moderations as a pipe-separated string with manual moderation, if relevant, being last.

            Note: Rejected assets are automatically invalidated on the CDN within approximately ten minutes.
          example: aws_rek|duplicate:0|perception_point|manual
        notification_url:
          type: string
          format: uri
          description: A URL to notify when the asset is ready.
        ocr:
          type: string
          description: |
            Set to adv_ocr to extract all text elements in an image as well as the bounding box
            coordinates of each detected element using the OCR text detection and extraction add-on.
            Optionally append options (e.g., adv_ocr:document).
          example: adv_ocr
        on_success:
          type: string
          description: Allows you to update an asset by specifying custom logic with JavaScript that is executed after the upload to Cloudinary is completed successfully. This can be useful for conditionally adding tags, contextual metadata, and structured metadata, depending on the results of using the detection parameter on upload.
        overwrite:
          type: boolean
          description: |
            Whether to overwrite existing assets with the same public ID. When set to false, return immediately if an asset with the same public ID already exists. Default: true (when using unsigned upload, the default is false and cannot be changed to true).
        phash:
          type: boolean
          description: |
            Whether to return the perceptual hash (pHash) on the uploaded image for image similarity detection.
        proxy:
          type: string
          description: A proxy to use for fetching remote URLs. The format should be http://hostname:port.
        public_id:
          type: string
          description: The identifier that is used for accessing the uploaded asset. If not specified, a unique ID is generated automatically.
        public_id_prefix:
          type: string
          description: A string or path that's automatically prepended to the public_id with a forward slash. The value can contain the same characters as the public_id including additional forward slashes. This prefix can be useful to provide context and improve the SEO of an asset's filename in the delivery URL, but the value does not impact the location where the asset is stored.
        quality_analysis:
          type: boolean
          description: Whether to return a quality analysis value for the image between 0 and 1, where 0 means the image is blurry and out of focus and 1 means the image is sharp and in focus. Relevant for images only.
        raw_convert:
          type: string
          pattern: ^(aspose|azure_video_indexer(:\D+)*|google_speech(:(vt|sr)t)*(:[a-zA-Z-]+)?|extract_text)$
          description: |
            Generates a related file based on the uploaded file.
            - Set to aspose to automatically create a PDF or other image format from a raw Office document using the Aspose Document Conversion add-on. (Asynchronous)
            - Set to google_speech to instruct the Google AI Video Transcription add-on to generate an automatic transcript raw file from an uploaded video. (Asynchronous)
            - Set to extract_text to extract all the text from a PDF file and store it in a raw JSON file with a public ID in the format: [pdf_public_id].extract_text.json. The full URL of the generated JSON file is included in the API response. Unlike the above raw_convert options, this option doesn't require registering for an add-on.(Synchronous)
            - Set to azure_video_indexer to generate AI-powered video insights from Microsoft Azure. (Asynchronous)
          example: google_speech:vtt:en-US
        regions:
          anyOf:
            - type: string
            - $ref: '#/components/schemas/region_mapping'
          description: |
            Named region coordinate groups for cropping with region gravity.
            Can be a JSON-encoded string or an object. Each region name may contain
            only letters, numbers, or hyphens, and must have at least two coordinate pairs.
          example: '{"face": [[100, 200], [300, 400]], "body": [[50, 60], [70, 80], [90, 100]]}'
        responsive_breakpoints:
          description: Settings to automatically generate breakpoints for responsive images.
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/responsive_breakpoint'
            - $ref: '#/components/schemas/responsive_breakpoint'
        return_delete_token:
          type: boolean
          description: Whether to return a deletion token in the upload response. The token can be used to delete the uploaded asset within approximately 10 minutes using an unauthenticated API call.
        upload_preset:
          type: string
          description: Name of an upload preset that you defined for your Cloudinary product environment. An upload preset consists of upload parameters centrally managed using the Admin API or from the Upload Presets page of the Console Settings.
        use_asset_folder_as_public_id_prefix:
          type: boolean
          description: Whether to add the asset_folder value as a prefix to the public_id value (prepended with a forward slash). This ensures that the public ID path will always match the initial asset folder, and can help to retain the behavior that previously existed in fixed folder mode. However, keep in mind that even when this option is used during upload, an asset with a certain public ID path can later be moved to a completely different asset folder hierarchy without impacting the public ID. This option only ensures path matching for the initial upload. Relevant only when public_id_prefix (or folder) has not been separately specified.
        use_filename:
          type: boolean
          description: |
            Whether to use the original file name of the uploaded asset if available for the public ID. The file name is normalized and random characters are appended to ensure uniqueness if the file name already exists. Default: false.
        use_filename_as_display_name:
          type: boolean
          description: Whether to automatically assign the original filename of the uploaded asset as the asset's display name. Relevant only if the display_name parameter isn't set.
        unique_display_name:
          type: boolean
          description: Whether the display name should be unique.
        unique_filename:
          type: boolean
          description: |
            When set to false and used together with use_filename, if an asset with the same file name already exists, no random characters are appended to the file name. Instead, the asset is overwritten. Default: true (random characters are added to the file name if needed).
        visual_search:
          type: boolean
          description: Whether to index the image for use with visual searches. Relevant for images only.
    tags_param:
      anyOf:
        - type: string
          description: A comma-separated list of tag names.
        - type: array
          items:
            type: string
          description: An array of tag names.
      description: A comma-separated list of tag names, or an array of tag names.
      example: animal,dog
    context_param:
      type: string
      description: A pipe-separated list of key-value pairs of general textual context metadata to attach to the asset (e.g., "alt=My image|caption=Nice photo"). A literal = or | inside a value must be escaped with a prepending backslash, and a literal backslash must be doubled. A double quote must not be escaped.
      example: alt=My image|caption=Nice photo
    upload_serializable_input:
      type: object
      description: Upload parameters that accept encoded string values, such as comma-separated tags, pipe-separated context metadata, and transformation strings.
      properties:
        tags:
          $ref: '#/components/schemas/tags_param'
        context:
          $ref: '#/components/schemas/context_param'
        eager:
          type: string
          description: A list of transformations to eagerly generate for the asset. Accepts either a single transformation or a pipe-separated list of transformations.
        transformation:
          type: string
          description: An incoming transformation to run on the uploaded asset before its storage. In contrast to eager, this parameter is applied before the file is stored.
        allowed_formats:
          type: string
          description: |
            A comma-separated list of file formats that are allowed for uploading. Files of other types will be rejected. The formats can be any combination of image types, video formats or raw file extensions.
            Note: You can also add the `format` parameter to convert other file types instead of rejecting them. In this case, only files that would normally be rejected are converted, any file format allowed for upload won't be converted.
          example: mp4,ogv,jpg,png,pdf
        headers:
          type: string
          description: |
            An HTTP header or a list of headers lines for adding as response HTTP headers when delivering the asset to your users. Supported headers: Link, Authorization, X-Robots-Tag.
          example: 'X-Robots-Tag: noindex'
        face_coordinates:
          type: string
          description: Face coordinates as comma-separated values, with multiple faces separated by pipes.
          pattern: ^(\d+,\d+,\d+,\d+)(\|\d+,\d+,\d+,\d+)*$
          example: 10,20,150,130|213,345,82,61
        custom_coordinates:
          type: string
          description: Custom coordinates as comma-separated values, with multiple coordinates separated by pipes.
          pattern: ^(\d+,\d+,\d+,\d+)(\|\d+,\d+,\d+,\d+)*$
          example: 10,20,150,130
    upload_common_parameters:
      description: Common parameters for configuring an asset, including transformation, tagging, metadata, and moderation options.
      allOf:
        - $ref: '#/components/schemas/upload_base_parameters'
        - $ref: '#/components/schemas/upload_serializable_input'
    managed_delivery_type:
      type: string
      enum:
        - upload
        - private
        - authenticated
      description: Managed delivery types for assets uploaded and stored by Cloudinary.
    asset_delivery_type:
      type: string
      enum:
        - asset
      description: Static asset delivery type.
    upload_delivery_type:
      anyOf:
        - $ref: '#/components/schemas/managed_delivery_type'
        - $ref: '#/components/schemas/asset_delivery_type'
      description: Delivery types accepted by upload and rename operations.
    upload_type_parameter:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/upload_delivery_type'
          description: The delivery type that defines if and how the uploaded asset is available for public delivery. By default, all uploaded assets are public (upload).
    upload_parameters:
      description: Parameters for configuring asset uploads, including transformation, tagging, metadata, and delivery options.
      allOf:
        - $ref: '#/components/schemas/upload_common_parameters'
        - $ref: '#/components/schemas/upload_type_parameter'
    upload_request_parameters:
      type: object
      properties:
        upload_preset:
          type: string
          description: |
            (Required for unsigned uploading / optional for signed uploading)
            Name of an upload preset that you defined for your Cloudinary product environment. An upload preset consists of upload parameters centrally managed using the Admin API or from the Upload Presets page of the Console Settings. An upload preset may be marked as unsigned, which allows unsigned uploading directly from the browser and restricts the optional parameters to: public_id, folder, tags, context, face_coordinates, regions and custom_coordinates.
    binary_upload_request:
      type: object
      allOf:
        - $ref: '#/components/schemas/signature_parameters'
        - $ref: '#/components/schemas/upload_parameters'
        - $ref: '#/components/schemas/upload_request_parameters'
        - type: object
          properties:
            file:
              type: string
              format: binary
              description: |
                The actual data (byte array buffer).
      required:
        - file
    upload_request:
      type: object
      allOf:
        - $ref: '#/components/schemas/signature_parameters'
        - $ref: '#/components/schemas/upload_parameters'
        - $ref: '#/components/schemas/upload_request_parameters'
        - type: object
          properties:
            file:
              type: string
              pattern: ^https?:\/\/|^s3:\/\/|^gcs:\/\/|^ftp:\/\/|^(data:[^;]*;base64,)|^file:\/\/
              description: |
                One of the following:
                - The remote HTTP or HTTPS URL address of an existing file.
                - The Data URI (Base64 encoded), max ~60 MB (62,910,000 chars).
                - The FTP address of an existing file.
                - Local file path starting with file://.
      required:
        - file
    version_id:
      type: string
      pattern: ^([0-9a-f]{32})+$
      description: Hexadecimal version ID; length is a positive multiple of 32 (typically 32 or 64).
    asset_id:
      type: string
      pattern: ^[0-9a-f]{32}$
      description: A 32-character hexadecimal asset ID.
    tags_response:
      type:
        - array
        - 'null'
      items:
        type: string
      description: Tag names assigned to the asset.
    context_full_response:
      type:
        - object
        - 'null'
      description: Contextual metadata grouped by kind. Custom user context appears under the 'custom' key. Other context kinds may also appear as additional keys.
      properties:
        custom:
          type: object
          additionalProperties:
            type: string
          description: User-defined contextual metadata as key-value pairs.
      additionalProperties:
        type: object
        additionalProperties:
          type: string
    faces_response:
      type:
        - array
        - 'null'
      description: Detected face coordinate rectangles [x, y, width, height].
      items:
        type: array
        items:
          type: integer
    coordinates_response:
      type:
        - object
        - 'null'
      description: Coordinate data for faces and custom regions.
      properties:
        faces:
          type: array
          description: Detected face coordinate rectangles [x, y, width, height].
          items:
            type: array
            items:
              type: integer
        custom:
          type: array
          description: Custom coordinate rectangles [x, y, width, height].
          items:
            type: array
            items:
              type: number
    upload_response:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The URL of the uploaded file.
        secure_url:
          type: string
          format: uri
          description: The secure URL of the uploaded file.
        public_id:
          type: string
          description: The public ID of the uploaded file.
        version:
          type: integer
          description: The version of the uploaded file.
        version_id:
          $ref: '#/components/schemas/version_id'
        signature:
          type: string
          description: The signature of the uploaded file.
        width:
          type: integer
          description: The width of the uploaded file.
        height:
          type: integer
          description: The height of the uploaded file.
        asset_id:
          $ref: '#/components/schemas/asset_id'
        format:
          type: string
          description: The format of the uploaded file.
        resource_type:
          type: string
          description: The type of resource that was uploaded.
        created_at:
          type: string
          format: date-time
          description: The date and time the file was uploaded.
        tags:
          $ref: '#/components/schemas/tags_response'
          description: The tags of the uploaded file.
        context:
          $ref: '#/components/schemas/context_full_response'
        metadata:
          type: object
          additionalProperties: true
          description: Structured metadata associated with the uploaded file.
        pages:
          type: integer
          description: The number of pages in the uploaded file.
        bytes:
          type: integer
          description: The size of the uploaded file in bytes.
        type:
          type: string
          description: The type of the uploaded file.
        etag:
          type: string
          description: The ETag of the uploaded file.
        placeholder:
          type: boolean
          description: Whether the uploaded file is a placeholder.
        original_filename:
          type: string
          description: The original filename of the uploaded file.
        image_metadata:
          type: object
          description: The image metadata of the uploaded file.
        illustration_score:
          type: number
          description: The illustration score of the uploaded file.
        semi_transparent:
          type: boolean
          description: Whether the uploaded file is semi-transparent.
        grayscale:
          type: boolean
          description: Whether the uploaded file is grayscale.
        faces:
          $ref: '#/components/schemas/faces_response'
        coordinates:
          $ref: '#/components/schemas/coordinates_response'
        eager:
          type: array
          items:
            type: object
            properties:
              transformation:
                type: string
              width:
                type: integer
              height:
                type: integer
              bytes:
                type: integer
              format:
                type: string
              url:
                type: string
              secure_url:
                type: string
        asset_folder:
          type:
            - string
            - 'null'
          description: The asset folder where the file is stored.
        display_name:
          type: string
          description: The display name of the uploaded file.
        api_key:
          type: string
          description: The API key used to upload the file.
      example:
        asset_id: 3515c6000a548515f1134043f9785c2f
        public_id: gotjephlnz2jgiu20zni
        version: 1719307544
        version_id: 7d2cc533bee9ff39f7da7414b61fce7e
        signature: d0b1009e3271a942836c25756ce3e04d205bf754
        width: 1920
        height: 1441
        format: jpg
        resource_type: image
        created_at: '2024-06-25T09:25:44Z'
        tags: []
        pages: 1
        bytes: 896838
        type: upload
        etag: 2a2df1d2d2c3b675521e866599273083
        placeholder: false
        url: http://res.cloudinary.com/cld-docs/image/upload/v1719307544/gotjephlnz2jgiu20zni.jpg
        secure_url: https://res.cloudinary.com/cld-docs/image/upload/v1719307544/gotjephlnz2jgiu20zni.jpg
        asset_folder: ''
        display_name: gotjephlnz2jgiu20zni
        image_metadata:
          JFIFVersion: '1.01'
          ResolutionUnit: None
          XResolution: '1'
          YResolution: '1'
          Colorspace: RGB
          DPI: '0'
        illustration_score: 0
        semi_transparent: false
        grayscale: false
        original_filename: sample
        eager:
          - transformation: c_pad,h_300,w_400
            width: 400
            height: 300
            bytes: 26775
            format: jpg
            url: http://res.cloudinary.com/cld-docs/image/upload/c_pad,h_300,w_400/v1719307544/gotjephlnz2jgiu20zni.jpg
            secure_url: https://res.cloudinary.com/cld-docs/image/upload/c_pad,h_300,w_400/v1719307544/gotjephlnz2jgiu20zni.jpg
        api_key: '614335564976464'
    resource_type:
      type: string
      enum:
        - image
        - video
        - raw
      description: The type of resource.
    async_upload_response:
      type: object
      description: Response returned when an upload is processed asynchronously (async=true)
      required:
        - status
        - batch_id
        - type
      properties:
        status:
          type: string
          enum:
            - pending
          description: The status of the asynchronous upload. Will be 'pending' for async uploads.
        resource_type:
          $ref: '#/components/schemas/resource_type'
          description: The type of resource being uploaded. This field may be omitted if resource_type is not known at the time of the call.
        type:
          $ref: '#/components/schemas/upload_delivery_type'
          default: upload
          description: The delivery type of the asset. Defaults to 'upload'.
        public_id:
          type: string
          description: The public ID assigned to the upload. May be omitted if it will be auto-generated.
        batch_id:
          type: string
          description: A unique identifier for the asynchronous upload job.
        requester_ip:
          type: string
          description: The IP address of the requester. This is only included if a product environment has requester_ip tracking enabled.
      example:
        status: pending
        resource_type: image
        type: upload
        public_id: sample_image
        batch_id: 9c2f5a46b3a6c4d9e8f7g0h1i2j3k4l5
    html_redirect:
      type: string
      description: HTML redirect response
      example: <html><body>You are being <a href="http://example.cloudinary.com?bytes=5243000&amp;done=false&amp;kind=upload&amp;resource_type=image">redirected</a>.</body></html>
    api_error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
          required:
            - message
      required:
        - error
    non_final_chunk_upload_response:
      type: object
      description: |
        Status information returned for in-progress chunked uploads.
        Note that fields that are not yet determined or not known at the time of the call are omitted from the response.
      required:
        - done
        - bytes
      properties:
        done:
          type: boolean
          description: Whether the upload is complete. Will be false for all but the last chunk.
        bytes:
          type: integer
          description: The total number of bytes uploaded so far.
        kind:
          $ref: '#/components/schemas/upload_delivery_type'
          description: The delivery type of the asset. Defaults to 'upload'.
        resource_type:
          type: string
          description: The type of resource being uploaded (e.g., "image", "video", "raw"). May be omitted in early chunks when using auto detection.
        public_id:
          type: string
          description: The public ID assigned to the upload. May be omitted in early chunks if it will be auto-generated upon completion.
      example:
        done: false
        bytes: 1000000
        kind: upload
        resource_type: image
        public_id: sample_image
    rename_request:
      description: The rename request parameters.
      allOf:
        - $ref: '#/components/schemas/signature_parameters'
        - type: object
          properties:
            from_public_id:
              type: string
              description: The public ID of the asset to rename.
            to_public_id:
              type: string
              description: The new public ID for the asset.
            type:
              description: The current delivery type of the asset.
              allOf:
                - $ref: '#/components/schemas/upload_delivery_type'
            to_type:
              description: The target delivery type for the renamed asset. If omitted, the delivery type remains unchanged.
              allOf:
                - $ref: '#/components/schemas/upload_delivery_type'
            overwrite:
              type: boolean
              description: Whether to overwrite the target asset if it already exists. Default is false.
              default: false
            invalidate:
              type: boolean
              description: Whether to invalidate CDN cache copies of the renamed asset. Default is false.
              default: false
            context:
              type: boolean
              description: Whether to include contextual metadata in the response. Default is false.
              default: false
            metadata:
              type: boolean
              description: Whether to include structured metadata in the response. Default is false.
              default: false
            notification_url:
              type: string
              format: uri
              description: URL to notify when the operation is complete.
          required:
            - from_public_id
            - to_public_id
    fetch_delivery_type:
      type: string
