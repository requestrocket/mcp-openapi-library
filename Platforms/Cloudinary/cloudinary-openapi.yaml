        sort_by:
          $ref: '#/components/schemas/search_sort_by'
        max_results:
          type: integer
          maximum: 500
          default: 50
          description: Maximum number of folders to return (max 500, default 50).
        next_cursor:
          type: string
          description: When more results are available, use the next_cursor value from the previous response.
    principal_type:
      type: string
      enum:
        - user
        - group
        - apiKey
      description: The type of principal.
    folder_role:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the role.
          example: cld::role::folder::viewer
        name:
          type: string
          description: The human-readable name of the role.
          example: Manager
        description:
          type: string
          description: A summary of the permissions granted by this role.
          example: Editor permissions, plus delete, share, and full download access.
        inherited:
          type: boolean
          description: Indicates whether this role is inherited from an ancestor folder. If false, it's assigned directly to the requested folder.
          example: false
      required:
        - id
        - name
        - description
        - inherited
    folder_role_assignment:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/principal_type'
          example: user
        id:
          type: string
          description: The unique identifier of the principal. For `apiKey`, provide the API key value.
          example: cec735fd65b7d541f35d9f661d130f
        folder_id:
          type: string
          description: The ID of the folder where this role assignment was defined, either the requested folder or one of its ancestor folders.
          example: cd7e9d690a014c68ae8b58f08e090cb03a
        roles:
          type: array
          description: The roles assigned to this principal for this folder.
          items:
            $ref: '#/components/schemas/folder_role'
      required:
        - type
        - id
        - folder_id
        - roles
    permitted_role:
      type: object
      properties:
        id:
          type: string
          description: The role identifier.
          example: cld::role::folder::manager
        name:
          type: string
          description: The human-readable name of the role.
          example: Manager
        description:
          type: string
          description: A description of the role's permissions.
          example: Editor permissions, plus delete, share, and full download access.
      required:
        - id
        - name
        - description
    folder_roles_response:
      type: object
      properties:
        shared_with:
          type: array
          description: An array of principals (users, groups, or API keys) with their role assignments on this folder, including roles inherited from ancestor folders.
          items:
            $ref: '#/components/schemas/folder_role_assignment'
        permitted_roles:
          type: array
          description: The roles the authenticated user can assign on this folder. Users can assign only roles at or below their own permission level for this folder. Returned only when `include_assignable_roles` is true.
          items:
            $ref: '#/components/schemas/permitted_role'
      example:
        shared_with:
          - type: user
            id: cec735fd65b7d541f35d9f661d130f
            folder_id: cd7e9d690a014c68ae8b58f08e090cb03a
            roles:
              - id: cld::role::folder::viewer
                description: View and download public assets.
                name: Viewer
                inherited: false
        permitted_roles:
          - id: cld::role::folder::viewer
            name: Viewer
            description: View and download public assets.
          - id: cld::role::folder::contributor
            name: Contributor
            description: Viewer permissions, plus add assets and create subfolders.
    assign_folder_roles_request:
      type: object
      properties:
        principal:
          type: object
          description: The user, group, or API key whose role assignments are being modified.
          properties:
            type:
              $ref: '#/components/schemas/principal_type'
              example: apiKey
            id:
              type: string
              description: The unique identifier of the principal. For `apiKey`, provide the API key value.
              example: '799451857115779'
          required:
            - type
            - id
        operation:
          type: string
          enum:
            - add
            - remove
          description: The operation to perform on the principal’s role assignments. `add` grants the specified roles; `remove` revokes them.
          example: add
        roles:
          type: array
          description: The role IDs to add or remove.
          items:
            type: string
          maxItems: 10
          example:
            - cld::role::folder::viewer
      required:
        - principal
        - operation
        - roles
      example:
        principal:
          id: '799451857115779'
          type: apiKey
        operation: add
        roles:
          - cld::role::folder::contributor
    folder_rename_request:
      type: object
      description: The source and destination folder paths.
      properties:
        path:
          type: string
          description: The full path of the folder to rename or move.
          example: product/test
        to_path:
          type: string
          description: The new full path for the folder.
          example: product/test_renamed
        resources_limit:
          type: integer
          description: The maximum number of assets that may be moved by the rename. Assets beyond this limit cause the rename to be rejected.
          example: 100000
        resources_size_limit:
          type: integer
          description: The maximum total size, in bytes, of the assets that may be moved by the rename.
          example: 1099511627776
        max_derived:
          type: integer
          description: The maximum number of derived assets that may be moved by the rename.
          example: 1000000
      required:
        - path
        - to_path
    folder_rename_response:
      type: object
      description: The result of renaming or moving a folder.
      properties:
        folder_deleted:
          type: boolean
          description: Whether the source folder was deleted after the move.
        moved:
          type: integer
          description: The number of assets successfully moved.
        rejected:
          type: integer
          description: The number of assets rejected during the move.
        failed:
          type: integer
          description: The number of assets that failed to move.
    folder_by_id_request:
      type: object
      description: The identifier of the folder to retrieve.
      properties:
        id:
          type: string
          description: The immutable identifier of the folder to retrieve.
          example: cd7e9d690a014c68ae8b58f08e090cb03a
      required:
        - id
    folder_detail_response:
      description: |
        The details of a folder. Returns the standard folder fields plus aggregation and ancestor
        fields when available.
      allOf:
        - $ref: '#/components/schemas/folder'
        - type: object
          properties:
            resource_count:
              type: integer
              description: The number of assets directly within the folder.
            total_bytes:
              type: number
              description: The total size, in bytes, of the assets within the folder.
            last_uploaded_at:
              type:
                - integer
                - 'null'
              description: The Unix timestamp of the most recent upload into the folder.
            ancestors:
              type: array
              description: The ancestor folders of this folder, ordered from root to parent.
              items:
                $ref: '#/components/schemas/folder'
          additionalProperties: true
    folder_by_path_request:
      type: object
      description: The path of the folder to retrieve.
      properties:
        path:
          type: string
          description: The full path of the folder to retrieve. Use an empty string for the root folder.
          example: product/test
        case_sensitive:
          type: boolean
          description: Whether to match the folder path case-sensitively. If false, the path is matched case-insensitively.
      required:
        - path
    folder_descendants_request:
      type: object
      description: The parent folder identifier and optional descendant filter.
      properties:
        id:
          type: string
          description: The immutable identifier of the parent folder whose descendants are returned.
          example: cd7e9d690a014c68ae8b58f08e090cb03a
        filter_ids:
          type: array
          description: A list of folder identifiers to restrict the returned descendants to.
          items:
            type: string
        inclusive:
          type: boolean
          description: Whether to include the parent folder itself in the results. If false, only descendants are returned.
      required:
        - id
    folder_descendants_response:
      type: object
      description: The descendant folders of a folder.
      properties:
        folders:
          type: array
          description: The descendant folders.
          items:
            $ref: '#/components/schemas/folder_detail_response'
      required:
        - folders
    DerivedDestroyRequest:
      type: object
      description: Request parameters for deleting derived resources
      properties:
        derived_resource_ids:
          type: array
          items:
            type: string
          description: Array of derived resource IDs to delete specific derived resources
          example:
            - 1234567890abcdef
            - fedcba0987654321
        invalidate:
          type: boolean
          description: Whether to invalidate the CDN cache for the deleted resources
          example: true
      required:
        - derived_resource_ids
    DerivedDestroyResponse:
      type: object
      description: Response for derived resource deletion
      properties:
        deleted:
          type: object
          additionalProperties:
            type: string
            enum:
              - deleted
              - not_found
          description: Map of derived resource IDs to deletion status
          example:
            1234567890abcdef: deleted
            fedcba0987654321: not_found
        unauthorized:
          type: array
          items:
            type: string
          description: Array of derived resource IDs that were not authorized to be deleted
        invalidation:
          type: object
          properties:
            took:
              type: number
              description: Time taken for CDN invalidation in seconds
              example: 25
            urls:
              type: array
              items:
                type: string
              description: Array of URLs that were invalidated
              example:
                - /image/upload/w_100/sample
                - /image/upload/w_200/sample
    invalidate_by_urls_request:
      type: object
      description: The set of delivery URLs whose derived assets should be invalidated.
      properties:
        urls:
          type: array
          description: The delivery URLs whose cached derived assets should be invalidated.
          items:
            type: string
          example:
            - https://res.cloudinary.com/demo/image/upload/w_100/sample.jpg
        skip_reporting:
          type: boolean
          description: Whether to skip recording this invalidation against the product environment usage. If false, the invalidation is counted towards usage. Default is false.
      required:
        - urls
    invalidate_by_urls_response:
      type: object
      description: The result of invalidating derived assets by delivery URLs.
      properties:
        cdn_invalidated:
          type: boolean
          description: Whether the assets were invalidated directly on the CDN.
        took:
          type: number
          description: The time the invalidation took, in seconds.
        urls:
          type: array
          description: The delivery URLs that were invalidated.
          items:
            type: string
        unauthorized_urls:
          type: array
          description: The delivery URLs that were skipped because the caller lacked update permission.
          items:
            type: string
    resource_get_by_body_request:
      type: object
      description: The identifying attributes of the asset to retrieve.
      properties:
        public_id:
          type: string
          description: The public ID of the asset to retrieve.
          example: sample
        resource_type:
          allOf:
            - $ref: '#/components/schemas/resource_type'
          description: The type of the asset (image, video, or raw).
          example: image
        kind:
          allOf:
            - $ref: '#/components/schemas/managed_delivery_type'
          description: The delivery type of the asset.
          example: upload
        with_elastic:
          type: boolean
          description: Whether to source the asset details from the search index. If false, the details are read directly from the canonical store. Default is true.
        derived:
          type: boolean
          description: Whether to include the derived assets of this asset in the response. Default is true.
        versions:
          type: boolean
          description: Whether to include the backup versions of this asset in the response. Default is false.
      required:
        - public_id
        - resource_type
        - kind
      additionalProperties: true
    resource_internal_response:
      description: |
        The details of a single asset. Returns the standard asset fields, plus additional
        internal fields when accessed over the internal transport.
      allOf:
        - $ref: '#/components/schemas/info'
        - type: object
          additionalProperties: true
    admin_context_operation:
      type: object
      description: A single internal contextual-metadata operation.
      properties:
        name:
          type: string
          description: The context key to operate on.
        value:
          type: array
          description: The value(s) to apply for the context key.
          items:
            type: string
        type:
          type: string
          description: The value type of the context entry.
        op:
          type: string
          description: The operation to apply to the context key (for example, "+" to add or "-" to remove).
      required:
        - name
    resource_update_by_body_request:
      type: object
      description: |
        The asset identifiers plus the attributes to update. The identifying fields (public_id,
        resource_type, kind) are required; the remaining update fields are optional. Additional
        fields accepted by the asset update API are permitted.
      properties:
        public_id:
          type: string
          description: The public ID of the asset to update.
          example: sample
        resource_type:
          allOf:
            - $ref: '#/components/schemas/resource_type'
          description: The type of the asset (image, video, or raw).
          example: image
        kind:
          allOf:
            - $ref: '#/components/schemas/managed_delivery_type'
          description: The delivery type of the asset.
          example: upload
        tags:
          type: array
          description: The list of tags to assign to the asset, replacing any existing tags.
          items:
            type: string
        context:
          type: object
          additionalProperties: true
          description: The key-value pairs of contextual metadata to assign to the asset.
        metadata:
          type: object
          additionalProperties: true
          description: The structured metadata field values to assign to the asset.
        asset_folder:
          type: string
          description: The asset folder to move the asset into.
        display_name:
          type: string
          description: The display name to assign to the asset.
        moderation_status:
          type: string
          enum:
            - pending
            - approved
            - rejected
          description: The moderation status to set on the asset.
        admin_context:
          type: array
          description: |
            Internal-only contextual metadata operations applied with add/remove semantics. Each
            entry names a context key, the value(s) to apply, the value type, and the operation.
          items:
            $ref: '#/components/schemas/admin_context_operation'
        response_type:
          type: string
          description: The shape of the asset representation to return (for example, "public").
        skip_permission_check:
          type: boolean
          description: Whether to skip permission enforcement for the update. Internal use only. Default is false.
      required:
        - public_id
        - resource_type
        - kind
      additionalProperties: true
    resources_by_container_id_response:
      type: object
      description: A page of assets contained in a folder, with pagination metadata.
      properties:
        resources:
          type: array
          description: The assets contained in the folder.
          items:
            $ref: '#/components/schemas/resource_internal_response'
        total_count:
          type: integer
          description: The total number of assets in the folder.
        next_cursor:
          type: string
          description: A cursor for retrieving the next page of results, when more results are available.
      required:
        - resources
    eval_request:
      type: object
      description: |
        The eval expression and the upload parameters to evaluate it against. The `eval` field holds
        the dynamic expression; any other upload parameters may be supplied alongside it.
      properties:
        eval:
          type: string
          description: The dynamic eval expression to evaluate against the upload parameters.
          example: upload_options.quality_analysis = resource_info.quality_score * 100
        public_id:
          type: string
          description: The public ID of the asset the eval expression applies to.
      required:
        - eval
      additionalProperties: true
    eval_response:
      type: object
      description: The upload parameters resulting from evaluating the eval expression.
      additionalProperties: true
    search_parameters:
      type: object
      description: Common parameters for resource search operations.
      properties:
        expression:
          type: string
          description: |
            The Lucene-like search expression. Supports token match (`field:value`), exact match (`field=value`), trailing `*` for prefix match, ranges (`[a TO b]`, `{a TO b}`), and comparisons (`>`, `<`, `>=`, `<=`). Combine terms with uppercase `AND`, `OR`, `NOT`, or `+`/`-`, and group with parentheses. Wrap values containing reserved characters (spaces, colons, etc.) in double quotes. See the [search expressions guide](https://cloudinary.com/documentation/search_expressions.md) for the full syntax and supported fields.
          example: resource_type:image AND tags:kitten
          examples:
            - tags:shirt AND uploaded_at>1d
            - resource_type:image AND bytes>1000000 AND (format:png OR format:jpg)
            - folder:products AND context.category:electronics
            - tags:"service:mantels" AND -tags:discontinued
        sort_by:
          $ref: '#/components/schemas/search_sort_by'
        max_results:
          type: integer
          minimum: 0
          maximum: 500
          description: |
            The maximum number of results to return. Default - 50. Maximum - 500.
            Set to `0` to get only `total_count` and `aggregations` without any resources in the response — useful for counting or aggregation-only queries.
          example: 30
        next_cursor:
          type: string
          description: The cursor value to get the next page of results. Available when a previous search returned more results than max_results.
        aggregate:
          description: |
            Fields or ranges to aggregate search results by. Requires a Tier 2 search plan; on Tier 1 the field is accepted but aggregations are omitted from the response.
          oneOf:
            - type: array
              items:
                type: string
                enum:
                  - format
                  - resource_type
                  - type
              description: The fields to aggregate results by. Simple aggregation by field name.
              example:
                - format
                - resource_type
            - type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - bytes
                      - image_pixels
                      - video_pixels
                      - duration
                  ranges:
                    type: array
                    description: |
                      One or more ranges for the numeric field. Each range must include a `key` label and at least one of `from` / `to`.
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          minLength: 1
                          maxLength: 20
                          pattern: ^[a-zA-Z0-9_-]+$
                          description: A label for the bucket, returned in the aggregation response. 1–20 chars, alphanumeric plus `-` and `_`.
                          example: small
                        from:
                          type: number
                          description: Start of the range (inclusive). At least one of `from` / `to` is required.
                        to:
                          type: number
                          description: End of the range (exclusive). At least one of `from` / `to` is required.
                      required:
                        - key
                required:
                  - type
                  - ranges
              description: Range-based aggregations for numeric fields
              example:
                - type: bytes
                  ranges:
                    - key: small
                      from: 0
                      to: 10000
                    - key: medium
                      from: 10000
                      to: 100000
        with_field:
          type: array
          items:
            type: string
            enum:
              - context
              - tags
              - image_metadata
              - image_analysis
              - metadata
              - quality_analysis
              - accessibility_analysis
            x-enum-descriptions:
              - Includes the `context` key-value pairs attached to each asset.
              - Includes the list of `tags` attached to each asset.
              - Includes embedded metadata extracted from the asset file (EXIF, IPTC, XMP under `image_metadata`). Tier 2 feature.
              - Includes analysis results such as `colors`, `face_count`, `illustration_score`, and `grayscale` under `image_analysis`. Tier 2 feature.
              - Includes values of structured metadata fields under `metadata`. Tier 2 feature.
              - Includes `quality_analysis.*` scores for assets analyzed at upload time.
              - Includes `accessibility_analysis.*` scores for assets analyzed at upload time.
          description: |
            The additional asset attributes to include in each search result. The `fields` parameter takes precedence over this parameter. `image_metadata`, `image_analysis`, and `metadata` require a Tier 2 search plan.
          example:
            - tags
            - context
        fields:
          type: string
          description: |
            A comma-separated list of fields to include in the response.
            Notes:
            - This parameter takes precedence over the with_field parameter, so if you want any additional asset attributes returned, make sure to also include them in this list (e.g., tags or context).
            - The following fields are always included in the response: public_id, asset_id, asset_folder, created_at, status, type, and resource_type.
          example: tags,context,metadata
    search_response:
      type: object
      description: The response object returned by search operations.
      properties:
        total_count:
          type: integer
          description: The total number of resources matching the search criteria.
          example: 42
        time:
          type: integer
          description: The time taken to execute the search query in milliseconds.
          example: 42
        resources:
          type: array
          description: The list of resources matching the search criteria. Can be empty if no results found.
          items:
            type: object
            description: Resource fields that can be returned. All fields are optional and can be filtered using the fields parameter.
            properties:
              asset_id:
                type: string
                description: The unique identifier of the asset.
                example: 09169cf604b03521789d1b3b8cca53d1
              public_id:
                type: string
                description: The public identifier that is used to build the URL.
                example: blue_sweater
              asset_folder:
                type: string
                description: The folder where the asset is stored.
                example: Clothing Sale
              filename:
                type: string
                description: The original filename of the asset.
                example: blue_sweater
              display_name:
                type: string
                description: The display name of the asset.
                example: blue_sweater
              format:
                type:
                  - string
                  - 'null'
                description: The format of the asset. Null for raw assets, which have no format.
                example: jpg
              version:
                type: integer
                description: The version number of the asset.
                example: 1719316754
              resource_type:
                type: string
                description: The type of resource.
                enum:
                  - image
                  - video
                  - raw
                example: image
              type:
                $ref: '#/components/schemas/delivery_type_all'
              created_at:
                type: string
                format: date-time
                description: The timestamp when the asset was created.
                example: '2024-06-25T11:59:14+00:00'
              uploaded_at:
                type: string
                format: date-time
                description: The timestamp when the asset was uploaded.
                example: '2024-06-25T11:59:14+00:00'
              bytes:
                type: integer
                description: The size of the asset in bytes.
                example: 71063
              backup_bytes:
                type: integer
                description: The size of the backup asset in bytes.
                example: 71063
              width:
                type:
                  - integer
                  - 'null'
                description: The width of the asset in pixels. Null for non-visual assets (e.g. raw, audio).
                example: 4800
              height:
                type:
                  - integer
                  - 'null'
                description: The height of the asset in pixels. Null for non-visual assets (e.g. raw, audio).
                example: 6400
              aspect_ratio:
                type:
                  - number
                  - 'null'
                format: float
                description: The aspect ratio of the asset (width/height). Null for non-visual assets (e.g. raw, audio).
                example: 0.75
              pixels:
                type:
                  - integer
                  - 'null'
                description: The total number of pixels in the asset. Null for non-visual assets (e.g. raw, audio).
                example: 307200
              url:
                type: string
                format: uri
                description: The HTTP URL for accessing the asset.
                example: http://res.cloudinary.com/demo/image/upload/v1719316754/blue_sweater.jpg
              secure_url:
                type: string
                format: uri
                description: The HTTPS URL for accessing the asset.
                example: https://res.cloudinary.com/demo/image/upload/v1719316754/blue_sweater.jpg
              status:
                type: string
                description: The current status of the asset.
                enum:
                  - active
                  - inactive
                  - deleted
                  - pending
                example: active
              access_mode:
                type:
                  - string
                  - 'null'
                description: The access mode of the asset. Null when not explicitly set.
                enum:
                  - public
                  - authenticated
                  - 
                example: public
              access_control:
                anyOf:
                  - $ref: '#/components/schemas/access_control'
                  - type: 'null'
                description: The access control settings for the asset.
                example:
              etag:
                type: string
                description: The ETag of the asset.
                example: 7242da7b353e7da2c3eb8c006165b385
              created_by:
                type:
                  - object
                  - 'null'
                description: Information about who created the asset.
                properties:
                  access_key:
                    type: string
                    description: The access key of the user who created the asset.
                    example: '614335564976464'
              uploaded_by:
                type:
                  - object
                  - 'null'
                description: Information about who uploaded the asset.
                properties:
                  access_key:
                    type: string
                    description: The access key of the user who uploaded the asset.
                    example: '614335564976464'
              context:
                allOf:
                  - $ref: '#/components/schemas/context_response'
                description: Custom context metadata associated with the asset.
              tags:
                allOf:
                  - $ref: '#/components/schemas/tags_response'
                description: Tags associated with the asset.
              image_metadata:
                type:
                  - object
                  - 'null'
                description: Technical metadata extracted from the image.
              image_analysis:
                type:
                  - object
                  - 'null'
                description: Results of image analysis.
              metadata:
                type:
                  - object
                  - 'null'
                description: Structured metadata associated with the asset.
              quality_analysis:
                type:
                  - object
                  - 'null'
                description: Results of quality analysis.
              accessibility_analysis:
                type:
                  - object
                  - 'null'
                description: Results of accessibility analysis.
        next_cursor:
          type:
            - string
            - 'null'
          description: A cursor for pagination. Only included when there are more results available.
          example: e4d03a236b27e306e56719f74d05cdef
        aggregations:
          type: object
          description: Aggregation results when the aggregate parameter is used in the request. Only included when aggregations are requested.
          properties:
            values:
              type: array
              description: Array of aggregation values when using simple aggregation (e.g., by format, resource_type, etc.)
              items:
                type: object
                properties:
                  value:
                    type: string
                    description: The value being aggregated
                    example: jpg
                  count:
                    type: integer
                    description: The count of resources with this value
                    example: 42
            ranges:
              type: array
              description: Array of range-based aggregation results when using range aggregation (e.g., bytes, width, height, etc.)
              items:
                type: object
                properties:
                  from:
                    type: number
                    description: Start of the range (inclusive)
                    example: 0
                  to:
                    type: number
                    description: End of the range (exclusive)
                    example: 1048576
                  count:
                    type: integer
                    description: The count of resources within this range
                    example: 17
    visual_search_parameters:
      description: Parameters for visual search operations
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - image_url
          properties:
            image_url:
              type: string
              format: uri
              description: The URL of an image to use as the source for finding visually similar images
              example: https://res.cloudinary.com/demo/image/upload/sample.jpg
            threshold:
              type: number
              minimum: 0
              maximum: 1
              description: The minimum similarity score (between 0 and 1.0) that a resource must have to be included in the response
              example: 0.8
        - type: object
          additionalProperties: false
          required:
            - image_asset_id
          properties:
            image_asset_id:
              type: string
              description: The asset ID of an existing image to use as the source for finding visually similar images
              example: 09169cf604b03521789d1b3b8cca53d1
            threshold:
              type: number
              minimum: 0
              maximum: 1
              description: The minimum similarity score (between 0 and 1.0) that a resource must have to be included in the response
              example: 0.8
        - type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              description: A textual description to find visually similar images
              example: shirts
            threshold:
              type: number
              minimum: 0
              maximum: 1
              description: The minimum similarity score (between 0 and 1.0) that a resource must have to be included in the response
              example: 0.8
    initial_backup_status_enum:
