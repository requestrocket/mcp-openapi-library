          type: boolean
          description: 'Whether to clear invalid metadata fields. If false, invalid fields will be preserved. Default: false'
          default: false
        face_coordinates:
          type: string
          description: Face coordinates as comma-separated values, with multiple faces separated by pipes.
          pattern: ^(\d+,\d+,\d+,\d+)(\|\d+,\d+,\d+,\d+)*$
          example: 10,20,150,130|213,345,82,61
        custom_coordinates:
          type: string
          description: Custom coordinates as comma-separated values, with multiple coordinates separated by pipes.
          pattern: ^(\d+,\d+,\d+,\d+)(\|\d+,\d+,\d+,\d+)*$
          example: 10,20,150,130|213,345,82,61
        regions:
          type: string
          description: A JSON-encoded object of named groups of coordinate pairs representing regions. Each region name may contain only letters, numbers, or hyphens, and must have at least two coordinate pairs.
          example: '{"face": [[100, 200], [300, 400]], "body": [[50, 60], [70, 80], [90, 100]]}'
        quality_override:
          type: string
          description: Quality override value that will override any automatic quality transformations.
          examples:
            - 80:420
            - auto:best
        moderation_status:
          type: string
          enum:
            - approved
            - rejected
