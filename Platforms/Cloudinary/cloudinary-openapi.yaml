        prompt: A photorealistic sunset over a mountain lake
        model:
          id: flux-2-pro
        image_size:
          width: 1280
          height: 720
        target:
          target_type: temporary
        seed: 42
    GenerateImageAsyncExample:
      summary: Async image generation
      description: |
        Request the generation be performed asynchronously. The API responds
        202 with a task_id; the caller polls /tasks/{task_id} or waits for
        the webhook.
      value:
        prompt: A futuristic city skyline at night
        model:
          family: gpt-image
          tier: premium
        async: true
        notification_url: https://path.to/webhook
    GenerateImageAutoModelExample:
      summary: Automatic model selection
      description: |
        Let the service choose the model for the prompt; `preference` says what
        the choice optimizes for (default `balanced`). The response echoes the
        model that was actually used.
      value:
        prompt: A photorealistic sunset over a mountain lake
        model:
          mode: auto
          preference: quality
        image_size:
          aspect_ratio: 16:9
          resolution: 2K
        target:
          target_type: temporary
        seed: 42
    ImageToImageBasicExample:
