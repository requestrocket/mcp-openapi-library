openapi: 3.1.0
info:
  title: Cloudinary API v1.1
  version: 0.7.8 # x-release-please-version
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Cloudinary Support
    email: support@cloudinary.com
    url: https://support.cloudinary.com
  termsOfService: https://cloudinary.com/tou
servers:
  - url: https://{region}.cloudinary.com
    description: Regional API endpoints for optimal performance.
    variables:
      region:
        default: api
        description: Regional endpoint selection
        enum:
          - api
          - api-eu
          - api-ap
  - url: https://{host}
    description: Custom domains for enterprise deployments.
    variables:
      host:
        default: api.cloudinary.com
        description: API host domain.
security:
  - basicAuth: []
  - oauth2:
      - asset_management
      - upload
      - media_generation
tags:
  - name: upload
    description: Uploads files to the active product environment.
  - name: upload_presets
    description: Enables you to manage upload presets.
  - name: metadata_fields
    description: Enables you to manage structured metadata fields.
  - name: metadata_rules
    description: Enables you to set up dependencies and relationships between structured metadata fields and options.
  - name: upload_mappings
    description: Enables you to manage upload mappings
  - name: assets
    description: Enables you to manage all the resources (assets) stored in your product environment.
  - name: asset_relations
    description: Enables you to manage relationships between assets.
  - name: asset_metadata
    description: Enables you to manage the tags, contextual metadata, and structured metadata values stored on specific assets.
  - name: moderations
    description: Enables you to manage moderation definitions.
  - name: streaming_profiles
    description: Enables you to manage streaming profiles
  - name: video_analytics
    description: Gets video analytics
  - name: transformations
    description: Enables you to manage named and unnamed transformations.
  - name: triggers
    description: Enables you to manage event triggers and notifications.
  - name: explode
    description: Generates derived images from a multi-frame/page file.
  - name: tags
    description: Enables you to manage the tags used in your product environment.
  - name: backups
    description: Enables you to manage backup versions.
  - name: initial_backup
    description: Enables you to initiate and track an initial backup of existing assets in your product environment.
  - name: folders
    description: Enables you to manage the asset folders in your product environment.
  - name: usage
    description: Gets usage details
  - name: search
    description: APIs for searching resources using text and visual search capabilities
  - name: people
    description: APIs for accessing and managing face recognition results.
  - name: Generation
    description: Generate images from text prompts using AI models.
  - name: Tasks
    description: Query the status of async generation tasks.
paths:
  /v1_1/{cloud_name}/{resource_type}/upload:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - $ref: '#/components/parameters/upload_resource_type'
    post:
      operationId: upload
      summary: Uploads media assets (images, videos, raw files) to your Cloudinary product environment
      description: |
        Uploads media assets (images, videos, raw files) to your Cloudinary product environment. The file is securely stored
        in the cloud with backup and revision history. Cloudinary automatically analyzes and saves important data about each
        asset, such as format, size, resolution, and prominent colors, which is indexed to enable searching on those attributes.

        Supports uploading from:
        - Local file paths (SDKs/MCP server only). For MCP server path MUST start with file://
        - Remote HTTP/HTTPS URLs
        - Base64 Data URIs (max ~60 MB)
        - Private storage buckets (S3 or Google Storage)
        - FTP addresses

        The uploaded asset is immediately available for transformation and delivery upon successful upload.

        Transform media files using transformation syntax in delivery URLs, which creates derived files accessible immediately without re-uploading the original.
      tags:
        - upload
      x-speakeasy-mcp:
        name: upload-asset
        scopes:
          - librarian
          - builder
        title: Upload Asset
      requestBody:
        $ref: '#/components/requestBodies/upload_request_body'
      responses:
        '200':
          description: Successful upload
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/upload_response'
                  - $ref: '#/components/schemas/async_upload_response'
        '302':
          description: Redirect to callback URL (when 'callback' parameter is provided and request is not XHR).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/html_redirect'
        '400':
          description: Bad request (e.g., missing parameters, invalid type, target exists without overwrite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '401':
          description: Authorization required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '403':
          description: Not allowed (e.g., insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '404':
          description: Asset not found (e.g. when uploading from a remote URL that does not exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
  /v1_1/{cloud_name}/upload:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
    post:
      operationId: uploadNoResourceType
      summary: Upload with automatic file type detection
      description: Uploads a file to Cloudinary. The file type is automatically detected based on its content, so you don't need to specify the type manually.
      tags:
        - upload
      x-speakeasy-mcp:
        disabled: true
      requestBody:
        $ref: '#/components/requestBodies/upload_request_body'
      responses:
        '200':
          description: Successful upload
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/upload_response'
                  - $ref: '#/components/schemas/async_upload_response'
        '302':
          description: Redirect to callback URL (when 'callback' parameter is provided and request is not XHR).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/html_redirect'
        '400':
          description: Bad request (e.g., missing parameters, invalid type, target exists without overwrite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '401':
          description: Authorization required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '403':
          description: Not allowed (e.g., insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '404':
          description: Asset not found (e.g. when uploading from a remote URL that does not exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
  /v1_1/{cloud_name}/{resource_type}/upload_chunked:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - $ref: '#/components/parameters/upload_resource_type'
    post:
      operationId: uploadChunk
      summary: Upload a single chunk of a large file
      description: |
        Uploads a single chunk of a large file as part of a chunked upload process. This enables efficient upload of
        large files with the ability to resume interrupted uploads. Each request uploads one chunk of the file.
        It is required for any files that are larger than 100 MB. This is often relevant for video files, as they
        tend to have larger file sizes. Minimum chunk size is 5 MB.

        The `file` field accepts either the chunk bytes (multipart) or an HTTP/HTTPS URL. When a URL is supplied,
        Cloudinary downloads it and validates the response `Content-Length` against the chunk-size contract
        (exact match in the uniform-size flow; within 5 MB floor and 5 GiB cap in explicit-order mode) before
        storing any bytes. A mismatch aborts with 400 and persists no state. The remote server must return a
        `Content-Length` header; chunked transfer-encoded responses are rejected.

        **Explicit-order totals** (`X-Upload-Part-Number`): `X-Upload-Total-Parts` may be omitted on non-terminal
        chunks until the session total *N* is established by any earlier chunk that sent the header. After *N* is
        known, the chunk for part index *N* must include `X-Upload-Total-Parts: N`. Whenever the header appears,
        its value must be the same integer *N* for that `X-Unique-Upload-Id` (no conflicting totals).
      tags:
        - upload
      x-speakeasy-mcp:
        disabled: true
        scopes:
          - librarian
      parameters:
        - name: Content-Range
          in: header
          required: false
          schema:
            type: string
          description: |
            The range of bytes being uploaded in the current chunk, in the format "bytes start-end/total".
            For example, "bytes 0-999999/3000000" indicates the first 1MB chunk of a 3MB file. Required for the
            default uniform-size chunked upload flow. In explicit-order mode (`X-Upload-Part-Number`), this
            header remains optional; clients do not have to send `Content-Range`, `X-Upload-Part-Number`, and
            `X-Upload-Total-Parts` together on every request—`X-Upload-Total-Parts` may be omitted on some chunks
            subject to the rules documented on that header.
          example: bytes 0-999999/3000000
        - name: X-Unique-Upload-Id
          in: header
          required: true
          schema:
            type: string
          description: A unique identifier for the upload. Must be the same for all chunks of the same file.
          example: 2fd4e1c67a2d28fce
        - name: X-Upload-Part-Number
          in: header
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
          description: |
            The 1-based part number for this chunk when uploading parts of uneven size with explicit
            client-supplied order. Requires `X-Unique-Upload-Id`. When present, activates explicit-order mode
            and `Content-Range` is optional. Parts must use contiguous indices `1`…`N`, where `N` is the session
            total. If `X-Upload-Total-Parts` is omitted on a chunk, the server still enforces `X-Upload-Part-Number ≤ N`
            once `N` has been learned from any prior chunk for the same upload that supplied `X-Upload-Total-Parts`.
          example: 2
        - name: X-Upload-Total-Parts
          in: header
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
          description: |
            Declared session total `N` (optional on chunks where omission is allowed). When present on a chunk,
            it must satisfy either `X-Upload-Part-Number < X-Upload-Total-Parts` (non-terminal) or
            `X-Upload-Part-Number == X-Upload-Total-Parts` (terminal). The same integer `N` must appear whenever
            this header is sent for a given `X-Unique-Upload-Id` (no conflicting declared totals). Chunks may omit
            the header entirely until `N` is established; after `N` is known, non-terminal indices may still omit
            it. Once `N` is known for the session, the request for part index `N` (the final part) must include
            `X-Upload-Total-Parts: N`. The upload completes when all parts `1`…`N` have been received.
          example: 3
      requestBody:
        $ref: '#/components/requestBodies/upload_request_body'
      responses:
        '200':
          description: Chunk upload successful. For all but the final chunk, this returns upload status. For the final chunk, it returns the complete upload response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/non_final_chunk_upload_response'
                  - $ref: '#/components/schemas/upload_response'
                  - $ref: '#/components/schemas/async_upload_response'
        '302':
          description: Redirect to callback URL (when 'callback' parameter is provided and request is not XHR).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/html_redirect'
        '400':
          description: |
            Bad request. Examples: invalid Content-Range format; chunk size below the 5 MB minimum
            (non-final parts); part_number outside 1..total_parts; when `file` is a URL: Content-Length
            missing, Content-Length does not match the declared chunk size, Content-Length exceeds the
            5 GiB per-chunk cap, or the remote server returned a non-2xx status.

            Explicit-order mode examples: `X-Upload-Total-Parts` disagrees with an earlier declared total for the
            same upload; part index `N` reached without `X-Upload-Total-Parts` after `N` was already established;
            `X-Upload-Part-Number` greater than `X-Upload-Total-Parts`; non-terminal chunk shape where
            `X-Upload-Part-Number` equals `X-Upload-Total-Parts` but the part is not the terminal index (invalid
            combination for the declared totals).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '401':
          description: Authorization required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '403':
          description: Not allowed (e.g., insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
  /v1_1/{cloud_name}/{resource_type}/rename:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - $ref: '#/components/parameters/resource_type'
    post:
      x-speakeasy-mcp:
        name: asset-rename
        scopes:
          - librarian
        title: Asset Rename
        idempotentHint: true
      summary: Updates an existing asset's identifier (public ID) and optionally other metadata in your Cloudinary account
      tags:
        - assets
      operationId: renameAsset
      requestBody:
        description: The rename request parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rename_request'
      responses:
        '200':
          description: Asset renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upload_response'
        '400':
          description: Bad request (e.g., missing parameters, invalid type, target exists without overwrite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '404':
          description: Source asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
  /v1_1/{cloud_name}/{resource_type}/download:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - $ref: '#/components/parameters/resource_type'
    get:
      x-speakeasy-mcp:
        name: download-asset
        disabled: true
        scopes:
          - admin
      summary: Generates a download link for a specific asset (image)
      tags:
        - assets
      operationId: downloadAsset
      parameters:
        - $ref: '#/components/parameters/public_id_query'
        - name: format
          in: query
          required: false
          schema:
            type: string
          description: The format to convert the asset to before downloading.
        - $ref: '#/components/parameters/delivery_type_query'
        - name: expires_at
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Unix timestamp indicating when the download URL should expire.
        - name: attachment
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to force download as an attachment.
        - name: target_filename
          in: query
          required: false
          schema:
            type: string
          description: The desired filename for the downloaded file.
        - name: transformation
          in: query
          required: false
          schema:
            type: string
          description: A transformation to apply to the asset before downloading.
        - $ref: '#/components/parameters/api_key_query'
        - $ref: '#/components/parameters/signature_query'
        - $ref: '#/components/parameters/timestamp_query'
      responses:
        '200':
          description: Asset downloaded successfully
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request (e.g., missing parameters, invalid format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '403':
          description: Forbidden (e.g., insufficient permissions for private assets)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
  /v1_1/{cloud_name}/{resource_type}/destroy:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - $ref: '#/components/parameters/resource_type'
    post:
      operationId: destroyAsset
      summary: Destroys an asset/resource
      tags:
        - upload
      requestBody:
        description: The asset to destroy and related options.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/destroy_request'
      responses:
        '200':
          description: Asset/resource destroyed successfully or not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destroy_response'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '404':
          description: Asset/resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
  /v1_1/{cloud_name}/{resource_type}/explode:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - name: resource_type
        in: path
        required: true
        schema:
          type: string
          enum:
            - image
        description: The type of resource to explode. Only "image" is supported.
    post:
      summary: Create derived images from multi-page file
      description: Generates derived images for each of the individual pages/frames in a multi-page/frame file (such as a PDF or animated image).
      tags:
        - explode
      operationId: explodeResource
      requestBody:
        description: The explode operation parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/explode_request'
      responses:
        '200':
          description: Explode operation started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/explode_response'
        '400':
          description: Bad request (e.g., missing pg_all parameter, invalid transformation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
  /v1_1/{cloud_name}/{resource_type}/explicit:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - $ref: '#/components/parameters/resource_type'
    post:
      summary: Apply operations on an existing asset
      description: |
        Applies actions such as transformations, tags, or metadata updates to an existing asset without re-uploading it.
        This is useful for applying new transformations, adding tags, or updating metadata on assets that are already in your cloud.

        Note: Always prefer delivery URL transformations over this method, unless eager transformations are specifically required.
      tags:
        - assets
      operationId: explicitAsset
      requestBody:
        description: The asset and operations to apply.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/explicit_request'
      responses:
        '200':
          description: Operations applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upload_response'
        '400':
          description: Bad request (e.g., missing parameters, invalid type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '403':
          description: Forbidden (e.g., insufficient permissions for private assets)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
  /v1_1/{cloud_name}/{resource_type}/tags:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - $ref: '#/components/parameters/resource_type'
    post:
      x-speakeasy-mcp:
        name: manage-asset-tags
        scopes:
          - librarian
        title: Manage Asset Tags
        destructiveHint: true
      summary: Adds, removes, or replaces tags on multiple assets
      description: |
        Applies a tag command to the given assets, addressing them by public ID.

        The number of tags multiplied by the number of public IDs must not exceed 10,000.
      tags:
        - asset_metadata
      operationId: updateAssetsTags
      requestBody:
        description: The tag command, the tags to apply, and the assets to apply them to.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tags_update_request'
            example:
              command: add
              public_ids:
                - sample
                - product_image
                - banner_2023
              tags:
                - animal
                - dog
      responses:
        '200':
          description: Tag command applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/public_ids_response'
              example:
                public_ids:
                  - sample
                  - product_image
                  - banner_2023
        '400':
          description: Bad request (e.g., invalid command, blank tag, tag containing a comma, or the 10,000 tags-times-assets limit exceeded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
              example:
                error:
                  message: 'Invalid command - bogus. Must be one of: add, remove, replace, remove_all'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
              example:
                error:
                  message: api_secret mismatch
        '403':
          description: Forbidden (e.g., insufficient permissions for the requested assets)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
              example:
                error:
                  message: This token is unauthorized to perform the requested action
  /v1_1/{cloud_name}/{resource_type}/context:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - $ref: '#/components/parameters/resource_type'
    post:
      x-speakeasy-mcp:
        name: manage-asset-context
        scopes:
          - librarian
        title: Manage Asset Contextual Metadata
        destructiveHint: true
      summary: Adds or clears contextual metadata on multiple assets
      description: |
        Applies a contextual-metadata command to the given assets, addressing them by public ID.
      tags:
        - asset_metadata
      operationId: updateAssetsContext
      requestBody:
        description: The context command, the metadata to apply, and the assets to apply it to.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/context_update_request'
            example:
              command: add
              public_ids:
                - sample
                - product_image
                - banner_2023
              context: alt=My image|caption=Nice photo
      responses:
        '200':
          description: Context command applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/public_ids_response'
              example:
                public_ids:
                  - sample
                  - product_image
                  - banner_2023
        '400':
          description: Bad request (e.g., invalid command, or `context` missing when adding)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
              example:
                error:
                  message: Missing required parameter - context
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
              example:
                error:
                  message: api_secret mismatch
        '403':
          description: Forbidden (e.g., insufficient permissions for the requested assets)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_error'
              example:
                error:
                  message: This token is unauthorized to perform the requested action
  /v1_1/{cloud_name}/{resource_type}/metadata:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
      - $ref: '#/components/parameters/resource_type'
    post:
      x-speakeasy-mcp:
        name: manage-asset-metadata
        scopes:
          - librarian
        title: Manage Asset Structured Metadata
        destructiveHint: true
      summary: Sets structured metadata values on multiple assets
      description: |
        Assigns structured metadata field values to the given assets, addressing them by public ID.

        Values are merged into each asset's existing structured metadata: fields not mentioned
        keep their current values, and an empty value clears the field. Every referenced field
        must already exist in the product environment. Conditional metadata rules are evaluated
        as part of the update.
      tags:
        - asset_metadata
      operationId: updateAssetsMetadata
      requestBody:
        description: The structured metadata values to assign and the assets to assign them to.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/metadata_update_request'
            example:
              public_ids:
                - sample
                - product_image
                - banner_2023
              metadata:
                in_stock_id: 50
                color_id:
                  - green
