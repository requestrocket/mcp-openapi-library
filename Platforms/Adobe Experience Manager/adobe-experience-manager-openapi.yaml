    FullTextSearchCriteria:
      type: object
      description: Full text search criteria on Content Fragments.
      properties:
        text:
          type: string
          description: A text value used to search for Content Fragments.
        queryMode:
          description: |
            Query mode in case of search by full text.
            * EXACT_WORDS = terms will be rendered as they are
            * EXACT_PHRASE = the terms will be rendered as a phrase
            * ALL_TERMS = every term will be rendered as a "contains" operation
            * EDGES = only edge terms will be rendered as a "contains" operation
            * AS_IS = will use the search term as it is (this is the default)
          type: string
          enum:
            - EXACT_WORDS
            - EXACT_PHRASE
            - ALL_TERMS
            - EDGES
            - AS_IS
          default: AS_IS
    MetadataSearchEntry:
      type: object
      description: Pair of key-value consisting of a metadata property's name and value used for Content Fragment search filtering
      required:
        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          description: The name of the metadata property to filter by
          pattern: ^[^\[\]\*|/]+$
        value:
          type: string
          minLength: 1
          description: The value of the metadata property to filter by
    ContentFragmentSearchFilter:
      allOf:
        - $ref: '#/components/schemas/SearchFilterBase'
        - type: object
          description: Search Filter criteria for Content Fragments
          properties:
            modelIds:
              type: array
              description: |
                When provided, only the Content Fragments based on models that match at least one tag from this array will be retrieved.
                If both `modelTags` and `modelIds` are specified, the result will include fragments based on models that match either of the criteria.
              items:
                $ref: '#/components/schemas/Base64URLId'
              uniqueItems: true
              minItems: 1
            modelTags:
              type: array
              description: |
                When provided, only the Content Fragments based on models that match at least one tag from this array will be retrieved.
                If both `modelTags` and `modelIds` are specified, the result will include fragments based on models that match either of the criteria.
              items:
                $ref: '#/components/schemas/TagId'
              uniqueItems: true
              minItems: 1
            fullText:
              allOf:
                - $ref: '#/components/schemas/FullTextSearchCriteria'
              description: Full text search - when provided, only the Content Fragments whose content matches the provided text will be retrieved.
            path:
              allOf:
                - $ref: '#/components/schemas/AssetOrLaunchPath'
              description: |
                When provided, only the Content Fragments under the path mentioned above will be retrieved.
                The path is relative to the `/content/dam` or `/content/launches` folders.
            onlyDirectChildren:
              description: only direct children under the path mentioned above
              type: boolean
              default: false
            status:
              type: array
              items:
                $ref: '#/components/schemas/ContentFragmentStatus'
              uniqueItems: true
              minItems: 1
              description: When provided, only the Content Fragments whose status matches one of the statuses from the list will be retrieved.
            locale:
              type: array
              items:
                $ref: '#/components/schemas/Locale'
              uniqueItems: true
              minItems: 1
              description: |
                When provided, only the resources with at least one of the locales in the list will be retrieved.
            tags:
              type: array
              items:
                $ref: '#/components/schemas/TagId'
              uniqueItems: true
              minItems: 1
              description: When provided, only the Content Fragments tagged with at least one of the tags in the list will be retrieved.
            metadata:
              type: array
              maxItems: 10
              minItems: 1
              items:
                $ref: '#/components/schemas/MetadataSearchEntry'
              description: When provided, return only Content Fragments whose metadata matches at least one of the provided key-value entries.
    SearchSort:
      type: array
      description: |
        Defines the sorting criteria for searching Content Fragments and Content Fragment Models. The criteria will be applied
        in the provided order.
      items:
        type: object
        properties:
          'on':
            description: A sorting criterion.
            type: string
            enum:
              - title
              - created
              - modified
              - modifiedOrCreated
          order:
            description: The sorting order that will be applied for the criterion.
            type: string
            enum:
              - ASC
              - DESC
            default: ASC
    ContentFragmentSearchPattern:
      type: object
      description: Filtering and Sorting criteria applied when searching for Content Fragments.
      properties:
        filter:
          $ref: '#/components/schemas/ContentFragmentSearchFilter'
        sort:
          $ref: '#/components/schemas/SearchSort'
      required:
        - filter
      example: '%7B%0A%20%20%20%22filter%22%3A%20%7B%0A%20%20%20%20%20%20%20%22created%22%3A%7B%0A%20%20%20%20%20%20%20%20%20%20%20%22by%22%3A%20%5B%22admin%22%5D%2C%0A%20%20%20%20%20%20%20%20%20%20%20%22after%22%3A%20%222019-10-12T07%3A20%3A50.52Z%22%0A%20%20%20%20%20%20%20%7D%2C%0A%20%20%20%0A%20%20%20%20%20%20%20%22path%22%3A%20%22%2Fcontent%2Fdam%22%2C%0A%20%20%20%20%20%20%20%0A%20%20%20%20%20%20%20%22modelIds%22%3A%20%5B%22L2NvbmYvd2tuZC1zaGFyZWQvc2V0dGluZ3MvZGFtL2NmbS9tb2RlbHMvYXV0aG9y%22%5D%0A%20%20%20%7D%0A%7D'
    NameSearchCriteria:
      type: object
      description: Search Content Fragment Model by name (title) or technical name (the name used for storing the Content Fragment Model).
      properties:
        name:
          type: string
          description: Name (title) or technical name used to search for Content Fragment Model.
        nameMatching:
          description: |
            Defines how the search will be performed base on the model's technical name or title:
            * EXACT_MATCH = case insensitive exact match of the model's technical name or title
            * PARTIAL_MATCH = looks for a case insensitive substring `name` in the model's technical name or title
          type: string
          enum:
            - EXACT_MATCH
            - PARTIAL_MATCH
          default: PARTIAL_MATCH
    ContentFragmentModelSearchFilter:
      allOf:
        - $ref: '#/components/schemas/SearchFilterBase'
        - type: object
          description: Search Filter criteria for Content Fragment Models
          properties:
            name:
              allOf:
                - $ref: '#/components/schemas/NameSearchCriteria'
              description: When provided, only the Content Fragment Model matching the given name will be retrieved.
            technicalName:
              allOf:
                - $ref: '#/components/schemas/NameSearchCriteria'
              description: When provided, only the Content Fragment Model matching the given technical name will be retrieved.
            configurationFolder:
              allOf:
                - $ref: '#/components/schemas/ContentFragmentModelPath'
              description: |
                When provided, only the Content Fragment Models that belong to the given configuration will be retrieved.
            status:
              type: array
              items:
                $ref: '#/components/schemas/ContentFragmentModelStatus'
              uniqueItems: true
              minItems: 1
              description: |
                When provided, only the Content Fragment Models matching the given status will be retrieved.
            replicationStatus:
              type: array
              items:
                $ref: '#/components/schemas/ReplicationStatus'
              uniqueItems: true
              minItems: 1
              description: |
                When provided, only the Content Fragment Models matching the given replication status on the `publish` tier will be retrieved.
            locked:
              type: boolean
              description: When provided, only the Content Fragment Models whose lock status matches this status will be retrieved.
            includeModelReferences:
              allOf:
                - $ref: '#/components/schemas/Base64URLId'
              description: When provided, only the parent references of the Content Fragment Model with the given id will be retrieved.
            enabledForFolder:
              allOf:
                - $ref: '#/components/schemas/ContentFragmentPath'
              description: |
                The `enabledForFolder` query parameter allows the caller to filter the list of Content Fragment Models based on their availability for a certain DAM (Digital Assets Management) folder. 
                As such, the provided path must be a DAM folder.
            ids:
              type: array
              description: |
                When provided, only the Content Fragment Models with the given ids will be retrieved.
                If both `ids` and `tags` are specified, the result will include models that match either of the criteria.
              items:
                $ref: '#/components/schemas/Base64URLId'
              uniqueItems: true
              minItems: 1
            tags:
              type: array
              items:
                $ref: '#/components/schemas/TagId'
              uniqueItems: true
              minItems: 1
              description: |
                When provided, only the Content Fragment Models tagged with at least one of the tags in the list will be retrieved.
                If both `ids` and `tags` are specified, the result will include models that match either of the criteria.
    ContentFragmentModelSearchPattern:
      type: object
      description: Filtering and Sorting criteria applied when searching for Content Fragment Models.
      properties:
        filter:
          $ref: '#/components/schemas/ContentFragmentModelSearchFilter'
        sort:
          $ref: '#/components/schemas/SearchSort'
      required:
        - filter
      example: '%7B%0A%20%20%20%22filter%22%3A%20%7B%0A%20%20%20%20%20%20%20%22created%22%3A%7B%0A%20%20%20%20%20%20%20%20%20%20%20%22by%22%3A%20%5B%22admin%22%5D%2C%0A%20%20%20%20%20%20%20%20%20%20%20%22after%22%3A%20%222019-10-12T07%3A20%3A50.52Z%22%0A%20%20%20%20%20%20%20%7D%2C%0A%20%20%20%0A%20%20%20%20%20%20%20%22configurationFolder%22%3A%20%22%2Fcontent%2Fdam%2Fwknd-shared%2Fen%2Fadventures%2Fwest-coast-cycling%22%2C%0A%20%20%20%20%20%20%20%0A%20%20%20%20%20%20%20%22name%22%3A%20%22West%20Coast%20Cycling%22%0A%20%20%20%7D%0A%7D'
    BatchJobStatus:
      type: string
      description: This filter is used to filter the batch requests by their status.
      enum:
