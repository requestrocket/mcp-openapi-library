      type: string
      description: |
        This parameter defines how references will be handled when patching Content Fragments. The following options are available:
          * `none` - no references will be collected;
          * `direct` - only direct references will be collected;
          * `direct-hydrated` - only direct references will be collected; they will be fully hydrated.
        If the parameter is missing, the default value is `direct-hydrated`.
      enum:
        - none
        - direct
        - direct-hydrated
      default: direct-hydrated
    CheckoutState:
      type: object
      description: |
        Represents the checkout state of a Content Fragment. When a fragment is checked out, it is locked 
        to the current user, preventing other users from editing or checking out the fragment.
      properties:
        checkedOut:
          type: boolean
          description: |
            Indicates whether the fragment should be checked out (true) or checked in (false).
            - `true`: Checks out the fragment, creating an exclusive lock for the current user
            - `false`: Checks in the fragment, removing the exclusive lock
      required:
        - checkedOut
