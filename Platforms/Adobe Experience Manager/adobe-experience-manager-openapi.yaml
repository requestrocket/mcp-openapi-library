  /cf/workflows:
    get:
      operationId: workflows/getWorkflows
      tags:
        - Workflows
      summary: List Workflows
      description: |
        This operation provides support for retrieving all the workflows
        accessible to the current user, determined via the applied request authorization. 
        This operation supports filtering and sorting of workflows based on the provided search criteria.
        By default this call will return a maximum of 50 sorted in descending order by the workflow’s start time.

        The caller can define other limits suited to their application (see the `limit` query
        parameter), but the limit cannot be higher than 50. To ask for the next set of items
        pass the value of the `cursor` provided in the response to the `cursor` query parameter.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/WorkflowSearchParameter'
      responses:
        '200':
          description: A response containing a potentially paginated list of workflows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'
                  cursor:
                    $ref: '#/components/schemas/Cursor'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    post:
      operationId: workflows/start
      summary: Start a workflow
      description: |
        This operation starts an AEM workflow related to Content Fragments.
        The following type of operations are available:
          * publish-folder - recursively publishes the fragments from a certain folder
          * unpublish-fragments - unpublish content fragments
          * unpublish-models - unpublish content fragment models
          * create-translation-structure - creates the folder structure for Language Copies of Content Fragments
          * move-fragments - move multiple Content Fragments
      tags:
        - Workflows
      requestBody:
        description: Request parameters to start a workflow.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '400':
          $ref: '#/components/responses/400_BadRequest_WithValidation'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '413':
          $ref: '#/components/responses/413_ContentTooLarge'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
