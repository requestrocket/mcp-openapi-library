    CopyContentFragment:
      description: Request payload for copying a Content Fragment
      type: object
      properties:
        parentPath:
          allOf:
            - $ref: '#/components/schemas/RelativePath'
          description: |
            The folder to which the Content Fragment should be copied. The provided destination path should already exist. If
            the destination path does not exist, the copy operation will not be performed and the system will return an error.

            This path should start with `/content/dam` or should be relative to the `/content/dam` folder.
        name:
          description: |
            This property allows you to specify a new name for the resource being copied.

            When a value is not provided the original name of the resource will be used. In case of resource conflicts in the 
            destination folder, the server will automatically generate an alternative resource name based on the provided value.

            When a value is provided and a conflict exists in the destination folder, the caller will have to
            explicitly solve the conflict.
          type: string
      required:
        - parentPath
