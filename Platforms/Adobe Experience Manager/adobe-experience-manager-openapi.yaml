    JSONPatchOperation:
      type: object
      description: Base schema for a JSON Patch operation
      discriminator:
        propertyName: op
        mapping:
          add: '#/components/schemas/AddOperation'
          copy: '#/components/schemas/CopyOperation'
          move: '#/components/schemas/MoveOperation'
          remove: '#/components/schemas/RemoveOperation'
          replace: '#/components/schemas/ReplaceOperation'
          test: '#/components/schemas/TestOperation'
      properties:
        op:
          type: string
          description: The operation to perform
          enum:
            - add
            - copy
            - move
            - remove
            - replace
            - test
      required:
        - op
    PatchValue:
      description: The information to place at the location indicated by the `path` parameter
      oneOf:
        - type: string
        - type: number
        - type: array
          items: {}
        - type: object
        - type: boolean
    AddOperation:
      type: object
      description: Adds the contents of the `value` parameter to the location indicated by the `path` parameter.
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/JSONPatchOperation'
        - type: object
          properties:
            path:
              description: The location where information should be added
              type: string
              minLength: 1
            value:
              $ref: '#/components/schemas/PatchValue'
      required:
        - path
        - value
      example:
        op: add
        path: /dc:title
        value: Flower Photo
    CopyOperation:
      type: object
      description: Copies information from the location described by the `from` parameter to the location described by the `path` parameter.
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/JSONPatchOperation'
        - type: object
          properties:
            from:
              description: A path that points to the entity to be copied
              type: string
              minLength: 1
            path:
              description: A path that points to the location where the entity is to be copied to
              type: string
              minLength: 1
      required:
        - from
        - path
      example:
        op: copy
        from: /dc:title
        path: /custom:title
    MoveOperation:
      type: object
      description: Move an entity from the location described by the `from` parameter to the location described by the `path` parameter. This operation is most often used to rename a property.
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/JSONPatchOperation'
        - type: object
          properties:
            from:
              description: A path that points to the entity to be moved
              type: string
              minLength: 1
            path:
              description: A path that points to the location where the entity is to be moved to
              type: string
              minLength: 1
      required:
        - from
        - path
      example:
        op: move
        from: /cameraLocation
        path: /cameraPosition
    RemoveOperation:
      type: object
      description: Remove the entity at the location pointed to by the `path` parameter.
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/JSONPatchOperation'
        - type: object
          properties:
            path:
              description: A path that points to the entity to be removed
              type: string
              minLength: 1
      required:
        - path
      example:
        op: remove
        path: /cameraLocation
    ReplaceOperation:
      type: object
      description: Replaces information at the location indicated by the `path` parameter with the contents of the `value` parameter.
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/JSONPatchOperation'
        - type: object
          properties:
            path:
              description: The location where the information should be replaced
              type: string
              minLength: 1
            value:
              $ref: '#/components/schemas/PatchValue'
      required:
        - path
        - value
      example:
        op: replace
        path: /dc:title
        value: Sun Flower Photo
    TestOperation:
      type: object
      description: |
        Compares the contents of the `value` parameter with the value at the location indicated by the `path` parameter. `test` operations can be
        included in a `PATCH` request to validate that some condition is true before applying the transformations included in the `test`
        operation(s).  If any of the `test`s evaluate to false, a 412 response will be returned.
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/JSONPatchOperation'
        - type: object
          properties:
            path:
              description: The location of the information to use for comparison
              type: string
              minLength: 1
            value:
              $ref: '#/components/schemas/PatchValue'
      required:
        - path
        - value
      example:
        op: test
        path: /dc:title
        value: Sun Flower Photo
    JSONPatch:
      type: array
      description: |
        JSON Patch defines a JSON document structure for expressing a
        sequence of operations to apply to a JavaScript Object Notation
        (JSON) document; it is suitable for use with the HTTP PATCH method.
        The `application/json-patch+json` media type is used to identify such
        patch documents.

        For more details check [RFC 6902](https://www.rfc-editor.org/rfc/rfc6902).
      items:
        $ref: '#/components/schemas/JSONPatchOperation'
      example:
        - op: test
          path: /dc:title
          value: old value
        - op: replace
          path: /dc:title
          value: new value
        - op: copy
          from: /dc:title
          path: /custom:title
    ContentFragmentModelPublishRequest:
      type: object
      properties:
        ids:
          type: array
          description: The list of content fragment model ids.
          items:
            $ref: '#/components/schemas/Base64URLId'
          minItems: 1
          maxItems: 50
          uniqueItems: true
        agentId:
          type: string
          description: The agent id used for publishing the content fragment models.
          default: publish
        filterAllowedModelIdsByStatus:
          type: array
          description: |
            The status of the referenced models. A model is in `draft` as soon as it's
            created, unless the user specifically marks the model as `enabled`.
            A model is in `disabled` state only when a user explicitly disables
            the model.
          items:
            enum:
              - ENABLED
              - DISABLED
              - DRAFT
          uniqueItems: true
        workflowModelId:
          type: string
          default: /etc/workflow/models/scheduled_model_activation_with_references
          description: The workflow model id used for initiating the workflow instance to handle the publication. AEM provides the designated model `/etc/workflow/models/scheduled_model_activation_with_references` for publishing contents including references.
        workflowTitle:
          type: string
          description: A freely defined non-empty string used to identify the workflow when it executes.
        scheduledTime:
          type: integer
          format: int64
          description: The scheduled time as an epoch timestamp.
      required:
        - ids
        - filterAllowedModelIdsByStatus
      example:
        ids:
          - L2NvbmYvd2tuZC1zaGFyZWQvc2V0dGluZ3MvZGFtL2NmbS9tb2RlbHMvYXJ0aWNsZQ==
          - L2NvbmYvd2tuZC1zaGFyZWQvc2V0dGluZ3MvZGFtL2NmbS9tb2RlbHMvYWR2ZW50dXJl
        filterAllowedModelIdsByStatus:
          - DRAFT
          - ENABLED
        workflowModelId: /etc/workflow/models/scheduled_model_activation_with_references
        workflowTitle: Workflow Title
        scheduledTime: 1635244063701
    UUID:
      description: Resource unique identifier
      type: string
      format: uuid
      example: 49af775d-0e7a-46c3-913d-00f762528373
    ContentFragmentPath:
      type: string
      pattern: ^\/content\/dam(\/.*)?$
      description: A valid path to a Content Fragment resource.
    WorkflowStatus:
      type: string
      description: |
        The workflow status of the entity:
          - `SUCCESS_TRIGGERED` - the processing of the entity is triggered successfully by the workflow
          - `ERROR_NOT_FOUND` - the entity was not found
          - `ERROR_REFERENCED` - the entity is referenced by another entity.
          - `ERROR_FORBIDDEN` - the user does not have the necessary permissions to perform the operation.
          - `ERROR_INVALID` - indicates that a content fragment or its references failed validation during the pre-validation check, meaning it cannot be safely published.
      enum:
        - SUCCESS_TRIGGERED
        - ERROR_NOT_FOUND
        - ERROR_REFERENCED
        - ERROR_FORBIDDEN
        - ERROR_INVALID
    PublishStatus:
      type: object
      description: |
        A publish or unpublish operation can fail for an individual Content Fragment.
        This status is returned in the response of a bulk publish or unpublish operation.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        path:
          $ref: '#/components/schemas/ContentFragmentPath'
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        invalidResources:
          type: array
          items:
            $ref: '#/components/schemas/Path'
          description: |
            List of resource paths that failed validation. This includes both the main content fragment paths and any associated reference paths (direct or indirect) that were found to be invalid.
            This property is relevant when the status is ERROR_INVALID.
          uniqueItems: true
    PublishResponse:
      type: object
      properties:
        workflowInstanceId:
          $ref: '#/components/schemas/Path'
          description: |
            The workflow instance id. Can be used to monitor the status of the given publication workflow using the Workflow REST API.
            In case no workflow is started because all fragments cannot be published, this property is not set.
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishStatus'
      example:
        workflowInstanceId: /var/workflow/instances/server0/2022-01-21/scheduled_activation_with_references_23
        items:
          - path: /content/dam/fragment
            status: SUCCESS_TRIGGERED
          - path: /content/dam/missing_fragment
            status: ERROR_NOT_FOUND
          - path: /content/dam/referenced_fragment
            status: ERROR_REFERENCED
    ScheduledPublicationStatusModelsRequest:
      type: object
      properties:
        ids:
          type: array
          description: The list of Content Fragment Model IDs.
          items:
            $ref: '#/components/schemas/Base64URLId'
          uniqueItems: true
          maxItems: 50
          minItems: 1
      required:
        - ids
    ScheduledPublicationStatus:
      description: Details of Scheduled Publish operation for a Content Fragment.
      type: object
      properties:
        action:
          type: string
          description: One of publishing actions.
          enum:
            - PUBLISH
            - UNPUBLISH
        status:
          type: string
          description: Operation status.
          enum:
            - PENDING
            - SCHEDULED
            - QUEUED
        scheduledBy:
          type: string
          description: User performing the scheduling of the operation.
        scheduledDate:
          type: string
          format: date-time
          description: Moment when operation was scheduled.
      example:
        action: PUBLISH
        status: PENDING
        scheduledBy: admin
        scheduledDate: '2023-08-04T12:11:09.120Z'
    ScheduledPublicationStatusModelsMapping:
      type: object
      description: |
        The Scheduled Publication Status of a Content Fragment Model is returned along with the Content Fragment Model ID.
      properties:
        id:
          $ref: '#/components/schemas/Base64URLId'
        scheduledPublicationStatus:
          $ref: '#/components/schemas/ScheduledPublicationStatus'
    ScheduledPublicationStatusModelsListResult:
      description: |
        Collection of scheduled publication statuses for a list of Content Fragment Models.
      type: object
      properties:
        items:
          description: |
            List of Content Fragment Model Scheduled Publication Statuses corresponding to each Content Fragment Model ID provided.
            If a Content Fragment Model is not found or a Content Fragment Model Status for one of the given IDs is not found, it will be missing from the response.
          type: array
          items:
            $ref: '#/components/schemas/ScheduledPublicationStatusModelsMapping'
    TagList:
      type: object
      description: A list of tags.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      required:
        - items
      example:
        items:
          - id: wknd-shared:season/summer
            title: Summer
            i18n: []
            titlePath: 'WKND Shared : Season / Summer'
            name: summer
            path: /content/cq:tags/wknd-shared/season/summer
            description: A tag used for summer related content.
          - id: wknd-shared:season/spring
            title: Spring
            i18n: []
            titlePath: 'WKND Shared : Season / Spring'
            name: spring
            path: /content/cq:tags/wknd-shared/season/spring
            description: A tag used for spring related content.
    TagsRequest:
      type: object
      properties:
        tags:
          type: array
          description: List of tag IDs to be added to the Content Fragment
          items:
            $ref: '#/components/schemas/TagId'
          minItems: 1
      example:
        tags:
          - wknd-shared:season/summer
          - wknd-shared:season/spring
      required:
        - tags
    Element:
      type: object
      description: Common base interface for any UI schema element.
      discriminator:
        propertyName: type
        mapping:
          Control: '#/components/schemas/Control'
          HorizontalLayout: '#/components/schemas/HorizontalLayout'
          VerticalLayout: '#/components/schemas/VerticalLayout'
          Group: '#/components/schemas/GroupLayout'
          Category: '#/components/schemas/Category'
          Categorization: '#/components/schemas/Categorization'
      properties:
        type:
          description: Type of UI Schema element
          type: string
          enum:
            - Control
            - HorizontalLayout
            - VerticalLayout
            - Group
            - Category
            - Categorization
        options:
          $ref: '#/components/schemas/Option'
        rule:
          type: object
          description: |
            Rules allow for dynamic aspects for a form, e.g. by hiding or disabling UI schema elements.
          properties:
            effect:
              $ref: '#/components/schemas/Effect'
            condition:
              type: object
              description: |
                The condition of the rule to decide if the associated effect should be applied.
              properties:
                scope:
                  $ref: '#/components/schemas/Scope'
                schema:
                  $ref: '#/components/schemas/Operation'
              required:
                - scope
                - schema
          required:
            - effect
            - condition
      required:
        - type
    Scope:
      type: string
      description: |
        The mandatory scope property expects a JSON reference value.
        It defines to which property of the data the control should be bound to.
        It can be bound to multiple properties by using the "#" value.
      minLength: 1
      example:
        - scope: '#/properties/name'
        - scope: '#/properties/age'
        - scope: '#'
    Control:
      type: object
      description: |
        A control is usually displaying the value of one property from the data in a UI element such as an input field. 
        The scope property of the control determines to which part of the schema the control should be bound.
      allOf:
        - $ref: '#/components/schemas/Element'
        - type: object
          properties:
            label:
              type: string
              description: |
                By default, controls use the name of property they point to as a label. 
                You can customize this behaviour by specifying a label property.
              minLength: 1
            scope:
              $ref: '#/components/schemas/Scope'
          required:
            - scope
    Layout:
      type: object
      description: Represents a layout element which can order its children in a specific way.
      allOf:
        - $ref: '#/components/schemas/Element'
        - type: object
          properties:
            elements:
              type: array
              items:
                $ref: '#/components/schemas/Element'
          required:
            - elements
    HorizontalLayout:
      type: object
      description: A layout which orders its child elements horizontally (i.e. from left to right).
      allOf:
        - $ref: '#/components/schemas/Layout'
    VerticalLayout:
      type: object
      description: A layout which orders its child elements vertically (i.e. from top to bottom).
      allOf:
        - $ref: '#/components/schemas/Layout'
    GroupLayout:
      type: object
      description: A group resembles a vertical layout, but features an additional mandatory `label`. This layout is useful when grouping different elements by a certain criteria.
      allOf:
        - $ref: '#/components/schemas/Layout'
        - type: object
          properties:
            label:
              type: string
              description: The label property defines an additional string that is used to describe the elements of the Group.
              minLength: 1
          required:
            - label
    Category:
      type: object
      description: |
        The category layout itself acts as a container and has an `elements` of its own 
        as well as a `label` that describes the contained data.
      allOf:
        - $ref: '#/components/schemas/Layout'
        - type: object
          properties:
            label:
              type: string
              minLength: 1
          required:
            - label
    Categorization:
      type: object
      description: Categorizations are typically used to bundle related data using Category elements, for instance by means of Tabs.
      allOf:
        - $ref: '#/components/schemas/Element'
        - type: object
          properties:
            label:
              type: string
              minLength: 1
            elements:
              type: array
              items:
                $ref: '#/components/schemas/Category'
              minItems: 1
          required:
            - elements
    Option:
      type: object
      description: |
        Additional options for a UI Schema element.
        The options which are not defined in this schema must have a name that starts with 'x-'.
      properties:
        collapsible:
          type: boolean
          description: If set to `true`, the element to which this option is applied will be collapsible.
          default: false
        tooltip:
          type: string
          description: A tooltip to be displayed when hovering over the element.
        expanded:
          type: boolean
          description: For an element that is collapsible, this option indicates whether the element is expanded or collapsed.
          default: true
        format:
          type: string
          description: The format of the element to which this option is applied. This is a hint for the UI to render the element in a specific way.
      additionalProperties: true
    Effect:
      description: |
        The effect that is applied to the encompassing element if the condition is met.
      type: string
      enum:
        - HIDE
        - SHOW
        - ENABLE
        - DISABLE
    Operation:
      type: object
      description: The operation used to evaluate the rule
      allOf:
        - $ref: '#/components/schemas/BaseOperation'
        - type: object
          properties:
            required:
              $ref: '#/components/schemas/Required'
    BaseOperation:
      type: object
      description: The operation used to evaluate the rule, which is mapped to a specific property
      properties:
        contains:
          description: The operation that must be present for the scoped property
          $ref: '#/components/schemas/Operation'
        const:
          description: Matching the scope to a specific value
          oneOf:
            - type: string
            - type: number
            - type: boolean
        enum:
          description: Matching the scope to one of the values in the array
          type: array
          items:
            type: string
        not:
          $ref: '#/components/schemas/Operation'
        minimum:
          type: integer
          format: int64
          description: The minimum value for the scoped property
        maximum:
          type: integer
          format: int64
          description: The maximum value for the scoped property
        minLength:
          type: integer
          format: int64
          description: The minimum length for the value of the scoped property
        maxLength:
          type: integer
          format: int64
          description: The maximum length for the value for the scoped property
        exclusiveMinimum:
          type: integer
          format: int64
          description: The exclusive minimum value for the scoped property
        exclusiveMaximum:
          type: integer
          format: int64
          description: The exclusive maximum value for the scoped property
        multipleOf:
          type: integer
          format: int64
          description: The value of the scoped property must be a multiple of the number
        pattern:
          type: string
          description: The pattern the scoped property must match
        minItems:
          type: integer
          format: int64
          description: The minimum size of the array scoped property
        maxItems:
          type: integer
          format: int64
          description: The maximum size of the array scoped property
        uniqueItems:
          type: boolean
          description: In case the scoped property is an array, it must contain only unique values
    Required:
      description: A list of properties that must contain at least one value in order for the Rule to be enforced
      type: array
      items:
        type: string
    Properties:
      type: string
      nullable: true
      additionalProperties:
        $ref: '#/components/schemas/BaseOperation'
    MultiPropertiesOperation:
      type: object
      description: |
        The operation used to evaluate the rule which doesn't have to be mapped to a specific property 
        and can be applied to multiple properties at once
      properties:
        properties:
          description: |
            A mapping formed by the property's name 
            and the operations used to evaluate the conditions imposed upon the property
          $ref: '#/components/schemas/Properties'
        required:
          description: A list of properties that must contain values for the condition to be considered fulfilled
          $ref: '#/components/schemas/Required'
    Constraint:
      type: object
      properties:
        if:
          $ref: '#/components/schemas/MultiPropertiesOperation'
        then:
          $ref: '#/components/schemas/MultiPropertiesOperation'
        else:
          $ref: '#/components/schemas/MultiPropertiesOperation'
      required:
        - if
        - then
    UISchema:
      type: object
      description: A UI Schema and its associated metadata
      properties:
        uiSchema:
          $ref: '#/components/schemas/Element'
        staticSchema:
          description: |
            A schema representation of a content fragment model's fields, containing the name of the
            model field, along with all constraints supported by the scoped field (i.e minLength, maxLength
            required) in json format
          type: object
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        modified:
          $ref: '#/components/schemas/AuthoringInfo'
    UISchemaPayload:
      type: object
      properties:
        uiSchema:
          $ref: '#/components/schemas/Element'
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
    CopyContentFragmentModel:
      description: Request payload for copying a Content Fragment Model
      type: object
      properties:
        parentPath:
          description: |
            The configuration folder to which the Content Fragment Model should be copied. The provided destination path should already exist. If
            the destination path does not exist, the copy operation will not be performed and the system will return an error.
          type: string
          minLength: 1
        name:
          description: |
            This property allows you to specify a new name for the resource being copied.
            When a value is not provided the original name of the resource will be used. In case of resource conflicts in the 
            destination folder, the server will automatically generate an alternative resource name based on the provided value.
          type: string
      required:
        - parentPath
    References:
      type: string
      description: |
        This parameter defines how references will be retrieved for Content Fragments. The following options are available:
          * `direct` - only direct references will be collected; they will not be hydrated;
          * `direct-hydrated` - only direct references will be collected; they will be fully hydrated;
          * `all` - all references up to the maximum allowed depth will be collected; they will not be hydrated;
          * `all-hydrated` - all references up to the maximum allowed depth will be collected; they will be fully hydrated
          * `none` - no references will be collected

        Non-hydrated responses will only include the properties defined by the `BaseReference` type when embedding references. 
        Hydrated responses are defined by
        each implementation of the `BaseReference` type. In particular, for Content Fragment references the response will include the
        fragment's fields, variations, tags.
      enum:
        - direct
        - direct-hydrated
        - all
        - all-hydrated
        - none
      default: direct-hydrated
    AssetOrLaunchPath:
      type: string
      pattern: ^\/content\/(dam|launches)(\/.*)?$
      description: A valid path to a Content Fragment or Content Fragment launch resource.
    ContentFragmentStatus:
      description: Status of a Resource
      type: string
      readOnly: true
      enum:
        - NEW
        - DRAFT
        - PUBLISHED
        - MODIFIED
        - UNPUBLISHED
    ValidationMessage:
      type: object
      properties:
        property:
          description: JSON pointer to an invalid property
          type: string
        message:
          description: The reason for the invalid status.
          type: string
    ValidationStatus:
      type: array
      description: |
        Provides the validation status of the resource addressed by the current request.
        An empty or missing array means that the request or resources are valid.
      items:
        $ref: '#/components/schemas/ValidationMessage'
    ContentFragmentField:
      type: object
      description: A field value of one of the supported types.
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextFragmentField'
          long-text: '#/components/schemas/LongTextFragmentField'
          number: '#/components/schemas/LongNumberFragmentField'
          float-number: '#/components/schemas/DoubleNumberFragmentField'
          boolean: '#/components/schemas/BooleanFragmentField'
          content-fragment: '#/components/schemas/FragmentReferenceFragmentField'
          content-reference: '#/components/schemas/ContentReferenceFragmentField'
          date: '#/components/schemas/DateFragmentField'
          time: '#/components/schemas/TimeFragmentField'
          date-time: '#/components/schemas/DateTimeFragmentField'
          enumeration: '#/components/schemas/EnumerationFragmentField'
          tag: '#/components/schemas/TagFragmentField'
          json: '#/components/schemas/JsonFragmentField'
      properties:
        name:
          type: string
          description: The name of the field.
        type:
          $ref: '#/components/schemas/DataType'
        multiple:
          type: boolean
          description: Whether the field has multiple values.
          default: false
        locked:
          description: |
            If set to true, the field cannot be edited. 
            In case of live copies, the field inherits its value from the source content fragment and cannot be edited.
          type: boolean
          default: false
      required:
        - name
        - type
    TextFragmentField:
      description: A field containing text up to 256 characters
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                type: string
    LongTextFragmentField:
      description: A field containing longer text, like a paragraph
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            mimeType:
              $ref: '#/components/schemas/MimeType'
            values:
              type: array
              items:
                type: string
    LongNumberFragmentField:
      description: A field containing long numbers
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              description: An array of values of one of the supported types.
              items:
                type: integer
                format: int64
    DoubleNumberFragmentField:
      description: A field containing fractional (double-precision) numbers
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                type: number
                format: double
    BooleanFragmentField:
      description: A field containing a boolean value
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                type: boolean
    FragmentOrLaunchIdentifier:
      type: string
      pattern: ^\/content\/(dam|launches)(\/.*)?$|^([0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12})$
      description: A valid path to a Content Fragment or Content Fragment launch resource or the fragment's UUID.
    FragmentReferenceFragmentField:
      description: A field containing references to Content Fragments
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                $ref: '#/components/schemas/FragmentOrLaunchIdentifier'
    RemoteAssetRepository:
      type: string
      description: The hostname of the remote repository where the asset is stored.
      minLength: 1
    URN:
      description: A URN schema object
      type: string
      pattern: ^urn:[a-z0-9][a-z0-9-]{0,31}:[a-z0-9()+,-.:=@;$_!*'%/?#]+$
      example: urn:aaid:aem:49af775d-0e7a-46c3-913d-00f762528373
    RemoteAssetProperties:
      type: object
      description: The properties of a remote asset reference
      properties:
        repository:
          $ref: '#/components/schemas/RemoteAssetRepository'
        assetId:
          description: The ID of the asset
          allOf:
            - $ref: '#/components/schemas/URN'
      required:
        - repository
        - assetId
      example:
        repository: delivery-p123456-e123456.adobeaemcloud.com
        assetId: urn:aaid:aem:1fb05fe4-c12b-4f85-b1ca-aa92cdbd6a62
    ContentReferenceUrl:
      type: string
      format: url
      description: The URL of the content reference
    AssetValue:
      anyOf:
        - $ref: '#/components/schemas/Path'
        - $ref: '#/components/schemas/UUID'
        - $ref: '#/components/schemas/RemoteAssetProperties'
        - $ref: '#/components/schemas/ContentReferenceUrl'
    ContentReferenceFragmentField:
      description: 'A field containing references to various content types like: plain text, rich text, content fragments, images, audio clips or video clips'
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                $ref: '#/components/schemas/AssetValue'
    DateFragmentField:
      description: A field containing a date with the format yyyy-MM-dd
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                type: string
                format: date
    TimeFragmentField:
      description: A field containing time information in the HH:mm:ss format
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                type: string
                format: time
    DateTimeFragmentField:
      description: A field containing an offset date-time with the format yyyy-MM-dd'T'HH:mm:ss±hh:mm
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                type: string
                format: date-time
    EnumerationFragmentField:
      description: A field containing enumeration keys defined in the model
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                type: string
    TagFragmentField:
      description: A field containing tag references
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                $ref: '#/components/schemas/TagId'
              uniqueItems: true
    JsonFragmentField:
      description: A field containing a JSON object
      allOf:
        - $ref: '#/components/schemas/ContentFragmentField'
        - type: object
          properties:
            values:
              type: array
              items:
                type: object
    BaseReference:
      type: object
      description: Information about referenced resources.
      discriminator:
        propertyName: type
        mapping:
          asset: '#/components/schemas/AssetReference'
          content-fragment: '#/components/schemas/ContentFragmentReference'
          page: '#/components/schemas/PageReference'
          experience-fragment: '#/components/schemas/ExperienceFragmentReference'
      properties:
        name:
          description: Item name
          type: string
        fieldName:
          description: Name of the field that contains the reference.
          type: string
        type:
          $ref: '#/components/schemas/ReferenceType'
        title:
          type: string
          description: Reference title.
        path:
          $ref: '#/components/schemas/Path'
        created:
          $ref: '#/components/schemas/AuthoringInfo'
        modified:
          $ref: '#/components/schemas/AuthoringInfo'
        published:
          $ref: '#/components/schemas/AuthoringInfo'
        status:
          $ref: '#/components/schemas/ContentFragmentStatus'
        previewReplicationStatus:
          $ref: '#/components/schemas/PreviewReplicationStatus'
        previewStatus:
          $ref: '#/components/schemas/PreviewStatus'
      required:
        - type
        - path
      example:
        name: ian_provo.jpg
        fieldName: profilePicture
        type: asset
        path: /content/dam/wknd-shared/en/contributors/ian_provo.jpg
        created:
          at: '2023-08-02T16:01:47.765+03:00'
          by: admin
        status: DRAFT
        assetId: urn:aaid:aem:1fb05fe4-c12b-4f85-b1ca-aa92cdbd6a62
        repo:size: 251434
        dc:format: image/jpeg
        tiff:ImageWidth: 1152
        tiff:ImageHeight: 1152
    AssetReference:
      readOnly: true
      description: Minimal information about referenced asset, can be used to generate preview.
      allOf:
        - $ref: '#/components/schemas/BaseReference'
        - type: object
          properties:
            description:
              type: string
              description: Asset description.
            assetId:
              $ref: '#/components/schemas/URN'
              description: Asset unique identifier expressed as a URN.
            repo:size:
              type: integer
              format: int64
