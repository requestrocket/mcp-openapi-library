      operationId: fragments/getLanguages
      summary: Get the available language(s) for creating Language Copies for a given Content Fragment path
      tags:
        - Translations
      parameters:
        - in: query
          name: path
          description: Required UTF-8 encoded parameter to specify a Content Fragment path for which to retrieve the available language roots.
          schema:
            $ref: '#/components/schemas/ContentFragmentPath'
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Languages'
        '400':
          $ref: '#/components/responses/400_BadRequest_WithValidation'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/fragments/scheduledPublicationStatus:
    post:
      operationId: fragments/scheduledPublicationStatusMultipleFragments
      tags:
        - Fragment Management
      summary: Get the scheduled publication status for a list of Content Fragment IDs
      requestBody:
        required: true
        description: Request parameters to retrieve scheduled publication status of Content Fragments.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledPublicationStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledPublicationStatusListResult'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/fragments/findAndReplace:
    post:
      operationId: fragments/findAndReplace
      tags:
        - Fragment Management
      summary: |
        Find and replace text in Content Fragments
      description: |
        This operation provides support for bulk editing the selected content fragments in the sense of replacing text occurrences for all fields of type `text` and `long-text`.
        This operation executes synchronously. For performance considerations, the operation applies on a batch of selected CFs identified by a list of their paths.
      requestBody:
        description: Request payload for Content Fragments Bulk Edit Find and Replace
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindAndReplace'
      responses:
        '200':
          description: A response containing s result for FindAndReplace operation for each of the selected Content Fragment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindAndReplaceResolution'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/domains:
    get:
      operationId: fragments/getDomain
      x-audience: cloud
      summary: Get the domain URL matching the AEM tier environment provided.
      tags:
        - Fragment Management
      description: |
        This operation returns the domain URL based on the AEM tier provided: author, publish or preview.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/permissions:
    post:
      operationId: permissions
      summary: Get the current's user permissions on a list of resources
      description: |
        This operation returns the list of permissions the user has over a list of Folder, Content Fragments or Content Fragment Models. The Content Fragments are expected to be within the `/content/dam` directory, the Content Fragment Models within the `/conf` directory, and the Folders could be within either `/content/dam` or the `/conf` directory.
      tags:
        - Permissions
      requestBody:
        description: Request parameters to retrieve permissions.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: List of actions the user is allowed to perform.
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionsResponse'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '413':
          $ref: '#/components/responses/413_ContentTooLarge'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/graphql:
    post:
      operationId: graphQL/post
      summary: GraphQL POST request
      tags:
        - GraphQL
      x-audience: cloud
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
      responses:
        '200':
          description: The passed query got executed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GraphQLSuccessResponse'
                  - $ref: '#/components/schemas/GraphQLErrorResponse'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    get:
      operationId: graphQL/get
      summary: GraphQL GET request
      tags:
        - GraphQL
      x-audience: cloud
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
          description: GraphQL query string
        - in: query
          name: variables
          schema:
            type: string
          description: Variables simplify GraphQL queries by letting you pass data separately. Can be declared after the query are passed like arguments to a function and begin with `$`.
      responses:
        '200':
          description: The passed query got executed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GraphQLSuccessResponse'
                  - $ref: '#/components/schemas/GraphQLErrorResponse'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/fragments/search:
    get:
      operationId: fragments/search
      tags:
        - Search
      summary: |
        Search API for Content Fragments based on various Search Criteria.
      description: |
        This is a filtering API to find Content Fragments that match specific criteria. Results can be paginated.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/includeMetadata'
        - $ref: '#/components/parameters/ContentFragmentSearchParameter'
        - in: query
          name: projection
          description: |
            If this optional parameter is provided and its value is 'summary', the fragments in the response will contain
            only the required properties.
          schema:
            $ref: '#/components/schemas/Projection'
          required: false
      responses:
        '200':
          description: List of detailed Content Fragments matching Search criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragmentListResult'
        '400':
          $ref: '#/components/responses/400_BadRequest_WithValidation'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/models/search:
    get:
      operationId: models/search
      tags:
        - Search
      summary: |
        Search API for Content Fragment Models based on various Search Criteria.
      description: |
        This is a filtering API to find Content Fragment Models that match specific criteria. Results can be paginated.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/ContentFragmentModelSearchParameter'
        - in: query
          name: projection
          description: |
            This parameter is optional. If set to 'minimal', the response will include include only the resource identifiers
            of the Content Fragment Model: id, path, and name.
            If set to 'summary', the Content Fragment Model's fields will not be populated in the response.
            If set to 'full', the response will include all properties.
            By default, the value of this query parameter is 'full'.
          schema:
            $ref: '#/components/schemas/Projection'
          required: false
      responses:
        '200':
          description: List of detailed Content Fragment Models matching Search Criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragmentModelListResult'
              examples:
                minimal:
                  $ref: '#/components/examples/ContentFragmentModelMinimal'
                summary:
                  $ref: '#/components/examples/ContentFragmentModelSummary'
        '400':
          $ref: '#/components/responses/400_BadRequest_WithValidation'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/batch:
    post:
      operationId: batch/create
      tags:
        - Batching
      summary: Create a batch request
      description: |
        This operation creates a batch request to execute multiple operations asynchronously in a single HTTP request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '202':
          description: The request was accepted for processing and it will be executed asynchronously.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: The URI at which the status of the batch request can be monitored.
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    get:
      operationId: batch/list
      summary: List batch requests
      description: |
        This operation lists all batch requests that have been created.
      tags:
        - Batching
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - in: query
          name: jobStatus
          description: |
            If this optional parameter is provided, the batch requests will be filtered based on their status.
          schema:
            $ref: '#/components/schemas/BatchJobStatus'
          required: false
      responses:
        '200':
          description: A response containing a potentially paginated list of batch requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponseListResult'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/batch/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: The ID of the Batch Request
        schema:
          type: string
    get:
      operationId: batch/get
      tags:
        - Batching
      summary: Retrieve the status of a batch request
      description: |
        This operation retrieves the status of a batch request and the results of the operations that were executed.
      responses:
        '200':
          description: The status of the batch request and the results of the operations that were executed.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/fragments/{fragmentId}/model:
    parameters:
      - in: path
        name: fragmentId
        description: Content Fragment unique identifier
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      operationId: fragments/getModel
      tags:
        - Fragment Management
      summary: Get the model of a Content Fragment
      description: |
        This operation allows a caller to get the Content Fragment Model belonging to a specific Content Fragment.
        It is an alias for the endpoint /cf/models/{id}.
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragmentModel'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    put:
      operationId: fragments/changeModel
      tags:
        - Fragment Management
      summary: Change the model of a Content Fragment
      description: |
        This operation allows a caller to change the Content Fragment Model for a Content Fragment. As a result of this operation, the Content Fragment can become invalid if the new Model does not match the existing content.
        To edit the Content Fragment's fields after a Content Fragment Model change, use a partial or a full update operation on the Fragment.
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentFragmentChangeModel'
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/fragments/create:
    post:
      operationId: fragments/create
      tags:
        - Fragment Management
      summary: Create a Content Fragment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentFragment'
      responses:
        '201':
          description: The Content Fragment was successfully created.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: The URI at which the created content fragment can be accessed.
        '400':
          $ref: '#/components/responses/400_BadRequest_WithValidation'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/fragments/{fragmentId}/copyTree:
    post:
      operationId: fragments/copyTree
      summary: Copy a Content Fragment
      description: |
        This operation asynchronously creates a copy of a Content Fragment and its Content Fragment references.
        By default, references will be copied under their original folders and their names will automatically be adjusted by the server. 
        Optionally, references can also be copied into the same folder as the main Content Fragment. 
        The limit of references that can be handled is configurable server-side, with a default value of 1000.
      tags:
        - Fragment Management
      parameters:
        - in: path
          name: fragmentId
          description: The unique identifier of the Content Fragment to be copied.
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyContentFragmentTree'
      responses:
        '202':
          description: The request was accepted for processing and it will be executed asynchronously.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: The URI at which the status of the copy request can be monitored.
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/fragments/{fragmentId}/metadata:
    parameters:
      - in: path
        name: fragmentId
        description: Content Fragment unique identifier
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      operationId: fragments/getFragmentMetadata
      tags:
        - Metadata
      summary: Get Content Fragment metadata
      description: |
        Returns all metadata properties for a Content Fragment, including the metadata form identifier.

        The form identifier is resolved from the fragment itself or its parent folder hierarchy.
        If no form is found up to the root folder, the default form is used.

        The response includes an `ETag` header. Clients can pass this value in the `If-None-Match` header
        of subsequent requests to avoid re-fetching unchanged data. When the metadata has not changed,
        the server replies with a `304 Not Modified` response and an empty body.
      parameters:
        - $ref: '#/components/parameters/If-None-Match'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FragmentMetadata'
        '304':
          $ref: '#/components/responses/304_NotModified'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    patch:
      operationId: fragments/patchFragmentMetadata
      tags:
        - Metadata
      summary: Update Content Fragment metadata
      description: |
        This operation allows updating metadata properties of a Content Fragment that has a linked metadata schema.
        The changes are passed as [JSON Patch documents](https://www.rfc-editor.org/rfc/rfc6902).

        Properties must be defined in the linked metadata schema. Attempting to modify properties not defined
        in the schema or read-only properties will result in a `400` error.

        Save conflicts are detected by leveraging [conditional](https://www.rfc-editor.org/rfc/rfc9110.html#conditional.requests) HTTP
        requests. When a conflict occurs, the server will reply with a `412` response.
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
      responses:
        '200':
          description: OK - Metadata updated successfully
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FragmentMetadata'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/metadata/schemas:
    get:
      operationId: metadataSchemasGetSchema
      tags:
        - Metadata
      summary: Get metadata for a resource path
      description: |
        Returns all metadata properties for a content fragment or folder, including the metadata form identifier.

        The form identifier is resolved from the resource itself or its parent folder hierarchy,
        falling back to the default form if none is found up to the root folder.

        All properties under the metadata node are always returned.
      parameters:
        - in: query
          name: path
          required: true
          description: |
            The folder or content fragment path for which to resolve and return metadata.
          schema:
            $ref: '#/components/schemas/AssetOrLaunchPath'
          example: /content/dam/campaigns/summer-2026
        - $ref: '#/components/parameters/If-None-Match'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FragmentMetadata'
        '304':
          $ref: '#/components/responses/304_NotModified'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/metadata/schemas/bindings:
    put:
      operationId: metadata/schemas/bindSchema
      summary: Bind a metadata schema to a resource
      description: |
        Links a metadata schema to a content fragment or DAM folder.
        The schema defines which metadata properties are available for the resource.

        **Binding a Schema:**
        - Set `schemaId` to the ID of the metadata schema to bind
        - Child resources (fragments in folders) will inherit the schema unless overridden

        **Unbinding a Schema:**
        - Set `schemaId` to `null` to remove the schema binding
        - The resource will then inherit from its parent folder, if any

        Only DAM folders and content fragments are supported. Other resource types will result in a 400 Bad Request response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataSchemaBinding'
            examples:
              bindSchema:
                summary: Bind a schema to a folder
                value:
                  resourcePath: /content/dam/campaigns/summer-2026
                  schemaId: campaign.schema.json
              unbindSchema:
                summary: Unbind a schema from a resource
                value:
                  resourcePath: /content/dam/campaigns/summer-2026
      tags:
        - Metadata
      responses:
        '204':
          description: Schema binding updated successfully
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
x-webhooks:
