  /cf/fragments/{fragmentId}/checkoutState:
    parameters:
      - in: path
        name: fragmentId
        description: Content Fragment unique identifier
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    patch:
      operationId: fragments/updateCheckoutState
      summary: Update checkout state of a Content Fragment
      description: |
        This operation updates the checkout state of a Content Fragment, either checking it out or checking it in.

        **Checking Out (checkedOut: true):**
        - Creates an exclusive lock on the fragment for the current user
        - Prevents other users from editing or checking out the fragment
        - If already checked out by the current user, the operation is idempotent
        - If checked out by another user, returns a 409 Conflict response

        **Checking In (checkedOut: false):**
        - Removes the exclusive lock on the fragment
        - Allows other users to check out and edit the fragment
        - If not checked out, the operation is idempotent
        - Non-admin users can only check in fragments they have checked out
        - Admin users can check in any fragment

        **Conditional Requests:**
        This operation requires the `If-Match` header with the current ETag of the fragment to ensure
        the operation is performed on the expected state of the resource. This prevents race conditions
        where multiple users might attempt to change the checkout state simultaneously.

        The ETag should be obtained from a previous GET request to the fragment.
        When a conflict occurs (ETag mismatch), the server will reply with a `412 Precondition Failed` response.
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutState'
            examples:
              checkout:
                summary: Check out a fragment
                value:
                  checkedOut: true
              checkin:
                summary: Check in a fragment
                value:
                  checkedOut: false
      tags:
        - Fragment Management
      responses:
        '204':
          description: No Content
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
