        - ACTIVE
        - SUCCEEDED
        - STOPPED
        - GIVEN_UP
        - ERROR
        - DROPPED
    NameValue:
      type: object
      description: |
        The Header schema allows to define a name-value pair that could be used as a header or query parameter.
      properties:
        name:
          type: string
          description: The name.
        value:
          type: string
          description: The value.
    SingleResponse:
      type: object
      description: |
        This schema defines the response to a single request included in a batch request.
      properties:
        headers:
          type: array
          items:
            $ref: '#/components/schemas/NameValue'
        statusCode:
          type: integer
          description: The status code of the response.
          minimum: 100
          maximum: 599
        body:
          type: object
    BatchResponse:
      type: object
      properties:
