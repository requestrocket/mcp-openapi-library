          type: string
        status:
          $ref: '#/components/schemas/Status'
        responses:
          type: array
          items:
            $ref: '#/components/schemas/SingleResponse'
        created:
          type: string
          format: date-time
          description: The date and time when the batch request was created.
        finished:
