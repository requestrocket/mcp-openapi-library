      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchResponse'
        cursor:
          $ref: '#/components/schemas/Cursor'
    UrlPath:
      type: string
      description: The path part of the request URL.
      pattern: ^(?:(?!\*|\[|\]|\||\\|\|).)*$
    Method:
      type: string
      description: The HTTP method of the request.
      enum:
        - POST
        - PUT
        - DELETE
        - PATCH
    SingleRequest:
      type: object
      description: |
        The SingleRequest schema allows to define a single request that should be executed as part of a batch request.
      properties:
        path:
          $ref: '#/components/schemas/UrlPath'
        method:
