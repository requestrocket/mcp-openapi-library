    FindAndReplace:
      type: object
      properties:
        paths:
          type: array
          description: The list of Content Fragments paths on which Find And Replace operation is performed.
          items:
            $ref: '#/components/schemas/ContentFragmentPath'
          maxItems: 20
        find:
          description: String we want to replace in all TEXT fields in selected Content Fragments
          type: string
          pattern: ^[^<>]*$
        replace:
          description: Replacement string.
          type: string
          pattern: ^[^<>]*$
        dryRun:
          description: When enabled, the operation runs in simulation mode — only simulated results are returned and no changes are persisted.
          type: boolean
        ignoreErrors:
          description: True means that we want replacement taking place for all cases when Replacement would be successful and do nothing for cases in error.
          type: boolean
        isCaseSensitive:
          description: True means that we want to perform case sensitive search.
          type: boolean
          default: true
        matchExactWord:
          description: |
            A flag indicating whether to only consider the exact matches of the `find` String
            When set to `true` (optional), the replacement will occur only for occurrences of the `find` String that are entire words, excluding parts of compound words.
            When set to `false` (default), the replacement will happen for any occurrence of the `find` String, including within compound words.
          type: boolean
          default: false
        fieldNames:
          description: |
            An optional list of text and long text field names.
            If provided, it will be used to restrict the Find And Replace operation to those specific fields within the Content Fragments.
            If not provided, the operation will be performed on all text and long text fields.
          type: array
          items:
            type: string
          uniqueItems: true
          maxItems: 10
      required:
        - paths
        - find
        - replace
        - dryRun
        - ignoreErrors
      example:
        paths:
          - /content/dam/copy-of-my-new-adventure3
        find: adventure
        replace: fun
        dryRun: true
        ignoreErrors: true
    FindReplaceField:
      type: object
      description: This describes outcome of Find/Replace operation for specific Content Fragment Model Field.
      properties:
        fieldName:
          type: string
          description: This is the name of the Content Fragment Field, as exposed in the Content Fragment Model.
        details:
          type: array
          description: List containing details on all failing constraints when applying Replace for erroneous field.
          items:
            type: string
            description: Specific replace error for given field. One of REQUIRED, MAX_LENGTH, REGEX_CUSTOM, REGEX_URL, REGEX_EMAIL.
            enum:
              - REQUIRED
              - MAX_LENGTH
              - REGEX_CUSTOM
              - REGEX_URL
              - REGEX_EMAIL
    FindReplaceContentFragment:
      type: object
      description: |
        Provides details on the replacement operation outcome per Content Fragment. Besides the path identifying
        the Content Fragment, the schema provides a replacement status (OK, ERROR) and a detailed report on each field
        from a Content Fragment that was subject to a replace.
      properties:
        path:
          type: string
          description: Path identifying the Content Fragment that is subject to the Find/Replace operation.
        status:
          type: string
          description: |
            Possible statuses when a `FindAndReplace` operation is attempted for a Content Fragment:
            * `REPLACE_OK` is returned when replace can be successfully performed as field values after replace obey validation constraints
            * `REPLACE_ERROR` is returned when replace cannot be successfully  performed because of validation constraints violations
            * `REPLACE_NOT_APPLICABLE` is returned when the `find` string cannot be found in any of the fields of the Content Fragment
          enum:
            - REPLACE_OK
            - REPLACE_ERROR
            - REPLACE_NOT_APPLICABLE
        fieldsInError:
          type: array
          description: This contains detailed status of Replace operation outcome for all fields of the corresponding Content Fragment.
          items:
            $ref: '#/components/schemas/FindReplaceField'
      example:
        path: /content/dam/copy-of-my-new-adventure3
        status: REPLACE_OK
        fieldsInError: []
    FindAndReplaceResolution:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FindReplaceContentFragment'
