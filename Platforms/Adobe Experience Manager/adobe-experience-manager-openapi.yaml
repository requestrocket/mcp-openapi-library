openapi: 3.0.3
info:
  title: Sites API
  version: '2026.07'
servers:
  - url: https://{bucket}.adobeaemcloud.com/adobe/sites
    variables:
      bucket:
        default: ''
        description: The bucket to use for this request, e.g. author-p12345-e123456
security:
  - bearerAuth: []
tags:
  - name: Fragment Management
  - name: Fragment Variations
  - name: Fragment Versioning
  - name: Model Management
  - name: Search
  - name: Tagging
  - name: References
  - name: Translations
  - name: Permissions
  - name: Workflows
  - name: Batching
    description: |
      These endpoints allow you to submit multiple requests in a single call, improving efficiency for various operations. 
      A batch of individual requests sent in the request body will be processed asynchronously in the background.
      You can then poll the status of the batch request to check if it has been completed and receive a consolidated response for all operations.
  - name: GraphQL
    description: GraphQL default endpoints
  - name: Metadata
    description: Operations for managing Content Fragment metadata according to linked metadata schemas.
  - name: Fragment Events
    description: |
      A number of events are emitted for content state updates and content changes for Content Fragments.
      For more details about how these events can be handled, please head over to the Adobe I/O Events
      Documentation linked below.
    externalDocs:
      url: https://developer.adobe.com/events/docs/guides/
  - name: Model Events
    description: |
      A number of events are emitted for content state updates and content changes for Content Fragments Models.
      For more details about how these events can be handled, please head over to the Adobe I/O Events
      Documentation linked below.
    externalDocs:
      url: https://developer.adobe.com/events/docs/guides/
  - name: Page Events
    description: |
      A number of events are emitted for content state updates and content changes for Pages.
      For more details about how these events can be handled, please head over to the Adobe I/O Events
      Documentation linked below.
    externalDocs:
      url: https://developer.adobe.com/events/docs/guides/
paths:
  /cf/models:
    get:
      operationId: models/getModels
      tags:
        - Model Management
      summary: |
        List all Content Fragment Models
      description: |
        This operation provides support for retrieving all the Content Fragment Models
        accessible to the current user, determined via the applied request authorization.
        By default this call will return a maximum of 50 items.

        The caller can define other limits suited to their application (see the `limit` query
        parameter), but the limit cannot be higher than 50. To ask for the next set of items
        pass the value of the `cursor` provided in the response to the `cursor` query parameter.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - in: query
          name: projection
          description: |
            This parameter is optional. If set to 'minimal', the response will include include only the resource identifiers
            of the Content Fragment Model: id, path, and name.
            If set to 'summary', the Content Fragment Model's fields will not be populated in the response. 
            If set to 'full', the response will include all properties.
            By default, the value of this query parameter is 'full'.
          schema:
            $ref: '#/components/schemas/Projection'
          required: false
      responses:
        '200':
          description: A list of Content Fragment Models was successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragmentModelListResult'
              examples:
                minimal:
                  $ref: '#/components/examples/ContentFragmentModelMinimal'
                summary:
                  $ref: '#/components/examples/ContentFragmentModelSummary'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    post:
      operationId: models/createModel
      tags:
        - Model Management
      summary: Create a Content Fragment Model
      description: |
        This operation allows creating one or more Content Fragment Models. The server will check
        the `content-fragment` field types and validate if the passed models are present in the
        request's payload or already available on the server.
      parameters:
        - in: query
          name: dryRun
          description: |
            If set to true, this operation allows validating the payload for creating one or more Content Fragment Models 
            before performing the actual creation request.
            It performs the same validations as the creation process but does not create the models.
          schema:
            type: boolean
            default: false
          required: false
      requestBody:
        description: The request payload to create one or more Content Fragment Models.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentFragmentModels'
      responses:
        '201':
          description: The Content Fragment Models were successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentFragmentModelIdentifier'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/models/{id}:
    parameters:
      - $ref: '#/components/parameters/If-None-Match'
      - in: path
        name: id
        required: true
        description: The ID of the Content Fragment Model to retrieve.
        schema:
          $ref: '#/components/schemas/Base64URLId'
    get:
      operationId: models/getModel
      tags:
        - Model Management
      summary: Get a Content Fragment Model
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragmentModel'
        '304':
          $ref: '#/components/responses/304_NotModified'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    head:
      operationId: models/getModelHeaders
      tags:
        - Model Management
      summary: Get the details for a Content Fragment Model
      description: |
        This operation allows retrieving the headers for a Content Fragment Model, when a client needs to execute subsequent operations that
        need to be consistent (e.g. check an `ETag` value, check if the model still exists, etc.).
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
        '304':
          $ref: '#/components/responses/304_NotModified'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    patch:
      operationId: models/updateModel
      summary: Edit a Content Fragment Model
      description: |
        This operation allows editing a Content Fragment Model. The changes are passed as [JSON Patch documents](https://www.rfc-editor.org/rfc/rfc6902).

        Save conflicts are detected by leveraging [conditional](https://www.rfc-editor.org/rfc/rfc9110.html#conditional.requests) HTTP
        requests. When a conflict occurs, the server will reply with a `412` response. It becomes the caller's
        responsibility to resolve the conflict, either by accepting the values from the server, or by overwriting them.
      tags:
        - Model Management
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
            examples:
              add-string-value:
                $ref: '#/components/examples/AddStringPatch'
              add-number-value:
                $ref: '#/components/examples/AddNumberPatch'
              add-array-value:
                $ref: '#/components/examples/AddArrayPatch'
              add-object-value:
                $ref: '#/components/examples/AddObjectPatch'
              copy:
                $ref: '#/components/examples/CopyPatch'
              move:
                $ref: '#/components/examples/MovePatch'
              remove:
                $ref: '#/components/examples/RemovePatch'
              replace-string-value:
                $ref: '#/components/examples/ReplaceStringPatch'
              replace-number-value:
                $ref: '#/components/examples/ReplaceNumberPatch'
              replace-array-value:
                $ref: '#/components/examples/ReplaceArrayPatch'
              replace-object-value:
                $ref: '#/components/examples/ReplaceObjectPatch'
              multiple-operations:
                $ref: '#/components/examples/MultipleOperationsPatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragmentModel'
              examples:
                changed-name:
                  $ref: '#/components/examples/PatchContentFragmentModel'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    delete:
      operationId: models/deleteModel
      summary: Delete a Content Fragment Model
      tags:
        - Model Management
      parameters:
        - $ref: '#/components/parameters/If-Match'
      responses:
        '204':
          description: The delete operation completed successfully. The response body doesn't provide any content.
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/models/publish:
    post:
      operationId: models/publish
      summary: Publish Content Fragment Models
      description: |
        This operation starts an AEM workflow for publishing Content Fragment Models.
      tags:
        - Model Management
      requestBody:
        description: Request parameters to publish content fragment models.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentFragmentModelPublishRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/models/scheduledPublicationStatus:
    post:
      operationId: models/scheduledPublicationStatusMultipleModels
      summary: Get the scheduled publication status for a list of Content Fragment Models
      tags:
        - Model Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledPublicationStatusModelsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledPublicationStatusModelsListResult'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/models/{id}/tags:
    parameters:
      - in: path
        name: id
        required: true
        description: The ID of the Content Fragment Model.
        schema:
          $ref: '#/components/schemas/Base64URLId'
    get:
      operationId: models/getTagsFromContentFragmentModel
      tags:
        - Tagging
      summary: Get the Tags applied to a Content Fragment Model
      responses:
        '200':
          $ref: '#/components/responses/TagsListResponse'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    post:
      operationId: models/addTagsToContentFragmentModel
      tags:
        - Tagging
      summary: Add Tags to a Content Fragment Model
      description: |
        This operation adds new tags to an existing Content Fragment Model.
        The tags must be already available in the system when this request is made.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagsRequest'
      responses:
        '200':
          $ref: '#/components/responses/TagsListResponse'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    put:
      operationId: models/replaceTagsFromContentFragmentModel
      tags:
        - Tagging
      summary: Replace the Tags applied to a Content Fragment Model
      description: |
        This operation updates all tags of an existing Content Fragment Model by replacing the existing tags
        with tags based on the details from the payload.
        The tags must be already available in the system when this request is made.
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagsRequest'
      responses:
        '200':
          $ref: '#/components/responses/TagsListResponse'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    delete:
      operationId: models/deleteTagsFromContentFragmentModel
      tags:
        - Tagging
      summary: Delete the Tags applied to a Content Fragment Model
      parameters:
        - $ref: '#/components/parameters/If-Match'
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/models/{id}/uiSchema:
    parameters:
      - $ref: '#/components/parameters/X-Adobe-Accept-Unsupported-API'
      - in: path
        name: id
        required: true
        description: The ID of the Content Fragment Model.
        schema:
          $ref: '#/components/schemas/Base64URLId'
    get:
      operationId: models/retrieveUISchema
      tags:
        - Model Management
      summary: Get the UI schema associated with the Content Fragment Model
      responses:
        '200':
          description: A response containing a UI schema
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UISchema'
              examples:
                ui-schema-response:
                  $ref: '#/components/examples/UISchemaResponseBody'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    put:
      operationId: models/createOrUpdateUISchema
      tags:
        - Model Management
      summary: Update the existing UI schema associated with a Content Fragment Model
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UISchemaPayload'
            examples:
              tab-structure:
                $ref: '#/components/examples/Tabs'
              category-headlines:
                $ref: '#/components/examples/CategoryHeadlines'
              collapsible-fields:
                $ref: '#/components/examples/CollapsibleFields'
              conditional-fields:
                $ref: '#/components/examples/ConditionalFields'
              conditional-required:
                $ref: '#/components/examples/ConditionalRequiredFields'
      responses:
        '204':
          description: The UI schema was successfully updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/models/{id}/copy:
    post:
      operationId: models/copy
      summary: Copy a Content Fragment Model
      description: |
        This operation copies the Content Fragment Model from one location to another.
      tags:
        - Model Management
      parameters:
        - in: path
          name: id
          description: The unique identifier of the Content Fragment Model to be copied.
          required: true
          schema:
            $ref: '#/components/schemas/Base64URLId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyContentFragmentModel'
      responses:
        '201':
          description: The Content Fragment Model was successfully copied.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragmentModel'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/fragments:
    get:
      operationId: fragments/getFragments
      tags:
        - Fragment Management
      summary: List all Content Fragments
      description: |
        This operation provides support for retrieving all the Content Fragments
        accessible to the current user, determined via the applied request authorization.
        By default this call will return a maximum of 50 items.

        The caller can define other limits suited to their application (see the `limit` query
        parameter), but the limit cannot be higher than 50. To ask for the next set of items
        pass the value of the `cursor` provided in the response to the `cursor` query parameter.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/includeMetadata'
        - in: query
          name: path
          description: Optional UTF-8 encoded parameter to specify a path where to start looking for content fragments.
          schema:
            type: string
          examples:
            one-fragment:
              value: /content/dam/adaptto/presentations/aem-cloud-service-from-a-developer-perspective
              description: Get exactly one '/aem-cloud-service-from-a-developer-perspective' content fragment.
            multiple-fragments:
              value: /content/dam/adaptto/presentations
              description: Get all child content fragments under '/presentations' folder.
          required: false
        - in: query
          name: references
          description: |
            When the `path` query parameter identifies a Content Fragment, this parameter allows controlling the
            way the references are retrieved for that fragment. When this parameter is missing, the references
            will not be populated.

            The following options are available:
              * `direct` - only direct references will be collected; they will not be hydrated;
              * `direct-hydrated` - only direct references will be collected; they will be fully hydrated;
              * `all` - all references up to the maximum allowed depth will be collected; they will not be hydrated;
              * `all-hydrated` - all references up to the maximum allowed depth will be collected; they will be fully hydrated
              * `none` - no references will be collected

            Non-hydrated responses will only include the properties defined by the `BaseReference` type when embedding references. 
            Hydrated responses are defined by each implementation of the `BaseReference` type. In particular, for Content Fragment
            references the response will include the fragment's fields, variations, tags.
          schema:
            $ref: '#/components/schemas/References'
          required: false
        - in: query
          name: projection
          description: |
            If this optional parameter is provided and its value is 'summary', the fragments in the response will contain
            only the required properties.
          schema:
            $ref: '#/components/schemas/Projection'
          required: false
      responses:
        '200':
          description: A response containing a potentially paginated list of content fragments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragmentListResult'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
    post:
      operationId: fragments/createFragment
      tags:
        - Fragment Management
      summary: Create a Content Fragment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentFragment'
      responses:
        '201':
          description: The Content Fragment was successfully created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
                format: uri
              description: The URI at which the created content fragment can be accessed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragment'
              example:
                path: /content/dam/wknd-shared/en/adventures/snowboarding-cf
                title: Snowboarding
                description: This new CF is created with the new POST endpoint
                id: 04dbb683-a63c-4144-9a27-7d019bd3e50e
                created:
                  at: '2023-08-04T11:31:57.229+03:00'
                  by: admin
                modified: {}
                status: NEW
                fields:
                  - type: text
                    name: location
                    multiple: false
                    values: []
                variations: []
                tags: []
                references: []
                model:
                  id: L2NvbmYvZ2xvYmFsL3NldHRpbmdzL2RhbS9jZm0vbW9kZWxzL3NpbXBsZS1jZg
                  path: /conf/global/settings/dam/cfm/models/simple-cf
                  name: simple cf
                  title: simple cf
                validationStatus: []
                fieldTags: []
        '400':
          $ref: '#/components/responses/400_BadRequest_WithValidation'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
  /cf/fragments/{fragmentId}:
    parameters:
      - in: path
        name: fragmentId
        description: Content Fragment unique identifier
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      operationId: fragments/getFragment
      tags:
        - Fragment Management
      summary: Get a Content Fragment
      parameters:
        - $ref: '#/components/parameters/If-None-Match'
        - in: query
          name: references
          schema:
            $ref: '#/components/schemas/References'
          required: false
        - in: query
          name: locale
          description: |
            An optional parameter that specifies the locale of the Content Fragment, using a language and country code (e.g. en_us). 
            If provided, the corresponding language copy of the Content Fragment will be returned if available.
            If not available, a 404 error will be returned.
          schema:
            $ref: '#/components/schemas/Locale'
          required: false
