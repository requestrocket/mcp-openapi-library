          minLength: 1
      required:
        - type
        - title
        - status
        - detail
    CreateContentFragmentModel:
      description: The request payload for creating a new Content Fragment Model.
      type: object
      properties:
        configurationFolder:
          type: string
          description: The configuration folder where the model should be created.
        name:
          type: string
          description: A human-readable name for this model.
          minLength: 1
        technicalName:
          type: string
          description: |
            Optional technical name used for storing the Content Fragment Model.
            If omitted, it will be generated from the 'name' property (e.g., spaces replaced with hyphens).
            It cannot contain the characters: / : [ ] * | \t \r \n.
            If a model with the same technical name already exists in the target folder, an error will be returned due to the conflict.
          pattern: ^[^\/:\[\]|*]*$
        description:
          type: string
          description: A human-readable description for this model.
        locked:
          type: boolean
          description: |
            If a model is locked, then no edits can be performed on this model,
            except for unlocking it.
        status:
          $ref: '#/components/schemas/ContentFragmentModelStatus'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ContentFragmentModelField'
        previewUrlPattern:
          x-audience: cloud
          type: string
          format: url
          description: Preview URL Pattern for the given Model
      required:
        - name
      example:
        name: A simple CFM
        description: This is a simple CFM
        locked: true
        status: enabled
        fields:
          - type: text
            name: title
            label: Title
            required: false
            multiple: false
            maxLength: 255
            validationType: none
          - type: text
            name: slug
            label: Slug
            description: A short path to be used to uniquely identify the article. Can be used for pathing in client applications.
            required: true
            multiple: false
            maxLength: 255
            validationType: custom
            customValidationRegex: ^[a-z0-9\-_]{5,40}$
            customErrorMessage: Slug must be at least 5 characters in length, lower case, using only letters and numbers and no spaces. Only special characters that can be used are dashes and underscore.
        previewUrlPattern: http://localhost:4502/${contentFragment.model.name}/${contentFragment.id}.html
    CreateContentFragmentModels:
      description: The request payload for creating multiple Content Fragment Models.
      type: object
      properties:
        configurationFolder:
          type: string
          description: |
            The configuration folder where the models should be created.
            If both `configurationFolder` and `models.configurationFolder` are provided,
            the latter will take precedence.
        locked:
          type: boolean
          description: |
            If the models are locked, then no edits can be performed on them,
            except for unlocking them.
            If both `locked` and `models.locked` are provided, the latter will take
            precedence.
          default: false
        status:
          description: |
            The status of the models to be created. Default is "enabled".
          $ref: '#/components/schemas/ContentFragmentModelStatus'
        models:
          type: array
          items:
            $ref: '#/components/schemas/CreateContentFragmentModel'
