components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicAuth:
      type: http
      scheme: basic
  schemas:
    Cursor:
      description: |
        A cursor is an opaque string that can be used in API calls which support paginating the response. A non-existent cursor
        signifies that the returned list does not have more elements.
      type: string
      minLength: 1
    Limit:
      description: |
        For a paginated request, this parameter defines the maximum number of items to retrieve.
      type: integer
      format: int32
      minimum: 1
      maximum: 50
    Projection:
      type: string
      description: |
        This parameter defines how much data is present in the response. The following options are available:
          * `minimal` - only resource identifiers will be included in the response
          * `summary` - only the required properties will be included in the response
          * `full` - potentially all the properties will be included in the response, depending on whether the optional properties are present
      enum:
        - minimal
        - summary
        - full
      default: full
    Base64URLId:
      description: Defines a `base64url` with no padding encoded ID.
      type: string
      minLength: 1
    ContentFragmentModelPath:
      type: string
      description: A valid path to a Content Fragment Model resource.
      pattern: ^\/conf(\/.*)?$
      readOnly: true
    ETag:
      type: string
      description: |
        The `ETag` field in a response provides the current entity tag for the selected representation, as determined at the
        conclusion of handling the request. An entity tag is an opaque validator for differentiating between multiple
        representations of the same resource, regardless of whether those multiple representations are due to resource state
        changes over time, content negotiation resulting in multiple representations being valid at the same time, or both.
        An entity tag consists of an opaque quoted string, possibly prefixed by a weakness indicator.

        For more details, please head over to [RFC9110](https://www.rfc-editor.org/rfc/rfc9110.html#name-etag).
    AuthoringInfo:
      readOnly: true
      type: object
      description: Provides details about an authoring operation (e.g. user and date).
      properties:
        at:
          type: string
          format: date-time
          description: Date and time of the operation.
          example: '2021-01-30T08:30:00Z'
        by:
          type: string
          description: The identifier of the user who performed the operation.
          example: jdoe
        fullName:
          type: string
          description: The full name of the user who performed the operation.
          example: John Doe
        firstName:
          type: string
          description: The first name of the user who performed the operation.
          example: John
        lastName:
          type: string
          description: The last name of the user who performed the operation.
          example: Doe
    ContentFragmentModelStatus:
      description: |
        The status of this model. A model is in `draft` as soon as it's
        created, unless the user specifically marks the model as `enabled`.
        A model is in `disabled` state only when a user explicitly disables
        the model.
      type: string
      readOnly: true
      enum:
        - enabled
        - disabled
        - draft
    ReplicationStatus:
      description: |
        The replication status of a resource, which can also act as a a filtering criterion that allows users 
        to select resources based on their replication status. The following options are available:
          * `PUBLISHED` - the resource is published
          * `UNPUBLISHED` - the resource was published and then later unpublished
          * `MODIFIED` - the resource was published and then later modified on the author
          * `NEVER_PUBLISHED` - the resource has never been published
      type: string
      readOnly: true
      enum:
        - PUBLISHED
        - UNPUBLISHED
        - MODIFIED
        - NEVER_PUBLISHED
    PreviewReplicationStatus:
      description: |
        The preview replication status of a resource, which can also act as a a filtering criterion that allows users 
        to select resources based on their replication status. The following options are available:
          * `PUBLISHED` - the resource is published
          * `UNPUBLISHED` - the resource was published and then later unpublished
          * `MODIFIED` - the resource was published and then later modified on the author
          * `NEVER_PUBLISHED` - the resource has never been published
      type: string
      readOnly: true
      enum:
        - PUBLISHED
        - UNPUBLISHED
        - MODIFIED
        - NEVER_PUBLISHED
      x-audience: cloud
    ContentFragmentModelField:
      description: Defines a Content Fragment Model field.
      type: object
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextModelField'
          long-text: '#/components/schemas/LongTextModelField'
          number: '#/components/schemas/LongNumberModelField'
          float-number: '#/components/schemas/DoubleNumberModelField'
          boolean: '#/components/schemas/BooleanModelField'
          content-fragment: '#/components/schemas/FragmentReferenceModelField'
          content-reference: '#/components/schemas/ContentReferenceModelField'
          date: '#/components/schemas/DateModelField'
          time: '#/components/schemas/TimeModelField'
          date-time: '#/components/schemas/DateTimeModelField'
          enumeration: '#/components/schemas/EnumerationModelField'
          tag: '#/components/schemas/TagModelField'
          json: '#/components/schemas/JsonModelField'
      properties:
        name:
          type: string
          description: The name of this field.
        label:
          type: string
          description: |
            A label to be used when rendering this field in an editable form.
        description:
          type: string
          description: |
            A human-readable description for this field.
        required:
          type: boolean
          description: Defines whether this field is required or optional.
          default: false
        multiple:
          type: boolean
          description: Defines if this field should store multiple values.
          default: false
        minItems:
          type: integer
          description: A positive integer number that defines the minimum number of values that can be stored into this field
          format: int32
          minimum: 0
        maxItems:
          type: integer
          description: A positive integer number that defines the maximum number of values that can be stored into this field
          format: int32
          minimum: 1
        type:
          $ref: '#/components/schemas/DataType'
        extensionConfig:
          type: object
          description: |
            If this field is related to an extension, this object contains the configuration of the field for use by the extension.
            The values in this object are defined by the extension and can be used to configure the field's behavior or appearance.
            The values can be primitive types (string, boolean, number) or arrays of primitive types.
            More information about Content Fragments extensions can be found at <a href="https://experienceleague.adobe.com/en/docs/experience-manager-learn/cloud-service/developing/extensibility/ui/content-fragments/overview">AEM Content Fragments extensibility</a>.
          additionalProperties:
            oneOf:
              - type: string
              - type: boolean
              - type: number
              - type: array
                items:
                  oneOf:
                    - type: string
                    - type: boolean
                    - type: number
      required:
        - name
        - label
        - type
    TextModelField:
      description: A data type for representing strings up to 256 characters
      allOf:
        - $ref: '#/components/schemas/ContentFragmentModelField'
        - type: object
          properties:
            placeholder:
              type: string
            defaultValue:
              type: string
            maxLength:
              type: integer
              description: The maximum length this text should have, the value cannot exceed 256
              format: int32
              minimum: 0
            unique:
              type: boolean
            translatable:
              type: boolean
            validationType:
              type: string
              enum:
                - none
                - email
                - url
                - custom
              default: none
            customValidationRegex:
              type: string
            customErrorMessage:
              type: string
    MimeType:
      type: string
      description: The mime type of a multiline text field
      enum:
        - text/html
        - text/plain
        - text/x-markdown
        - text/markdown
    LongTextModelField:
      description: A data type for representing longer texts (paragraphs)
      allOf:
        - $ref: '#/components/schemas/ContentFragmentModelField'
        - type: object
          properties:
            mimeType:
              allOf:
                - $ref: '#/components/schemas/MimeType'
              default: text/plain
            allowFragmentReference:
              type: boolean
              description: |
                Whether the text contained by the field can reference a Content Fragment
            allowedModels:
              type: array
              items:
                $ref: '#/components/schemas/Base64URLId'
              description: |
                The types of fragments that can be referenced by a field of this type. This field is required 
                when allowFragmentReference is true, and shouldn't be present otherwise
            translatable:
              type: boolean
    LongNumberModelField:
      description: A data type for representing long numbers
      allOf:
        - $ref: '#/components/schemas/ContentFragmentModelField'
        - type: object
          properties:
            placeholder:
              type: string
            defaultValue:
              type: integer
              format: int64
            min:
              type: integer
              description: The minimum value that can be used by a field of this type
              format: int64
            max:
              type: integer
              description: The maximum value that can be used by a field of this type
              format: int64
            customErrorMessage:
              type: string
    DoubleNumberModelField:
      description: A data type for representing fractional (double-precision) numbers
      allOf:
        - $ref: '#/components/schemas/ContentFragmentModelField'
        - type: object
          properties:
            placeholder:
              type: string
            defaultValue:
              type: number
              format: double
            min:
              type: number
              description: The minimum value that can be used by a field of this type
              format: double
            max:
              type: number
              description: The maximum value that can be used by a field of this type
              format: double
            customErrorMessage:
              type: string
    BooleanModelField:
      description: A type for representing boolean fields (checkboxes in web forms)
      allOf:
        - $ref: '#/components/schemas/ContentFragmentModelField'
        - type: object
          properties:
            defaultValue:
              type: boolean
            customErrorMessage:
              type: string
    Path:
      type: string
      pattern: ^[^\\\[\]|*]*$
      description: A valid path to a resource
    TagId:
      description: Tag identifier
      type: string
      pattern: ^(?:(?!\.|%|\*|\?|\[|\]|\|).)*$
    FragmentReferenceModelField:
      description: A data type for representing references to Content Fragments
      allOf:
        - $ref: '#/components/schemas/ContentFragmentModelField'
        - type: object
          properties:
            placeholder:
              type: string
            defaultValue:
              $ref: '#/components/schemas/Path'
              description: A Content Fragment path that can be used as the default value for a field of this type
            root:
              $ref: '#/components/schemas/Path'
              description: The root folder from where references can be selected for a field of this type
            allowFragmentCreation:
              type: boolean
              default: true
            items:
              type: array
              description: An array of Content Fragment Model IDs
              items:
                $ref: '#/components/schemas/Base64URLId'
            tags:
              type: array
              description: An array of Content Fragment Model Tags
              items:
                $ref: '#/components/schemas/TagId'
            uuidBased:
              type: boolean
              description: Whether the reference field is uuid-based or path-based
              default: false
    MinMax:
      type: object
      description: Defines a minimum and maximum value for a field.
      properties:
        min:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 0
    FileSize:
      type: object
      description: Defines a file size in a given storage unit.
      properties:
        size:
          type: integer
          description: The file size a reference should have
          format: int32
          minimum: 0
        unit:
          type: string
          description: 'The storage unit of a file size: B, KB, MB, GB, TB'
          enum:
            - B
            - KB
            - MB
            - GB
            - TB
      required:
        - size
        - unit
    ContentType:
      type: string
      description: |
        The type of content for a Content Reference field.
        This property supports a set of predefined values that represent the different types of content that can be referenced.
      enum:
        - plaintext
        - richtext
        - image
        - audio
        - video
        - pdf
        - spreadsheet
        - presentation
        - archive
        - markup
        - contentfragment
    CustomContentType:
      type: string
      description: |
        A custom content type for this field. The value must correspond to an existing AEM content type overlay.
        These overlays are created according to the mechanism described in the <a href="https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/implementing/developing/full-stack/overlays">AEM documentation</a>.
        The provided value will be validated against the MIME types configured in the corresponding overlay.
    AllowedContentTypes:
      type: array
      description: |
        The allowed content types for a field of this type.
        This can include both standard predefined content types from the predefined list and custom content types
        created as overlays according to the <a href="https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/implementing/developing/full-stack/overlays">AEM documentation</a>.

        Custom content types allow specifying additional MIME types that will be validated against the content.
        To determine if a content type is predefined, check if it exists in the ContentType enum.

        When both predefined and custom content types are present, they will be merged and validated against both sets of rules.
      items:
        anyOf:
          - $ref: '#/components/schemas/ContentType'
